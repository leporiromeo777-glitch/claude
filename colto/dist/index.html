:"Nessuno organizza una bolla. Eppure somiglia a ==uno schema Ponzi==."},{"tipo":"testo","testo":"Lo dice Robert Shiller. In uno schema Ponzi i primi sono pagati con i soldi degli ultimi. In una bolla ==non c'è un truffatore==."},{"tipo":"elenco","titolo":"Il giro che si alimenta da solo","numerato":true,"voci":["I prezzi salgono","Tutti parlano di chi ha guadagnato","Nasce una storia: «è una nuova era»","Entrano altri, i prezzi salgono ancora"]},{"tipo":"colpo","testo":"Finché ==entra gente nuova==."},{"tipo":"grafico","titolo":"Azioni USA: prezzo diviso utili medi di 10 anni","forma":"barre","dati":[{"e":"1901","v":25.2},{"e":"1929","v":32.6},{"e":"1966","v":24.1},{"e":"2000","v":44.3}],"nota":"I picchi citati da Shiller. Il libro uscì a marzo 2000."},{"tipo":"mito","mito":"Se sale così tanto, un motivo ci sarà","realta":"In una bolla sale perché è salito: ==l'entusiasmo si contagia==."},{"tipo":"chiusura","azione":"Senti «stavolta è diverso»? Chiediti: ==cosa so, a parte che è salito?=="}]},{"id":"four-pillars-quattro-pilastri","categoria":"investimenti","titolo":"Sai tre cose su quattro? Per investire non basta","libro":{"titolo":"The Four Pillars of Investing","autore":"William J. Bernstein","anno":2002},"scene":[{"tipo":"apertura","testo":"Per investire male basta ignorare ==una cosa su quattro==."},{"tipo":"elenco","titolo":"I quattro pilastri di Bernstein","voci":["Teoria: più rendimento, più rischio","Storia: ogni tanto i mercati impazziscono","Psicologia: il nemico sei tu","Industria: vive dei tuoi costi"]},{"tipo":"colpo","testo":"Ne manca uno? ==Crolla tutto.=="},{"tipo":"esempio","testo":"L'esempio di Bernstein è il fondo LTCM, con due premi Nobel fra i soci. Teoria impeccabile. ==Storia dei mercati ignorata.== Nel 1998 sfiora il fallimento."},{"tipo":"quiz","domanda":"Rendimento alto, «garantito, senza rischi». Che dice il primo pilastro?","opzioni":["È un'occasione rara","Va bene, se dura poco","Il rischio c'è: non lo vedi"],"corretta":2,"spiegazione":"Rendimenti alti, rischi alti. Se non li vedi, sono nascosti. O è una truffa."},{"tipo":"chiusura","azione":"Scegli il pilastro ==che conosci meno==. Dagli dieci minuti oggi."}]},{"id":"ricchezza-nazioni-divisione-lavoro","categoria":"economia","titolo":"Dieci operai, 48 mila spilli al giorno","libro":{"titolo":"La ricchezza delle nazioni","autore":"Adam Smith","anno":1776,"titoloOriginale":"The Wealth of Nations"},"scene":[{"tipo":"apertura","testo":"Da solo fai forse ==uno spillo al giorno==. In fabbrica, 4800."},{"tipo":"colpo","testo":"Stesse mani. ==Altro metodo.=="},{"tipo":"esempio","testo":"Adam Smith visita una fabbrica di spilli. Uno tira il filo, uno lo taglia, uno fa la punta. Il lavoro è diviso in circa ==18 operazioni==."},{"tipo":"numero","valore":48,"suffisso":" mila","didascalia":"Gli spilli al giorno di ==dieci operai==, secondo Smith: 4800 a testa.","nota":"Da soli, scrive, non ne avrebbero fatti nemmeno 20 a testa."},{"tipo":"elenco","titolo":"Perché rende così tanto","voci":["Ripeti un gesto e diventi più abile","Non perdi tempo a cambiare compito","Chi fa una cosa sola inventa attrezzi migliori"]},{"tipo":"principio","testo":"Per Smith un paese si arricchisce quando ==divide il lavoro==. Le stesse persone producono molto di più."},{"tipo":"chiusura","azione":"Prendi un oggetto dalla tasca. Conta ==quanti mestieri== sono serviti per fartelo avere."}]},{"id":"ricchezza-nazioni-mano-invisibile","categoria":"economia","titolo":"Chi ha organizzato la tua colazione?","libro":{"titolo":"La ricchezza delle nazioni","autore":"Adam Smith","anno":1776,"titoloOriginale":"The Wealth of Nations"},"scene":[{"tipo":"apertura","testo":"Chi ha deciso che oggi al bar ci fossero i cornetti? ==Nessuno.=="},{"tipo":"testo","titolo":"Perché funziona","testo":"Per Smith la cena non viene dalla bontà di macellai e fornai. Viene perché ognuno ==bada al proprio interesse==."},{"tipo":"colpo","testo":"Nessuno dirige. ==Eppure gira.=="},{"tipo":"principio","testo":"Cerchi il tuo guadagno. Per Smith è ==come una mano invisibile==: spesso ti porta a servire gli altri."},{"tipo":"quiz","domanda":"Quante volte Smith scrive «mano invisibile» nel libro?","opzioni":["Una ventina","In ogni capitolo","Una sola"],"corretta":2,"spiegazione":"Una sola, nel quarto libro. La fama è arrivata dopo."},{"tipo":"mito","mito":"L'egoismo fa sempre il bene di tutti","realta":"Smith diffida dei mercanti: se possono, ==si accordano contro il pubblico==."},{"tipo":"chiusura","azione":"Prima di comprare, conta ==quanti altri vendono== la stessa cosa."}]},{"id":"economics-one-lesson-vetrina-rotta","categoria":"economia","titolo":"La vetrina rotta fa bene all'economia?","libro":{"titolo":"Economics in One Lesson","autore":"Henry Hazlitt","anno":1946},"scene":[{"tipo":"apertura","testo":"Un ragazzo spacca una vetrina. Qualcuno dice: ==fa girare l'economia==."},{"tipo":"esempio","testo":"Il fornaio paga il vetraio, che spende quei soldi altrove. Sembra un guadagno. Ma con quei soldi il fornaio voleva ==un abito nuovo==."},{"tipo":"colpo","testo":"Il sarto ==non lo vede nessuno==."},{"tipo":"confronto","titolo":"Chi vedi e chi no","a":{"etichetta":"Quello che si vede","voci":["Il vetraio che lavora","La vetrina nuova"]},"b":{"etichetta":"Quello che non si vede","voci":["Il sarto senza cliente","L'abito mai cucito"]}},{"tipo":"testo","titolo":"La stessa lente, in grande","testo":"Hazlitt la usa per sussidi, dazi e opere pubbliche. Chi riceve i soldi si vede. Chi li paga con le tasse ==resta fuori dalla foto==."},{"tipo":"principio","testo":"Per Hazlitt la lezione è una: guarda gli effetti ==nel tempo e su tutti==, non solo quelli immediati."},{"tipo":"chiusura","azione":"Leggi una notizia su un bonus. Scrivi ==chi lo paga e a cosa rinuncia==."}]},{"id":"basic-economics-usi-alternativi","categoria":"economia","titolo":"Il vero costo non è sul cartellino","libro":{"titolo":"Basic Economics","autore":"Thomas Sowell","anno":2000},"scene":[{"tipo":"apertura","testo":"Nemmeno il paese più ricco ha ==abbastanza di tutto per tutti==."},{"tipo":"esempio","testo":"Lo stesso latte può diventare formaggio, gelato o yogurt. Un litro usato per uno ==manca agli altri==."},{"tipo":"colpo","testo":"Ogni scelta ==esclude le altre==."},{"tipo":"testo","titolo":"Costo opportunità","testo":"Per Sowell il vero costo è ==l'alternativa a cui rinunci==. Vale per una famiglia e per uno Stato."},{"tipo":"quiz","domanda":"Hai un'ora libera: studi invece di allenarti. Qual è il costo?","opzioni":["Nessuno: era gratis","L'allenamento che salti","La fatica di studiare"],"corretta":1,"spiegazione":"Paghi con l'alternativa migliore che lasci. Anche senza spendere un euro."},{"tipo":"principio","testo":"Per Sowell l'economia è questo: usare ==risorse scarse== che hanno usi alternativi."},{"tipo":"chiusura","azione":"Prima di spendere 50 euro scrivi ==cos'altro ci faresti==. Poi decidi."}]},{"id":"basic-economics-prezzi-bloccati","categoria":"economia","titolo":"Blocchi gli affitti. Poi cosa succede?","libro":{"titolo":"Basic Economics","autore":"Thomas Sowell","anno":2000},"scene":[{"tipo":"apertura","testo":"Affitti troppo alti. La legge mette un tetto. ==Risolto?=="},{"tipo":"colpo","testo":"Per Sowell, ==tutt'altro==."},{"tipo":"testo","titolo":"Il prezzo è un messaggio","testo":"Per Sowell un prezzo dice a tutti ==quanto una cosa è scarsa==. Se sale, chi compra ne usa meno. E chi produce ne offre di più."},{"tipo":"elenco","titolo":"Tetto agli affitti: cosa segue","numerato":true,"voci":["Prezzo basso: più persone cercano casa","Affittare rende meno: l'offerta cala","Le case mancano e si curano meno"]},{"tipo":"mito","mito":"Con il prezzo bloccato la casa costa meno a tutti","realta":"Per Sowell costa meno ==solo a chi la trova==. Gli altri restano in coda."},{"tipo":"principio","testo":"Per Sowell un tetto al prezzo non crea più case. Fa sì che ==molti cerchino e pochi offrano==."},{"tipo":"chiusura","azione":"Trova un prezzo salito da poco. Scrivi ==cosa sta segnalando== a chi compra e a chi vende."}]},{"id":"teoria-generale-domanda-complessiva","categoria":"economia","titolo":"Se tutti risparmiano, chi compra?","libro":{"titolo":"Teoria generale dell'occupazione, dell'interesse e della moneta","autore":"John Maynard Keynes","anno":1936,"titoloOriginale":"The General Theory of Employment, Interest and Money"},"scene":[{"tipo":"apertura","testo":"Risparmiare è prudente. Ma se lo fanno ==tutti insieme==, chi compra?"},{"tipo":"esempio","testo":"Tempi incerti. Tu rimandi l'auto nuova. Il concessionario vende meno e licenzia. ==La tua spesa era uno stipendio.=="},{"tipo":"colpo","testo":"Poi taglia ==pure il licenziato==."},{"tipo":"quiz","domanda":"Tutti risparmiano di più. Per Keynes il risparmio totale:","opzioni":["Sale di sicuro","Può non salire"],"corretta":1,"spiegazione":"Se tutti tagliano, i redditi calano. E chi guadagna meno mette da parte meno."},{"tipo":"testo","titolo":"L'idea di Keynes","testo":"Per Keynes il lavoro dipende dalla ==domanda complessiva==: quanto spendono famiglie e imprese. Se manca, può spendere lo Stato."},{"tipo":"principio","testo":"Per Keynes un'economia può restare a lungo con molti disoccupati: ==non riparte da sola==."},{"tipo":"chiusura","azione":"Chiedi a un parente ==cosa tagliò per primo== nell'ultima crisi."}]},{"id":"teoria-generale-moltiplicatore","categoria":"economia","titolo":"La provocazione delle banconote sotterrate","libro":{"titolo":"Teoria generale dell'occupazione, dell'interesse e della moneta","autore":"John Maynard Keynes","anno":1936,"titoloOriginale":"The General Theory of Employment, Interest and Money"},"scene":[{"tipo":"apertura","testo":"Sotterrare banconote e far scavare. ==Keynes lo scrisse davvero.=="},{"tipo":"testo","titolo":"Una provocazione","testo":"Lui preferirebbe costruire case. Ma in crisi, dice, anche una spesa assurda dà reddito a qualcuno. ==Che lo rispende.=="},{"tipo":"colpo","testo":"E il giro ==ricomincia==."},{"tipo":"esempio","testo":"Lo Stato paga 100 a un muratore. Lui ne spende 80 dal fruttivendolo, che ne spende 64 dal meccanico. ==A ogni giro l'onda si accorcia.=="},{"tipo":"grafico","titolo":"Reddito totale creato da una spesa di 100","forma":"linea","dati":[{"e":"1 giro","v":100},{"e":"2 giri","v":180},{"e":"3 giri","v":244},{"e":"5 giri","v":336},{"e":"10 giri","v":446},{"e":"20 giri","v":494}],"nota":"Esempio illustrativo: ognuno rispende l'80%. Limite: 500."},{"tipo":"principio","testo":"Per Keynes una nuova spesa crea reddito ==più della spesa stessa==. Quanto, dipende da quanto si rispende."},{"tipo":"chiusura","azione":"Prendi uno scontrino di oggi. Segui i soldi per tre passaggi: ==chi li rispende?=="}]},{"id":"via-schiavitu-piano-unico","categoria":"economia","titolo":"Chi decide il piano decide le tue priorità","libro":{"titolo":"La via della schiavitù","autore":"Friedrich A. Hayek","anno":1944,"titoloOriginale":"The Road to Serfdom"},"scene":[{"tipo":"apertura","testo":"Lo Stato decide prezzi e produzione. ==A te cosa resta?=="},{"tipo":"testo","titolo":"Inghilterra, 1944","testo":"In guerra molti sognano un'economia guidata dal centro. Hayek avverte: anche con buone intenzioni, ==toglie libertà==."},{"tipo":"elenco","titolo":"Il suo ragionamento","numerato":true,"voci":["Un piano unico sceglie cosa conta di più","Ma le persone hanno priorità diverse","Così qualcuno impone le sue a tutti"]},{"tipo":"colpo","testo":"E non si ferma ==ai soldi==."},{"tipo":"principio","testo":"Per Hayek chi controlla l'economia controlla ==i mezzi di ogni nostro scopo==."},{"tipo":"quiz","domanda":"Hayek accettava un minimo garantito a tutti contro la miseria?","opzioni":["Sì","No"],"corretta":0,"spiegazione":"Sì: per lui un minimo di cibo e casa non minaccia la libertà. Il piano unico sì."},{"tipo":"chiusura","azione":"Scrivi tre scelte di questa settimana. Segna ==chi le ha decise== davvero."}]},{"id":"capitalismo-liberta-imposta-negativa","categoria":"economia","titolo":"L'imposta che ti paga invece di chiederti soldi","libro":{"titolo":"Capitalismo e libertà","autore":"Milton Friedman","anno":1962,"titoloOriginale":"Capitalism and Freedom"},"scene":[{"tipo":"apertura","testo":"E se sotto un certo reddito fosse ==il fisco a pagare te==?"},{"tipo":"testo","titolo":"La proposta","testo":"Sopra una soglia paghi le tasse. Sotto, ricevi ==una parte di ciò che ti manca==. Friedman la chiama imposta negativa."},{"tipo":"esempio","testo":"Numeri inventati: soglia 12 mila euro, sussidio 50%. Guadagni zero: ricevi 6 mila. Guadagni 4 mila: ne ricevi altri 4. ==Totale 8 mila.=="},{"tipo":"colpo","testo":"Lavorare ==conviene sempre==."},{"tipo":"quiz","domanda":"Stesse regole. Guadagni 10 mila: quanto ricevi dal fisco?","opzioni":["Niente","2000 euro","1000 euro"],"corretta":2,"spiegazione":"Ti mancano 2 mila per la soglia: ne ricevi la metà. Totale: 11 mila."},{"tipo":"principio","testo":"Per Friedman l'aiuto più diretto a chi ha poco è ==denaro==. Come usarlo, lo decide lui."},{"tipo":"chiusura","azione":"Conta gli aiuti al reddito del tuo paese. Friedman ne voleva ==uno al posto di tanti==."}]},{"id":"capitale-xxi-secolo-rendimento-crescita","categoria":"economia","titolo":"Lavorare sodo o sposare un'ereditiera?","libro":{"titolo":"Il capitale nel XXI secolo","autore":"Thomas Piketty","anno":2013,"titoloOriginale":"Le Capital au XXIe siècle"},"scene":[{"tipo":"apertura","testo":"Studiare e lavorare, o sposare un'ereditiera? ==Balzac fece il conto.=="},{"tipo":"esempio","testo":"In Papà Goriot un personaggio avverte il giovane Rastignac: nessuna carriera gli darà quanto ==un matrimonio ricco==. Piketty riparte da lì."},{"tipo":"colpo","testo":"Può tornare ==quel mondo==?"},{"tipo":"testo","titolo":"Due velocità","testo":"Piketty confronta r, quanto rende il capitale, e g, ==quanto cresce l'economia==. Nei suoi dati storici r è circa 4-5% l'anno, g molto meno."},{"tipo":"grafico","titolo":"100 euro dopo 30 anni: all'1,5% e al 5%","forma":"barre","unita":"€","dati":[{"e":"Oggi","v":100},{"e":"All'1,5%","v":156},{"e":"Al 5%","v":432}],"nota":"Esempio illustrativo: tutto reinvestito, senza tasse né spese."},{"tipo":"principio","testo":"Per Piketty il capitale tende a rendere più di quanto cresce l'economia. Così ==le eredità pesano sempre di più==."},{"tipo":"chiusura","azione":"Fai il conto di casa: quanto entra ==dal lavoro== e quanto da affitti o investimenti?"}]},{"id":"capitale-marx-plusvalore","categoria":"economia","titolo":"Da dove esce il profitto, secondo Marx","libro":{"titolo":"Il capitale","autore":"Karl Marx","anno":1867,"titoloOriginale":"Das Kapital"},"scene":[{"tipo":"apertura","testo":"Se ogni scambio è alla pari, ==da dove esce il profitto?=="},{"tipo":"testo","titolo":"La risposta di Marx","testo":"L'operaio non vende il suo lavoro. Vende la ==forza-lavoro==: la capacità di lavorare per una giornata. Il salario è il suo prezzo."},{"tipo":"esempio","testo":"L'esempio di Marx: giornata di 12 ore. In 6 l'operaio produce il valore del suo salario. Nelle altre 6 produce ancora, ma ==per il capitalista==."},{"tipo":"colpo","testo":"Marx lo chiama ==plusvalore==."},{"tipo":"confronto","titolo":"La giornata divisa in due","a":{"etichetta":"Lavoro necessario","voci":["Ripaga il salario"]},"b":{"etichetta":"Pluslavoro","voci":["Diventa profitto di chi assume"]}},{"tipo":"principio","testo":"Per Marx il profitto non nasce da un imbroglio nello scambio. Nasce dal ==lavoro non pagato==."},{"tipo":"chiusura","azione":"Calcola quanto vale una tua ora: ==stipendio netto diviso ore lavorate== nel mese."}]},{"id":"economista-mascherato-potere-scarsita","categoria":"economia","titolo":"Chi guadagna davvero sul tuo caffè","libro":{"titolo":"L'economista mascherato","autore":"Tim Harford","anno":2005,"titoloOriginale":"The Undercover Economist"},"scene":[{"tipo":"apertura","testo":"Il caffè in stazione costa caro. Ma il grosso ==non va al bar==."},{"tipo":"esempio","testo":"Sei di corsa. Il chiosco è proprio sulla strada per il binario. Paghi senza guardare. ==Posti così sono pochi.=="},{"tipo":"colpo","testo":"E chi possiede ==quel posto==?"},{"tipo":"testo","titolo":"Il potere della scarsità","testo":"Tanti bar vogliono quel punto e l'affitto sale. Per Harford gran parte del margine va ==al padrone dello spazio==."},{"tipo":"quiz","domanda":"Perché l'affitto di quel chiosco è così alto?","opzioni":["Il caffè costa di più","Lì i clienti pagano caro","Serve più personale"],"corretta":1,"spiegazione":"La causa va al contrario: clienti disposti a pagare rendono prezioso il posto."},{"tipo":"principio","testo":"Per Harford guadagna di più ==chi controlla la risorsa più scarsa==."},{"tipo":"chiusura","azione":"Al prossimo acquisto di corsa guardati intorno: ==quante alternative avevi?=="}]},{"id":"naked-economics-capitale-umano","categoria":"economia","titolo":"Cosa ti resta se perdi tutto","libro":{"titolo":"Naked Economics","autore":"Charles Wheelan","anno":2002},"scene":[{"tipo":"apertura","testo":"Ti tolgono casa, soldi e lavoro. Resti per strada. ==Cosa ti rimane?=="},{"tipo":"esempio","testo":"Wheelan fa la prova con Bill Gates: toglietegli tutto e lasciatelo per strada. Con quello che sa fare, dice, ==se la caverebbe benissimo==."},{"tipo":"colpo","testo":"Si chiama ==capitale umano==."},{"tipo":"elenco","titolo":"Cosa c'è dentro, per Wheelan","voci":["Istruzione ed esperienza","Intelligenza e creatività","Carisma e spirito d'iniziativa"]},{"tipo":"testo","titolo":"E lo stipendio?","testo":"Per Wheelan il lavoro ha un prezzo come tutto. Competenze ==rare e richieste== vengono pagate molto: sono difficili da sostituire."},{"tipo":"mito","mito":"Se gli altri diventano più bravi, io ci perdo","realta":"Per Wheelan chi sa di più produce di più: ==la torta cresce== per tutti."},{"tipo":"chiusura","azione":"Scrivi ==tre cose che sai fare bene==. Accanto, una da imparare entro l'anno."}]},{"id":"freakonomics-multa-asilo","categoria":"economia","titolo":"Tre dollari di multa e un effetto imprevisto","libro":{"titolo":"Freakonomics","autore":"Steven D. Levitt, Stephen J. Dubner","anno":2005},"scene":[{"tipo":"apertura","testo":"Un asilo multa i genitori in ritardo. ==Indovina com'è finita.=="},{"tipo":"esempio","testo":"Haifa, Israele, dieci asili. Troppi genitori arrivano tardi. Due economisti provano ==3 dollari di multa== oltre i dieci minuti."},{"tipo":"quiz","domanda":"Dopo la multa, i ritardi:","opzioni":["Aumentano","Calano","Restano uguali"],"corretta":0,"spiegazione":"Da 8 a 20 a settimana per asilo. Sono i dati citati nel libro."},{"tipo":"colpo","testo":"La colpa aveva ==un prezzo==."},{"tipo":"testo","titolo":"Cos'è successo","testo":"Prima chi tardava si sentiva in colpa: incentivo morale. La multa l'ha sostituito con uno economico, ==e basso==. Pagavi ed eri a posto."},{"tipo":"principio","testo":"Per Levitt e Dubner l'economia studia gli incentivi. ==Ne cambi uno== e la gente cambia. Non sempre come speri."},{"tipo":"chiusura","azione":"Scegli una regola che nessuno rispetta. Scrivi ==cosa ci guadagna chi la ignora==."}]},{"id":"nazioni-falliscono-nogales-confine","categoria":"economia","titolo":"Una città, una rete in mezzo, due destini","libro":{"titolo":"Perché le nazioni falliscono","autore":"Daron Acemoglu, James A. Robinson","anno":2012,"titoloOriginale":"Why Nations Fail"},"scene":[{"tipo":"apertura","testo":"Una rete taglia in due una città. Da un lato si guadagna ==il triplo==."},{"tipo":"colpo","testo":"Stessa gente. Stesso clima."},{"tipo":"testo","titolo":"Nogales","testo":"A nord è Arizona, a sud Sonora, Messico. Stessi antenati, stessa cucina. A sud una famiglia guadagna ==circa un terzo==."},{"tipo":"quiz","domanda":"Che cosa spiega il divario, secondo gli autori?","opzioni":["Il clima","La cultura","Le regole"],"corretta":2,"spiegazione":"Clima e cultura sono gli stessi. Cambiano le istituzioni: le regole del gioco."},{"tipo":"confronto","titolo":"Due tipi di regole","a":{"etichetta":"Estrattive","voci":["Potere e ricchezza restano a pochi"]},"b":{"etichetta":"Inclusive","voci":["Chi ha un'idea può provarci"]}},{"tipo":"principio","testo":"Un paese resta povero quando ==le regole servono solo a chi comanda==. Non per sfortuna."},{"tipo":"chiusura","azione":"Apri una mappa, cerca Nogales e segui ==la linea del confine== che la taglia."}]},{"id":"nazioni-falliscono-paura-del-nuovo","categoria":"economia","titolo":"La regina che disse no a una macchina","libro":{"titolo":"Perché le nazioni falliscono","autore":"Daron Acemoglu, James A. Robinson","anno":2012,"titoloOriginale":"Why Nations Fail"},"scene":[{"tipo":"apertura","testo":"Inventi una macchina che fa le calze da sola. La regina ==dice no==."},{"tipo":"esempio","testo":"1589. William Lee porta a Elisabetta I un telaio per la maglia. Niente brevetto: i sudditi resterebbero ==senza lavoro==. Poi rifiuta anche Giacomo I."},{"tipo":"colpo","testo":"Bontà d'animo? Non proprio."},{"tipo":"testo","testo":"Il nuovo crea nuovi ricchi e mette in crisi i vecchi potenti. Per Acemoglu e Robinson la regina teme ==per il trono==."},{"tipo":"elenco","titolo":"Altri «no» nel libro","voci":["Austria: l'imperatore frena le ferrovie","Russia: lo zar teme le fabbriche","Ottomani: stampa in turco solo dal 1727"]},{"tipo":"mito","mito":"Una buona invenzione si impone da sola","realta":"Passa solo dove chi comanda ==non può bloccarla==."},{"tipo":"chiusura","azione":"Scegli un'app che usi ogni giorno e cerca ==quale mestiere== ha messo in crisi."}]},{"id":"economia-poveri-lenticchie-vaccini","categoria":"economia","titolo":"Un chilo di lenticchie per un vaccino","libro":{"titolo":"L'economia dei poveri","autore":"Abhijit V. Banerjee, Esther Duflo","anno":2011,"titoloOriginale":"Poor Economics"},"scene":[{"tipo":"apertura","testo":"Vaccini gratis in ogni villaggio. Li completano ==6 bambini su 100==."},{"tipo":"colpo","testo":"La soluzione? ==Lenticchie.=="},{"tipo":"testo","titolo":"Udaipur, India","testo":"Ambulatori spesso chiusi, c'è sempre da lavorare. I genitori ==rimandano==: fatica oggi, beneficio lontano."},{"tipo":"esempio","testo":"Banerjee e Duflo fanno una prova. Prima: una clinica mobile sempre puntuale. Poi un regalo: ==un chilo di lenticchie== a ogni vaccino."},{"tipo":"grafico","titolo":"Bambini con tutti i vaccini","forma":"barre","unita":"%","dati":[{"e":"Niente","v":6},{"e":"Clinica","v":18},{"e":"Più dono","v":39}],"nota":"Studio a Udaipur pubblicato nel 2010."},{"tipo":"mito","mito":"Chi non vaccina è contrario ai vaccini","realta":"Bastano le lenticchie: ==non era ostilità==, era rinvio."},{"tipo":"principio","testo":"Rimandare è umano. Un ==piccolo premio oggi== batte un grande beneficio lontano."},{"tipo":"chiusura","azione":"Quella cosa che rimandi da settimane: legala a ==un piccolo premio== e falla oggi."}]},{"id":"economia-poveri-tv-prima-del-cibo","categoria":"economia","titolo":"Perché chi ha fame compra una tv","libro":{"titolo":"L'economia dei poveri","autore":"Abhijit V. Banerjee, Esther Duflo","anno":2011,"titoloOriginale":"Poor Economics"},"scene":[{"tipo":"apertura","testo":"In casa manca il cibo. Sul tetto però c'è ==la parabola==."},{"tipo":"esempio","testo":"Marocco. Un uomo dice agli autori che con più soldi comprerebbe più cibo. In casa ha tv, parabola e DVD. Ride: ==la tv conta più del cibo==."},{"tipo":"colpo","testo":"Sembra assurdo. Non lo è."},{"tipo":"quiz","domanda":"Cina: famiglie povere ricevono uno sconto sul riso. Che succede?","opzioni":["Mangiano più riso","Mangiano meno riso"],"corretta":1,"spiegazione":"Con i soldi risparmiati comprano carne e gamberi. Le calorie non salgono."},{"tipo":"mito","mito":"Chi ha fame spende ogni soldo in più per mangiare","realta":"Cerca anche gusto e svago: ==non è una macchina da calorie==."},{"tipo":"chiusura","azione":"Prendi l'ultimo scontrino e segna ==cosa hai comprato per gusto==, non per fame."}]},{"id":"buona-economia-migranti-salari","categoria":"economia","titolo":"125 mila arrivi in pochi mesi. E gli stipendi?","libro":{"titolo":"Una buona economia per tempi difficili","autore":"Abhijit V. Banerjee, Esther Duflo","anno":2019,"titoloOriginale":"Good Economics for Hard Times"},"scene":[{"tipo":"apertura","testo":"1980: in Florida sbarcano ==125 mila cubani== in pochi mesi. E i salari?"},{"tipo":"testo","testo":"Castro apre il porto di Mariel. Metà di chi arriva si ferma a Miami: i lavoratori della città crescono ==del 7%==."},{"tipo":"quiz","domanda":"David Card confronta Miami con altre città. Cosa trova?","opzioni":["Nessun effetto visibile","Salari in forte calo"],"corretta":0,"spiegazione":"Salari e lavoro dei residenti vanno come nelle altre città."},{"tipo":"colpo","testo":"Il conto non torna. Perché?"},{"tipo":"principio","testo":"Il lavoro non è una torta fissa: chi arriva ==spende e compra==, e crea altro lavoro."},{"tipo":"testo","titolo":"Il dibattito","testo":"Borjas rilegge i dati e vede salari in calo tra i meno istruiti. Per gli autori ==molte altre ricerche== danno ragione a Card."},{"tipo":"chiusura","azione":"Indovina la percentuale di stranieri nel tuo paese. Poi ==cerca il dato vero==."}]},{"id":"economia-ciambella-anello-sicuro","categoria":"economia","titolo":"E se l'economia fosse una ciambella?","libro":{"titolo":"L'economia della ciambella","autore":"Kate Raworth","anno":2017,"titoloOriginale":"Doughnut Economics"},"scene":[{"tipo":"apertura","testo":"Disegna un'economia sana. Freccia in su? Raworth fa ==una ciambella==."},{"tipo":"mito","mito":"Se il PIL cresce, il paese sta bene","realta":"Per Raworth il PIL ==non dice se stiamo bene== né a che prezzo."},{"tipo":"elenco","titolo":"Com'è fatta la ciambella","voci":["Il buco: chi non ha il minimo","Bordo interno: 12 bisogni di base","Bordo esterno: 9 limiti del pianeta","In mezzo: ==spazio sicuro e giusto=="]},{"tipo":"principio","testo":"Lo scopo non è crescere senza fine: è dare ==il necessario a tutti== nei limiti del pianeta."},{"tipo":"colpo","testo":"Oggi sbagliamo due volte."},{"tipo":"numero","valore":4 ce prima?","opzioni":["I debiti","Le monete"],"corretta":0,"spiegazione":"In Mesopotamia i debiti si registrano 5000 anni fa. Le prime monete: verso il 600 a.C."},{"tipo":"testo","testo":"Nei villaggi ci si conosce: ==prendi oggi, ricambi quando puoi==. Il baratto compare tra estranei, o se la moneta sparisce."},{"tipo":"principio","testo":"Il denaro nasce per ==tenere il conto di chi deve cosa a chi==, non per scambiare galline."},{"tipo":"chiusura","azione":"Conta i ==debiti senza soldi== che hai in giro: un caffè offerto, un favore."}]},{"id":"questa-volta-diverso-sindrome","categoria":"economia","titolo":"La frase che precede ogni crisi","libro":{"titolo":"Questa volta è diverso","autore":"Carmen M. Reinhart, Kenneth S. Rogoff","anno":2009,"titoloOriginale":"This Time Is Different"},"scene":[{"tipo":"apertura","testo":"Prima di ogni grande crisi qualcuno ripete ==la stessa frase==."},{"tipo":"numero","valore":66,"didascalia":"I paesi studiati da Reinhart e Rogoff, lungo ==otto secoli== di debiti e crolli."},{"tipo":"colpo","testo":"«Questa volta è diverso.»"},{"tipo":"elenco","titolo":"Cosa ci si racconta prima","voci":["Abbiamo imparato dagli errori","Le vecchie regole non valgono più","Noi siamo più solidi degli altri"]},{"tipo":"principio","testo":"Le crisi non sono incidenti rari: tornano. E ogni volta le prepara ==troppo debito==."},{"tipo":"quiz","domanda":"Dal Cinquecento all'Ottocento, quante volte la Spagna non paga i debiti?","opzioni":["2 volte","5 volte","13 volte"],"corretta":2,"spiegazione":"Tredici, nel conto degli autori. E ogni volta qualcuno le ha prestato ancora."},{"tipo":"chiusura","azione":"Ti dicono che un prezzo «non può scendere»? Cerca ==com'è finita== l'ultima volta."}]},{"id":"lords-of-finance-gabbia-oro","categoria":"economia","titolo":"I quattro banchieri che ruppero il mondo","libro":{"titolo":"Lords of Finance","autore":"Liaquat Ahamed","anno":2009},"scene":[{"tipo":"apertura","testo":"Chi ha causato la Grande Depressione? Un libro fa ==quattro nomi==."},{"tipo":"elenco","titolo":"Quattro banchieri centrali","voci":["Norman, Banca d'Inghilterra","Strong, Federal Reserve di New York","Schacht, Reichsbank tedesca","Moreau, Banca di Francia"]},{"tipo":"colpo","testo":"Li univa una fede: ==l'oro==."},{"tipo":"testo","testo":"Ogni moneta vale una quantità fissa d'oro. Sembra solidità. Ma se l'economia affonda ==non puoi creare moneta==."},{"tipo":"esempio","testo":"1925: Churchill riporta la sterlina all'oro, al valore di prima della guerra. Per Keynes è ==troppo cara di circa il 10%==: salari tagliati, scioperi."},{"tipo":"colpo","testo":"Chi molla l'oro riparte prima."},{"tipo":"principio","testo":"Per Ahamed la Depressione non fu fatalità: nacque da ==decisioni sbagliate== sulla moneta."},{"tipo":"chiusura","azione":"Cerca quanto oro ha la banca centrale del tuo paese: ==non garantisce più== le banconote."}]},{"id":"globalizzazione-oppositori-ricetta-unica","categoria":"economia","titolo":"La stessa medicina per ogni paese","libro":{"titolo":"La globalizzazione e i suoi oppositori","autore":"Joseph E. Stiglitz","anno":2002,"titoloOriginale":"Globalization and Its Discontents"},"scene":[{"tipo":"apertura","testo":"Un medico dà ==la stessa cura== a ogni paziente. Ti fideresti?"},{"tipo":"colpo","testo":"Qui i pazienti sono paesi."},{"tipo":"elenco","titolo":"La ricetta del Fondo Monetario","voci":["Tagli alla spesa, subito","Privatizzare in fretta","Mercati e capitali aperti"]},{"tipo":"testo","testo":"A denunciarla è uno ==che l'ha vista da dentro==: Joseph Stiglitz, ex capo economista della Banca Mondiale."},{"tipo":"esempio","testo":"1997: la crisi parte dalla Thailandia e travolge l'Asia. Il Fondo chiede tagli e tassi altissimi. Per Stiglitz ==aggrava la recessione==."},{"tipo":"confronto","titolo":"Due strade, secondo Stiglitz","a":{"etichetta":"La cura del Fondo","voci":["Tagli, tassi alti, capitali in fuga"]},"b":{"etichetta":"Malesia, 1998","voci":["Frena i capitali: meno danni"]}},{"tip 4,"titoloOriginale":"Zero to One"},"scene":[{"tipo":"apertura","testo":"Fanno volare milioni di persone. E ==non guadagnano quasi niente==."},{"tipo":"numero","valore":37,"suffisso":" cent","didascalia":"Di dollaro. Il guadagno ==per passeggero== delle compagnie aeree USA nel 2012.","nota":"Biglietto medio: 178 dollari. Dati citati da Thiel."},{"tipo":"colpo","testo":"Colpa ==della concorrenza==."},{"tipo":"testo","testo":"Vendono tutte lo stesso servizio. Quindi si battono sul prezzo. Per Peter Thiel finisce così: ==i profitti spariscono==."},{"tipo":"confronto","titolo":"Nel 2012","a":{"etichetta":"Compagnie aeree","voci":["Ricavi: 160 miliardi di dollari","37 centesimi a passeggero"]},"b":{"etichetta":"Google","voci":["Ricavi: 50 miliardi di dollari","Il 21% resta come profitto"]}},{"tipo":"testo","titolo":"Monopolio creativo","testo":"Per Thiel non nasce da imbrogli. Nasce da un'azienda così brava che ==nessuno la sostituisce==."},{"tipo":"principio","testo":"Secondo Thiel non devi battere i rivali: devi ==non averne==."},{"tipo":"chiusura","azione":"Scrivi tre rivali del tuo progetto. Poi una cosa che ==fai solo tu==."}]},{"id":"hard-thing-pace-e-guerra","categoria":"leadership","titolo":"Il capo giusto in pace è sbagliato in guerra","libro":{"titolo":"The Hard Thing About Hard Things","autore":"Ben Horowitz","anno":2014},"scene":[{"tipo":"apertura","testo":"Il capo perfetto oggi può essere ==quello sbagliato== fra un anno."},{"tipo":"testo","testo":"Ben Horowitz distingue due fasi. In pace sei in vantaggio e il mercato cresce. In guerra rischi ==di chiudere==."},{"tipo":"confronto","a":{"etichetta":"Capo di pace","voci":["Allarga il mercato","Cerca il consenso"]},"b":{"etichetta":"Capo di guerra","voci":["Vuole vincere il mercato","Non aspetta il consenso"]}},{"tipo":"colpo","testo":"Due ==mestieri opposti==."},{"tipo":"esempio","testo":"Horowitz cita Google, che dominava: 20% del tempo ai progetti dei dipendenti. E Jobs, in una Apple quasi fallita: ==un solo ":["Era un corridore anche lui","Chi ascoltava sentiva che ci credeva"]}},{"tipo":"principio","testo":"Per Knight, se credi in ciò che offri non stai vendendo: ==la convinzione è contagiosa==."},{"tipo":"chiusura","azione":"Scrivi in tre righe perché credi in ciò che fai. ==Non ti vengono?== Problema trovato."}]},{"id":"mom-test-tre-regole","categoria":"business","titolo":"Le domande a cui nessuno può mentirti","libro":{"titolo":"The Mom Test","autore":"Rob Fitzpatrick","anno":2013},"scene":[{"tipo":"apertura","testo":"Tua mamma dice che la tua idea è bellissima. ==Non hai imparato niente.=="},{"tipo":"colpo","testo":"Sbagliata è ==la domanda==."},{"tipo":"elenco","titolo":"Le tre regole di Rob Fitzpatrick","voci":["Parla della loro vita, non della tua idea","Chiedi ==fatti del passato==, non opinioni","Parla meno, ascolta di più"]},{"tipo":"confronto","a":{"etichetta":"Domanda sbagliata","voci":["Compreresti un'app di ricette?"]},"b":{"etichetta":"Domanda giusta","voci":["L'ultimo ricettario che hai comprato?"]}},{"tipo":"quiz","domanda":"Quale domanda supera il test della mamma?","opzioni":["Useresti un'app per la spesa?","Ti sembra una buona idea?","Com'è andata la tua ultima spesa?"],"corretta":2,"spiegazione":"Chiede un fatto del passato. Le altre chiedono opinioni: lì mentire è facile."},{"tipo":"principio","testo":"Con le domande giuste ==nemmeno tua mamma== può mentirti."},{"tipo":"chiusura","azione":"Prima di raccontare un'idea chiedi: ==l'ultima volta come hai fatto?=="}]},{"id":"mom-test-impegno","categoria":"business","titolo":"Un complimento non è un cliente","libro":{"titolo":"The Mom Test","autore":"Rob Fitzpatrick","anno":2013},"scene":[{"tipo":"apertura","testo":"«Bella idea, fammi sapere quando esce.» ==Non è un sì.=="},{"tipo":"mito","mito":"Mi ha fatto i complimenti: è interessato","realta":"Per Rob Fitzpatrick un complimento ==non costa niente== a chi lo fa."},{"tipo":"testo","testo":"Un incontro è andato bene solo se l'altro ==si impegna in qualcosa==. Altrimenti hai raccolto parole gentili."},{"tipo":"confronto","a":{"etichetta":"Parole","voci":["«Mi piace molto»","«Tienimi aggiornato»"]},"b":{"etichetta":"Fatti","voci":["«Ti presento chi decide»","«Lo proviamo da lunedì»"]}},{"tipo":"elenco","titolo":"Con che cosa si paga un impegno","voci":["Tempo: un secondo incontro, con data","Reputazione: ti presenta al suo capo","Soldi: un preordine o un acconto"]},{"tipo":"principio","testo":"Più uno rinuncia a qualcosa per te, più ==puoi credergli==."},{"tipo":"chiusura","azione":"Al prossimo complimento chiedi ==un passo concreto==: una data, una prova."}]},{"id":"crossing-the-chasm-burrone","categoria":"business","titolo":"Il burrone dove cadono le novità","libro":{"titolo":"Crossing the Chasm","autore":"Geoffrey A. Moore","anno":1991},"scene":[{"tipo":"apertura","testo":"I primi clienti ti adorano. Poi le vendite ==si fermano di colpo==."},{"tipo":"colpo","testo":"==Non è sfortuna.=="},{"tipo":"grafico","titolo":"Chi adotta una novità, gruppo dopo gruppo","forma":"barre","unita":"%","dati":[{"e":"Tecnofili","v":2.5},{"e":"Visionari","v":13.5},{"e":"Pratici","v":34},{"e":"Prudenti","v":34},{"e":"Scettici","v":16}],"nota":"Quote del modello classico di Everett Rogers."},{"tipo":"testo","testo":"Per Geoffrey Moore ogni gruppo compra per motivi diversi. Fra i visionari e i pragmatici c'è un vuoto: ==il burrone==."},{"tipo":"confronto","a":{"etichetta":"Visionari","voci":["Comprano una promessa","Vogliono arrivare primi"]},"b":{"etichetta":"Pragmatici (i pratici)","voci":["Vogliono una soluzione completa","Chiedono chi altro la usa già"]}},{"tipo":"quiz","domanda":"Hai conquistato i visionari. Per Moore, la mossa dopo?","opzioni":["Dominare una nicchia","Abbassare il prezzo","Pubblicità di massa"],"corretta":0,"spiegazione":"I pragmatici si fidano di altri pragmatici. Una nicchia conquistata li convince."},{"tipo":"chiusura","azione":"Descrivi in una riga il ==cliente più preciso== che puoi aiutare."}]},{"id":"company-of-one-restare-piccoli","categoria":"business","titolo":"Restare piccoli può essere l'obiettivo","libro":{"titolo":"Company of One","autore":"Paul Jarvis","anno":2019},"scene":[{"tipo":"apertura","testo":"E se la mossa più furba fosse ==non ingrandirti==?"},{"tipo":"mito","mito":"Un'azienda sana deve crescere sempre","realta":"Per Paul Jarvis la crescita è ==una scelta==, non un dovere."},{"tipo":"testo","testo":"Jarvis chiama «azienda di uno» chi mette in dubbio la crescita. Non per forza lavora da solo. Prima di ogni passo si chiede ==se serve==."},{"tipo":"elenco","titolo":"I quattro tratti secondo Jarvis","voci":["Resilienza: regge agli scossoni","Autonomia: decidi tu come lavorare","Velocità: cambi strada in fretta","Semplicità: poche regole"]},{"tipo":"colpo","testo":"E poi mette ==un tetto==."},{"tipo":"testo","titolo":"Quanto è abbastanza?","testo":"Di solito fissiamo un minimo: almeno tanti clienti. Jarvis propone anche ==un massimo==. Oltre, crescere può solo complicare."},{"tipo":"chiusura","azione":"Scrivi quanto ti basta al mese per vivere bene. È ==il tuo «abbastanza»==."}]},{"id":"good-to-great-concetto-riccio","categoria":"business","titolo":"Perché il riccio batte la volpe","libro":{"titolo":"Good to Great","autore":"Jim Collins","anno":2001},"scene":[{"tipo":"apertura","testo":"La volpe sa cento trucchi. Il riccio uno solo. ==Chi vince?=="},{"tipo":"colpo","testo":"Vince ==il riccio==."},{"tipo":"testo","titolo":"Un'idea sola","testo":"Per Jim Collins le aziende che diventano eccellenti ragionano da ricci: riducono tutto a ==una sola idea semplice==."},{"tipo":"elenco","titolo":"I tre cerchi: l'idea sta al centro","voci":["Ciò che ti appassiona","Ciò in cui puoi essere il migliore al mondo","Ciò che ti fa guadagnare"]},{"tipo":"esempio","testo":"Walgreens sceglie: le farmacie più comode. E guarda un numero solo: ==il profitto per ogni visita== del cliente."},{"tipo":"principio","testo":"Capisci in che cosa puoi essere il migliore. Poi trova la disciplina di ==dire no al resto==."},{"tipo":"numero","valore":2,"didascalia":"delle 11 aziende lodate nel libro cadono nel 2008: Circuit City e Fannie Mae.","nota":"Una fallita, l'altra commissariata. Il metodo non è una garanzia."},{"tipo":"chiusura","azione":"Disegna tre cerchi e riempili. ==Che cosa finisce al centro?=="}]},{"id":"dilemma-innovatore-fallire-facendo-bene","categoria":"business","titolo":"Come si perde un mercato facendo tutto giusto","libro":{"titolo":"Il dilemma dell'innovatore","autore":"Clayton M. Christensen","anno":1997,"titoloOriginale":"The Innovator's Dilemma"},"scene":[{"tipo":"apertura","testo":"Ascolti i clienti. Investi dove rende. ==E perdi il mercato.=="},{"tipo":"esempio","testo":"1985. Seagate mostra ai clienti un disco più piccolo, da 3,5 pollici. Non interessa: vogliono più capienza. Progetto fermato."},{"tipo":"colpo","testo":"Poi arrivano ==i portatili==."},{"tipo":"testo","testo":"Quei dischi finiscono nei portatili, venduti da altri. E migliorano ogni anno, ==finché bastano a tutti==."},{"tipo":"confronto","a":{"etichetta":"Innovazione di sostegno","voci":["Migliora ciò che c'è già","La chiedono i clienti migliori"]},"b":{"etichetta":"Innovazione dirompente","voci":["All'inizio peggiore, ma più semplice","Parte da mercati piccoli"]}},{"tipo":"mito","mito":"Le grandi aziende cadono perché gestite male","realta":"Per Christensen cadono ==facendo le cose giuste==: servire i clienti migliori."},{"tipo":"colpo","testo":"Tesi discussa, ==non una legge==."},{"tipo":"chiusura","azione":"Scrivi un prodotto «giocattolo» del tuo settore. Accanto: ==chi lo usa già==."}]},{"id":"high-output-management-leva-manageriale","categoria":"leadership","titolo":"Il lavoro di un capo non è il suo lavoro","libro":{"titolo":"High Output Management","autore":"Andrew S. Grove","anno":1983},"scene":[{"tipo":"apertura","testo":"Sei un capo? ==Il tuo lavoro non è il tuo lavoro.=="},{"tipo":"colpo","testo":"È quello ==degli altri==."},{"tipo":"principio","testo":"Il risultato di un capo è ==il risultato della sua squadra==, più quello dei gruppi che influenza."},{"tipo":"testo","titolo":"La leva","testo":"Andrew Grove, che ha guidato Intel, misura ogni attività così: quanto lavoro degli altri muove ==un'ora del tuo tempo==."},{"tipo":"numero","valore":80,"suffisso":" ore","didascalia":"di lavoro di un collaboratore: le migliora ==un colloquio di 90 minuti==.","nota":"Conto di Grove: un colloquio ogni due settimane, 2 × 40 ore."},{"tipo":"esempio","testo":"Grove parla due ore a 200 nuovi assunti: storia, valori, stile di Intel. Due ore sue, ==duecento persone orientate==."},{"tipo":"mito","mito":"Finché non decido, non faccio danni","realta":"Per Grove un via libera che non arriva è un rosso: ==ferma tutti==."},{"tipo":"chiusura","azione":"Apri l'agenda di domani. Cerchia ==l'impegno che tocca più persone==."}]},{"id":"competitive-strategy-cinque-forze","categoria":"business","titolo":"Le cinque forze che decidono chi guadagna","libro":{"titolo":"Competitive Strategy","autore":"Michael E. Porter","anno":1980},"scene":[{"tipo":"apertura","testo":"In certi settori guadagnano quasi tutti. In altri, ==quasi nessuno==."},{"tipo":"colpo","testo":"Non basta ==essere bravi==."},{"tipo":"testo","titolo":"La struttura","testo":"Per Michael Porter decide la struttura del settore: cinque forze si contendono il valore. La prima: la ==rivalità fra chi c'è già==."},{"tipo":"elenco","titolo":"Le altre quattro","voci":["Nuovi concorrenti","Prodotti sostitutivi","Il potere dei clienti","Il potere dei fornitori"]},{"tipo":"quiz","domanda":"Per un cinema, lo streaming è…","opzioni":["Un prodotto sostitutivo","Un nuovo concorrente","Un fornitore"],"corretta":0,"spiegazione":"Stesso bisogno, altro modo. Per Porter i sostituti mettono un tetto ai prezzi."},{"tipo":"principio","testo":"Più le cinque forze sono deboli, ==più margine resta== a chi lavora in quel settore."},{"tipo":"chiusura","azione":"Dai un voto da 1 a 5 a ogni forza ==nel tuo settore==. Qual è la più forte?"}]},{"id":"oceano-blu-mercato-nuovo","categoria":"business","titolo":"Il circo che ha smesso di fare il circo","libro":{"titolo":"Strategia Oceano Blu","autore":"W. Chan Kim, Renée Mauborgne","anno":2005,"titoloOriginale":"Blue Ocean Strategy"},"scene":[{"tipo":"apertura","testo":"Un circo toglie gli animali, alza i prezzi ==e fa il pieno==."},{"tipo":"testo","titolo":"Cirque du Soleil, 1984","testo":"Il circo perde pubblico da anni. Loro non fanno un circo migliore: lo mescolano al teatro e puntano sugli adulti."},{"tipo":"colpo","testo":"Niente rivali. ==Mare aperto.=="},{"tipo":"confronto","a":{"etichetta":"Oceano rosso","voci":["Il mercato che esiste già","Tutti sugli stessi clienti"]},"b":{"etichetta":"Oceano blu","voci":["Uno spazio di mercato nuovo","La concorrenza non conta più"]}},{"tipo":"elenco","titolo":"Quattro mosse per arrivarci","voci":["Elimina ciò che tutti danno per scontato","Riduci ciò che è troppo","Aumenta ciò che vale","Crea ciò che nessuno offre"]},{"tipo":"esempio","testo":"Via animali e artisti famosi: costano. Dentro una storia, musica, danza. ==Meno costi, più valore==, a prezzi da teatro."},{"tipo":"chiusura","azione":"Dividi un foglio in quattro: elimina, riduci, aumenta, crea. ==Riempilo.=="}]},{"id":"effective-executive-conosci-il-tempo","categoria":"leadership","titolo":"Non sai dove va il tuo tempo","libro":{"titolo":"The Effective Executive","autore":"Peter F. Drucker","anno":1967},"scene":[{"tipo":"apertura","testo":"Credi di sapere dove va il tuo tempo. ==Quasi certamente sbagli.=="},{"tipo":"quiz","domanda":"Per Drucker, qual è il primo passo per lavorare meglio?","opzioni":["Pianificare la settimana","Registrare dove va il tempo","Fare una lista di priorità"],"corretta":1,"spiegazione":"Prima di pianificare devi sapere dove va il tempo. La memoria non basta."},{"tipo":"esempio","testo":"Un presidente d'azienda giura: mi divido fra dirigenti, clienti e impegni pubblici. Il registro dice altro: ==quasi niente a tutti e tre==."},{"tipo":"colpo","testo":"La memoria ==mente==."},{"tipo":"elenco","titolo":"I tre passi di Drucker","numerato":true,"voci":["Registra il tempo mentre lo usi","Taglia ciò che non serve","Unisci il resto in blocchi lunghi"]},{"tipo":"principio","testo":"Finché non governi il tuo tempo, ==non governi nient'altro==."},{"tipo":"chiusura","azione":"Fino a stasera annota ogni mezz'ora cosa fai. ==Domani confronta.=="}]},{"id":"good-strategy-bad-strategy-nocciolo","categoria":"business","titolo":"27 navi contro 33: che cos'è una strategia","libro":{"titolo":"Good Strategy/Bad Strategy","autore":"Richard P. Rumelt","anno":2011},"scene":[{"tipo":"apertura","testo":"Trafalgar, 1805. 27 navi contro 33. ==Vincono le 27.=="},{"tipo":"esempio","testo":"Nelson non si mette in fila davanti al nemico. Divide la flotta in due colonne e taglia la loro linea. Loro perdono 22 navi. Lui nessuna."},{"tipo":"colpo","testo":"Questa è ==strategia==."},{"tipo":"testo","titolo":"E questa no","testo":"«Cresceremo del 20% l'anno.» Per Richard Rumelt è un desiderio: non dice ==quale ostacolo== superare, né come."},{"tipo":"elenco","titolo":"Il nocciolo, per Rumelt","numerato":true,"voci":["Diagnosi: qual è la vera sfida","Linea guida: come la affronti","Azioni coerenti che si rafforzano"]},{"tipo":"quiz","domanda":"Quale di queste è una strategia?","opzioni":["Raddoppiare i clienti","Diventare i numeri uno","Servire solo i ristoranti"],"corretta":2,"spiegazione":"Le prime due sono traguardi. La terza sceglie dove concentrare le forze."},{"tipo":"chiusura","azione":"Prendi un tuo obiettivo. Scrivi sotto ==l'ostacolo principale==."}]},{"id":"built-to-last-bhag","categoria":"business","titolo":"L'obiettivo che fa un po' paura","libro":{"titolo":"Built to Last","autore":"Jim Collins, Jerry I. Porras","anno":1994},"scene":[{"tipo":"apertura","testo":"1961. Kennedy punta alla Luna ==entro il decennio==. Poteva dire meno."},{"tipo":"confronto","a":{"etichetta":"Vago","voci":["Rafforzare il programma spaziale"]},"b":{"etichetta":"Preciso","voci":["Un uomo sulla Luna entro il decennio"]}},{"tipo":"colpo","testo":"Chiaro. ==E spaventoso.=="},{"tipo":"testo","testo":"Collins e Porras chiamano traguardi così BHAG, Big Hairy Audacious Goals: ==enormi, audaci, un po' spaventosi==."},{"tipo":"esempio","testo":"1952. Boeing vive di aerei militari. Punta lo stesso su un jet di linea, mentre Douglas resta alle eliche. Nasce il 707."},{"tipo":"mito","mito":"Un buon obiettivo deve essere realistico","realta":"Un BHAG è fuori dalla zona di comfort: riuscirci ==non è affatto scontato==."},{"tipo":"principio","testo":"Un traguardo enorme e chiaro ==mette in moto le persone== più di cento buoni propositi."},{"tipo":"chiusura","azione":"Riscrivi un tuo «vorrei migliorare»: ==un risultato e una data==."}]},{"id":"the-goal-collo-di-bottiglia","categoria":"business","titolo":"Il gruppo va al passo del più lento","libro":{"titolo":"The Goal","autore":"Eliyahu M. Goldratt, Jeff Cox","anno":1984},"scene":[{"tipo":"apertura","testo":"In gita la fila va al passo ==del più lento==. In azienda pure."},{"tipo":"esempio","testo":"Nel romanzo Alex, direttore di fabbrica, porta in gita degli scout. La fila si sfilaccia: tutti dipendono da Herbie, il più lento. Lo mette ==in testa==."},{"tipo":"colpo","testo":"In fabbrica è ==una macchina==."},{"tipo":"grafico","titolo":"Pezzi all'ora in ogni fase","forma":"barre","dati":[{"e":"Taglio","v":20},{"e":"Saldatura","v":12},{"e":"Forno","v":5},{"e":"Montaggio","v":15}],"nota":"Esempio illustrativo: escono 5 pezzi l'ora, come dal forno."},{"tipo":"quiz","domanda":"Dove investi per produrre di più?","opzioni":["Nel taglio, il più veloce","Nel forno, il più lento","Un po' ovunque"],"corretta":1,"spiegazione":"Potenziare le altre fasi crea solo pezzi fermi in coda davanti al forno."},{"tipo":"principio","testo":"Goldratt lo chiama collo di bottiglia: un'ora persa lì è ==persa per tutto il sistema==."},{"tipo":"chiusura","azione":"Guarda la tua settimana: ==dove si accumula il lavoro in attesa?=="}]},{"id":"measure-what-matters-okr","categoria":"business","titolo":"Il pezzo che manca ai tuoi obiettivi","libro":{"titolo":"Measure What Matters","autore":"John Doerr","anno":2018},"scene":[{"tipo":"apertura","testo":"«Quest'anno voglio migliorare.» ==Come saprai se ci sei riuscito?=="},{"tipo":"colpo","testo":"Manca ==un numero==."},{"tipo":"testo","titolo":"Da Intel a Google","testo":"John Doerr impara il metodo a Intel, da Andy Grove. Nel 1999 lo porta a ==Google==. Si chiama OKR: obiettivi e risultati chiave."},{"tipo":"confronto","titolo":"Le due metà di un OKR","a":{"etichetta":"Obiettivo","voci":["Che cosa vuoi ottenere"]},"b":{"etichetta":"Risultati chiave","voci":["Come sai di esserci arrivato","Con un numero e una scadenza"]}},{"tipo":"quiz","domanda":"Quale di questi è un risultato chiave?","opzioni":["Migliorare l'assistenza","Curare di più i clienti","Rispondere a tutti entro 24 ore"],"corretta":2,"spiegazione":"È l'unico che si può verificare: a fine mese o è successo, o no."},{"tipo":"principio","testo":"L'obiettivo dice dove vai. I risultati chiave dicono ==se ci sei arrivato==."},{"tipo":"chiusura","azione":"Scrivi un obiettivo per tre mesi. Sotto, ==tre risultati con un numero==."}]},{"id":"high-output-management-maturita-compito","categoria":"leadership","titolo":"Quando controllare tutto è la scelta giusta","libro":{"titolo":"High Output Management","autore":"Andrew S. Grove","anno":1983},"scene":[{"tipo":"apertura","testo":"Controllare ogni dettaglio è da pessimo capo. ==O da ottimo.=="},{"tipo":"quiz","domanda":"Una collega esperta riceve un compito mai fatto. Come la segui?","opzioni":["Indicazioni precise e verifiche","La lascio fare: è esperta"],"corretta":0,"spiegazione":"Per Andrew Grove conta quanto è pronta su quel compito, non in generale."},{"tipo":"colpo","testo":"Dipende ==dal compito==."},{"tipo":"elenco","titolo":"Più è pronta, meno la guidi","voci":["Poco pronta: dici cosa, quando e come","A metà: dialogo e sostegno","Molto pronta: obiettivi e pochi controlli"]},{"tipo":"esempio","testo":"Grove pensa a un genitore. Al bimbo dici no. Con la prima bici gli stai accanto. All'università ==chiedi solo come va==."},{"tipo":"principio","testo":"Lo stile giusto dipende da quanto la persona è pronta ==per quel compito==."},{"tipo":"chiusura","azione":"Per ogni collega scrivi il compito della settimana e ==lo stile che serve==."}]},{"id":"partire-dal-perche-cerchio-doro","categoria":"business","titolo":"Sai cosa fai. Sai anche perché?","libro":{"titolo":"Partire dal perché","autore":"Simon Sinek","anno":2009,"titoloOriginale":"Start with Why"},"scene":[{"tipo":"apertura","testo":"Tutti sanno dire cosa fanno. Pochi sanno dire ==perché==."},{"tipo":"elenco","titolo":"Il cerchio d'oro di Sinek","voci":["Fuori: che cosa fai","In mezzo: come lo fai","Al centro: perché lo fai"]},{"tipo":"colpo","testo":"Quasi tutti partono ==da fuori==."},{"tipo":"confronto","titolo":"Lo stesso computer","a":{"etichetta":"Dal che cosa","voci":["Facciamo ottimi computer. Ne vuoi uno?"]},"b":{"etichetta":"Dal perché","voci":["Crediamo nel pensare diverso.","Per questo li facciamo così."]}},{"tipo":"esempio","testo":"1903. Langley ha fondi pubblici e la stampa al seguito. I Wright un negozio di bici. ==Volano loro.== Per Sinek li muoveva uno scopo."},{"tipo":"mito","mito":"Il perché di un'azienda è fare soldi","realta":"Per Sinek i soldi sono un risultato. Il perché è ==ciò in cui credi==."},{"tipo":"testo","testo":"È un modello costruito su storie scelte a posteriori: ==utile, non una legge==."},{"tipo":"chiusura","azione":"Completa: ==«Faccio questo lavoro perché credo che…»=="}]},{"id":"competitive-strategy-bloccati-a-meta","categoria":"business","titolo":"Né il più economico né il migliore","libro":{"titolo":"Competitive Strategy","autore":"Michael E. Porter","anno":1980},"scene":[{"tipo":"apertura","testo":"Né il più economico, né il migliore. ==Chi ti sceglie?=="},{"tipo":"esempio","testo":"Quattro alimentari in città. Il discount vince sul prezzo. La gastronomia sulla qualità. La bottega senza glutine sulla nicchia. E il quarto?"},{"tipo":"colpo","testo":"Il quarto ==resta a metà==."},{"tipo":"elenco","titolo":"Le tre strade di Porter","voci":["Costi più bassi di tutti","Qualcosa che il cliente vede come unico","Una nicchia servita meglio di chiunque"]},{"tipo":"mito","mito":"Chi offre un po' di tutto accontenta tutti","realta":"Per Porter resta ==bloccato a metà==: nessun vantaggio, margini bassi."},{"tipo":"testo","titolo":"Non tutti sono d'accordo","testo":"È la tesi di Porter, del 1980. Kim e Mauborgne ribattono: in un mercato nuovo puoi avere ==costi bassi e unicità==."},{"tipo":"chiusura","azione":"Scrivi in una riga perché scelgono te: ==prezzo, unicità o nicchia?=="}]},{"id":"effective-executive-punti-di-forza","categoria":"leadership","titolo":"Assumeresti un genio pieno di difetti?","libro":{"titolo":"The Effective Executive","autore":"Peter F. Drucker","anno":1967},"scene":[{"tipo":"apertura","testo":"Geniale coi numeri, un disastro con le persone. ==Lo assumi?=="},{"tipo":"mito","mito":"Meglio assumere chi non ha punti deboli","realta":"Per Drucker così ottieni la mediocrità: ==dove ci sono cime ci sono valli==."},{"tipo":"esempio","testo":"Lincoln sceglie generali senza grossi difetti. Va male. Poi nomina Grant: dicono che beva, ma ==vince le battaglie==. È la svolta, scrive Drucker."},{"tipo":"colpo","testo":"Conta ==cosa sa fare==."},{"tipo":"confronto","a":{"etichetta":"Evitare i difetti","voci":["Cerchi chi non sbaglia mai","Ottieni una squadra nella media"]},"b":{"etichetta":"Puntare sui talenti","voci":["Cerchi chi eccelle in ciò che serve","Tolleri i difetti che lì non pesano"]}},{"tipo":"principio","testo":"Un'organizzazione serve a rendere ==produttivi i punti di forza== e irrilevanti le debolezze."},{"tipo":"chiusura","azione":"Scrivi tre colleghi e accanto ==ciò che ognuno fa meglio==. Poi tu."}]},{"id":"mucca-viola-straordinario","categoria":"business","titolo":"Il contrario di straordinario non è «scarso»","libro":{"titolo":"La mucca viola","autore":"Seth Godin","anno":2003,"titoloOriginale":"Purple Cow"},"scene":[{"tipo":"apertura","testo":"La prima mucca la guardi. Alla ventesima ==non ti giri nemmeno==."},{"tipo":"testo","titolo":"L'immagine di Seth Godin","testo":"Dopo un po' le mucche sono tutte uguali: invisibili. Una ==mucca viola== invece la noteresti. E la racconteresti a qualcuno."},{"tipo":"mito","mito":"Se un prodotto è molto buono, si fa notare","realta":"Per Godin «molto buono» è la norma. E della norma ==non parla nessuno==."},{"tipo":"esempio","testo":"Dutch Boy vendeva vernice come tutti. Poi cambia il barattolo: facile da portare, versare, richiudere. La gente ==inizia a parlarne==."},{"tipo":"colpo","testo":"Stessa vernice. ==Altra storia.=="},{"tipo":"principio","testo":"Straordinario, per Godin, è ciò di cui ==vale la pena parlare==. Il resto passa inosservato."},{"tipo":"chiusura","azione":"Scrivi la frase che un cliente direbbe di te ==a un amico==. Non ti viene? Parti da lì."}]},{"id":"questo-e-il-marketing-mercato-minimo","categoria":"business","titolo":"«È per tutti» è la risposta sbagliata","libro":{"titolo":"Questo è il marketing","autore":"Seth Godin","anno":2018,"titoloOriginale":"This Is Marketing"},"scene":[{"tipo":"apertura","testo":"«Per chi è quello che fai?» «Per tutti.» ==Risposta sbagliata.=="},{"tipo":"mito","mito":"Più persone raggiungi, più vendi","realta":"Per Seth Godin chi parla a tutti fa una cosa media: ==non entusiasma nessuno==."},{"tipo":"colpo","testo":"Lui parte ==dal lato opposto==."},{"tipo":"principio","testo":"Scegli il mercato più piccolo che ti tiene in piedi. E ==servilo meglio di chiunque altro==."},{"tipo":"quiz","domanda":"Apri una palestra. Seguendo Godin, da chi parti?","opzioni":["Chi vuole tenersi in forma","Le neomamme del quartiere","Tutta la città, a prezzi bassi"],"corretta":1,"spiegazione":"Un gruppo piccolo e preciso lo capisci e lo servi davvero."},{"tipo":"testo","testo":"Piccolo non è per sempre: pochi clienti che ti adorano ==ti portano gli altri==."},{"tipo":"chiusura","azione":"Completa in una riga: «Quello che faccio è per chi crede che…». ==Mostrala a qualcuno.=="}]},{"id":"questo-e-il-marketing-gente-come-noi","categoria":"business","titolo":"Compri quello che compra la gente come te","libro":{"titolo":"Questo è il marketing","autore":"Seth Godin","anno":2018,"titoloOriginale":"This Is Marketing"},"scene":[{"tipo":"apertura","testo":"Quelle scarpe non le hai scelte da solo. ==Le avevano i tuoi amici.=="},{"tipo":"esempio","testo":"In ufficio tre colleghi si portano il pranzo da casa. Dopo un mese lo fanno quasi tutti. ==Nessuno ha letto studi sul risparmio.=="},{"tipo":"colpo","testo":"Hanno guardato ==gli altri==."},{"tipo":"mito","mito":"Scelgo in base a prezzo e qualità","realta":"Per Seth Godin scegli pensando: ==gente come noi fa cose come questa==."},{"tipo":"confronto","titolo":"Due idee di marketing","a":{"etichetta":"Convincere tutti","voci":["Elenchi i vantaggi","Parli alla massa"]},"b":{"etichetta":"Cambiare un gruppo","voci":["Scegli un «noi» preciso","Mostri cosa fa chi ne fa parte"]}},{"tipo":"testo","titolo":"Quale gruppo?","testo":"Godin non punta a cambiare «la» cultura: è troppo grande. Ne sceglie ==una piccola==: una classe, un quartiere, una nicchia."},{"tipo":"chiusura","azione":"Guarda l'ultima cosa che hai comprato. Scrivi ==chi intorno a te la usava già==."}]},{"id":"positioning-scala-nella-mente","categoria":"business","titolo":"Avis disse «siamo secondi». E iniziò a guadagnare","libro":{"titolo":"Positioning: The Battle for Your Mind","autore":"Al Ries, Jack Trout","anno":1981},"scene":[{"tipo":"apertura","testo":"Elenca le marche di dentifricio che ricordi. ==Ti fermi presto.=="},{"tipo":"testo","testo":"Per Al Ries e Jack Trout la mente tiene ==poche marche, in ordine==, per ogni prodotto. Come i pioli di una scala."},{"tipo":"colpo","testo":"E se sei ==il numero due==?"},{"tipo":"esempio","testo":"Anni Sessanta. Avis è dietro Hertz e perde soldi da 13 anni. Poi lo ammette: siamo i numeri due, quindi ==ci impegniamo di più==."},{"tipo":"grafico","titolo":"Utili di Avis dopo la campagna, in dollari","forma":"barre","unita":"mln","dati":[{"e":"1° anno","v":1.2},{"e":"2° anno","v":2.6},{"e":"3° anno","v":5}],"nota":"Cifre riportate da Ries e Trout."},{"tipo":"mito","mito":"Per crescere devi dire che sei il migliore","realta":"Avis ha ==legato il suo nome a Hertz== e si è presa il secondo piolo."},{"tipo":"principio","testo":"Il posizionamento non si fa sul prodotto: si fa ==nella testa di chi compra==."},{"tipo":"chiusura","azione":"Chiedi a tre persone la prima marca del tuo campo. ==Segna a che piolo sei tu.=="}]},{"id":"22-leggi-marketing-essere-primi","categoria":"business","titolo":"Chi è stato il secondo? Appunto","libro":{"titolo":"Le 22 immutabili leggi del marketing","autore":"Al Ries, Jack Trout","anno":1993,"titoloOriginale":"The 22 Immutable Laws of Marketing"},"scene":[{"tipo":"apertura","testo":"Il primo a volare da solo sull'Atlantico? Facile. ==E il secondo?=="},{"tipo":"colpo","testo":"Lindbergh. Poi ==il vuoto==."},{"tipo":"testo","testo":"Per Al Ries e Jack Trout nel marketing è uguale: in testa resta ==chi arriva primo==, non chi è meglio."},{"tipo":"quiz","domanda":"Arrivi tardi, il leader c'è già. Cosa consigliano gli autori?","opzioni":["Un prodotto migliore","Copiare il leader a meno","Aprire una categoria nuova"],"corretta":2,"spiegazione":"La domanda utile non è «in cosa sei meglio?» ma «in cosa sei il primo?»."},{"tipo":"esempio","testo":"Amelia Earhart non fu la prima a sorvolare da sola l'Atlantico. Fu ==la prima donna==. E il nome lo conosci."},{"tipo":"principio","testo":"Se non puoi essere il primo in una categoria, ==inventane una in cui lo sei==."},{"tipo":"chiusura","azione":"Completa: «Sono il primo che…». ==Restringi il campo== finché è vera."}]},{"id":"22-leggi-marketing-una-parola","categoria":"business","titolo":"La marca più forte possiede una parola sola","libro":{"titolo":"Le 22 immutabili leggi del marketing","autore":"Al Ries, Jack Trout","anno":1993,"titoloOriginale":"The 22 Immutable Laws of Marketing"},"scene":[{"tipo":"apertura","testo":"Dico «sicurezza». Tu pensi a ==una marca d'auto==. Sempre quella."},{"tipo":"colpo","testo":"==Volvo.== E non per caso."},{"tipo":"testo","testo":"Per anni ha ripetuto una cosa sola. Per Al Ries e Jack Trout una marca è forte se ==possiede una parola== in testa alla gente."},{"tipo":"elenco","titolo":"Altri esempi dal libro","voci":["FedEx: ==consegna in una notte==","Crest, dentifricio: niente carie","BMW: il piacere di guidare"]},{"tipo":"quiz","domanda":"Per gli autori, quale parola è la meno adatta da «possedere»?","opzioni":["Qualità","Velocità","Sicurezza"],"corretta":0,"spiegazione":"La dichiarano tutti, nessuno dice il contrario: non distingue."},{"tipo":"mito","mito":"Dieci pregi convincono più di uno","realta":"Per gli autori così la parola si annacqua: ==più restringi, più resti==."},{"tipo":"chiusura","azione":"Scrivi cinque cose che dici di te. ==Cancellane quattro.== Resta la tua parola."}]},{"id":"storybrand-cliente-eroe","categoria":"business","titolo":"Nella tua storia l'eroe non sei tu","libro":{"titolo":"Building a StoryBrand","autore":"Donald Miller","anno":2017},"scene":[{"tipo":"apertura","testo":"Quando parli di te, sei ==Luke o Yoda==? Quasi tutti sbagliano ruolo."},{"tipo":"confronto","titolo":"Lo stesso idraulico, due voci","a":{"etichetta":"Fa Luke","voci":["Trent'anni di esperienza","Furgoni nuovi, premi vinti"]},"b":{"etichetta":"Fa Yoda","voci":["Perdita in casa?","Arriviamo in un'ora"]}},{"tipo":"testo","testo":"Donald Miller nota che le aziende parlano di sé: storia, premi, valori. Ma chi ascolta ==è già l'eroe della sua storia==."},{"tipo":"colpo","testo":"Cerca ==una guida==."},{"tipo":"elenco","titolo":"La trama che Miller propone","numerato":true,"voci":["Un personaggio ha un problema","Incontra una guida con un piano","La guida lo chiama all'azione","Evita il fallimento, arriva al successo"]},{"tipo":"principio","testo":"Il cliente è Luke. Tu sei Yoda: hai un piano e ==lo aiuti a vincere==."},{"tipo":"chiusura","azione":"Apri la tua bio. Conta le frasi con «io» o «noi». ==Riscrivine una partendo dal cliente.=="}]},{"id":"100m-offers-equazione-valore","categoria":"business","titolo":"Stesso risultato, prezzi lontanissimi: cosa paghi?","libro":{"titolo":"$100M Offers","autore":"Alex Hormozi","anno":2021},"scene":[{"tipo":"apertura","testo":"Paghi la ditta di traslochi molto più del furgone. ==E ti sembra giusto.=="},{"tipo":"colpo","testo":"I mobili arrivano ==uguali==."},{"tipo":"testo","testo":"Alex Hormozi la chiama equazione del valore: quanto vale un'offerta dipende da ==quattro leve==."},{"tipo":"elenco","titolo":"Due da alzare, due da abbassare","voci":["Su: quanto desideri il risultato","Su: quanto credi di ottenerlo","Giù: quanto devi aspettare","Giù: quanta fatica ti costa"]},{"tipo":"quiz","domanda":"La ditta, rispetto al furgone, quali leve muove?","opzioni":["Un risultato più desiderato","Meno attesa e meno fatica"],"corretta":1,"spiegazione":"Il risultato è lo stesso. Lo paghi per averlo in un giorno, senza scatoloni."},{"tipo":"colpo","testo":"Paghi ==tempo e fatica in meno==."},{"tipo":"chiusura","azione":"Prendi una cosa che offri. Trova un modo per ==dimezzare l'attesa== del risultato."}]},{"id":"ogilvy-advertising-titolo","categoria":"business","titolo":"Su cinque che leggono il titolo, uno solo continua","libro":{"titolo":"Ogilvy on Advertising","autore":"David Ogilvy","anno":1983},"scene":[{"tipo":"apertura","testo":"Tre settimane di studio per scrivere ==una riga sola==. Ne valeva la pena."},{"tipo":"esempio","testo":"David Ogilvy deve vendere una Rolls-Royce. Legge tutto sull'auto e trova un dettaglio: a 60 miglia all'ora il rumore più forte è ==l'orologio==."},{"tipo":"colpo","testo":"Quel fatto ==diventa il titolo==."},{"tipo":"numero","valore":5,"suffisso":" volte","didascalia":"Per Ogilvy il titolo è letto da ==cinque volte più persone== del testo."},{"tipo":"mito","mito":"Il titolo incuriosisce, poi vende il testo","realta":"Per Ogilvy se il titolo non vende hai ==sprecato quasi tutti i soldi==."},{"tipo":"elenco","titolo":"I titoli che funzionano, per Ogilvy","voci":["Promettono un ==vantaggio== a chi legge","Portano una notizia","Dicono fatti precisi, non giochi di parole"]},{"tipo":"chiusura","azione":"Riprendi il tuo ultimo post. ==Riscrivi solo il titolo== con un vantaggio preciso."}]},{"id":"spin-selling-quattro-domande","categoria":"business","titolo":"Il venditore bravo non chiude: chiede","libro":{"titolo":"SPIN Selling","autore":"Neil Rackham","anno":1988},"scene":[{"tipo":"apertura","testo":"Vuoi vendere qualcosa e ==parli tu==. È lì che perdi il cliente."},{"tipo":"mito","mito":"Il bravo venditore è chi sa chiudere","realta":"Nelle vendite grandi, per Neil Rackham, spingere a chiudere ==serve a poco==."},{"tipo":"numero","valore":35,"suffisso":" mila","didascalia":"Le visite di vendita studiate dal suo gruppo in ==dodici anni==."},{"tipo":"elenco","titolo":"I migliori fanno 4 domande: SPIN","numerato":true,"voci":["Situazione: come lavorate oggi?","Problema: cosa non va?","Implicazione: e cosa comporta?","Need-payoff: quanto vale risolverlo?"]},{"tipo":"quiz","domanda":"«Se il sito resta lento, quanti ordini perdete?» Che tipo è?","opzioni":["Di situazione","Di problema","Di implicazione"],"corretta":2,"spiegazione":"Non chiede se il problema c'è: fa vedere quanto costa."},{"tipo":"chiusura","azione":"Prima di proporre, prepara ==due domande sulle conseguenze==. Poi ascolta."}]},{"id":"traction-bersaglio-canali","categoria":"business","titolo":"19 modi per farti trovare. Te ne serve uno","libro":{"titolo":"Traction","autore":"Gabriel Weinberg, Justin Mares","anno":2014},"scene":[{"tipo":"apertura","testo":"Per farti trovare usi tre canali. ==E gli altri sedici?=="},{"tipo":"numero","valore":19,"didascalia":"I canali che Weinberg e Mares mettono in fila: ==stampa, fiere, email…=="},{"tipo":"testo","testo":"Dopo decine di interviste a fondatori, la loro tesi: usi i canali che conosci e ==scarti senza provarlo== quello giusto."},{"tipo":"colpo","testo":"Loro usano ==un bersaglio==."},{"tipo":"elenco","titolo":"Il metodo del bersaglio","numerato":true,"voci":["Fuori: un'idea per ognuno dei 19 canali","In mezzo: prove piccole sui migliori","Centro: tutto sul canale che funziona"]},{"tipo":"esempio","testo":"Vendi biscotti. Con 50 euro a prova tenti annunci social, mercato, due bar. I bar riordinano ogni settimana: ==ecco il centro==."},{"tipo":"principio","testo":"Di solito, in ogni fase, ti fa crescere ==un canale solo==. Va trovato provando."},{"tipo":"chiusura","azione":"Scrivi ==tre canali mai provati==. Per ognuno, una prova da meno di 50 euro."}]},{"id":"alchemy-psico-logica","categoria":"business","titolo":"Bocciata agli assaggi, cara, minuscola: ha stravinto","libro":{"titolo":"Alchemy","autore":"Rory Sutherland","anno":2019},"scene":[{"tipo":"apertura","testo":"Cara, in lattina minuscola, bocciata agli assaggi. ==Chi la compra?=="},{"tipo":"colpo","testo":"È ==Red Bull==."},{"tipo":"confronto","titolo":"Sfidare la Coca-Cola","a":{"etichetta":"La logica chiedeva","voci":["Più buona","Più grande, meno cara"]},"b":{"etichetta":"Ha funzionato","voci":["Gusto bocciato ai test","Lattina mini, prezzo alto"]}},{"tipo":"testo","testo":"Per Rory Sutherland non scegliamo con la logica degli economisti. Seguiamo una ==psico-logica==: segnali, contesto, sensazioni."},{"tipo":"quiz","domanda":"Aspettare il taxi snerva. Qual è la mossa «psico-logica»?","opzioni":["Mettere più auto in strada","Mostrare l'auto sulla mappa"],"corretta":1,"spiegazione":"È la mappa di Uber: l'attesa è uguale, ma senza incertezza pesa molto meno."},{"tipo":"principio","testo":"Anche il contrario di una buona idea può funzionare: ==prova ciò che sembra assurdo==."},{"tipo":"chiusura","azione":"Prendi un problema che ti blocca. Scrivi ==la soluzione opposta a quella ovvia==."}]},{"id":"obviously-awesome-contesto","categoria":"business","titolo":"Suona in metro un grande violinista: tirano dritto","libro":{"titolo":"Obviously Awesome","autore":"April Dunford","anno":2019},"scene":[{"tipo":"apertura","testo":"Un violinista famoso suona in metro. ==Quasi nessuno si ferma.=="},{"tipo":"esempio","testo":"Washington, 2007. Joshua Bell suona in incognito in una stazione. Stesso violino, stessa musica. Vedono ==un musicista di strada==."},{"tipo":"colpo","testo":"Cambia ==solo il contesto==."},{"tipo":"testo","testo":"Per April Dunford ai prodotti capita uguale: è il contesto a dire ==che cos'è questa cosa== e con cosa confrontarla."},{"tipo":"quiz","domanda":"Per posizionare un prodotto, da dove parte Dunford?","opzioni":["Da cosa useresti se non ci fosse","Dalle sue funzioni migliori"],"corretta":0,"spiegazione":"Dalle alternative vere. Spesso non è un'azienda: è Excel, uno stagista, o niente."},{"tipo":"principio","testo":"Posizionare è scegliere la cornice in cui sei ==la scelta ovvia== per le persone giuste."},{"tipo":"chiusura","azione":"Chiedi a un cliente: ==«Se questo non esistesse, cosa useresti?»== Scrivi la risposta."}]},{"id":"scientific-advertising-prova-in-piccolo","categoria":"business","titolo":"Il nonno del test A/B usava buoni di carta","libro":{"titolo":"Scientific Advertising","autore":"Claude C. Hopkins","anno":1923},"scene":[{"tipo":"apertura","testo":"1923, niente internet. C'è già chi fa ==test A/B==. Con la carta."},{"tipo":"colpo","testo":"Lui diceva ==campagne di prova==."},{"tipo":"mito","mito":"La pubblicità migliore si sceglie in riunione","realta":"Per Claude Hopkins decide ==una piccola prova== sui clienti veri."},{"tipo":"elenco","titolo":"Il metodo di Hopkins","numerato":true,"voci":["Due annunci, un buono con codice diverso","Poche copie: conti i buoni tornati","Spendi in grande solo su chi vince"]},{"tipo":"esempio","testo":"Oggi vendi torte. Titolo A: «La torta della nonna». Titolo B: «Torta per 8, pronta in 24 ore». ==Due codici sconto==: vedi quale usano di più."},{"tipo":"principio","testo":"Prima chiedi a pochi clienti veri. Poi ==spendi su tutti gli altri==."},{"tipo":"chiusura","azione":"Scrivi ==due versioni dell'oggetto== della prossima mail. Mandale a due gruppi e conta."}]},{"id":"leaders-eat-last-cerchio-di-sicurezza","categoria":"leadership","titolo":"Perché nei Marines i capi mangiano per ultimi","libro":{"titolo":"Ultimo viene il leader","autore":"Simon Sinek","anno":2014,"titoloOriginale":"Leaders Eat Last"},"scene":[{"tipo":"apertura","testo":"Alla mensa dei Marines gli ufficiali mangiano ==per ultimi==."},{"tipo":"colpo","testo":"Nessuno glielo ordina."},{"tipo":"testo","testo":"Per Simon Sinek è un segnale. Chi guida protegge il gruppo. Nasce così un ==cerchio di sicurezza==."},{"tipo":"confronto","titolo":"Dove vanno le energie","a":{"etichetta":"Senza cerchio","voci":["Ti guardi le spalle dai colleghi","Nascondi gli errori"]},"b":{"etichetta":"Dentro il cerchio","voci":["Chiedi aiuto senza vergogna","Le forze vanno ai pericoli veri"]}},{"tipo":"colpo","testo":"Lo sapeva già ==Esopo==."},{"tipo":"esempio","testo":"Quattro buoi stanno coda contro coda. Il leone trova solo corna. Poi litigano e si separano. Il leone ==li mangia uno a uno==. Sinek cita questa favola."},{"tipo":"principio","testo":"I pericoli fuori non li controlli. Quelli dentro sì: toglierli è ==il compito di chi guida==."},{"tipo":"chiusura","azione":"Scegli chi nel tuo gruppo è in difficoltà. Chiedigli: ==di cosa hai bisogno?=="}]},{"id":"five-dysfunctions-piramide-fiducia","categoria":"leadership","titolo":"Tutti bravi, squadra pessima: c'è una piramide sotto","libro":{"titolo":"La guerra nel team","autore":"Patrick Lencioni","anno":2002,"titoloOriginale":"The Five Dysfunctions of a Team"},"scene":[{"tipo":"apertura","testo":"Tutti bravi, presi uno per uno. Insieme, ==un disastro==."},{"tipo":"colpo","testo":"Sotto c'è ==una piramide==."},{"tipo":"testo","testo":"Patrick Lencioni la racconta così: cinque difetti impilati. Ognuno ==regge quello sopra==."},{"tipo":"elenco","titolo":"La piramide, dal basso","numerato":true,"voci":["Niente fiducia: nessuno ammette errori","Niente conflitto: accordo per finta","Niente impegno: decisioni vaghe","Niente richiami fra colleghi"]},{"tipo":"colpo","testo":"In cima: ==ognuno pensa a sé==."},{"tipo":"quiz","domanda":"Per riparare la squadra, da quale piano si parte?","opzioni":["Dai risultati","Dai richiami","Dalla fiducia"],"corretta":2,"spiegazione":"Senza fiducia nessuno dice cosa pensa. E i piani sopra cedono."},{"tipo":"principio","testo":"Fidarsi, in squadra, è poter dire ==«ho sbagliato»== senza pagarla."},{"tipo":"chiusura","azione":"Alla prossima riunione ammetti tu per primo ==un tuo errore==."}]},{"id":"extreme-ownership-colpa-mia","categoria":"leadership","titolo":"Fuoco amico: il comandante che disse «colpa mia»","libro":{"titolo":"Mai dire ma","autore":"Jocko Willink, Leif Babin","anno":2015,"titoloOriginale":"Extreme Ownership"},"scene":[{"tipo":"apertura","testo":"Fuoco amico in Iraq. Il comandante dice: ==colpa mia==."},{"tipo":"esempio","testo":"Ramadi, 2006. Nel caos due gruppi alleati si sparano addosso. Hanno sbagliato in tanti. Jocko Willink comanda i SEAL. A rapporto si prende ==tutta la colpa==."},{"tipo":"colpo","testo":"Poteva costargli ==il comando==."},{"tipo":"testo","testo":"Invece, racconta Willink, i superiori si fidano di più. E se il capo non cerca scuse, ==non le cerca nessuno==."},{"tipo":"mito","mito":"Se ammetti un errore perdi autorità","realta":"Per Willink e Babin è il contrario: ==la guadagni==."},{"tipo":"confronto","titolo":"Quando va storto","a":{"etichetta":"Scuse","voci":["«Nessuno me l'aveva detto»"]},"b":{"etichetta":"Responsabilità","voci":["«Non l'ho spiegato bene io»"]}},{"tipo":"principio","testo":"Di ciò che succede alla tua squadra rispondi tu. Non c'è ==nessun altro da incolpare==."},{"tipo":"chiusura","azione":"Una cosa andata male questa settimana: scrivi cosa ==potevi fare tu==."}]},{"id":"extreme-ownership-una-priorita-alla-volta","categoria":"leadership","titolo":"Dieci urgenze insieme: la regola dei Navy SEAL","libro":{"titolo":"Mai dire ma","autore":"Jocko Willink, Leif Babin","anno":2015,"titoloOriginale":"Extreme Ownership"},"scene":[{"tipo":"apertura","testo":"Dieci urgenze nello stesso minuto. ==Da quale parti?=="},{"tipo":"esempio","testo":"Ramadi, Iraq. La squadra di Leif Babin è su un tetto, allo scoperto. Un uomo è caduto di sotto, ferito. E non si sa se ==ci sono tutti==."},{"tipo":"colpo","testo":"Tre emergenze. ==Un minuto.=="},{"tipo":"quiz","domanda":"Qual è il primo ordine di Babin?","opzioni":["Soccorrere il ferito","Mettere la squadra al sicuro","Contare gli uomini"],"corretta":1,"spiegazione":"Prima la sicurezza di tutti. Poi il ferito. Poi la conta. Una cosa alla volta."},{"tipo":"principio","testo":"Se affronti tutti i problemi insieme li sbagli tutti. ==Scegli il più grave== e parti da lì."},{"tipo":"elenco","titolo":"La formula dei Navy SEAL","numerato":true,"voci":["Rilassati","Guardati intorno","Decidi"]},{"tipo":"chiusura","azione":"Scrivi cosa ti assilla. Cerchia ==la cosa più grave==. Dieci minuti solo su quella."}]},{"id":"dare-to-lead-chiaro-e-gentile","categoria":"leadership","titolo":"Sei vago per gentilezza? È il contrario","libro":{"titolo":"Dare to Lead","autore":"Brené Brown","anno":2018},"scene":[{"tipo":"apertura","testo":"«Va bene così, tranquillo». Poi rifai tutto ==di nascosto==."},{"tipo":"colpo","testo":"Ti sembra ==gentilezza==."},{"tipo":"testo","testo":"Quando addolciamo una verità, scrive Brené Brown, di rado è per l'altro. È per ==evitare il nostro disagio==."},{"tipo":"elenco","titolo":"Tre modi di essere vaghi","voci":["Dire mezze verità","Non dire cosa ti aspetti, poi lamentarti","Parlare di qualcuno, non con lui"]},{"tipo":"mito","mito":"Essere gentili vuol dire evitare le cose scomode","realta":"Per Brown è il contrario. Chiaro è gentile, ==vago è scortese==."},{"tipo":"confronto","titolo":"Chiedere un lavoro","a":{"etichetta":"Vago","voci":["«Mi sistemi le slide?»"]},"b":{"etichetta":"Chiaro","voci":["«Cinque slide con i dati»","«Entro giovedì alle 18»"]}},{"tipo":"chiusura","azione":"Oggi, se chiedi qualcosa, descrivi ==il lavoro finito==: cosa e per quando."}]},{"id":"turn-the-ship-around-ho-intenzione-di","categoria":"leadership","titolo":"Il sottomarino dove il capo smise di dare ordini","libro":{"titolo":"Turn the Ship Around!","autore":"L. David Marquet","anno":2013},"scene":[{"tipo":"apertura","testo":"Sottomarino nucleare. Il comandante dà ==un ordine impossibile==."},{"tipo":"colpo","testo":"L'ufficiale ==lo ripete==."},{"tipo":"esempio","testo":"David Marquet comanda il Santa Fe da poco. Ordina una velocità che lì non esiste. L'ufficiale lo sa. Ma ==l'ha detto il capo==."},{"tipo":"testo","testo":"Marquet capisce il rischio. Se tutti aspettano ordini, ==pensa uno solo==. Smette di darne e cambia una frase."},{"tipo":"confronto","titolo":"La frase che cambia","a":{"etichetta":"Prima","voci":["«Chiedo il permesso di immergere»"]},"b":{"etichetta":"Dopo","voci":["«Ho intenzione di immergere»","Il capo conferma, o ferma"]}},{"tipo":"principio","testo":"Chi dice cosa intende fare ==pensa già da responsabile==."},{"tipo":"mito","mito":"Dare autonomia significa dire «fate voi»","realta":"Per Marquet servono due cose: ==competenza e obiettivo chiaro==."},{"tipo":"chiusura","azione":"Invece di «cosa faccio?», scrivi: ==«Ho intenzione di…»== e il perché."}]},{"id":"culture-code-torre-di-spaghetti","categoria":"leadership","titolo":"Bambini dell'asilo contro futuri manager: chi vince?","libro":{"titolo":"The Culture Code","autore":"Daniel Coyle","anno":2018},"scene":[{"tipo":"apertura","testo":"Spaghetti, nastro, spago, un marshmallow. Chi fa ==la torre più alta==?"},{"tipo":"quiz","domanda":"Stessi materiali, stesso tempo. Chi vince in media?","opzioni":["Bambini dell'asilo","Studenti di business school","Avvocati"],"corretta":0,"spiegazione":"Vincono i bambini. Torri alte oltre il doppio di quelle degli studenti."},{"tipo":"colpo","testo":"Non sono ==più intelligenti==."},{"tipo":"confronto","titolo":"Come lavorano","a":{"etichetta":"Gli studenti","voci":["Discutono e pianificano","Si chiedono chi comanda"]},"b":{"etichetta":"I bambini","voci":["Provano, sbagliano, riprovano","Spalla a spalla"]}},{"tipo":"principio","testo":"Per Daniel Coyle conta ==come il gruppo interagisce==. Non quanto talento somma."},{"tipo":"elenco","titolo":"Le tre abilità dei gruppi forti","voci":["Creare sicurezza","Mostrarsi vulnerabili","Darsi uno scopo"]},{"tipo":"chiusura","azione":"Lavoro di gruppo? Chiedi il parere a ==chi non ha ancora parlato==."}]},{"id":"creativity-inc-braintrust","categoria":"leadership","titolo":"Alla Pixar ogni film all'inizio è brutto","libro":{"titolo":"Verso la creatività e oltre","autore":"Ed Catmull, Amy Wallace","anno":2014,"titoloOriginale":"Creativity, Inc."},"scene":[{"tipo":"apertura","testo":"Toy Story, Nemo, Up. All'inizio erano ==tutti brutti==."},{"tipo":"colpo","testo":"Lo dice chi guidava la Pixar."},{"tipo":"testo","testo":"Ed Catmull, cofondatore: le prime versioni non funzionano mai. Serve chi ti dica ==cosa non va, e presto==."},{"tipo":"elenco","titolo":"Il Braintrust, in breve","voci":["Il regista mostra il film ai colleghi","Si critica il film, non la persona","Si indica il problema con precisione","Nessuno può imporre nulla"]},{"tipo":"principio","testo":"Una critica si ascolta meglio da chi ==non può imporla==."},{"tipo":"confronto","titolo":"Una nota che serve","a":{"etichetta":"Vaga","voci":["«Non mi convince»"]},"b":{"etichetta":"Precisa","voci":["«Dal terzo minuto perdo il filo»"]}},{"tipo":"chiusura","azione":"Mostra a due persone un lavoro a
