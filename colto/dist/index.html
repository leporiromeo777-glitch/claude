 metà. Chiedi: ==«Dove non funziona?»=="}]},{"id":"creativity-inc-squadra-prima-dell-idea","categoria":"leadership","titolo":"Idea geniale o squadra geniale? Scegline una","libro":{"titolo":"Verso la creatività e oltre","autore":"Ed Catmull, Amy Wallace","anno":2014,"titoloOriginale":"Creativity, Inc."},"scene":[{"tipo":"apertura","testo":"Idea geniale e gruppo mediocre. O il contrario. ==Cosa scegli?=="},{"tipo":"quiz","domanda":"Per Ed Catmull della Pixar, cosa funziona meglio?","opzioni":["Idea mediocre, squadra brillante","Idea geniale, squadra mediocre"],"corretta":0,"spiegazione":"Una squadra mediocre rovina anche l'idea buona. Una brillante la aggiusta."},{"tipo":"colpo","testo":"È successo con ==Toy Story 2==."},{"tipo":"esempio","testo":"Nasce come film minore, con un secondo gruppo. A meno di un anno dall'uscita non funziona. La Pixar cambia la guida e lo rifà. ==Stesso spunto, altro film==."},{"tipo":"principio","testo":"Le idee vengono dalle persone. Quindi ==le persone giuste== vengono prima dell'idea giusta."},{"tipo":"confronto","titolo":"Da dove parti","a":{"etichetta":"Dall'idea perfetta","voci":["Poi la affidi a chi capita"]},"b":{"etichetta":"Dalle persone giuste","voci":["L'idea la aggiustano loro"]}},{"tipo":"chiusura","azione":"Prossimo progetto: scrivi prima ==con chi== vuoi farlo. Poi cosa."}]},{"id":"no-rules-rules-feedback-quattro-a","categoria":"leadership","titolo":"A Netflix tacere una critica è sleale","libro":{"titolo":"L'unica regola è che non ci sono regole","autore":"Reed Hastings, Erin Meyer","anno":2020,"titoloOriginale":"No Rules Rules"},"scene":[{"tipo":"apertura","testo":"A Netflix tacere una critica utile è ==slealtà verso l'azienda==."},{"tipo":"colpo","testo":"Reed Hastings dà ==4 regole==."},{"tipo":"elenco","titolo":"Se la critica la fai tu","voci":["Punta ad aiutare, non a sfogarti","Di' cosa si può fare di diverso"]},{"tipo":"confronto","titolo":"Stessa critica, due modi","a":{"etichetta":"Sfogo","voci":["«Le tue slide sono un caos»"]},"b":{"etichetta":"Aiuto","voci":["«Un grafico per slide e si capisce»"]}},{"tipo":"elenco","titolo":"Se la critica la ricevi","voci":["Ascolta e ringrazia, senza difenderti","Valutala sul serio, poi decidi tu"]},{"tipo":"quiz","domanda":"Ricevi una critica sincera. Cosa sei tenuto a fare?","opzioni":["Seguirla","Ribattere","Ascoltarla e valutarla"],"corretta":2,"spiegazione":"Ascoltare e ringraziare è d'obbligo. Se seguirla lo decidi tu."},{"tipo":"chiusura","azione":"Chiedi a qualcuno: ==«Cosa potrei fare meglio?»== Poi ringrazia e basta."}]},{"id":"principles-meritocrazia-delle-idee","categoria":"leadership","titolo":"Era sicuro di avere ragione. Perse quasi tutto","libro":{"titolo":"I principi del successo","autore":"Ray Dalio","anno":2017,"titoloOriginale":"Principles"},"scene":[{"tipo":"apertura","testo":"1982. Ray Dalio annuncia una grande crisi. ==Non arriva.=="},{"tipo":"colpo","testo":"Perde ==quasi tutto==."},{"tipo":"testo","testo":"Dalio racconta che lì cambiò domanda. Non più «ho ragione». Ma: ==come so di avere ragione?=="},{"tipo":"mito","mito":"Il modo più giusto di decidere è votare","realta":"Per Dalio no: deve pesare di più ==chi ne sa davvero==."},{"tipo":"elenco","titolo":"I tre ingredienti di Dalio","voci":["Verità: dici quello che pensi","Trasparenza: le informazioni girano","Peso: conta di più chi ne sa davvero"]},{"tipo":"quiz","domanda":"Per Dalio, chi è «credibile» su un tema?","opzioni":["Chi ha il grado più alto","Chi l'ha già fatto bene, più volte","Chi parla più sicuro"],"corretta":1,"spiegazione":"Conta chi ha risultati ripetuti e sa spiegare le sue scelte."},{"tipo":"chiusura","azione":"Prossima decisione di gruppo: chiedi chi ==l'ha già fatto davvero==."}]},{"id":"multipliers-moltiplicatori","categoria":"leadership","titolo":"Il capo che ti rende più sveglio, e quello che ti spegne","libro":{"titolo":"Multipliers","autore":"Liz Wiseman","anno":2010},"scene":[{"tipo":"apertura","testo":"Con certi capi ti senti un genio. Con altri ==ti spegni==."},{"tipo":"colpo","testo":"Stessa testa. ==Capo diverso.=="},{"tipo":"testo","testo":"Liz Wiseman ha studiato oltre cento capi. I primi li chiama moltiplicatori. Gli altri ==rimpiccioliscono chi hanno intorno==."},{"tipo":"numero","valore":2,"suffisso":"×","didascalia":"Con un moltiplicatore le persone dicono di dare ==circa il doppio==.","nota":"Stima degli intervistati, non una misura oggettiva."},{"tipo":"confronto","titolo":"Due tipi di capo","a":{"etichetta":"Chi rimpicciolisce","voci":["Ha sempre lui la risposta","Decide da solo, poi informa"]},"b":{"etichetta":"Chi moltiplica","voci":["Fa domande difficili","Fa discutere, poi si decide"]}},{"tipo":"mito","mito":"Il capo migliore è il più intelligente della stanza","realta":"Per Wiseman è chi tira fuori ==l'intelligenza degli altri==."},{"tipo":"chiusura","azione":"In riunione datti ==cinque interventi==. Finiti quelli, ascolta e basta."}]},{"id":"first-90-days-punto-di-pareggio","categoria":"leadership","titolo":"Nuovo lavoro: all'inizio costi più di quanto rendi","libro":{"titolo":"I primi 90 giorni","autore":"Michael D. Watkins","anno":2003,"titoloOriginale":"The First 90 Days"},"scene":[{"tipo":"apertura","testo":"Primo giorno di lavoro: non produci valore. ==Lo consumi.=="},{"tipo":"colpo","testo":"Per quanto tempo?"},{"tipo":"numero","valore":6.2,"decimali":1,"suffisso":" mesi","didascalia":"Tempo medio perché un nuovo manager ==vada in pari==, secondo Watkins.","nota":"Stima di 210 dirigenti, per manager di medio livello."},{"tipo":"testo","testo":"Michael Watkins lo chiama punto di pareggio: hai reso quanto hai assorbito. I primi tre mesi decidono ==quanto presto ci arrivi==."},{"tipo":"confronto","titolo":"Due modi di cominciare","a":{"etichetta":"L'errore tipico","voci":["Arrivi con la soluzione in tasca"]},"b":{"etichetta":"Il metodo","voci":["Prima fai domande e impari"]}},{"tipo":"principio","testo":"Nei primi mesi non strafare. ==Impara in fretta== e porta un piccolo risultato visibile."},{"tipo":"elenco","titolo":"Tre cose da chiedere al capo","voci":["Come vedi la situazione?","Cosa ti aspetti da me?","Come vuoi essere aggiornato?"]},{"tipo":"chiusura","azione":"Sei nuovo? Scrivi ==cinque domande== su come funziona davvero il posto."}]},{"id":"team-of-teams-giardiniere","categoria":"leadership","titolo":"Il generale che smise di decidere tutto lui","libro":{"titolo":"Team of Teams","autore":"Stanley McChrystal","anno":2015},"scene":[{"tipo":"apertura","testo":"Iraq, 2004. Le forze speciali più forti del mondo ==stanno perdendo==."},{"tipo":"colpo","testo":"Il nemico è ==una rete==."},{"tipo":"testo","testo":"Stanley McChrystal ha più uomini e mezzi. Ma ogni decisione sale e scende la gerarchia. Arriva quando ==è già tardi==."},{"tipo":"quiz","domanda":"Lo svegliano di notte per approvare un raid. Cosa aggiunge?","opzioni":["Soprattutto ritardo","Informazioni decisive","Più sicurezza"],"corretta":0,"spiegazione":"Chi era sul posto ne sapeva più di lui. Lo ammette lo stesso generale."},{"tipo":"confronto","titolo":"Due idee di capo","a":{"etichetta":"Lo scacchista","voci":["Muove ogni pezzo di persona"]},"b":{"etichetta":"Il giardiniere","voci":["Cura il terreno: fiducia e informazioni","Lascia decidere chi è sul posto"]}},{"tipo":"principio","testo":"Fai sapere a tutti ciò che sa il capo. Poi decide chi è ==più vicino al problema==."},{"tipo":"chiusura","azione":"Metti ==tutto quello che sai== sul progetto in un documento per tutti."}]},{"id":"pensieri-marco-aurelio-persone-difficili","categoria":"filosofia","titolo":"Metti in conto i maleducati prima di uscire","libro":{"titolo":"Pensieri","autore":"Marco Aurelio","anno":180,"titoloOriginale":"Ta eis heauton"},"scene":[{"tipo":"apertura","testo":"Oggi qualcuno sarà scortese con te. ==Mettilo in conto adesso==."},{"tipo":"testo","titolo":"Il promemoria dell'imperatore","testo":"Marco Aurelio annota: all'alba ripetiti che incontrerai invadenti, ingrati, prepotenti, sleali. ==Non è pessimismo==: è prepararsi."},{"tipo":"colpo","testo":"E non si arrabbia. ==Perché?=="},{"tipo":"confronto","a":{"etichetta":"D'istinto","voci":["Ce l'ha con me","Mi ha rovinato la giornata"]},"b":{"etichetta":"Marco Aurelio","voci":["Sbaglia: non distingue bene e male","Non può rendermi peggiore"]}},{"tipo":"principio","testo":"Siamo nati per collaborare, come le mani o ==le due file di denti==. Farsi la guerra è contro natura."},{"tipo":"esempio","testo":"Riunione delle nove. Un collega ti interrompe tre volte. Te lo aspettavi: non è un affronto, è lui. Rispondi nel merito e ==vai avanti==."},{"tipo":"chiusura","azione":"Stasera scrivi chi può innervosirti domani e ==come vuoi rispondere==."}]},{"id":"pensieri-marco-aurelio-opinione-altrui","categoria":"filosofia","titolo":"Ti ami più di tutti, ma credi più agli altri","libro":{"titolo":"Pensieri","autore":"Marco Aurelio","anno":180,"titoloOriginale":"Ta eis heauton"},"scene":[{"tipo":"apertura","testo":"Ti vuoi più bene di chiunque. Eppure ==un commento ti rovina la serata==."},{"tipo":"colpo","testo":"Un imperatore ==se ne stupiva==."},{"tipo":"testo","testo":"Marco Aurelio lo annota. Ognuno ama sé stesso più di tutti. Ma dà più peso ==al giudizio altrui== che al proprio."},{"tipo":"quiz","domanda":"Per Marco Aurelio, quanto dura la fama dopo la morte?","opzioni":["Per sempre, se meritata","Finché durano le opere","Poco: muore anche chi ti ricorda"],"corretta":2,"spiegazione":"Chi ti loda sparirà presto, e anche chi verrà dopo. Inseguire applausi è fatica sprecata."},{"tipo":"confronto","a":{"etichetta":"Per gli applausi","voci":["Conti i like ogni dieci minuti"]},"b":{"etichetta":"Per te","voci":["Ti chiedi: è fatto bene?"]}},{"tipo":"principio","testo":"Uno smeraldo non peggiora se nessuno lo loda. ==Un lavoro fatto bene nemmeno==."},{"tipo":"chiusura","azione":"Consegna o pubblica una cosa oggi. ==Non guardare le reazioni== fino a domani."}]},{"id":"lettere-lucilio-paure-immaginate","categoria":"filosofia","titolo":"Soffri più per quello che immagini che per i fatti","libro":{"titolo":"Lettere a Lucilio","autore":"Seneca","anno":65,"titoloOriginale":"Epistulae morales ad Lucilium"},"scene":[{"tipo":"apertura","testo":"Quante delle paure che ti tolgono il sonno ==succedono davvero==?"},{"tipo":"esempio","testo":"Il capo scrive: domani ti devo parlare. Notte in bianco, immagini il licenziamento. Voleva solo spostare una riunione."},{"tipo":"colpo","testo":"Guaio zero. ==Insonnia vera.=="},{"tipo":"principio","testo":"Ci spaventano più cose di quante ci colpiscano: ==soffriamo più di fantasia== che di realtà."},{"tipo":"elenco","titolo":"Tre modi di farsi male da soli","voci":["Ingrandire un problema che c'è","Soffrire prima che arrivi","Soffrire per un guaio che non verrà mai"]},{"tipo":"testo","titolo":"Il consiglio di Seneca","testo":"Non promette che andrà bene. Dice: controlla le prove, spesso sono solo voci. E se il guaio verrà, ==soffrirai allora==."},{"tipo":"chiusura","azione":"Scrivi la paura di adesso e accanto ==i fatti che la provano==. Pochi? Rimandala."}]},{"id":"brevita-vita-tempo-regalato","categoria":"filosofia","titolo":"La vita non è corta: sei tu che la regali","libro":{"titolo":"La brevità della vita","autore":"Seneca","anno":49,"titoloOriginale":"De brevitate vitae"},"scene":[{"tipo":"apertura","testo":"Non regali 500 euro a chi passa. ==Tre ore al giorno== sì."},{"tipo":"testo","testo":"Seneca lo nota quasi duemila anni fa. Difendiamo i soldi con le unghie. E ==regaliamo le giornate== a chiunque le chieda."},{"tipo":"colpo","testo":"Fai il conto."},{"tipo":"quiz","domanda":"Tre ore al giorno sul telefono. In un anno quanto fa?","opzioni":["Una settimana","Tre settimane","Un mese e mezzo"],"corretta":2,"spiegazione":"3 × 365 = 1095 ore: oltre 45 giorni interi, notti comprese. Esempio illustrativo."},{"tipo":"mito","mito":"La vita è troppo breve","realta":"Per Seneca è lunga abbastanza: ==ne sprechiamo gran parte==."},{"tipo":"testo","titolo":"Il trucco del «dopo»","testo":"Seneca prende in giro chi rimanda la vita ai cinquanta o ai sessant'anni. ==Chi ti garantisce di arrivarci?=="},{"tipo":"chiusura","azione":"Apri le statistiche del telefono. Guarda ==le ore di ieri== e togline una oggi."}]},{"id":"manuale-epitteto-dicotomia-controllo","categoria":"filosofia","titolo":"Dipende da te? La prima domanda da farti","libro":{"titolo":"Manuale","autore":"Epitteto","anno":125,"titoloOriginale":"Encheiridion"},"scene":[{"tipo":"apertura","testo":"Un ex schiavo divise il mondo in due liste. ==L'ansia sta in una sola==."},{"tipo":"quiz","domanda":"Le liste: «dipende da me» e «non dipende». Per Epitteto il tuo corpo dove sta?","opzioni":["Non dipende da me","Dipende da me"],"corretta":0,"spiegazione":"Il corpo può ammalarsi o essere bloccato da altri. Giudizi e scelte no."},{"tipo":"confronto","titolo":"Le due liste di Epitteto","a":{"etichetta":"Non dipende da te","voci":["Corpo, soldi, reputazione, cariche"]},"b":{"etichetta":"Dipende da te","voci":["Giudizi, desideri, le tue azioni"]}},{"tipo":"colpo","testo":"Indovina ==dove guardi di più==."},{"tipo":"esempio","testo":"Esame domani. Domande e voto non li decidi tu. Quanto ripassi stasera sì. ==Metti lì l'energia==."},{"tipo":"principio","testo":"Alcune cose dipendono da te, altre no. ==Chi le confonde soffre==, chi le distingue è libero."},{"tipo":"chiusura","azione":"Dividi la preoccupazione di oggi in due colonne: ==dipende da me, non dipende==."}]},{"id":"manuale-epitteto-giudizi-sui-fatti","categoria":"filosofia","titolo":"Non è l'offesa a ferirti: è come la leggi","libro":{"titolo":"Manuale","autore":"Epitteto","anno":125,"titoloOriginale":"Encheiridion"},"scene":[{"tipo":"apertura","testo":"Ti rispondono «ok.» con il punto. ==Ci rimugini per ore==."},{"tipo":"colpo","testo":"Che cosa è successo davvero?"},{"tipo":"esempio","testo":"Rileggi la scena. Il fatto: un «ok.» sullo schermo. Il giudizio: ce l'ha con me. ==Il secondo l'hai aggiunto tu.=="},{"tipo":"principio","testo":"Non sono i fatti a turbarci, ma ==i giudizi che diamo sui fatti==."},{"tipo":"mito","mito":"È lui che mi ha fatto arrabbiare","realta":"Per Epitteto ti irrita ==il tuo giudizio== che quella sia un'offesa."},{"tipo":"testo","testo":"Il suo consiglio: non seguire subito la prima impressione. ==Prendi tempo== e torni padrone di te."},{"tipo":"chiusura","azione":"Alla prossima irritazione scrivi ==il fatto== e ==cosa ci hai aggiunto==. Poi rispondi."}]},{"id":"etica-nicomachea-giusto-mezzo","categoria":"filosofia","titolo":"Il coraggio sta in mezzo a due difetti","libro":{"titolo":"Etica Nicomachea","autore":"Aristotele","anno":-340,"titoloOriginale":"Ethika Nikomacheia"},"scene":[{"tipo":"apertura","testo":"All'opposto della viltà non c'è il coraggio. ==C'è un altro difetto==."},{"tipo":"elenco","titolo":"Troppo poco, giusto, troppo","voci":["Pericolo: viltà, coraggio, temerarietà","Soldi: avarizia, generosità, spreco"]},{"tipo":"colpo","testo":"Ma ==non è la media==."},{"tipo":"testo","testo":"La stessa razione è poca per un lottatore, troppa per chi comincia. Per Aristotele il giusto mezzo ==si misura su di te==."},{"tipo":"quiz","domanda":"Per Aristotele c'è un giusto mezzo anche nel rubare?","opzioni":["No: è sbagliato sempre","Sì: basta non esagerare"],"corretta":0,"spiegazione":"Furto, omicidio o invidia non hanno una dose giusta: sono sbagliati in sé."},{"tipo":"principio","testo":"Arrabbiarsi è facile. Con la persona, la misura e il momento giusti: ==lì sta la virtù==."},{"tipo":"chiusura","azione":"Scegli un tuo difetto. Pendi verso il troppo? Oggi ==spingiti dall'altra parte==."}]},{"id":"etica-nicomachea-tre-amicizie","categoria":"filosofia","titolo":"Tre tipi di amicizia, uno solo che dura","libro":{"titolo":"Etica Nicomachea","autore":"Aristotele","anno":-340,"titoloOriginale":"Ethika Nikomacheia"},"scene":[{"tipo":"apertura","testo":"Smetti di essere utile o divertente. ==Chi ti resta?=="},{"tipo":"elenco","titolo":"Le tre amicizie di Aristotele","voci":["Per utilità: ci serviamo a vicenda","Per piacere: stiamo bene insieme","Per virtù: ti stimo per chi sei"]},{"tipo":"quiz","domanda":"Quale amicizia è tipica dei giovani, per Aristotele?","opzioni":["Per utilità","Per piacere","Per virtù"],"corretta":1,"spiegazione":"I giovani seguono ciò che piace ora: fanno e disfano amicizie in fretta."},{"tipo":"colpo","testo":"Le prime due ==scadono==."},{"tipo":"testo","testo":"Finito il vantaggio o lo svago, finisce il legame. La terza dura ma ==chiede tempo==. Prima, dice un proverbio, si mangia insieme molto sale."},{"tipo":"principio","testo":"L'amico vero vuole il tuo bene ==per te, non per sé==."},{"tipo":"chiusura","azione":"Scrivi adesso a un amico del terzo tipo. ==Non per chiedere==: per sapere come sta."}]},{"id":"apologia-socrate-so-di-non-sapere","categoria":"filosofia","titolo":"Il vantaggio di sapere che non sai","libro":{"titolo":"Apologia di Socrate","autore":"Platone","anno":-399,"titoloOriginale":"Apologia Sokratous"},"scene":[{"tipo":"apertura","testo":"L'oracolo: nessuno è più sapiente di Socrate. ==Lui va a controllare==."},{"tipo":"numero","valore":70,"suffisso":" anni","didascalia":"L'età di Socrate quando lo racconta. È ==sotto processo== e rischia la vita."},{"tipo":"elenco","titolo":"Chi va a interrogare","voci":["Politici: sicuri di sapere, non sapevano","Poeti: non sapevano spiegare i loro versi","Artigiani: bravi, presuntuosi sul resto"]},{"tipo":"colpo","testo":"==Tutti troppo sicuri.=="},{"tipo":"principio","testo":"Socrate non sa più degli altri. Ma ==non crede di sapere ciò che non sa==."},{"tipo":"mito","mito":"Socrate disse: so di non sapere","realta":"La formula è un riassunto. Lui dice di ==non illudersi di sapere==."},{"tipo":"chiusura","azione":"Alla prima sigla che non capisci oggi, ==chiedi cosa vuol dire==. Anche se tutti annuiscono."}]},{"id":"tao-te-ching-wu-wei","categoria":"filosofia","titolo":"Wu wei: fare di più forzando di meno","libro":{"titolo":"Tao Te Ching","autore":"Laozi","anno":-400,"titoloOriginale":"Dao De Jing"},"scene":[{"tipo":"apertura","testo":"Niente cede più dell'acqua. ==Niente la batte== contro ciò che è duro."},{"tipo":"testo","testo":"Il Tao Te Ching, attribuito a Laozi, lo chiama wu wei: non agire. Non è stare fermi. È ==non forzare==."},{"tipo":"mito","mito":"Se non funziona, spingi più forte","realta":"Per Laozi vince chi cede. ==Tutti lo sanno, nessuno lo pratica.=="},{"tipo":"esempio","testo":"Lite in corso. Più alzi la voce, più l'altro si irrigidisce. Fai una domanda a voce bassa: spesso ==il nodo si allenta==."},{"tipo":"colpo","testo":"Vale anche per i capi."},{"tipo":"quiz","domanda":"Per il Tao Te Ching, com'è il capo migliore?","opzioni":["Temuto da tutti","Amato e lodato","Quasi non lo noti"],"corretta":2,"spiegazione":"Con lui la gente dice: abbiamo fatto da soli. Il capo amato viene secondo."},{"tipo":"chiusura","azione":"Scegli una cosa che spingi a forza da giorni. Oggi ==smetti di spingere==."}]},{"id":"saggi-montaigne-cannibali","categoria":"filosofia","titolo":"Chiami barbaro quello che non è abitudine tua","libro":{"titolo":"Saggi","autore":"Michel de Montaigne","anno":1580,"titoloOriginale":"Essais"},"scene":[{"tipo":"apertura","testo":"Tre indigeni brasiliani in Francia, nel '500. ==Gli strani siamo noi==."},{"tipo":"elenco","titolo":"Cosa li colpisce, scrive Montaigne","voci":["Uomini armati agli ordini di un re bambino","Ricchi sazi accanto a mendicanti affamati","E gli affamati che non si ribellano"]},{"tipo":"colpo","testo":"==Chi sono i selvaggi?=="},{"tipo":"quiz","domanda":"Quel popolo mangiava i nemici uccisi. Per Montaigne, che cosa è più barbaro?","opzioni":["Mangiare un nemico già morto","Torturare una persona viva"],"corretta":1,"spiegazione":"Non assolve i cannibali. Dice che l'Europa delle torture li superava in crudeltà."},{"tipo":"principio","testo":"Ognuno chiama barbarie ==ciò che non è nelle sue abitudini==."},{"tipo":"chiusura","azione":"Prendi un'usanza che trovi strana. Cerca per cinque minuti ==da dove nasce==."}]},{"id":"obstacle-is-the-way-tre-discipline","categoria":"filosofia","titolo":"L'ostacolo non blocca la strada: è la strada","libro":{"titolo":"La via dell'ostacolo","autore":"Ryan Holiday","anno":2014,"titoloOriginale":"The Obstacle Is the Way"},"scene":[{"tipo":"apertura","testo":"Al colloquio speri di piacere. ==George Clooney faceva lo stesso errore==."},{"tipo":"esempio","testo":"Agli inizi lo scartano provino dopo provino, e ci resta male. Poi capisce: anche chi sceglie ha un problema. ==Deve trovare l'attore giusto.=="},{"tipo":"colpo","testo":"Lui è ==la soluzione==."},{"tipo":"confronto","titolo":"Al prossimo colloquio","a":{"etichetta":"Prima","voci":["Spero di piacere"]},"b":{"etichetta":"Dopo","voci":["Cercano qualcuno: mostro che servo"]}},{"tipo":"elenco","titolo":"Le tre discipline del libro","numerato":true,"voci":["Percezione: guarda il problema com'è","Azione: fai il prossimo passo utile","Volontà: reggi ciò che non puoi cambiare"]},{"tipo":"principio","testo":"Ciò che ti sbarra la strada può ==diventare la strada==. Holiday lo riprende da Marco Aurelio."},{"tipo":"chiusura","azione":"Scrivi il tuo ostacolo. Sotto, ==una cosa che ti costringe a imparare==."}]},{"id":"ego-is-the-enemy-essere-o-fare","categoria":"filosofia","titolo":"Vuoi essere qualcuno o fare qualcosa?","libro":{"titolo":"Ego è il nemico","autore":"Ryan Holiday","anno":2016,"titoloOriginale":"Ego Is the Enemy"},"scene":[{"tipo":"apertura","testo":"Prima o poi arrivi a un bivio: ==sembrare importante== o fare sul serio."},{"tipo":"testo","testo":"Ryan Holiday racconta di John Boyd, pilota e stratega americano. Ai giovani ufficiali poneva ==sempre la stessa scelta==."},{"tipo":"confronto","titolo":"Il bivio di Boyd","a":{"etichetta":"Essere qualcuno","voci":["Promozioni e incarichi","Al prezzo di compromessi"]},"b":{"etichetta":"Fare qualcosa","voci":["Il lavoro che conta","Anche senza promozioni"]}},{"tipo":"colpo","testo":"Boyd scelse ==la seconda==."},{"tipo":"quiz","domanda":"Le idee di Boyd cambiarono l'aviazione militare. A che grado si fermò?","opzioni":["Capitano","Colonnello","Generale"],"corretta":1,"spiegazione":"Mai promosso generale. Eppure le sue idee hanno cambiato caccia e strategia."},{"tipo":"principio","testo":"Ego, per Holiday: credersi importanti. Ma ==avere autorità non è essere autorevoli==."},{"tipo":"chiusura","azione":"Nella lista di oggi segna cosa fai solo ==per farti notare==. Parti da altro."}]},{"id":"guide-good-life-visualizzazione-negativa","categoria":"filosofia","titolo":"Immagina di perderlo e tornerai ad apprezzarlo","libro":{"titolo":"A Guide to the Good Life","autore":"William B. Irvine","anno":2008},"scene":[{"tipo":"apertura","testo":"Il telefono nuovo ti ha reso felice due settimane. ==Poi basta.=="},{"tipo":"testo","titolo":"Adattamento edonico","testo":"Ci abituiamo in fretta a ciò che abbiamo e vogliamo altro. William Irvine cerca il rimedio ==negli stoici==."},{"tipo":"colpo","testo":"Il rimedio sembra ==assurdo==."},{"tipo":"elenco","titolo":"Visualizzazione negativa","numerato":true,"voci":["Scegli qualcuno o qualcosa a cui tieni","Immagina per pochi secondi di averlo perso","Torna al presente: è ancora qui"]},{"tipo":"mito","mito":"Pensare al peggio rende tristi","realta":"Per Irvine, fatto per pochi secondi, ==ti fa apprezzare ciò che hai==."},{"tipo":"principio","testo":"Il modo più diretto per essere contento: ==desiderare ciò che hai già==."},{"tipo":"chiusura","azione":"Stasera a tavola guarda chi hai davanti. Pensa dieci secondi che ==potrebbe non esserci==."}]},{"id":"arte-della-guerra-vincere-senza-combattere","categoria":"filosofia","titolo":"Per Sun Tzu la battaglia è solo la terza scelta","libro":{"titolo":"L'arte della guerra","autore":"Sun Tzu","anno":-500,"titoloOriginale":"Sunzi bingfa"},"scene":[{"tipo":"apertura","testo":"Cento battaglie, cento vittorie. Per Sun Tzu ==non è il massimo==."},{"tipo":"colpo","testo":"Prima guarda ==il conto==."},{"tipo":"testo","titolo":"Anche chi vince paga","testo":"Il testo attribuito a Sun Tzu ha circa 2500 anni. Fa i conti: la guerra costa uomini, denaro e tempo. ==Pure a chi la vince.=="},{"tipo":"elenco","titolo":"Le mosse, dalla migliore alla peggiore","numerato":true,"voci":["Mandare a vuoto i piani dell'altro","Togliergli gli alleati","Affrontare il suo esercito","Assediare una città: solo se costretto"]},{"tipo":"colpo","testo":"La battaglia? ==Solo terza.=="},{"tipo":"esempio","testo":"Tu e una collega volete lo stesso progetto. Le parli prima e proponi di dividerlo. In riunione arrivate con ==l'accordo già fatto==."},{"tipo":"principio","testo":"Il colpo da maestro è piegare l'avversario ==senza arrivare allo scontro==."},{"tipo":"chiusura","azione":"Ti aspetta una discussione? Fai oggi ==la mossa che la evita==: una telefonata, una proposta."}]},{"id":"arte-della-guerra-conosci-te-e-l-altro","categoria":"filosofia","titolo":"L'errore che ti costa una sconfitta su due","libro":{"titolo":"L'arte della guerra","autore":"Sun Tzu","anno":-500,"titoloOriginale":"Sunzi bingfa"},"scene":[{"tipo":"apertura","testo":"Hai preparato il colloquio per giorni. Di chi hai davanti ==sai zero==."},{"tipo":"colpo","testo":"Sun Tzu sa ==come finisce==."},{"tipo":"quiz","domanda":"Conosci bene te stesso, ma niente dell'altro. Per Sun Tzu come va?","opzioni":["Vinci quasi sempre","Una vittoria, una sconfitta","Perdi ogni volta"],"corretta":1,"spiegazione":"Vedi solo metà del quadro: per ogni vittoria, dice il testo, arriva una sconfitta."},{"tipo":"colpo","testo":"Metà quadro, ==metà vittorie==."},{"tipo":"principio","testo":"Conosci te stesso e l'altro: anche in cento scontri ==non sei mai in pericolo==."},{"tipo":"confronto","titolo":"Prima di una trattativa, due liste","a":{"etichetta":"La lista che fai già","voci":["Che cosa voglio davvero","Fin dove posso cedere"]},"b":{"etichetta":"La lista che ti manca","voci":["Che cosa serve all'altro","Che alternative ha senza di me"]}},{"tipo":"chiusura","azione":"Prima del prossimo incontro scrivi ==tre cose che sai dell'altro==. E una che ti manca."}]},{"id":"principe-fortuna-argini","categoria":"filosofia","titolo":"Metà è fortuna, dice Machiavelli. E l'altra metà?","libro":{"titolo":"Il Principe","autore":"Niccolò Machiavelli","anno":1532},"scene":[{"tipo":"apertura","testo":"Va tutto bene. È il momento giusto per ==prepararti al peggio==."},{"tipo":"numero","valore":50,"suffisso":"%","didascalia":"Per Machiavelli la fortuna decide ==circa metà== di quello che facciamo.","nota":"È una sua stima, non una misura."},{"tipo":"colpo","testo":"L'altra metà ==è tua==."},{"tipo":"testo","titolo":"Un fiume in piena","testo":"Paragona la fortuna a un fiume rovinoso. Quando esonda, nessuno lo ferma. Ma nei tempi quieti puoi alzare ==argini e ripari==."},{"tipo":"esempio","testo":"Lavori in proprio e hai un solo grande cliente. Finché paga, tutto bene. L'argine è cercarne altri due adesso. ==Prima che se ne vada.=="},{"tipo":"principio","testo":"Gli argini si alzano ==quando il fiume è calmo==. Con la piena è tardi."},{"tipo":"chiusura","azione":"Scegli un imprevisto che temi. Fai oggi ==una cosa che riduce il danno==: una copia dei file."}]},{"id":"principe-difendersi-dagli-adulatori","categoria":"filosofia","titolo":"Come farsi dire la verità (senza perdere rispetto)","libro":{"titolo":"Il Principe","autore":"Niccolò Machiavelli","anno":1532},"scene":[{"tipo":"apertura","testo":"Tutti annuiscono alla tua idea. ==Forse nessuno osa dirtelo.=="},{"tipo":"testo","titolo":"Machiavelli la chiama peste","testo":"Parla dell'adulazione. E il guaio, dice, siamo noi: ci piacciamo tanto che dai complimenti ==ci difendiamo a fatica==."},{"tipo":"principio","testo":"Dalle lusinghe ti difendi in un modo solo: fai capire che ==la verità non ti offende==."},{"tipo":"colpo","testo":"Ma ==non da tutti==."},{"tipo":"mito","mito":"Un buon capo si fa dire la verità da tutti","realta":"Se chiunque può dirti tutto, scrive, ==perdi il rispetto==. Meglio pochi, scelti."},{"tipo":"elenco","titolo":"Il suo rimedio, in tre passi","numerato":true,"voci":["Scegli poche persone di buon giudizio","Chiedi a loro la verità, su tutto","Ascolta. Poi ==decidi tu== e tieni il punto"]},{"tipo":"chiusura","azione":"Scrivi a una persona che stimi: ==dimmi una cosa che sbaglio==. Poi ascolta e basta."}]},{"id":"ricordi-discrezione-non-regole","categoria":"filosofia","titolo":"L'asino che doveva correre come un cavallo","libro":{"titolo":"Ricordi","autore":"Francesco Guicciardini","anno":1530},"scene":[{"tipo":"apertura","testo":"Stai seguendo il consiglio di uno che ==non ha la tua vita==."},{"tipo":"mito","mito":"Ha funzionato per lui, funzionerà per me","realta":"Per Guicciardini giudicare le cose ==per regola== è un grande errore."},{"tipo":"quiz","domanda":"Per lui, quando serve davvero un esempio del passato?","opzioni":["Quando ha avuto successo","Mai: ogni caso è nuovo","Se somiglia in tutto al tuo"],"corretta":2,"spiegazione":"Basta una piccola differenza, scrive, per cambiare del tutto l'effetto."},{"tipo":"esempio","testo":"Nel Cinquecento tutti citavano i Romani. Ma serve una città come la loro, avverte. Sennò chiedi a ==un asino di correre da cavallo==."},{"tipo":"principio","testo":"Le eccezioni non stanno nei libri. Le vede solo ==il giudizio caso per caso==: la discrezione."},{"tipo":"chiusura","azione":"Prendi un consiglio che segui da anni. Trova ==due differenze== fra te e chi l'ha dato."}]},{"id":"cortegiano-sprezzatura","categoria":"filosofia","titolo":"La parola del 1528 per chi fa sembrare tutto facile","libro":{"titolo":"Il libro del Cortegiano","autore":"Baldassarre Castiglione","anno":1528},"scene":[{"tipo":"apertura","testo":"Perché chi è bravo davvero sembra ==non fare fatica==?"},{"tipo":"colpo","testo":"La fatica c'è. ==È nascosta.=="},{"tipo":"testo","titolo":"Una parola nuova","testo":"Nel 1528 Baldassarre Castiglione le dà un nome: ==sprezzatura==. È la disinvoltura che nasconde lo studio e fa sembrare tutto naturale."},{"tipo":"confronto","titolo":"Stessa presentazione, due effetti","a":{"etichetta":"Affettazione","voci":["Si vede che vuoi fare colpo"]},"b":{"etichetta":"Sprezzatura","voci":["La preparazione c'è e non pesa"]}},{"tipo":"quiz","domanda":"Un collega ripete a tutti: «L'ho improvvisata in dieci minuti». È sprezzatura?","opzioni":["Sì, è proprio questo","No: è affettazione anche questa"],"corretta":1,"spiegazione":"Esibire la noncuranza è un altro modo di mettersi in mostra. Per il libro è lo stesso difetto."},{"tipo":"principio","testo":"Per Castiglione la vera arte è ==quella che non sembra arte==."},{"tipo":"chiusura","azione":"Ripeti l'inizio della prossima presentazione ==finché non ti serve il foglio==."}]},{"id":"oracolo-manuale-saper-dire-no","categoria":"filosofia","titolo":"Dire di no senza lasciare nessuno a mani vuote","libro":{"titolo":"Oracolo manuale e arte di prudenza","autore":"Baltasar Gracián","anno":1647,"titoloOriginale":"Oráculo manual y arte de prudencia"},"scene":[{"tipo":"apertura","testo":"C'è un «no» che fa più piacere di un «sì». Ha ==quasi 400 anni==."},{"tipo":"numero","valore":300,"didascalia":"Gli aforismi del gesuita Baltasar Gracián, 1647. Uno insegna ==a dire di no==."},{"tipo":"colpo","testo":"Non tutto. ==Non a tutti.=="},{"tipo":"principio","testo":"Saper negare conta quanto saper dare. E un no garbato piace più di ==un sì detto secco==."},{"tipo":"elenco","titolo":"Il no secondo Gracián","voci":["Mai di colpo: fallo scendere ==a sorsi==","Dove manca il favore, metti la cortesia","Lascia sempre un filo di speranza"]},{"tipo":"esempio","testo":"Un collega ti chiede aiuto e sei sommerso. «Questa settimana no. Giovedì ti do mezz'ora, intanto ti giro il mio file.» ==Nessuno resta a mani vuote.=="},{"tipo":"chiusura","azione":"Hai un no da dire? Scrivilo ora: ==motivo breve, tono gentile==, un'alternativa vera."}]},{"id":"cinque-anelli-nessuna-arma-preferita","categoria":"filosofia","titolo":"Il consiglio di un samurai: niente arma preferita","libro":{"titolo":"Il libro dei cinque anelli","autore":"Miyamoto Musashi","anno":1645,"titoloOriginale":"Gorin no sho"},"scene":[{"tipo":"apertura","testo":"Il tuo cavallo di battaglia? Per un samurai è ==un difetto==."},{"tipo":"colpo","testo":"Lo dice ==uno del mestiere==."},{"tipo":"numero","valore":60,"suffisso":"+","didascalia":"I duelli che Miyamoto Musashi dice di aver vinto, ==senza mai perdere==.","nota":"Lo racconta lui stesso all'inizio del libro."},{"tipo":"principio","testo":"Niente arma preferita: conoscerne ==troppo bene una sola== è un difetto quanto conoscerla poco."},{"tipo":"confronto","titolo":"Davanti a un problema nuovo","a":{"etichetta":"Un'arma sola","voci":["Uso il metodo che so già","Piego il problema allo strumento"]},"b":{"etichetta":"Più armi","voci":["Guardo prima che cosa serve","Lo strumento lo scelgo dopo"]}},{"tipo":"colpo","testo":"Ogni arma ha ==il suo momento==."},{"tipo":"esempio","testo":"Sei bravissimo con le slide e le usi per tutto. Ma un cliente arrabbiato vuole una telefonata di cinque minuti. Lì ==la tua arma migliore è sbagliata==."},{"tipo":"chiusura","azione":"Oggi fai un compito abituale ==con lo strumento che eviti==: una telefonata, non un messaggio."}]},{"id":"della-guerra-attrito","categoria":"filosofia","titolo":"Perché anche i piani più semplici si inceppano","libro":{"titolo":"Della guerra","autore":"Carl von Clausewitz","anno":1832,"titoloOriginale":"Vom Kriege"},"scene":[{"tipo":"apertura","testo":"Sulla carta: una settimana. Nella realtà: ==tre==."},{"tipo":"testo","titolo":"Clausewitz lo chiama attrito","testo":"Per il generale prussiano in guerra tutto è semplice. Ma la cosa più semplice è difficile: nebbia, pioggia, un reparto ==che arriva tardi==."},{"tipo":"colpo","testo":"Ora ==fai il conto==."},{"tipo":"quiz","domanda":"Un piano in 10 passi. Ognuno va liscio 9 volte su 10. Quanto spesso fila tutto?","opzioni":["Il 90% delle volte","Circa il 35%","Circa il 65%"],"corretta":1,"spiegazione":"0,9 moltiplicato per sé stesso 10 volte fa 0,35. I piccoli intoppi si accumulano."},{"tipo":"grafico","titolo":"Probabilità che fili tutto liscio","forma":"linea","unita":"%","dati":[{"e":"1 passo","v":90},{"e":"5 passi","v":59},{"e":"10 passi","v":35},{"e":"15 passi","v":21},{"e":"20 passi","v":12}],"nota":"Esempio illustrativo, non del libro: 9 su 10 a ogni passo."},{"tipo":"principio","testo":"L'attrito separa ==il piano sulla carta== da quello che succede davvero."},{"tipo":"chiusura","azione":"Prendi la scadenza che hai in mente. ==Aggiungi un margine== prima di comunicarla."}]},{"id":"48-laws-azioni-non-discussioni","categoria":"filosofia","titolo":"Michelangelo e il naso del David: vincere senza discutere","libro":{"titolo":"Le 48 leggi del potere","autore":"Robert Greene","anno":1998,"titoloOriginale":"The 48 Laws of Power"},"scene":[{"tipo":"apertura","testo":"Gli criticano il naso del David. Michelangelo ==non discute==."},{"tipo":"quiz","domanda":"Soderini, che governa Firenze, trova il naso troppo grosso. E lui?","opzioni":["Finge di ritoccarlo","Lo rifà più sottile","Si rifiuta e se ne va"],"corretta":0,"spiegazione":"Sale sul ponteggio e lascia cadere polvere di marmo. Il naso non lo tocca."},{"tipo":"colpo","testo":"E a Soderini ==ora piace==."},{"tipo":"testo","titolo":"Greene ne fa una legge","testo":"L'aneddoto è di Vasari. Per Robert Greene insegna questo: chi vince a parole lascia rancore, chi mostra ==non umilia nessuno==."},{"tipo":"esempio","testo":"Il capo boccia la tua proposta. Non insisti: in un pomeriggio prepari una prova e gliela mostri. ==Lo vede da solo.=="},{"tipo":"confronto","titolo":"Due modi di avere ragione","a":{"etichetta":"Discutere","voci":["L'altro si sente sconfitto"]},"b":{"etichetta":"Dimostrare","voci":["Nessuno perde la faccia"]}},{"tipo":"chiusura","azione":"Alla prossima divergenza non ribattere: ==prepara una prova== e falla vedere."}]},{"id":"laws-human-nature-carattere-nei-fatti","categoria":"mente","titolo":"Chi l'ha fatto tre volte lo rifarà con te?","libro":{"titolo":"Le leggi della natura umana","autore":"Robert Greene","anno":2018,"titoloOriginale":"The Laws of Human Nature"},"scene":[{"tipo":"apertura","testo":"Tre soci, tre rotture. «Ma con me ==sarà diverso==.»"},{"tipo":"mito","mito":"La prima impressione dice chi hai davanti","realta":"Fascino e parole dicono poco. Per Greene conta ==ciò che uno fa nel tempo==."},{"tipo":"principio","testo":"Il carattere, sostiene Greene, si forma presto e ci fa ripetere. Nessuno fa una cosa ==una volta sola==."},{"tipo":"elenco","titolo":"Dove guardare, secondo Greene","voci":["Sotto pressione, quando qualcosa va storto","Quando ha potere su qualcuno","Nelle piccole cose di ogni giorno"]},{"tipo":"colpo","testo":"Con ==una cautela==."},{"tipo":"testo","titolo":"Una tesi, non una legge","testo":"È la lettura di Greene, non una scienza esatta: le persone possono cambiare. Ma prima delle promesse ==guarda i fatti==."},{"tipo":"chiusura","azione":"Prima di legarti a qualcuno chiedi a chi ci ha lavorato: ==com'è quando va male?=="}]},{"id":"33-strategies-non-combattere-ultima-guerra","categoria":"filosofia","titolo":"La Prussia aveva un metodo vincente. Poi arrivò Napoleone","libro":{"titolo":"Le 33 strategie della guerra","autore":"Robert Greene","anno":2006,"titoloOriginale":"The 33 Strategies of War"},"scene":[{"tipo":"apertura","testo":"Scrivi il tuo metodo vincente. Ora chiediti: ==di che anno è?=="},{"tipo":"esempio","testo":"1806. La Prussia sfida Napoleone con le tattiche di Federico il Grande. Hanno decenni. A Jena crolla ==in un giorno==."},{"tipo":"colpo","testo":"Stesso metodo. ==Altro mondo.=="},{"tipo":"mito","mito":"Squadra che vince non si cambia","realta":"Per Greene la formula vincente di ieri è ==la trappola di oggi==."},{"tipo":"testo","titolo":"Non combattere l'ultima guerra","testo":"Vale anche per le sconfitte: chi ha perso resta prigioniero di quel ricordo. In tutti e due i casi ==guardi indietro==."},{"tipo":"confronto","titolo":"Davanti a una sfida nuova","a":{"etichetta":"La guerra di ieri","voci":["L'altra volta ha funzionato","Rifaccio quello che so"]},"b":{"etichetta":"La guerra di oggi","voci":["Che cosa è cambiato da allora?","Parto da com'è adesso"]}},{"tipo":"chiusura","azione":"Scrivi il tuo metodo di sempre. Accanto, ==una cosa che è cambiata== da allora."}]},{"id":"strategy-of-conflict-punto-focale","categoria":"economia","titolo":"Trovarsi a New York senza appuntamento: si può","libro":{"titolo":"La strategia del conflitto","autore":"Thomas C. Schelling","anno":1960,"titoloOriginale":"The Strategy of Conflict"},"scene":[{"tipo":"apertura","testo":"Domani devi incontrare qualcuno a New York. ==Senza luogo né ora.=="},{"tipo":"quiz","domanda":"Schelling lo chiese a un gruppo di persone. Quale ora scelsero quasi tutte?","opzioni":["Le 9 del mattino","Le 6 di sera","Mezzogiorno"],"corretta":2,"spiegazione":"Mezzogiorno non è più comodo: spicca. Scegli ciò che pensi sceglierà l'altro."},{"tipo":"testo","titolo":"E il posto?","testo":"La maggioranza indicò la stazione Grand Central. Schelling lo chiama ==punto focale==: la scelta che salta all'occhio a entrambi."},{"tipo":"colpo","testo":"Succede anche ==coi soldi==."},{"tipo":"numero","valore":36,"suffisso":" su 40","didascalia":"Cento dollari da dividere senza parlarsi: in tanti scrissero ==50 esatti==.","nota":"Richieste oltre 100 in totale: niente a nessuno."},{"tipo":"principio","testo":"Tanti accordi finiscono «a metà» o su cifre tonde: lì ==tutti si aspettano di arrivare==."},{"tipo":"chiusura","azione":"Ti propongono di «fare a metà»? Guarda prima ==da quali due cifre si parte==."}]},{"id":"strategy-of-conflict-legarsi-le-mani","categoria":"economia","titolo":"Quando le mani legate ti fanno vincere una trattativa","libro":{"titolo":"La strategia del conflitto","autore":"Thomas C. Schelling","anno":1960,"titoloOriginale":"The Strategy of Conflict"},"scene":[{"tipo":"apertura","testo":"«Vorrei, ma non decido io.» Sembra debolezza. ==È una mossa.=="},{"tipo":"esempio","testo":"Tratti un'auto usata. Il venditore: «Sotto questa cifra il titolare non vuole.» Ora ==la mossa tocca a te==."},{"tipo":"testo","titolo":"Meno libertà, più forza","testo":"Per Thomas Schelling, se puoi cedere l'altro insiste finché cedi. Se non puoi, e lui lo sa, ==la scelta passa a lui==."},{"tipo":"quiz","domanda":"Hai un limite che non puoi superare. Quando ti dà forza?","opzioni":["Se l'altro lo conosce e ci crede","Se lo tieni segreto fino alla fine"],"corretta":0,"spiegazione":"Un vincolo nascosto non sposta l'altro: deve vederlo e crederci."},{"tipo":"colpo","testo":"Ma è ==un'arma a doppio taglio==."},{"tipo":"principio","testo":"Se vi legate le mani in due, su posizioni opposte, ==l'accordo salta==. Anche se conveniva a tutti."},{"tipo":"chiusura","azione":"Senti «ho le mani legate»? Chiedi con calma ==chi può decidere==. E di parlarci."}]},{"id":"psicologo-nei-lager-ultima-liberta","categoria":"benessere","titolo":"La libertà che nessuno ti può togliere","libro":{"titolo":"Uno psicologo nei lager","autore":"Viktor E. Frankl","anno":1946,"titoloOriginale":"Ein Psychologe erlebt das Konzentrationslager"},"scene":[{"tipo":"apertura","testo":"Auschwitz, 1944. A uno psichiatra tolgono tutto. ==Tranne una cosa.=="},{"tipo":"testo","titolo":"Viktor Frankl","testo":"Medico di Vienna, deportato nel 1942. Passa per quattro lager. Da psichiatra ==osserva== i prigionieri, sé compreso."},{"tipo":"colpo","testo":"E nota una cosa."},{"tipo":"esempio","testo":"Nelle baracche c'è chi consola i compagni. Chi regala ==l'ultimo pezzo di pane==. Sono pochi, scrive Frankl. Ma bastano come prova."},{"tipo":"principio","testo":"A una persona puoi togliere tutto, tranne una libertà: ==scegliere come stare== davanti a ciò che le capita."},{"tipo":"testo","titolo":"Che cosa non dice","testo":"Non dice che l'atteggiamento salvasse la vita: lì si moriva anche ==per caso==. Dice che una scelta interiore restava."},{"tipo":"confronto","a":{"etichetta":"Non lo scegli","voci":["Che cosa ti succede"]},"b":{"etichetta":"Lo scegli","voci":["Come rispondi"]}},{"tipo":"chiusura","azione":"Scrivi una cosa che oggi non puoi cambiare. Sotto: ==come scelgo di affrontarla==."}]},{"id":"psicologo-nei-lager-domanda-girata","categoria":"benessere","titolo":"Il senso della vita? Frankl ribalta la domanda","libro":{"titolo":"Uno psicologo nei lager","autore":"Viktor E. Frankl","anno":1946,"titoloOriginale":"Ein Psychologe erlebt das Konzentrationslager"},"scene":[{"tipo":"apertura","testo":"«Che senso ha la mia vita?» Per Frankl la domanda ==va girata==."},{"tipo":"colpo","testo":"Non sei tu a chiedere."},{"tipo":"confronto","a":{"etichetta":"Di solito","voci":["Che cosa mi aspetto dalla vita?"]},"b":{"etichetta":"Frankl","voci":["Che cosa si aspetta la vita da me?"]}},{"tipo":"testo","testo":"Viktor Frankl, psichiatra, lo capisce da prigioniero nei lager. È la vita a interrogarti, ogni giorno. E si risponde ==con quello che fai==."},{"tipo":"esempio","testo":"Due compagni non vedono più motivi per andare avanti. Frankl cerca con loro che cosa li aspetta fuori. Per uno ==un figlio==. Per l'altro dei libri da finire."},{"tipo":"principio","testo":"Chi ha ==un perché== per vivere regge quasi ogni come: Frankl lo riprende da Nietzsche."},{"tipo":"chiusura","azione":"Scrivi chi, o che cosa, ==ha bisogno di te== questa settimana. Comincia da lì."}]},{"id":"happiness-hypothesis-felicita-in-mezzo","categoria":"benessere","titolo":"La felicità non viene da dentro. E nemmeno da fuori","libro":{"titolo":"The Happiness Hypothesis","autore":"Jonathan Haidt","anno":2006},"scene":[{"tipo":"apertura","testo":"Buddha e gli stoici: la felicità sta dentro di te. ==Manca un pezzo.=="},{"tipo":"colpo","testo":"Uno psicologo controlla."},{"tipo":"quiz","domanda":"Casa più grande, ma più traffico ogni giorno. A cosa ti abitui?","opzioni":["Alla casa","Al traffico"],"corretta":0,"spiegazione":"Per Jonathan Haidt allo spazio ti adatti presto. Al traffico no: certe cose esterne pesano."},{"tipo":"colpo","testo":"Quindi viene da fuori? No."},{"tipo":"principio","testo":"La felicità non viene né da dentro né da fuori: ==nasce in mezzo==, dai legami fra te e il resto."},{"tipo":"elenco","titolo":"I tre legami, per Haidt","voci":["Fra te e gli altri","Fra te e il tuo lavoro","Fra te e ==qualcosa di più grande=="]},{"tipo":"chiusura","azione":"Guarda la tua settimana: quale dei tre legami trascuri? ==Dagli un'ora in agenda==."}]},{"id":"ikigai-ragione-per-alzarsi","categoria":"benessere","titolo":"Il paese dove a 90 anni si cura ancora l'orto","libro":{"titolo":"Ikigai","autore":"Héctor García, Francesc Miralles","anno":2016},"scene":[{"tipo":"apertura","testo":"A Ogimi, in Giappone, anche chi ha novant'anni ==cura un orto==. Perché?"},{"tipo":"testo","testo":"Héctor García e Francesc Miralles vanno a Ogimi, detto villaggio della longevità. Non fanno esperimenti: chiedono agli anziani ==come vivono==."},{"tipo":"colpo","testo":"Lì lo chiamano ==ikigai==."},{"tipo":"principio","testo":"Per gli autori l'ikigai è ==il motivo per cui ti alzi==: ciò che ti tiene attivo."},{"tipo":"mito","mito":"L'ikigai è lo schema a quattro cerchi","realta":"Quello schema ==non nasce in Giappone==. Lì ikigai è una ragione per vivere."},{"tipo":"elenco","titolo":"Che cosa notano a Ogimi","voci":["Quasi tutti curano ==un orto==","Gruppi di amici che si aiutano: i moai","A tavola ci si ferma prima di essere pieni"]},{"tipo":"chiusura","azione":"Scrivi una cosa per cui domattina ==vale la pena alzarsi==. Mettila in agenda alle 8."}]},{"id":"potere-di-adesso-problema-adesso","categoria":"benessere","titolo":"Che problema hai in questo preciso momento?","libro":{"titolo":"Il potere di Adesso","autore":"Eckhart Tolle","anno":1997,"titoloOriginale":"The Power of Now"},"scene":[{"tipo":"apertura","testo":"Che problema hai in questo preciso istante? ==Non domani. Adesso.=="},{"tipo":"colpo","testo":"Pensaci davvero."},{"tipo":"testo","testo":"È una domanda di Eckhart Tolle, maestro spirituale. Per lui la risposta è quasi sempre: nessuno. I problemi vivono ==nel prima e nel dopo==."},{"tipo":"elenco","titolo":"Dove va la testa, secondo Tolle","voci":["Troppo futuro: ansia","Troppo passato: rimpianto e rancore","Adesso: una cosa da fare, o da accettare"]},{"tipo":"mito","mito":"Vivere nel presente vuol dire non fare piani","realta":"Per Tolle i piani servono. Poi ==torni a ciò che fai ora==."},{"tipo":"principio","testo":"Passato e futuro esistono solo come pensieri. ==La vita succede adesso==, e solo adesso puoi agire."},{"tipo":"chiusura","azione":"Per un minuto segui ==solo il respiro==. Poi richiediti: che problema ho, adesso?"}]},{"id":"subtle-art-scegli-la-fatica","categoria":"benessere","titolo":"Non conta cosa vuoi: conta che fatica scegli","libro":{"titolo":"The Subtle Art of Not Giving a F*ck","autore":"Mark Manson","anno":2016},"scene":[{"tipo":"apertura","testo":"Tutti vogliono gli addominali. Quasi nessuno vuole ==la palestra alle 6==."},{"tipo":"mito","mito":"Per essere felice devi sapere cosa vuoi","realta":"Per Mark Manson vogliamo tutti le stesse cose. Conta ==quale fatica accetti==."},{"tipo":"esempio","testo":"Da ragazzo Manson sogna di fare la rockstar. Ma provare ogni giorno, trovare una band, caricare gli strumenti gli pesa. Dopo anni molla."},{"tipo":"colpo","testo":"Amava la cima. ==Non la salita.=="},{"tipo":"confronto","a":{"etichetta":"Domanda facile","voci":["Che cosa voglio godermi?"]},"b":{"etichetta":"Domanda utile","voci":["Per che cosa accetto di faticare?"]}},{"tipo":"principio","testo":"Non ti definisce ciò che sogni. Ti definisce ==la fatica che accetti di fare==."},{"tipo":"chiusura","azione":"Prendi un tuo obiettivo e scrivi ==la sua parte noiosa==. La faresti ogni settimana?"}]},{"id":"coraggio-non-piacere-separazione-compiti","categoria":"benessere","titolo":"Di chi è questo problema? Forse non tuo","libro":{"titolo":"Il coraggio di non piacere","autore":"Ichiro Kishimi, Fumitake Koga","anno":2013,"titoloOriginale":"Kirawareru yuki"},"scene":[{"tipo":"apertura","testo":"Quante cose fai solo perché ==qualcuno non ci resti male==?"},{"tipo":"testo","testo":"Il libro è un dialogo fra un filosofo e un ragazzo. Le idee sono di Alfred Adler. La regola: chiediti ==di chi è il compito==."},{"tipo":"quiz","domanda":"Come capisci di chi è un compito?","opzioni":["Da chi ci tiene di più","Da chi ne avrà le conseguenze"],"corretta":1,"spiegazione":"È di chi alla fine riceve il risultato della scelta. Studiare è compito del figlio."},{"tipo":"confronto","titolo":"Dopo che hai detto un no","a":{"etichetta":"Compito dell'altro","voci":["Che cosa pensa di te"]},"b":{"etichetta":"Compito tuo","voci":["Fare ciò che ritieni giusto"]}},{"tipo":"colpo","testo":"Aiutare sì. ==Sostituirsi no.=="},{"tipo":"principio","testo":"Essere liberi vuol dire accettare che ==a qualcuno non piacerai==: quel giudizio non è compito tuo."},{"tipo":"chiusura","azione":"Prendi il pensiero che ti pesa oggi e scrivi accanto: ==compito mio o suo?=="}]},{"id":"flourish-cinque-pezzi-perma","categoria":"benessere","titolo":"Stare bene è fatto di cinque pezzi, non di uno","libro":{"titolo":"Flourish","autore":"Martin E. P. Seligman","anno":2011},"scene":[{"tipo":"apertura","testo":"Nel 2002 scrive un libro sulla felicità. Nel 2011 ==si corregge da solo==."},{"tipo":"testo","testo":"Martin Seligman, fra i fondatori della psicologia positiva, cambia idea: la felicità come buonumore ==è troppo poco==."},{"tipo":"colpo","testo":"Servono cinque pezzi."},{"tipo":"grafico","titolo":"I cinque pezzi: un profilo di esempio (0-10)","forma":"barre","dati":[{"e":"Emozioni","v":8},{"e":"Flow","v":4},{"e":"Relazioni","v":7},{"e":"Senso","v":3},{"e":"Risultati","v":6}],"nota":"Esempio illustrativo: ognuno ha il suo profilo."},{"tipo":"testo","titolo":"Le iniziali inglesi: PERMA","testo":"Emozioni positive. Flow: sei così preso che il tempo vola. Relazioni. Senso. Risultati. Ognuno ==vale per sé==."},{"tipo":"quiz","domanda":"Quale di questi non è fra i cinque pezzi?","opzioni":["Relazioni","Risultati","Soldi"],"corretta":2,"spiegazione":"Il denaro non c'è. Per Seligman è un mezzo: conta se fa crescere il benessere."},{"tipo":"chiusura","azione":"Dai un voto da 0 a 10 ai cinque pezzi. Al più basso dedica ==dieci minuti oggi==."}]},{"id":"arte-felicita-piacere-o-felicita","categoria":"benessere","titolo":"Prima della terza fetta di torta, chiediti questo","libro":{"titolo":"L'arte della felicità","autore":"Dalai Lama, Howard C. Cutler","anno":1998,"titoloOriginale":"The Art of Happiness"},"scene":[{"tipo":"apertura","testo":"Terza fetta di torta. Prima di prenderla, prova ==una domanda sola==."},{"tipo":"quiz","domanda":"Quale domanda, secondo te?","opzioni":["Me la merito?","Mi renderà felice?","Quante calorie ha?"],"corretta":1,"spiegazione":"Non «mi piacerà?» ma «mi renderà felice?». Per il libro sono due cose diverse."},{"tipo":"colpo","testo":"Piacere ==non è felicità==."},{"tipo":"confronto","a":{"etichetta":"Piacere","voci":["Arriva subito, dura poco"]},"b":{"etichetta":"Felicità","voci":["Si costruisce allenando la mente"]}},{"tipo":"testo","testo":"Lo psichiatra Howard Cutler ne parla a lungo con il Dalai Lama. L'idea di fondo: la felicità ==si può allenare==, come un'abilità."},{"tipo":"principio","testo":"Con quella domanda non ti neghi qualcosa: ==scegli qualcosa==. Per questo il no pesa meno."},{"tipo":"chiusura","azione":"Oggi, davanti a uno sfizio, chiediti: ==mi renderà felice?== Poi decidi tu."}]},{"id":"dovunque-tu-vada-onde-e-surf","categoria":"benessere","titolo":"Meditare non è svuotare la testa","libro":{"titolo":"Dovunque tu vada, ci sei già","autore":"Jon Kabat-Zinn","anno":1994,"titoloOriginale":"Wherever You Go, There You Are"},"scene":[{"tipo":"apertura","testo":"Prova a non pensare a niente per dieci secondi. ==Fallito? Bene.=="},{"tipo":"mito","mito":"Meditare vuol dire svuotare la mente","realta":"Per Jon Kabat-Zinn è ==accorgerti di dove va== la mente. E riportarla qui."},{"tipo":"elenco","titolo":"Consapevolezza è fare attenzione…","voci":["Di proposito","Al momento presente","==Senza giudicare=="]},{"tipo":"colpo","testo":"Poi c'è un poster."},{"tipo":"esempio","testo":"Kabat-Zinn lo descrive: un maestro di yoga anziano, barba bianca, su una tavola da surf. Il senso: le onde ==non le fermi==. Impari a cavalcarle."},{"tipo":"principio","testo":"Pensieri e stress arrivano come onde. Non puoi fermarli: ==puoi imparare a starci sopra==."},{"tipo":"chiusura","azione":"Fermati dove sei e segui ==tre respiri interi==. Se la testa scappa, riportala."}]},{"id":"gifts-of-imperfection-perfezionismo-scudo","categoria":"benessere","titolo":"Il perfezionismo non è voler fare bene","libro":{"titolo":"The Gifts of Imperfection","autore":"Brené Brown","anno":2010},"scene":[{"tipo":"apertura","testo":"Rileggi la mail otto volte prima di inviarla. ==Non è precisione.=="},{"tipo":"mito","mito":"Il perfezionismo è solo voler fare bene","realta":"Per Brené Brown è ==uno scudo==: speri di evitare critiche e vergogna."},{"tipo":"testo","testo":"Brown studia da anni la vergogna. Il ragionamento nascosto, dice, è questo: se sembro perfetto, ==nessuno potrà giudicarmi==."},{"tipo":"confronto","titolo":"La domanda che ti fai","a":{"etichetta":"Perfezionismo","voci":["Che cosa penseranno di me?"]},"b":{"etichetta":"Voler migliorare","voci":["Come posso fare meglio?"]}},{"tipo":"esempio","testo":"Il progetto è pronto da mesi. Non lo mostri: «manca ancora qualcosa». Brown la chiama ==paralisi==: le occasioni perse per paura di non essere perfetti."},{"tipo":"colpo","testo":"Lo scudo pesa. ==E non protegge.=="},{"tipo":"chiusura","azione":"Scegli una cosa che tieni ferma da troppo. Oggi ==mostrala a una persona== così com'è."}]},{"id":"how-of-happiness-dose-giusta","categoria":"benessere","titolo":"Il diario della gratitudine ha una dose giusta","libro":{"titolo":"The How of Happiness","autore":"Sonja Lyubomirsky","anno":2007},"scene":[{"tipo":"apertura","testo":"Scrivere per cosa sei grato fa bene. ==Più spesso è meglio?=="},{"tipo":"testo","testo":"La psicologa Sonja Lyubomirsky lo prova con due gruppi, per sei settimane. Uno scrive una volta a settimana. L'altro tre."},{"tipo":"quiz","domanda":"Chi diventa più felice?","opzioni":["Chi scrive una volta","Chi scrive tre volte","Uguale"],"corretta":0,"spiegazione":"Solo chi scrive una volta. Ipotesi dell'autrice: per gli altri era diventato un compito."},{"tipo":"colpo","testo":"E non è l'unico caso."},{"tipo":"esempio","testo":"Altro suo studio: cinque gesti gentili a settimana. Sta meglio chi li fa ==tutti in un giorno==. Sparsi, si confondono con il resto."},{"tipo":"principio","testo":"Più spesso non vuol dire meglio. Per stare bene ==contano momento e varietà==."},{"tipo":"chiusura","azione":"Scegli una sera fissa a settimana. Lì scrivi ==cinque cose per cui sei grato==."}]},{"id":"good-life-relazioni-a-80-anni","categoria":"benessere","titolo":"Cosa prevede come starai a 80 anni","libro":{"titolo":"The Good Life","autore":"Robert Waldinger, Marc Schulz","anno":2023},"scene":[{"tipo":"apertura","testo":"A 50 anni un dato prevede come starai a 80. ==Non è il colesterolo.=="},{"tipo":"numero","valore":724,"didascalia":"Ragazzi di Harvard e dei quartieri poveri di Boston, seguiti ==dal 1938==.","nota":"Harvard Study of Adult Development, oggi guidato dagli autori."},{"tipo":"quiz","domanda":"Che cosa prevedeva meglio la salute a 80 anni?","opzioni":["Il reddito a 50 anni","La carriera fatta","La soddisfazione per i legami"],"corretta":2,"spiegazione":"Chi a 50 anni era più contento dei suoi legami era il più sano a 80. Più del colesterolo."},{"tipo":"colpo","testo":"Non servono cento amici."},{"tipo":"confronto","a":{"etichetta":"Conta meno","voci":["Quanti contatti hai"]},"b":{"etichetta":"Conta di più","voci":["Su chi puoi contare davvero"]}},{"tipo":"principio","testo":"La protezione più forte per salute e felicità? Per gli autori ==i legami stretti==."},{"tipo":"chiusura","azione":"Pensa a una persona che ti manca. ==Scrivile adesso==, anche solo due righe."}]},{"id":"good-life-forma-sociale","categoria":"benessere","titolo":"Quanto tempo ti resta con il tuo migliore amico","libro":{"titolo":"The Good Life","autore":"Robert Waldinger, Marc Schulz","anno":2023},"scene":[{"tipo":"apertura","testo":"Un'ora a settimana con un amico, per 40 anni. Totale: ==87 giorni==."},{"tipo":"colpo","testo":"Meno di tre mesi."},{"tipo":"grafico","titolo":"Un'ora insieme per 40 anni: giorni in tutto","forma":"barre","unita":"gg","dati":[{"e":"A sett.","v":87},{"e":"Al mese","v":20},{"e":"All'anno","v":2}],"nota":"Esempio illustrativo: ore totali divise per 24, arrotondate."},{"tipo":"testo","titolo":"Forma sociale","testo":"Waldinger e Schulz dirigono lo studio di Harvard sulla vita adulta. Per loro i legami sono come muscoli: ==fermi, si indeboliscono==."},{"tipo":"mito","mito":"Le amicizie vere durano da sole","realta":"Per gli autori vanno ==tenute in allenamento==, come il corpo."},{"tipo":"esempio","testo":"Marta e Giulia si scrivono «dobbiamo vederci» da due anni. Nessuna lite. ==Nessuna data.== Un'amicizia può spegnersi così, senza che nessuno lo decida."},{"tipo":"chiusura","azione":"Apri l'agenda. Fissa ==un appuntamento che si ripete== con una persona che conta."}]},{"id":"perche-dormiamo-caffe-nasconde-sonno","categoria":"benessere","titolo":"Il caffè non ti sveglia: ti nasconde il sonno","libro":{"titolo":"Perché dormiamo","autore":"Matthew Walker","anno":2017,"titoloOriginale":"Why We Sleep"},"scene":[{"tipo":"apertura","testo":"Il caffè non ti toglie il sonno. ==Te lo nasconde.=="},{"tipo":"testo","titolo":"La pressione del sonno","testo":"Per Matthew Walker, da sveglio accumuli nel cervello l'adenosina. ==Più ne hai, più hai sonno.== Dormendo la smaltisci."},{"tipo":"colpo","testo":"Poi arriva ==la tazzina==."},{"tipo":"mito","mito":"Il caffè ti ricarica","realta":"Occupa i recettori dell'adenosina: ==il segnale di sonno non arriva==."},{"tipo":"quiz","domanda":"Quando l'effetto del caffè finisce, che cosa trovi?","opzioni":["Il sonno di prima","Il sonno di prima, più altro","Niente: riparti da zero"],"corretta":1,"spiegazione":"Per Walker intanto l'adenosina è salita ancora. Arriva tutta insieme."},{"tipo":"principio","testo":"La caffeina non cancella il bisogno di dormire. ==Spegne l'avviso== per qualche ora."},{"tipo":"chiusura","azione":"Segna l'ora dell'ultimo caffè di oggi. Stasera nota ==come ti addormenti==."}]},{"id":"spark-giornata-comincia-correndo","categoria":"benessere","titolo":"La scuola dove la giornata comincia correndo","libro":{"titolo":"Spark","autore":"John J. Ratey","anno":2008},"scene":[{"tipo":"apertura","testo":"In una scuola dell'Illinois prima si corre, ==poi si aprono i libri==."},{"tipo":"esempio","testo":"Naperville, vicino a Chicago. Lì la ginnastica non è una gara. Si corre con il cardiofrequenzimetro. Il voto guarda il battito, ==non il cronometro==."},{"tipo":"colpo","testo":"E nelle ==altre materie==?"},{"tipo":"numero","valore":1,"suffisso":"°","didascalia":"Il posto del distretto in scienze, in un test mondiale del 1999.","nota":"TIMSS, terza media. Sesti in matematica."},{"tipo":"testo","titolo":"Che cosa c'entra la corsa","testo":"Per John Ratey il movimento prepara il cervello a imparare. Sale l'attenzione. E sale il BDNF, una proteina che ==aiuta i neuroni a collegarsi==."},{"tipo":"mito","mito":"La ginnastica toglie tempo allo studio","realta":"Per Ratey lo prepara. Ma Naperville è un indizio, ==non una prova==."},{"tipo":"chiusura","azione":"Prima di studiare fai ==dieci minuti a passo svelto==. Poi siediti."}]},{"id":"era-della-dopamina-bilancia","categoria":"benessere","titolo":"Perché dopo un piacere ne vuoi subito un altro","libro":{"titolo":"L'era della dopamina","autore":"Anna Lembke","anno":2021,"titoloOriginale":"Dopamine Nation"},"scene":[{"tipo":"apertura","testo":"Finisce l'episodio, parte il prossimo. ==Perché non ti basta mai?=="},{"tipo":"testo","titolo":"Una bilancia in testa","testo":"Per la psichiatra Anna Lembke piacere e dolore stanno su una bilancia. Ogni piacere la inclina. E il cervello ==la vuole in pari==."},{"tipo":"colpo","testo":"E ==spinge dall'altra parte==."},{"tipo":"esempio","testo":"Una patatina. Buona. Un attimo dopo ==ne vuoi un'altra==. Per Lembke è la bilancia che torna indietro, e va oltre."},{"tipo":"quiz","domanda":"Ripeti lo stesso piacere mille volte. Che cosa succede?","opzioni":["Dura sempre di più","Resta uguale","Cala, e il vuoto cresce"],"corretta":2,"spiegazione":"Lembke la chiama tolleranza: la spinta contraria si fa più forte."},{"tipo":"principio","testo":"Più piacere facile insegui, più la bilancia ==pende verso il dolore==. È la tesi di Lembke."},{"tipo":"chiusura","azione":"Stasera, finito l'episodio, ==aspetta dieci minuti== prima del prossimo."}]},{"id":"rest-tre-blocchi-darwin","categoria":"benessere","titolo":"Quante ore lavorava davvero Darwin","libro":{"titolo":"Rest","autore":"Alex Soojung-Kim Pang","anno":2016},"scene":[{"tipo":"apertura","testo":"Darwin lavorava tre blocchi da 90 minuti al giorno. ==Poi basta.=="},{"tipo":"colpo","testo":"Non era ==un'eccezione==."},{"tipo":"grafico","titolo":"Ore di lavoro concentrato al giorno","forma":"barre","unita":"h","dati":[{"e":"Darwin","v":4.5},{"e":"Poincaré","v":4},{"e":"Hardy","v":4}],"nota":"Dagli orari che Alex Pang ricostruisce nel libro."},{"tipo":"testo","titolo":"Riposo deliberato","testo":"Per Pang non erano pigri. Nel resto del giorno camminavano, dormivano, giocavano. E intanto la testa ==continuava a lavorare da sola==."},{"tipo":"mito","mito":"Più ore lavori, più produci","realta":"Per Pang contano poche ore intense e ==un riposo preso sul serio==."},{"tipo":"principio","testo":"Il riposo non è ciò che avanza dopo il lavoro. Per Pang ==è l'altra metà del lavoro==."},{"tipo":"chiusura","azione":"Oggi lavora 90 minuti senza interruzioni. Poi ==esci a camminare== per un quarto d'ora."}]},{"id":"arte-di-respirare-naso-tappato","categoria":"benessere","titolo":"Dieci giorni con il naso tappato","libro":{"titolo":"L'arte di respirare","autore":"James Nestor","anno":2020,"titoloOriginale":"Breath"},"scene":[{"tipo":"apertura","testo":"Un giornalista si fa tappare il naso ==per dieci giorni==. Apposta."},{"tipo":"esempio","testo":"James Nestor, seguito da un medico di Stanford, respira solo dalla bocca. Racconta che russa molto di più e dorme male. ==Poi toglie i tappi.=="},{"tipo":"colpo","testo":"E in pochi giorni ==si riprende==."},{"tipo":"mito","mito":"Naso o bocca, è la stessa aria","realta":"Per Nestor no: il naso la prepara, la bocca è ==solo la riserva==."},{"tipo":"elenco","titolo":"Cosa fa il naso all'aria","voci":["La filtra","La scalda","La inumidisce"]},{"tipo":"testo","testo":"Un test su due persone non è una prova. Per Nestor è solo l'inizio. Da lì va a cercare studi e tradizioni sul ==respiro==."},{"tipo":"chiusura","azione":"Per un minuto chiudi la bocca e ==respira piano dal naso==. Nota come ti senti."}]},{"id":"lato-positivo-stress-sono-carico","categoria":"benessere","titolo":"Agitato prima di un esame? Non provare a calmarti","libro":{"titolo":"Il lato positivo dello stress","autore":"Kelly McGonigal","anno":2015,"titoloOriginale":"The Upside of Stress"},"scene":[{"tipo":"apertura","testo":"Cuore a mille prima dell'esame. «Calmati», ti dicono. ==C'è di meglio.=="},{"tipo":"colpo","testo":"Due parole: ==«sono carico»==."},{"tipo":"esempio","testo":"Harvard. Alison Wood Brooks fa parlare in pubblico dei volontari. Prima, metà dice «sono calmo», metà «sono carico». ==I secondi parlano meglio.=="},{"tipo":"quiz","domanda":"A metà degli studenti dicono: «l'ansia può aiutarti». Come vanno al test?","opzioni":["Peggio degli altri","Come gli altri","Meglio degli altri"],"corretta":2,"spiegazione":"È lo studio di Jeremy Jamieson citato da McGonigal: cambia l'idea, cambia il voto."},{"tipo":"principio","testo":"Per Kelly McGonigal ansia ed entusiasmo nel corpo si somigliano. ==Cambiare etichetta== è più facile che calmarsi."},{"tipo":"chiusura","azione":"Alla prossima agitazione di' a voce alta ==«sono carico»==. Poi comincia."}]},{"id":"elogio-lentezza-favola-un-minuto","categoria":"benessere","titolo":"La favola della buonanotte in sessanta secondi","libro":{"titolo":"Elogio della lentezza","autore":"Carl Honoré","anno":2004,"titoloOriginale":"In Praise of Slowness"},"scene":[{"tipo":"apertura","testo":"Favole della buonanotte ==da un minuto==. Un papà stava per comprarle."},{"tipo":"esempio","testo":"Carl Honoré, giornalista sempre di corsa, legge al figlio saltando le righe. In aeroporto vede un articolo: fiabe ==in sessanta secondi==."},{"tipo":"colpo","testo":"Primo istinto: ==comprarle==."},{"tipo":"testo","testo":"Poi il dubbio: metto fretta perfino alla buonanotte? Da lì parte il suo viaggio fra chi ha scelto di ==rallentare==."},{"tipo":"quiz","domanda":"Per Honoré, che cosa vuol dire vivere «slow»?","opzioni":["Fare tutto lentamente","Dare a ogni cosa il suo tempo","Rinunciare alla tecnologia"],"corretta":1,"spiegazione":"Non fa guerra alla velocità: il nemico è la fretta messa dappertutto."},{"tipo":"confronto","a":{"etichetta":"Fretta per abitudine","voci":["Tutto veloce, anche il bello"]},"b":{"etichetta":"Tempo giusto","voci":["Veloce quando serve","Lento quando conta"]}},{"tipo":"chiusura","azione":"Stasera scegli una cosa sola e falla ==senza guardare l'ora==."}]},{"id":"outlive-decathlon-centenario","categoria":"benessere","titolo":"Il decathlon dei tuoi novant'anni","libro":{"titolo":"Outlive","autore":"Peter Attia","anno":2023},"scene":[{"tipo":"apertura","testo":"Che cosa vuoi saper fare ==a novant'anni==? Scrivilo adesso."},{"tipo":"elenco","titolo":"Per esempio","voci":["Alzarti da terra da solo","Prendere in braccio un bambino","Sollevare una valigia"]},{"tipo":"colpo","testo":"Peter Attia ne fa ==una gara==."},{"tipo":"testo","titolo":"Il decathlon del centenario","testo":"Attia, medico, fa scegliere dieci gesti così. Poi ragiona all'indietro: ==cosa devi saper fare oggi== per riuscirci?"},{"tipo":"quiz","domanda":"A 90 anni vuoi fare le scale con la spesa. Per Attia, a 50 devi…","opzioni":["Riuscirci appena","Riuscirci con molto margine"],"corretta":1,"spiegazione":"Forza e fiato calano con l'età. Per Attia il margine si costruisce prima."},{"tipo":"principio","testo":"Per Attia non conta solo quanti anni vivi: conta ==quanti ne vivi in forma==."},{"tipo":"chiusura","azione":"Scrivi ==tre cose== che vuoi saper fare da vecchio. Attaccale al frigo."}]},{"id":"attenzione-rubata-scroll-infinito","categoria":"benessere","titolo":"Chi ha tolto il fondo alle pagine","libro":{"titolo":"L'attenzione rubata","autore":"Johann Hari","anno":2022,"titoloOriginale":"Stolen Focus"},"scene":[{"tipo":"apertura","testo":"Una volta le pagine ==finivano==. Poi qualcuno ha tolto il fondo."},{"tipo":"confronto","titolo":"Che cosa è cambiato","a":{"etichetta":"Senza fondo","voci":["La pagina non finisce mai","Nessuna pausa per decidere"]},"b":{"etichetta":"Con un fondo","voci":["A fine pagina clicchi «avanti»","Un attimo per dirti: smetto?"]}},{"tipo":"esempio","testo":"2006. Il programmatore Aza Raskin inventa lo scorrimento infinito. Anni dopo dice a Johann Hari di essersene pentito. Tiene la gente sullo schermo ==troppo a lungo==."},{"tipo":"colpo","testo":"E ==non è un incidente==."},{"tipo":"mito","mito":"Mi distraggo perché ho poca forza di volontà","realta":"Per Hari molte app sono progettate apposta per ==non farti smettere==."},{"tipo":"principio","testo":"Per Hari la tua attenzione non è crollata da sola. ==Te la stanno portando via.=="},{"tipo":"chiusura","azione":"Scegli l'app che ti cattura di più. Prima di aprirla, ==metti una sveglia a dieci minuti==."}]},{"id":"burnout-chiudere-ciclo-stress","categoria":"benessere","titolo":"Problema risolto, stress ancora lì","libro":{"titolo":"Burnout","autore":"Emily Nagoski, Amelia Nagoski","anno":2019},"scene":[{"tipo":"apertura","testo":"Hai consegnato. Problema risolto. ==Allora perché sei ancora teso?=="},{"tipo":"testo","titolo":"Due cose diverse","testo":"Emily e Amelia Nagoski separano la causa dallo stress. La causa è la scadenza. Lo stress è ciò che ==succede nel tuo corpo==."},{"tipo":"esempio","testo":"Un leone ti insegue. Corri, arrivi al villaggio, sei salvo: il corpo capisce che ==è finita==. Dopo una mail difficile quel segnale non arriva."},{"tipo":"colpo","testo":"Il ciclo resta ==aperto==."},{"tipo":"elenco","titolo":"Come si chiude, per le autrici","voci":["Muoverti: il modo più efficace","Una risata vera","Un abbraccio lungo, venti secondi","Un bel pianto"]},{"tipo":"mito","mito":"Risolto il problema, lo stress passa da solo","realta":"Per le Nagoski il corpo aspetta ==un segnale che è finita==."},{"tipo":"chiusura","azione":"Dopo la prossima giornata pesante, ==cammina svelto dieci minuti== prima di sederti."}]},{"id":"perche-dormiamo-sonno-salva-ricordi","categoria":"benessere","titolo":"La parte dello studio che fai dormendo","libro":{"titolo":"Perché dormiamo","autore":"Matthew Walker","anno":2017,"titoloOriginale":"Why We Sleep"},"scene":[{"tipo":"apertura","testo":"Notte in bianco sui libri? Hai saltato ==un pezzo dello studio==."},{"tipo":"colpo","testo":"Quel pezzo ==è il sonno==."},{"tipo":"testo","testo":"Per Matthew Walker il sonno profondo è il tasto «salva». Sposta i ricordi freschi dal deposito provvisorio ==a quello stabile==."},{"tipo":"elenco","titolo":"Il sonno lavora due volte","voci":["Prima di studiare: ==fa spazio==","Dopo: ==fissa== ciò che hai imparato"]},{"tipo":"quiz","domanda":"Impari una lista a memoria. Ore dopo, chi la ricorda meglio?","opzioni":["Chi ha dormito","Chi è rimasto sveglio","Nessuna differenza"],"corretta":0,"spiegazione":"Lo mostrò già un esperimento del 1924: chi dorme dimentica meno."},{"tipo":"mito","mito":"Dormire è tempo tolto allo studio","realta":"Per Walker è il momento in cui lo studio ==si fissa==."},{"tipo":"chiusura","azione":"Stasera ripassa una volta e ==vai a letto alla solita ora==."}]},{"id":"blue-zones-muoversi-senza-palestra","categoria":"benessere","titolo":"Zone blu: muoversi senza accorgersene","libro":{"titolo":"The Blue Zones","autore":"Dan Buettner","anno":2008},"scene":[{"tipo":"apertura","testo":"Le «zone blu»? Il nome viene da ==una penna blu== su una cartina sarda."},{"tipo":"esempio","testo":"Primi anni Duemila. Gianni Pes e Michel Poulain studiano i centenari sardi. Cerchiano i loro paesi in blu. ==Il nome resta.=="},{"tipo":"testo","testo":"Dan Buettner visita posti simili, da Okinawa alla Costa Rica. Cerca ==che cosa hanno in comune==."},{"tipo":"colpo","testo":"Niente ==palestra==."},{"tipo":"confronto","a":{"etichetta":"Come lo pensiamo","voci":["Un'ora intensa, poi seduti"]},"b":{"etichetta":"Come lo ha visto lì","voci":["Pastori a piedi, orti, salite","Poco sforzo, tutto il giorno"]}},{"tipo":"testo","testo":"Attenzione: alcuni studiosi contestano i dati sull'età di quei centenari. Prendila come ==la tesi di Buettner==, non come una ricetta."},{"tipo":"principio","testo":"Per Buettner i più longevi non si allenano. Vivono in posti che ==li fanno muovere senza pensarci==."},{"tipo":"chiusura","azione":"Oggi un tragitto breve fallo ==a piedi==. E prendi le scale."}]},{"id":"gioia-di-muoversi-sballo-corridore","categoria":"benessere","titolo":"Lo sballo del corridore non è solo per chi corre","libro":{"titolo":"La gioia di muoversi","autore":"Kelly McGonigal","anno":2019,"titoloOriginale":"The Joy of Movement"},"scene":[{"tipo":"apertura","testo":"Lo «sballo del corridore» esiste. ==E non serve correre forte.=="},{"tipo":"mito","mito":"È tutta questione di endorfine","realta":"Per gli studi che McGonigal cita c'entrano di più gli ==endocannabinoidi==."},{"tipo":"colpo","testo":"E c'entra ==la preistoria==."},{"tipo":"testo","testo":"Per l'antropologo David Raichlen cacciare e raccogliere chiedeva ore di movimento. Il cervello imparò a ==premiare chi insisteva==."},{"tipo":"quiz","domanda":"Mezz'ora sul tapis roulant. Quale andatura dà lo sballo?","opzioni":["Corsetta costante","Camminata lenta","Corsa al massimo"],"corretta":0,"spiegazione":"Nel test di Raichlen gli endocannabinoidi salirono solo con lo sforzo moderato."},{"tipo":"principio","testo":"Per McGonigal non premia la velocità ma la costanza: ==in bici, in salita, in acqua==."},{"tipo":"chiusura","azione":"Oggi ==venti minuti di camminata svelta==, senza fermarti."}]},{"id":"elogio-lentezza-slow-food","categoria":"benessere","titolo":"La lumaca che sfidò il fast food","libro":{"titolo":"Elogio della lentezza","autore":"Carl Honoré","anno":2004,"titoloOriginale":"In Praise of Slowness"},"scene":[{"tipo":"apertura","testo":"Roma, 1986. Apre un fast food a Piazza di Spagna. ==Risponde una lumaca.=="},{"tipo":"esempio","testo":"Carlo Petrini, giornalista piemontese, non ci sta e lancia Slow Food. Simbolo: una chiocciola. Idea: il cibo buono ==chiede tempo== e compagnia."},{"tipo":"colpo","testo":"Poi l'idea ==esce dal piatto==."},{"tipo":"elenco","titolo":"Che cosa racconta Honoré","voci":["Città lente: nate in Italia nel 1999","Lavoro: meno ore, fatte meglio","Tempo libero senza cronometro"]},{"tipo":"mito","mito":"Slow Food è nostalgia del passato","realta":"Per Honoré non rifiuta il moderno: rifiuta ==la fretta dove non serve==."},{"tipo":"principio","testo":"Non si tratta di andare sempre piano: si tratta di ==decidere tu il ritmo==. E si comincia a tavola."},{"tipo":"chiusura","azione":"Stasera cena ==seduto a tavola==, telefono in un'altra stanza. Anche se sei da solo."}]},{"id":"sapiens-finzioni-condivise","categoria":"storia","titolo":"Perché comandiamo noi e non gli scimpanzé","libro":{"titolo":"Sapiens. Da animali a dèi","autore":"Yuval Noah Harari","anno":2011,"titoloOriginale":"Sapiens: A Brief History of Humankind"},"scene":[{"tipo":"apertura","testo":"Prometti il paradiso a una scimmia in cambio di una banana. ==Rifiuta.=="},{"tipo":"colpo","testo":"Noi umani invece ==ci crediamo==."},{"tipo":"testo","titolo":"Le finzioni condivise","testo":"Per Harari il segreto di Sapiens è questo. Crediamo in tanti a cose che esistono ==solo nell'immaginazione==. Dèi, nazioni, soldi, aziende."},{"tipo":"numero","valore":150,"didascalia":"Circa. Il limite di un gruppo tenuto insieme ==dal pettegolezzo==, secondo Harari.","nota":"Oltre questa soglia serve una storia comune."},{"tipo":"esempio","testo":"Peugeot non è le sue auto né i suoi operai. Per Harari è una ==finzione legale==. Esiste perché giudici, banche e clienti credono alla stessa storia."},{"tipo":"principio","testo":"Milioni di sconosciuti collaborano solo quando ==credono alla stessa storia==."},{"tipo":"chiusura","azione":"Prendi una banconota e chiediti: ==perché il barista la accetta?=="}]},{"id":"sapiens-trappola-del-grano","categoria":"storia","titolo":"Chi ha addomesticato chi? Il grano e noi","libro":{"titolo":"Sapiens. Da animali a dèi","autore":"Yuval Noah Harari","anno":2011,"titoloOriginale":"Sapiens: A Brief History of Humankind"},"scene":[{"tipo":"apertura","testo":"Il grano non l'abbiamo addomesticato noi. ==È stato lui.=="},{"tipo":"testo","titolo":"Diecimila anni fa","testo":"Il grano è un'erba selvatica del Medio Oriente. Poi Sapiens comincia a zappare, irrigare e togliere sassi ==per lui==. Dall'alba al tramonto."},{"tipo":"quiz","domanda":"Chi lavorava meno ore, secondo Harari?","opzioni":["I cacciatori-raccoglitori","I primi contadini"],"corretta":0,"spiegazione":"I raccoglitori mangiavano più vario e faticavano meno. Il contadino ebbe più cibo, non più tempo."},{"tipo":"colpo","testo":"Allora ==chi ci ha guadagnato==?"},{"tipo":"numero","valore":2.25,"decimali":2,"suffisso":" mln km²","didascalia":"La terra coperta oggi dal grano: ==quasi dieci volte la Gran Bretagna==.","nota":"Dato riportato da Harari."},{"tipo":"principio","testo":"Per Harari l'agricoltura fu una trappola: ==più cibo, più bocche, più fatica==. E indietro non si torna."},{"tipo":"chiusura","azione":"Scrivi una comodità che per te è diventata un obbligo. ==Decidi se tenerla.=="}]},{"id":"homo-deus-like-ti-conoscono","categoria":"storia","titolo":"Quanti like servono per conoscerti meglio dei tuoi","libro":{"titolo":"Homo Deus. Breve storia del futuro","autore":"Yuval Noah Harari","anno":2015,"titoloOriginale":"Homo Deus: A Brief History of Tomorrow"},"scene":[{"tipo":"apertura","testo":"Bastano 300 like e un algoritmo ti descrive ==meglio del tuo partner==."},{"tipo":"quiz","domanda":"E per descriverti meglio di un collega di lavoro, quanti like servono?","opzioni":["10","100","200"],"corretta":0,"spiegazione":"Ne bastano dieci. Harari cita uno studio del 2015 su 86 mila utenti Facebook."},{"tipo":"grafico","titolo":"Like che bastano per battere chi ti conosce","forma":"barre","dati":[{"e":"Collega","v":10},{"e":"Amico","v":70},{"e":"Famiglia","v":150},{"e":"Partner","v":300}],"nota":"La gara: prevedere un test di personalità."},{"tipo":"colpo","testo":"E quello era ==il 2015==."},{"tipo":"testo","titolo":"Chi ha l'ultima parola","testo":"Per secoli il consiglio è stato: ascolta te stesso. Harari immagina il passo dopo. Se i dati ti conoscono meglio, ==ascolterai loro==."},{"tipo":"principio","testo":"Harari lo chiama dataismo: ==l'autorità passa da te agli algoritmi==. È uno scenario, non una profezia."},{"tipo":"chiusura","azione":"Apri l'app di musica o video. Delle scelte di oggi, ==quante erano tue?=="}]},{"id":"21-lezioni-mosca-e-toro","categoria":"storia","titolo":"La mosca, il toro e la paura del terrorismo","libro":{"titolo":"21 lezioni per il XXI secolo","autore":"Yuval Noah Harari","anno":2018,"titoloOriginale":"21 Lessons for the 21st Century"},"scene":[{"tipo":"apertura","testo":"Come fa una mosca a distruggere ==un negozio di porcellane==?"},{"tipo":"colpo","testo":"Le serve ==un toro==."},{"tipo":"esempio","testo":"Da sola non sposta una tazzina. Allora entra nell'orecchio di un toro e ronza. Il toro, impazzito di paura e rabbia, ==sfascia il negozio==."},{"tipo":"testo","titolo":"La metafora è di Harari","testo":"Per lui il terrorista è la mosca. È troppo debole per vincere da solo. Punta tutto sulla ==reazione esagerata== di chi è molto più forte."},{"tipo":"numero","valore":50,"didascalia":"Circa. I morti l'anno per terrorismo nell'Unione Europea ==dopo il 2001==.","nota":"Sulle strade europee, scrive Harari, circa 80 mila l'anno."},{"tipo":"principio","testo":"Per Harari il terrorismo è uno spettacolo. ==Vince solo se la paura ci fa reagire male.=="},{"tipo":"chiusura","azione":"Una notizia ti spaventa? Cerca ==quanti casi ci sono in un anno==."}]},{"id":"armi-acciaio-malattie-germi-del-bestiame","categoria":"storia","titolo":"168 spagnoli contro 80 mila: l'arma che non si vedeva","libro":{"titolo":"Armi, acciaio e malattie","autore":"Jared Diamond","anno":1997,"titoloOriginale":"Guns, Germs, and Steel"},"scene":[{"tipo":"apertura","testo":"In 168 catturano un imperatore difeso da ==80 mila soldati==. È il 1532."},{"tipo":"colpo","testo":"Non fu solo ==l'acciaio==."},{"tipo":"quiz","domanda":"Dopo Colombo, che cosa uccise più nativi americani?","opzioni":["Le spade","I fucili","Le malattie"],"corretta":2,"spiegazione":"Il vaiolo arrivò in Perù prima di Pizarro. Per Diamond i germi uccisero più delle armi."},{"tipo":"testo","titolo":"Il regalo letale del bestiame","testo":"Vaiolo e morbillo nascono da germi degli animali domestici. Chi viveva da millenni accanto al bestiame ==aveva sviluppato difese==."},{"tipo":"numero","valore":13,"suffisso":" su 14","didascalia":"I grandi mammiferi domestici nati in Eurasia. ==Alle Americhe toccò il lama.==","nota":"Conteggio di Diamond."},{"tipo":"principio","testo":"Per Diamond non vinsero popoli migliori. Vinse ==la geografia==, che distribuì male animali e germi."},{"tipo":"chiusur
