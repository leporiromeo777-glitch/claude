a","azione":"A cena scegli un cibo nel piatto. Cerca ==in quale continente è nato==."}]},{"id":"armi-acciaio-malattie-asse-dei-continenti","categoria":"storia","titolo":"L'Eurasia è larga, le Americhe lunghe: e cambia tutto","libro":{"titolo":"Armi, acciaio e malattie","autore":"Jared Diamond","anno":1997,"titoloOriginale":"Guns, Germs, and Steel"},"scene":[{"tipo":"apertura","testo":"L'Eurasia è larga. Le Americhe sono lunghe. ==Per Diamond cambia tutto.=="},{"tipo":"testo","titolo":"Stessa latitudine, stesso clima","testo":"Da est a ovest stagioni e ore di luce si somigliano. Il grano della Mezzaluna fertile ==arriva fino in Spagna e in India==."},{"tipo":"confronto","a":{"etichetta":"Asse nord-sud","voci":["Americhe e Africa","Ogni tratto, un clima diverso"]},"b":{"etichetta":"Asse est-ovest","voci":["Eurasia","Semi e animali viaggiano veloci"]}},{"tipo":"colpo","testo":"Poi c'è ==la storia della ruota==."},{"tipo":"esempio","testo":"In Messico inventano la ruota, ma resta sui giocattoli. Sulle Ande allevano i lama. Ruota e lama ==non si incontrano mai==. In mezzo ci sono i tropici."},{"tipo":"principio","testo":"Per Diamond conta la forma dei continenti. Decide ==quanto in fretta viaggiano== semi, animali e idee."},{"tipo":"chiusura","azione":"Trova la tua città sulla mappa e segui il parallelo. ==Quali paesi incontri?=="}]},{"id":"collasso-ultimo-albero-isola-di-pasqua","categoria":"storia","titolo":"Chi ha tagliato l'ultimo albero dell'Isola di Pasqua?","libro":{"titolo":"Collasso","autore":"Jared Diamond","anno":2005,"titoloOriginale":"Collapse"},"scene":[{"tipo":"apertura","testo":"Cosa pensava chi tagliò ==l'ultimo albero== dell'Isola di Pasqua?"},{"tipo":"esempio","testo":"È la domanda di Jared Diamond. Per lui gli isolani abbattono le palme: servono campi, canoe, statue. Senza legno arrivano ==fame, guerre, crollo==."},{"tipo":"colpo","testo":"Ma forse ==non andò così==."},{"tipo":"confronto","titolo":"Una tesi contestata","a":{"etichetta":"Diamond","voci":["Foresta tagliata dagli isolani","Crollo prima degli europei"]},"b":{"etichetta":"Altri archeologi","voci":["Semi di palma mangiati dai topi","Crollo dopo il 1722, con gli europei"]}},{"tipo":"testo","titolo":"Cosa resta dell'idea","testo":"Diamond confronta molte società con cinque fattori: ambiente, clima, nemici, commerci persi. Il quinto c'è sempre: ==come la società reagisce==."},{"tipo":"principio","testo":"Per Diamond il collasso non è destino. Conta ==cosa scegli di fare== quando il problema si vede già."},{"tipo":"chiusura","azione":"Cerca «Rapa Nui» e leggi le due versioni. ==Quale ti convince di più?=="}]},{"id":"lessons-of-history-ricchezza-concentrata","categoria":"storia","titolo":"Atene, 594 a.C.: la rivolta che non scoppiò","libro":{"titolo":"The Lessons of History","autore":"Will Durant, Ariel Durant","anno":1968},"scene":[{"tipo":"apertura","testo":"Atene, 594 avanti Cristo. Ricchi e poveri ==a un passo dalla guerra==."},{"tipo":"esempio","testo":"Gli ateniesi eleggono Solone. Svaluta la moneta, alleggerisce i debiti, tassa di più i ricchi. Protestano tutti. ==La rivolta non scoppia.=="},{"tipo":"mito","mito":"La disuguaglianza estrema è un problema moderno","realta":"Per i Durant torna in ogni epoca: ==la ricchezza tende a concentrarsi==."},{"tipo":"colpo","testo":"E dopo? ==Due finali.=="},{"tipo":"confronto","titolo":"Come torna in circolo","a":{"etichetta":"Roma","voci":["Il Senato ferma i Gracchi","Un secolo di guerre civili"]},"b":{"etichetta":"Atene","voci":["Le riforme di Solone","Niente rivoluzione"]}},{"tipo":"principio","testo":"Per i Durant finisce in due modi. Una legge redistribuisce ricchezza, o ==una rivolta distribuisce povertà==."},{"tipo":"chiusura","azione":"Leggi una notizia di oggi su tasse o debiti. ==Cerca un caso simile nel passato.=="}]},{"id":"menti-tribali-sei-sapori-morali","categoria":"storia","titolo":"Perché a cena nessuno cambia idea sulla politica","libro":{"titolo":"Menti tribali","autore":"Jonathan Haidt","anno":2012,"titoloOriginale":"The Righteous Mind"},"scene":[{"tipo":"apertura","testo":"Cena di famiglia, si parla di politica. ==Nessuno cambia idea.== Mai."},{"tipo":"colpo","testo":"Non è ==testardaggine==."},{"tipo":"testo","titolo":"La morale ha sei sapori","testo":"Per Jonathan Haidt la mente morale è come una lingua. Ha ==sei recettori del gusto==. Li abbiamo tutti. Ognuno li pesa a modo suo."},{"tipo":"elenco","titolo":"I sei fondamenti morali","voci":["Cura ed equità","Lealtà e autorità","Sacralità e libertà"]},{"tipo":"esempio","testo":"Una donna trova una vecchia bandiera. La taglia e ci pulisce il bagno. Non fa male a nessuno. Ma se senti forte ==lealtà e sacralità==, è un oltraggio."},{"tipo":"mito","mito":"Chi vota diverso da me non ha valori","realta":"Per Haidt ha gli stessi sei sapori. ==Li pesa in modo diverso== da te."},{"tipo":"chiusura","azione":"Alla prossima discussione chiedi: ==che cosa ti sta a cuore qui?== Poi ascolta."}]},{"id":"bowling-alone-capitale-sociale","categoria":"storia","titolo":"Più gente al bowling, meno squadre: che succede?","libro":{"titolo":"Capitale sociale e individualismo","autore":"Robert D. Putnam","anno":2000,"titoloOriginale":"Bowling Alone"},"scene":[{"tipo":"apertura","testo":"Sempre più americani giocano a bowling. Sempre meno ==in squadra==."},{"tipo":"confronto","titolo":"Bowling negli USA, 1980-1993","a":{"etichetta":"Giocatori","voci":["+10%"]},"b":{"etichetta":"Iscritti ai campionati","voci":["−40%"]}},{"tipo":"colpo","testo":"Il bowling ==è solo un simbolo==."},{"tipo":"testo","titolo":"Si chiama capitale sociale","testo":"Per Putnam è la ricchezza fatta di legami. Club, sindacati, parrocchie, cene con amici. Negli USA cala ==nell'ultimo terzo del Novecento==."},{"tipo":"quiz","domanda":"Quale causa pesa di più, secondo Putnam?","opzioni":["La televisione","Il ricambio generazionale","Il troppo lavoro"],"corretta":1,"spiegazione":"Vale circa metà del calo. I nati prima del 1940 partecipavano di più. La TV, un erdinand von Richthofen."},{"tipo":"colpo","testo":"E la seta era ==il meno==."},{"tipo":"elenco","titolo":"Cosa viaggiava su quelle strade","voci":["Buddhismo, cristianesimo, islam","Argento, spezie, schiavi","La peste nera del Trecento"]},{"tipo":"numero","valore":100,"suffisso":" mln","didascalia":"Sesterzi che Roma perdeva ogni anno ==verso Oriente==, secondo Plinio il Vecchio.","nota":"Per comprare seta, spezie e altri lussi."},{"tipo":"mito","mito":"L'Europa è sempre stata il centro della storia","realta":"Per Frankopan lo diventa ==dopo il 1492==. Prima il cuore era più a est."},{"tipo":"chiusura","azione":"Apri una mappa e mettila al centro su Samarcanda. ==Guarda dove finisce l'Europa.=="}]},{"id":"dieci-mappe-pianura-russa","categoria":"storia","titolo":"Il paese più grande del mondo ha paura di una pianura","libro":{"titolo":"Le 10 mappe che spiegano il mondo","autore":"Tim Marshall","anno":2015,"titoloOriginale":"Prisoners of Geography"},"scene":[{"tipo":"apertura","testo":"È il paese più grande del mondo. E da secoli ==teme una pianura==."},{"tipo":"testo","titolo":"La grande pianura europea","testo":"Dalla Francia agli Urali è quasi tutto piatto. Per Tim Marshall, da Mosca sembra ==un corridoio senza porte==."},{"tipo":"elenco","titolo":"Chi è passato da lì","voci":["1605: i polacchi","1708: gli svedesi","1812: Napoleone","1914 e 1941: i tedeschi"]},{"tipo":"colpo","testo":"Capire ==non è giustificare==."},{"tipo":"confronto","titolo":"La tesi di Marshall","a":{"etichetta":"Cambiano","voci":["Zar, soviet, presidenti","Ideologie e alleanze"]},"b":{"etichetta":"Restano","voci":["Pianure, monti, mari","Le stesse paure strategiche"]}},{"tipo":"principio","testo":"Per Marshall chi governa è ==prigioniero della geografia==. La mappa gli restringe le mosse."},{"tipo":"chiusura","azione":"Apri la mappa fisica del tuo paese: ==quale barriera naturale lo protegge?=="}]},{"id":"origins-political-order-tre-pilastri","categoria":"storia","titolo":"Tre pilastri che tengono in piedi un paese","libro":{"titolo":"The Origins of Political Order","autore":"Francis Fukuyama","anno":2011},"scene":[{"tipo":"apertura","testo":"Lo Stato moderno nasce ==1800 anni prima== che in Europa. Indovina dove."},{"tipo":"quiz","domanda":"Dove nasce, secondo Fukuyama?","opzioni":["In Persia","In Cina","In Egitto"],"corretta":1,"spiegazione":"Nel 221 a.C. i Qin unificano la Cina. Creano una burocrazia centrale e impersonale."},{"tipo":"colpo","testo":"Ma uno Stato forte ==non basta==."},{"tipo":"elenco","titolo":"I tre pilastri di Fukuyama","voci":["Uno Stato che sa farsi obbedire","La legge sopra chi comanda","Un governo che risponde ai cittadini"]},{"tipo":"esempio","testo":"Fukuyama lo chiama «arrivare in Danimarca»: un paese stabile, prospero, poco corrotto. ==Pochi conoscono la strada.=="},{"tipo":"principio","testo":"La Cina ebbe presto il primo pilastro, non gli altri due. Per Fukuyama servono ==tutti e tre in equilibrio==."},{"tipo":"chiusura","azione":"Prendi una notizia di politica di oggi. ==Parla di Stato, legge o controllo?=="}]},{"id":"factfulness-test-scimpanze","categoria":"scienza","titolo":"Il test sul mondo in cui il caso fa meglio di noi","libro":{"titolo":"Factfulness","autore":"Hans Rosling, Ola Rosling, Anna Rosling Rönnlund","anno":2018},"scene":[{"tipo":"apertura","testo":"Tre risposte fra cui scegliere. Uno scimpanzé farebbe ==meglio di noi==."},{"tipo":"quiz","domanda":"Dal 1997 al 2017 la quota di persone in povertà estrema nel mondo è…","opzioni":["Quasi raddoppiata","Più o meno uguale","Quasi dimezzata"],"corretta":2,"spiegazione":"Quasi dimezzata. In media lo sa meno di una persona su dieci."},{"tipo":"grafico","titolo":"Risposte giuste su 12 domande sul mondo","forma":"barre","dati":[{"e":"Persone","v":2},{"e":"A caso","v":4}],"nota":"Media di quasi 12 mila persone in 14 Paesi, 2017."},{"tipo":"colpo","testo":"Peggio del caso. ==Non a caso.=="},{"tipo":"testo","titolo":"Non è ignoranza","testo":"Chi tira a caso ne azzecca una su tre. Noi sbagliamo ==tutti dalla stessa parte==: la più cupa."},{"tipo":"mito","mito":"Il mondo va sempre peggio","realta":"Per Rosling il mondo va male e ==va meglio di prima==. Insieme."},{"tipo":"chiusura","azione":"Alla prossima notizia nera cerca un dato: ==com'era vent'anni fa?=="}]},{"id":"mondo-infestato-demoni-kit-antibufale","categoria":"scienza","titolo":"Il kit di Carl Sagan per smascherare le bufale","libro":{"titolo":"Il mondo infestato dai demoni","autore":"Carl Sagan","anno":1995,"titoloOriginale":"The Demon-Haunted World"},"scene":[{"tipo":"apertura","testo":"Ti arriva un vocale: «È tutto vero, fai girare!» ==Come lo controlli?=="},{"tipo":"colpo","testo":"Sagan aveva ==un kit==."},{"tipo":"elenco","titolo":"Quattro attrezzi del kit","voci":["Cerca una ==conferma indipendente==","Contano le prove, non chi parla","Fai più di un'ipotesi","Chiediti: cosa la smentirebbe?"]},{"tipo":"esempio","testo":"Un video giura: «Questa calamita dimezza i consumi». Chi altro l'ha provato? Chi lo dice la vende? ==Cosa lo smentirebbe?=="},{"tipo":"mito","mito":"Se lo dice un esperto, dev'essere vero","realta":"Per Sagan nella scienza non ci sono autorità: solo esperti, ==e sbagliano==."},{"tipo":"testo","titolo":"L'attrezzo più scomodo","testo":"Vale anche per te. Non affezionarti a un'idea solo perché è tua: cerca per primo ==i motivi per scartarla==."},{"tipo":"chiusura","azione":"Riprendi l'ultima cosa che hai inoltrato. Passale ==un attrezzo del kit==."}]},{"id":"cosmo-eratostene-misura-terra","categoria":"scienza","titolo":"L'uomo che misurò la Terra senza lasciare l'Egitto","libro":{"titolo":"Cosmo","autore":"Carl Sagan","anno":1980,"titoloOriginale":"Cosmos"},"scene":[{"tipo":"apertura","testo":"2200 anni fa un uomo misurò la Terra con ==un bastone e un'ombra==."},{"tipo":"esempio","testo":"Eratostene legge una notizia. A Siene, a mezzogiorno del 21 giugno, i bastoni ==non fanno ombra==. Controlla ad Alessandria: lì l'ombra c'è."},{"tipo":"colpo","testo":"Perché lì no e qui sì?"},{"tipo":"testo","titolo":"La Terra è curva","testo":"Se fosse piatta, le ombre sarebbero uguali. La differenza dà un angolo di circa 7 gradi: ==un cinquantesimo di giro==."},{"tipo":"quiz","domanda":"Fra le due città ci sono circa 800 km. Quanto misura il giro della Terra?","opzioni":["8 mila km","40 mila km","400 mila km"],"corretta":1,"spiegazione":"800 per 50 fa 40 mila km. La misura di oggi è vicinissima."},{"tipo":"principio","testo":"Gli bastarono bastoni, occhi, piedi e cervello. Più la ==voglia di fare la prova==."},{"tipo":"chiusura","azione":"A mezzogiorno pianta una matita al sole e ==misura l'ombra==. Lui partì da lì."}]},{"id":"dal-big-bang-buchi-neri-non-neri","categoria":"scienza","titolo":"I buchi neri non sono del tutto neri","libro":{"titolo":"Dal big bang ai buchi neri","autore":"Stephen Hawking","anno":1988,"titoloOriginale":"A Brief History of Time"},"scene":[{"tipo":"apertura","testo":"Hawking scoprì che i buchi neri non sono neri. ==E ci rimase male.=="},{"tipo":"mito","mito":"Un buco nero non emette niente","realta":"Per i calcoli di Hawking emette una ==debole radiazione==."},{"tipo":"testo","titolo":"Perché ci rimase male","testo":"Il fisico Bekenstein diceva: i buchi neri hanno entropia. Hawking era contrario. Fece i conti: in sostanza ==aveva ragione l'altro==."},{"tipo":"colpo","testo":"E c'è una conseguenza."},{"tipo":"principio","testo":"Se emette energia, un buco nero perde massa. Lentissimamente, ==evapora==."},{"tipo":"confronto","titolo":"Più piccolo, più caldo","a":{"etichetta":"Buco nero enorme","voci":["Freddissimo","Evapora in tempi immensi"]},"b":{"etichetta":"Buco nero minuscolo","voci":["Molto più caldo","Evapora prima"]}},{"tipo":"testo","testo":"Resta una previsione teorica: quella radiazione è debolissima e ==nessuno l'ha ancora osservata==."},{"tipo":"chiusura","azione":"Un'idea altrui ti irrita? Prima di scartarla, ==prova a fare i conti==."}]},{"id":"gene-egoista-macchine-di-sopravvivenza","categoria":"scienza","titolo":"Perché un'ape muore per difendere l'alveare","libro":{"titolo":"Il gene egoista","autore":"Richard Dawkins","anno":1976,"titoloOriginale":"The Selfish Gene"},"scene":[{"tipo":"apertura","testo":"Un'ape punge il ladro di miele e muore. ==Chi ci guadagna?=="},{"tipo":"colpo","testo":"Non lei. ==I suoi geni.=="},{"tipo":"testo","titolo":"Il punto di vista del gene","testo":"Per Dawkins la selezione sceglie fra geni: resta chi si fa copiare di più. Il corpo è la loro ==macchina di sopravvivenza==."},{"tipo":"confronto","titolo":"Un tuo gene raro: chi altro ce l'ha?","a":{"etichetta":"Un cugino","voci":["1 probabilità su 8"]},"b":{"etichetta":"Un fratello","voci":["1 probabilità su 2"]}},{"tipo":"esempio","testo":"L'operaia non fa figli. Ma l'alveare è pieno di parenti strette con copie dei suoi geni. Morendo per loro, ==le salva==."},{"tipo":"mito","mito":"«Gene egoista» vuol dire che siamo nati egoisti","realta":"Egoista è il gene, per metafora. Per copiarsi costruisce anche ==corpi generosi==."},{"tipo":"chiusura","azione":"Racconta a qualcuno dell'ape che punge e muore. Poi chiedi: ==chi ci guadagna?=="}]},{"id":"origine-specie-selezione-naturale","categoria":"scienza","titolo":"Che cosa c'entrano i piccioni con l'evoluzione","libro":{"titolo":"L'origine delle specie","autore":"Charles Darwin","anno":1859,"titoloOriginale":"On the Origin of Species"},"scene":[{"tipo":"apertura","testo":"Per spiegare la vita sulla Terra, Darwin comincia dai ==piccioni==."},{"tipo":"esempio","testo":"Li alleva lui stesso. Code a ventaglio, gozzi gonfi: razze diversissime. Tutte discese dal ==piccione selvatico==."},{"tipo":"testo","testo":"Gli allevatori scelgono chi far riprodurre. Piccole differenze, sommate nel tempo, diventano enormi. E in natura ==chi sceglie?=="},{"tipo":"colpo","testo":"Nessuno. E funziona lo stesso."},{"tipo":"elenco","titolo":"La selezione naturale in tre mosse","numerato":true,"voci":["Si nasce ==tutti un po' diversi==","Nas }

// Numeri: spazio sottile per le migliaia, virgola per i decimali.
function formatta(n, decimali = 0) {
  const [int, dec] = Math.abs(n).toFixed(decimali).split('.');
  const gruppi = int.length > 4 ? int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : int;

  if (Number.isInteger(v)) return formatta(v);

}

function htmlParole(testo, { inizio = 0, ms = 44, modo = 'p' } = {}) {
  let car = 0;

      const cx = sx + banda * (i + 0.5);
      const alto = Math.max(base - y(d.v), 0.8);
      corpo += `<rect class="g-barra${d.v === top ? ' g-barra--max' : ''}" style="--d:${350 + i * 260}ms" x="${(cx - larg / 2).toFixed(2)}" y="${(base - alto).toFixed(2)}" width="${larg.toFixed(2)}" height="${alto.toFixed(2)}" rx="0.8"/>`;
      corpo += `<text class="g-val" style="--d:${800 + i * 260}ms;font-size:${cVal}px" x="${cx.toFixed(2)}" y="${(base - alto - 3).toFixed(2)}" text-anchor="middle">${esc(valore(d.v))}</text>`;
      corpo += `<text class="g-asse" style="font-size:${cAsse}px" x="${cx.toFixed(2)}" y="${base + 7.5}" text-anchor="middle">${esc(tipografia(d.e))}</text>`;
    });
  } else {
    const x = (i) => sx + (i * (dx - sx)) / (n - 1);
    const punti = dati.map((d, i) => `${x(i).toFixed(2)} ${y(d.v).toFixed(2)}`);
    corpo += `<path class="g-area" d="M${punti.join(' L')} L${dx} ${base} L${sx} ${base} Z"/>`;
    corpo += `<path class="g-linea" pathLength="1" d="M${punti.join(' L')}"/>`;
    dati.forEach((d, i) => {
      const ancora = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      const mostra = n <= 4 || i === 0 || i === n - 1 || (n % 2 === 1 && i === (n - 1) / 2);
      corpo += `<circle class="g-punto${i === n - 1 ? ' g-punto--fine' : ''}" style="--d:${500 + (i / (n - 1)) * 1500}ms" cx="${x(i).toFixed(2)}" cy="${y(d.v).toFixed(2)}" r="${i === n - 1 ? 2.1 : 1.1}"/>`;
      if (mostra) corpo += `<text class="g-asse" x="${x(i).toFixed(2)}" y="${base + 7.5}" text-anchor="${ancora}">${esc(tipografia(d.e))}</text>`;
    });
    const primo = dati[0], ultimo = dati[n - 1];
    if (primo.v !== ultimo.v) corpo += `<text class="g-val" style="--d:500ms" x="${sx}" y="${(y(primo.v) - 4).toFixed(2)}" text-anchor="start">${esc(valore(primo.v))}</text>`;
    corpo += `<text class="g-val g-val--fine" style="--d:2000ms" x="${dx}" y="${(y(ultimo.v) - 5).toFixed(2)}" text-anchor="end">${esc(valore(ultimo.v))}</text>`;
  }
  const descr = dati.map((d) => `${d.e}: ${valore(d.v)}`).join(', ');
  return `<svg viewBox="0 0 100 70" role="img" aria-label="${esc(sc.titolo + '. ' + descr)}">${corpo}</svg>`;
}

// Ritmi delle parole: i ganci arrivano di colpo, i testi si accendono al passo di chi legge.
const SVELTO = 18;
const LETTURA = 44;

function htmlScena(sc, video) {
  const cat = CAT[video.categoria];
  switch (sc.tipo) {
    case 'apertura':
      return `<p class="etichetta entra" style="--d:0ms">${esc(cat.nome)}</p>
        <h2 class="gancio">${htmlParole(sc.testo, { inizio: 60, ms: SVELTO })}</h2>`;
    case 'colpo':
      return `<p class="pugno">${htmlParole(sc.testo, { inizio: 30, ms: SVELTO })}</p>`;
    case 'testo':
      return `${sc.titolo ? `<h3 class="titolo">${htmlParole(sc.titolo, { ms: SVELTO })}</h3>` : ''}
        <p class="paragrafo">${htmlParole(sc.testo, { inizio: sc.titolo ? 420 : 100, ms: LETTURA, modo: 'k' })}</p>`;
    case 'principio':
      return `<p class="etichetta entra" style="--d:0ms">L’idea in una frase</p>
        <p class="massima">${htmlParole(sc.testo, { inizio: 160, ms: 38 })}</p>`;
    case 'elenco': {
      let attesa = 420;
      const voci = sc.voci.map((v, i) => {
        const li = `<li class="entra" style="--d:${attesa}ms"><span class="segno">${sc.numerato ? String(i + 1) : ''}</span><span>${htmlTesto(v)}</span></li>`;
        attesa += 380 + lunghezza(v) * 34;
        return li;
      }).join('');
      return `<h3 class="titolo">${htmlParole(sc.titolo, { ms: SVELTO })}</h3>
        <ol class="voci${sc.numerato ? ' voci--numerate' : ''}">${voci}</ol>`;
    }
    case 'numero':
      return `<p class="cifra entra" style="--d:0ms">${sc.prefisso ? `<span class="cifra-lato">${esc(sc.prefisso)}</span>` : ''}<span class="cifra-val" data-v="${sc.valore}" data-dec="${sc.decimali || 0}">${formatta(sc.valore, sc.decimali || 0)}</span>${sc.suffisso ? `<span class="cifra-lato">${esc(sc.suffisso)}</span>` : ''}</p>
        <p class="paragrafo">${htmlParole(sc.didascalia, { inizio: 850, ms: LETTURA, modo: 'k' })}</p>
        ${sc.nota ? `<p class="nota entra" style="--d:1500ms">${esc(tipografia(sc.nota))}</p>` : ''}`;
    case 'confronto': {
      const lato = (x, quale, ms) => `<div class="lato lato--${quale} entra" style="--d:${ms}ms">
          <p class="etichetta">${esc(tipografia(x.etichetta))}</p>
          <ul>${x.voci.map((v) => `<li>${htmlTesto(v)}</li>`).join('')}</ul>
        </div>`;
      const primo = sc.titolo ? 300 : 80;
      const dopo = primo + 750 + somma(sc.a.voci) * 26;
      return `${sc.titolo ? `<h3 class="titolo">${htmlParole(sc.titolo, { ms: SVELTO })}</h3>` : ''}
        <div class="lati">${lato(sc.a, 'a', primo)}${lato(sc.b, 'b', dopo)}</div>`;
    }
    case 'grafico':
      return `<h3 class="titolo titolo--piccolo">${htmlParole(sc.titolo, { ms: SVELTO })}</h3>
        <div class="grafico entra" style="--d:200ms">${svgGrafico(sc)}</div>
        ${sc.nota ? `<p class="nota entra" style="--d:2100ms">${esc(tipografia(sc.nota))}</p>` : ''}`;
    case 'esempio':
      return `<div class="scheda entra" style="--d:0ms">
          <p class="etichetta">Esempio</p>
          <p class="paragrafo">${htmlParole(sc.testo, { inizio: 260, ms: LETTURA, modo: 'k' })}</p>
        </div>`;
    case 'quiz':
      return `<p class="etichetta entra" style="--d:0ms">Tocca la risposta</p>
        <h3 class="domanda">${htmlParole(sc.domanda, { inizio: 80, ms: 22 })}</h3>
        <div class="opzioni">${sc.opzioni.map((o, i) => `<button type="button" class="opzione entra" style="--d:${520 + i * 160}ms" data-i="${i}"><span class="lettera">${'ABC'[i]}</span><span>${esc(tipografia(o))}</span></button>`).join('')}</div>
        <p class="spiegazione">${esc(tipografia(sc.spiegazione))}</p>`;
    case 'mito':
      return `<div class="mito-detto entra" style="--d:0ms">
          <p class="etichetta">Si dice</p>
          <p class="mito-frase">${esc(tipografia(sc.mito))}</p>
          <span class="timbro" aria-hidden="true">Falso</span>
        </div>
        <div class="mito-vero">
          <p class="etichetta">Secondo il libro</p>
          <p class="mito-realta">${htmlTesto(sc.realta)}</p>
        </div>`;
    case 'chiusura': {
      const l = video.libro;
      return `<p class="etichetta entra" style="--d:0ms">Da provare oggi</p>
        <p class="azione">${htmlParole(sc.azione, { inizio: 120, ms: 26 })}</p>
        <div class="colofone entra" style="--d:${Math.round(500 + lunghezza(sc.azione) * 26)}ms">
          <p class="colofone-da">Dal libro</p>
          <p class="colofone-libro">${esc(tipografia(l.titolo))}</p>
          <p class="colofone-autore">${esc(l.autore)} · ${annoLeggibile(l.anno)}</p>
        </div>`;
    }
    default: return '';
  }
}

function creaScena(sc, video, i) {
  const s = crea('div', `scena scena--${sc.tipo}`, `<div class="corpo">${htmlScena(sc, video)}</div>`);
  s.dataset.i = i;
  return s;
}

// Tre forme geometriche per video: restano le stesse e a ogni scena scivolano in una nuova posizione.
const FORME = ['cerchio', 'anello', 'righe', 'punti', 'mezzo', 'quadro'];
const ZONE = [[88, 14], [104, 48], [2, 86], [-4, 22], [96, 92], [40, 104], [60, -4]];

function formeVideo(video) {
  const rnd = casuale(seme(video.id));
  return mescola(FORME, rnd).slice(0, 3);
}
function disposizione(video, indice) {
  const rnd = casuale(seme(video.id + '#' + indice));
  return mescola(ZONE, rnd).slice(0, 3).map(([x, y]) => {
    const px = x + (rnd() - 0.5) * 14;
    const py = y + (rnd() - 0.5) * 10;
    const scala = 0.7 + rnd() * 0.75;
    const giro = Math.round((rnd() - 0.5) * 8) * 15;
    return `translate(${px.toFixed(1)}cqw, ${py.toFixed(1)}cqh) rotate(${giro}deg) scale(${scala.toFixed(2)})`;
  });
}

// Riduce il testo finché la scena entra nello spazio disponibile.
const SCRITTE_GRANDI = '.pugno, .cifra, .gancio, .titolo, .domanda, .massima, .azione';
function adatta(scena) {
  const corpo = scena.firstElementChild;
  if (!corpo) return;
  // In larghezza: una parola lunga o una cifra larga non devono uscire dallo schermo.
  for (const el of corpo.querySelectorAll(SCRITTE_GRANDI)) {
    el.style.removeProperty('--z');
    if (el.scrollWidth > el.clientWidth + 1) el.style.setProperty('--z', Math.max(0.5, (el.clientWidth / el.scrollWidth) * 0.97).toFixed(3));
  }
  // In altezza: si rimpicciolisce tutto il testo della scena finché entra.
  const stile = getComputedStyle(scena);
  const spazio = scena.clientHeight - parseFloat(stile.paddingTop) - parseFloat(stile.paddingBottom);
  if (spazio <= 0) return;
  let s = 1;
  scena.style.setProperty('--s', 1);
  for (let giro = 0; giro < 7; giro++) {
    const alto = corpo.scrollHeight;
    if (alto <= spazio + 1) break;
    s = Math.max(0.55, s * Math.max(0.8, Math.min(0.96, spazio / alto)));
    scena.style.setProperty('--s', s.toFixed(3));
    if (s <= 0.55) break;
  }
}

// ---- 03-suono.js
// Suoni generati dal browser (Web Audio): effetti sui tagli e una base ritmica diversa per ogni video.
// Niente file audio: tutto è sintetizzato. Parte solo dopo un tocco, come vuole il browser.

const suono = {
  ctx: null,
  uscita: null,
  vuole: memoria.suono !== false,
  pronto: false,

  attivo() { return this.vuole && this.pronto && this.ctx?.state === 'running'; },

  // Da chiamare dentro un tocco o un clic.
  sblocca() {
    if (!this.vuole) return false;
    try {
      const Classe = window.AudioContext || window.webkitAudioContext;
      if (!Classe) return false;
      if (!this.ctx) {
        this.ctx = new Classe();
        const freno = this.ctx.createDynamicsCompressor();
        freno.threshold.value = -16; freno.knee.value = 18; freno.ratio.value = 5; freno.attack.value = 0.004; freno.release.value = 0.18;
        this.uscita = this.ctx.createGain();
        this.uscita.gain.value = 0.65;
        this.uscita.connect(freno).connect(this.ctx.destination);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
      this.pronto = true;
    } catch (e) { this.pronto = false; }
    return this.pronto;
  },

  _tono({ f = 440, a = 0, tipo = 'sine', dur = 0.12, vol = 0.2, tra = 0, attacco = 0.004, dove = null }) {
    if (!this.attivo()) return;
    const t = this.ctx.currentTime + tra;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(f, t);
    if (a) o.frequency.exponentialRampToValueAtTime(a, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attacco);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dove || this.uscita);
    o.start(t);
    o.stop(t + dur + 0.03);
  },

  _rumore({ dur = 0.1, vol = 0.1, tipo = 'bandpass', f = 2000, a = 0, q = 1, tra = 0 }) {
    if (!this.attivo()) return;
    const t = this.ctx.currentTime + tra;
    if (!this._bianco) {
      const n = Math.floor(this.ctx.sampleRate * 0.6);
      this._bianco = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this._bianco.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = this.ctx.createBufferSource();
    s.buffer = this._bianco;
    const filtro = this.ctx.createBiquadFilter();
    filtro.type = tipo;
    filtro.Q.value = q;
    filtro.frequency.setValueAtTime(f, t);
    if (a) filtro.frequency.exponentialRampToValueAtTime(a, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(filtro).connect(g).connect(this.uscita);
    s.start(t, Math.random() * 0.4);
    s.stop(t + dur + 0.03);
  },

  taglio() { this._rumore({ dur: 0.11, vol: 0.07, f: 700, a: 3600, q: 0.8 }); },
  colpo() {
    this._tono({ f: 150, a: 44, dur: 0.22, vol: 0.5 });
    this._rumore({ dur: 0.06, vol: 0.12, tipo: 'lowpass', f: 1800 });
  },
  pop() { this._tono({ f: 560, a: 900, dur: 0.07, vol: 0.12, tipo: 'triangle' }); },
  tocco() { this._tono({ f: 420, a: 520, dur: 0.05, vol: 0.1, tipo: 'triangle' }); },
  cuore() {
    this._tono({ f: 620, a: 930, dur: 0.1, vol: 0.14, tipo: 'triangle' });
    this._tono({ f: 930, a: 1240, dur: 0.12, vol: 0.1, tipo: 'triangle', tra: 0.08 });
  },
  giusto() {
    this._tono({ f: 784, dur: 0.12, vol: 0.2, tipo: 'triangle' });
    this._tono({ f: 1175, dur: 0.26, vol: 0.2, tipo: 'triangle', tra: 0.1 });
  },
  sbagliato() {
    this._tono({ f: 196, a: 150, dur: 0.24, vol: 0.14, tipo: 'triangle' });
    this._tono({ f: 185, a: 139, dur: 0.24, vol: 0.1, tipo: 'sine', tra: 0.02 });
  },
  timbro() {
    this._tono({ f: 110, a: 50, dur: 0.16, vol: 0.5 });
    this._rumore({ dur: 0.09, vol: 0.16, tipo: 'lowpass', f: 2400 });
  },
  fine() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this._tono({ f, dur: 0.2, vol: 0.16, tipo: 'triangle', tra: i * 0.075 })); },
  festa() {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => this._tono({ f, dur: 0.26, vol: 0.16, tipo: 'triangle', tra: i * 0.085 }));
    [523.25, 783.99, 1046.5].forEach((f) => this._tono({ f, dur: 0.7, vol: 0.09, tipo: 'sine', tra: 0.46 }));
  },
};

// Base ritmica: cassa, rullante, charleston, basso e qualche nota, scelti a partire dal video.
const base = {
  timer: 0,
  id: null,
  parti(idVideo) {
    this.ferma();
    if (!suono.attivo()) return;
    const rnd = casuale(seme(idVideo + '/base'));
    const scegli = (lista) => lista[Math.floor(rnd() * lista.length)];
    const bpm = scegli([84, 88, 92, 96, 100]);
    this.passo = 60 / bpm / 4;
    this.radice = scegli([98, 110, 123.47, 130.81, 146.83]);
    this.cassa = scegli([[0, 8, 10], [0, 6, 8], [0, 3, 8, 11], [0, 7, 8, 14]]);
    this.bassi = scegli([[0, 0, 7, 5], [0, 3, 5, 3], [0, 5, 7, 5], [0, 0, 3, 5]]);
    const scala = [0, 3, 5, 7, 10, 12, 15];
    // melodia: 32 sedicesimi, poche note, sempre le stesse per questo video
    this.melodia = Array.from({ length: 32 }, (_, i) => (i % 2 === 0 && rnd() < 0.3 ? scegli(scala) : null));
    this.n = 0;
    this.prossimo = suono.ctx.currentTime + 0.08;
    this.id = idVideo;
    this.timer = setInterval(() => this._programma(), 50);
    this._programma();
  },
  ferma() {
    clearInterval(this.timer);
    this.timer = 0;
    this.id = null;
  },
  _programma() {
    if (!suono.attivo()) return this.ferma();
    const ora = suono.ctx.currentTime;
    if (this.prossimo < ora - 0.3) this.prossimo = ora + 0.05; // scheda rimasta in pausa: riparti da qui
    while (this.prossimo < ora + 0.16) {
      this._suona(this.n % 32, this.prossimo - ora);
      this.prossimo += this.passo;
      this.n++;
    }
  },
  _suona(i, tra) {
    const s = i % 16;
    const semitoni = (n) => this.radice * Math.pow(2, n / 12);
    if (this.cassa.includes(s)) suono._tono({ f: 118, a: 42, dur: 0.2, vol: 0.34, tra });
    if (s === 4 || s === 12) {
      suono._rumore({ dur: 0.11, vol: 0.085, f: 1700, q: 0.7, tra });
      suono._tono({ f: 190, a: 120, dur: 0.08, vol: 0.06, tipo: 'triangle', tra });
    }
    if (s % 2 === 0) suono._rumore({ dur: 0.035, vol: s % 4 === 2 ? 0.03 : 0.018, tipo: 'highpass', f: 7000, tra });
    if (s === 0 || s === 8) {
      const nota = this.bassi[Math.floor(i / 8) % 4];
      suono._tono({ f: semitoni(nota), dur: this.passo * 6, vol: 0.17, tipo: 'triangle', attacco: 0.01, tra });
    }
    const m = this.melodia[i];
    if (m !== null) suono._tono({ f: semitoni(m + 24), dur: 0.32, vol: 0.05, tipo: 'sine', attacco: 0.006, tra });
  },
};

// ---- 04-riproduttore.js
// Voce del dispositivo (facoltativa) e riproduttore che fa scorrere le scene di un video.

const voce = {
  ok: typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined',
  attiva: false,
  _scelta: null,
  _corrente: null,
  _finita: true,
  _scegli() {
    const italiane = speechSynthesis.getVoices().filter((v) => /^it([-_]|$)/i.test(v.lang));
    const punti = (v) => (/natural|premium|enhanced|neural|siri/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/it[-_]IT/i.test(v.lang) ? 1 : 0);
    this._scelta = italiane.sort((a, b) => punti(b) - punti(a))[0] || null;
  },
  // Vero se il dispositivo ha caricato le voci ma nessuna è italiana.
  senzaItaliano() {
    if (!this.ok) return true;
    const tutte = speechSynthesis.getVoices();
    return tutte.length > 0 && !tutte.some((v) => /^it([-_]|$)/i.test(v.lang));
  },
  di(testo) {
    if (!this.ok || !this.attiva || !testo) return;
    try {
      speechSynthesis.cancel();
      if (!this._scelta) this._scegli();
      const u = new SpeechSynthesisUtterance(testo);
      u.lang = 'it-IT';
      if (this._scelta) u.voice = this._scelta;
      u.rate = 1.08;
      this._corrente = u;
      this._finita = false;
      let partita = false;
      u.onstart = () => { partita = true; };
      u.onend = u.onerror = () => { if (this._corrente === u) this._finita = true; };
      speechSynthesis.speak(u);
      // Se dopo due secondi non ha iniziato a parlare, il video non resta ad aspettarla.
      setTimeout(() => { if (!partita && this._corrente === u) this._finita = true; }, 2000);
    } catch (e) { this._finita = true; }
  },
  staParlando() { return this.ok && this.attiva && !this._finita; },
  zitta() {
    this._corrente = null;
    this._finita = true;
    if (this.ok) { try { speechSynthesis.cancel(); } catch (e) { /* niente */ } }
  },
  ferma(si) {
    if (!this.ok || !this.attiva) return;
    try { si ? speechSynthesis.pause() : speechSynthesis.resume(); } catch (e) { /* niente */ }
  },
};

class Riproduttore {
  constructor(clip, video, alTermine) {
    this.clip = clip;
    this.video = video;
    this.alTermine = alTermine;
    this.palco = $('.palco', clip);
    this.scatola = $('.scene', clip);
    this.barra = $('.avanzamento', clip);
    this.forme = $$('.f', clip);
    this.passo = this.passo.bind(this);
  }

  monta() {
    const scene = this.video.scene;
    this.durate = scene.map(durataScena);
    this.nodi = [$('.scena', this.scatola)];
    for (let i = 1; i < scene.length; i++) {
      const nodo = creaScena(scene[i], this.video, i);
      this.scatola.append(nodo);
      this.nodi.push(nodo);
    }
    this.riadatta();
    this.barra.innerHTML = this.durate.map((d) => `<i style="flex-grow:${Math.round(d / 100)}"><b></b></i>`).join('');
    this.segmenti = $$('b', this.barra);
    this.i = -1;
    this.t = 0;
    this.primoGiro = true;
    this.finito = false;
    this.inPausa = false;
    this.attivo = true;
    this.palco.classList.remove('in-pausa');
    this.vai(0);
    base.parti(this.video.id);
    this.ultimo = performance.now();
    this.raf = requestAnimationFrame(this.passo);
  }

  smonta() {
    this.attivo = false;
    cancelAnimationFrame(this.raf);
    voce.zitta();
    base.ferma();
    this.nodi.slice(1).forEach((n) => n.remove());
    const primo = this.nodi[0];
    primo.classList.remove('on');
    primo.classList.add('fermo');
    disposizione(this.video, 0).forEach((tr, k) => { this.forme[k].style.transform = tr; });
    this.barra.innerHTML = '';
    this.palco.classList.remove('in-pausa', 'su-accento', 'alla-fine', 'scossa');
  }

  riadatta() { this.nodi.forEach(adatta); }

  passo(ora) {
    if (!this.attivo) return;
    const dt = Math.min(ora - this.ultimo, 100);
    this.ultimo = ora;
    if (!this.inPausa) { this.t += dt; this.aggiorna(); }
    this.raf = requestAnimationFrame(this.passo);
  }

  aggiorna() {
    const sc = this.video.scene[this.i];
    const d = this.durate[this.i];
    const nodo = this.nodi[this.i];
    if (sc.tipo === 'quiz' && !this.rivelato && this.t >= this.quiz.domanda) this.rivela(null);
    if (this.mito) {
      if (!this.timbrato && this.t >= this.mito.mito * 0.58) {
        this.timbrato = true;
        nodo.classList.add('timbrata');
        suono.timbro();
        vibra(18);
      }
      if (!this.svelato && this.t >= this.mito.mito) {
        this.svelato = true;
        nodo.classList.add('svelata');
        suono.pop();
        voce.di(`Falso. ${senzaSegni(sc.realta)}`);
      }
    }
    if (this.contatore) {
      const p = Math.max(0, Math.min(1, (this.t - 200) / 1100));
      const morbido = 1 - Math.pow(1 - p, 3);
      this.contatore.textContent = formatta(sc.valore * morbido, sc.decimali || 0);
      if (p >= 1) { this.contatore = null; suono.pop(); }
    }
    this.segmenti[this.i].style.transform = `scaleX(${Math.min(1, this.t / d)})`;
    if (this.ultima && !this.annunciata && this.t >= Math.min(d * 0.5, 2600)) {
      this.annunciata = true;
      this.palco.classList.add('alla-fine');
    }
    if (this.t >= d) {
      if (voce.staParlando() && this.t < d + 9000) return; // aspetta che la voce finisca la frase
      this.vai(this.i + 1);
    }
  }

  vai(i) {
    if (i >= this.nodi.length) {
      if (!this.finito) { this.finito = true; this.alTermine?.(this.video, this.palco); }
      i = 0;
      this.primoGiro = false;
    }
    if (i < 0) i = 0;
    const prima = this.nodi[this.i];
    const nodo = this.nodi[i];
    const inizio = i === 0 && this.primoGiro;
    if (prima && prima !== nodo) prima.classList.remove('on', 'fermo'); // taglio netto, niente dissolvenza
    this.i = i;
    this.t = 0;
    const sc = this.video.scene[i];

    nodo.classList.remove('on', 'rivelata', 'timbrata', 'svelata');
    $$('.opzione', nodo).forEach((o) => { o.classList.remove('giusta', 'sbagliata'); o.disabled = false; });
    nodo.style.setProperty('--dur', `${this.durate[i]}ms`);
    void nodo.offsetWidth; // fa ripartire le animazioni
    nodo.classList.toggle('fermo', inizio);
    nodo.classList.add('on');

    this.rivelato = false;
    this.quiz = sc.tipo === 'quiz' ? durataQuiz(sc) : null;
    this.mito = sc.tipo === 'mito' ? durataMito(sc) : null;
    this.timbrato = false;
    this.svelato = false;
    this.ultima = i === this.nodi.length - 1;
    this.annunciata = false;
    this.contatore = sc.tipo === 'numero' ? $('.cifra-val', nodo) : null;
    if (this.contatore) this.contatore.textContent = formatta(0, sc.decimali || 0);

    this.palco.classList.toggle('su-accento', sc.tipo === 'colpo');
    this.palco.classList.remove('alla-fine', 'scossa');
    if (sc.tipo === 'colpo') {
      void this.palco.offsetWidth;
      this.palco.classList.add('scossa');
      suono.colpo();
      vibra(10);
    } else if (!inizio) {
      suono.taglio();
    }

    this.segmenti.forEach((s, k) => { s.style.transform = `scaleX(${k < i ? 1 : 0})`; });
    disposizione(this.video, i).forEach((tr, k) => { this.forme[k].style.transform = tr; });
    voce.di(testoVoce(sc));
  }

  // scelta: indice toccato, oppure null se il tempo è scaduto e la risposta si svela da sola
  rivela(scelta) {
    const sc = this.video.scene[this.i];
    if (sc.tipo !== 'quiz' || this.rivelato) return;
    this.rivelato = true;
    const nodo = this.nodi[this.i];
    $$('.opzione', nodo).forEach((o, k) => {
      o.disabled = true;
      if (k === sc.corretta) o.classList.add('giusta');
      else if (k === scelta) o.classList.add('sbagliata');
    });
    nodo.classList.add('rivelata');
    this.t = this.quiz.domanda;
    if (scelta === null) suono.pop();
    else premiaQuiz(this.video, scelta === sc.corretta, this.palco);
    voce.di(`${senzaSegni(sc.opzioni[sc.corretta])}. ${sc.spiegazione}`);
  }

  pausa(si = !this.inPausa) {
    this.inPausa = si;
    this.palco.classList.toggle('in-pausa', si);
    voce.ferma(si);
    if (si) base.ferma(); else base.parti(this.video.id);
  }

  salta(passi) {
    this.vai(Math.max(0, Math.min(this.nodi.length - 1, this.i + passi)));
  }
}

// ---- 05-premi.js
// Punti, livelli, obiettivo del giorno e piccole feste: la ricompensa per chi arriva in fondo e risponde.

const OBIETTIVO = 5;        // idee al giorno
const PUNTI_VIDEO = 10;
const PUNTI_QUIZ = 5;
const SERIE_PREMIATE = [3, 5, 10, 20, 30, 50];
const NOMI_LIVELLO = ['Curioso', 'Sveglio', 'Lettore', 'Brillante', 'Acuto', 'Sapiente', 'Erudito', 'Maestro', 'Saggio', 'Colto'];

// Punti che servono per arrivare al livello n: ogni livello costa 20 punti più del precedente.
const sogliaLivello = (n) => 40 * (n - 1) + 10 * (n - 1) * n;
function livelloDi(punti) {
  let n = 1;
  while (sogliaLivello(n + 1) <= punti) n++;
  const oltre = n - NOMI_LIVELLO.length;
  const nome = oltre > 0 ? `Colto ${'I'.repeat(Math.min(oltre + 1, 3))}${oltre > 2 ? '+' : ''}` : NOMI_LIVELLO[n - 1];
  return { n, nome, da: sogliaLivello(n), a: sogliaLivello(n + 1) };
}

function coriandoli(palco, quanti = 26, x = 50, y = 46) {
  if (!palco || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const nido = crea('div', 'coriandoli');
  nido.style.left = `${x}%`;
  nido.style.top = `${y}%`;
  for (let i = 0; i < quanti; i++) {
    const c = document.createElement('i');
    const angolo = Math.random() * Math.PI * 2;
    const forza = 18 + Math.random() * 34;
    c.style.setProperty('--dx', `${(Math.cos(angolo) * forza).toFixed(1)}cqw`);
    c.style.setProperty('--dy', `${(Math.sin(angolo) * forza - 14).toFixed(1)}cqw`);
    c.style.setProperty('--giro', `${Math.round(Math.random() * 720 - 360)}deg`);
    c.style.setProperty('--tinta', ['var(--acc)', 'var(--ink)', 'var(--su)'][i % 3]);
    c.style.animationDelay = `${Math.round(Math.random() * 90)}ms`;
    if (i % 4 === 0) c.style.borderRadius = '50%';
    nido.append(c);
  }
  palco.append(nido);
  setTimeout(() => nido.remove(), 1500);
}

function puntiVolanti(palco, testo) {
  if (!palco) return;
  const v = crea('div', 'punti-volanti', `${ICONE.lampo}<b>${esc(testo)}</b>`);
  palco.append(v);
  setTimeout(() => v.remove(), 1300);
}

let stendardoTimer = 0;
function stendardo(titolo, sotto) {
  const s = $('#stendardo');
  s.innerHTML = `<span>${esc(sotto)}</span><b>${esc(titolo)}</b>`;
  s.classList.remove('visibile');
  void s.offsetWidth;
  s.classList.add('visibile');
  clearTimeout(stendardoTimer);
  stendardoTimer = setTimeout(() => s.classList.remove('visibile'), 3000);
}

function daiPunti(n, palco) {
  const prima = livelloDi(memoria.punti || 0);
  memoria.punti = (memoria.punti || 0) + n;
  ricorda();
  aggiornaCromo(true);
  puntiVolanti(palco, `+${n}`);
  const dopo = livelloDi(memoria.punti);
  if (dopo.n > prima.n) {
    setTimeout(() => {
      stendardo(`Livello ${dopo.n}: ${dopo.nome}`, 'Sei salito di livello');
      coriandoli(palco, 40);
      suono.festa();
      vibra([20, 40, 30]);
    }, 900);
  }
}

// Un video arrivato in fondo per la prima volta.
function premiaVideo(video, palco) {
  suono.fine();
  vibra(15);
  daiPunti(PUNTI_VIDEO, palco);
  if (vistiOggi() >= OBIETTIVO && memoria.bonus !== oggi()) {
    memoria.bonus = oggi();
    ricorda();
    setTimeout(() => {
      daiPunti(20, palco);
      stendardo('Obiettivo di oggi raggiunto', `${OBIETTIVO} idee nuove · +20 punti`);
      coriandoli(palco, 40);
      suono.festa();
    }, 1100);
  }
}

// Una risposta data toccando (non quando il quiz si svela da solo). I punti valgono solo la prima volta.
function premiaQuiz(video, giusta, palco) {
  if (giusta) { suono.giusto(); vibra(12); coriandoli(palco, 14, 42, 52); } else { suono.sbagliato(); vibra([30, 40, 30]); }
  if (memoria.quiz[video.id] !== undefined) return;
  memoria.quiz[video.id] = giusta ? 1 : 0;
  if (!giusta) { memoria.serie = 0; ricorda(); return; }
  memoria.serie = (memoria.serie || 0) + 1;
  daiPunti(PUNTI_QUIZ, palco);
  if (SERIE_PREMIATE.includes(memoria.serie)) {
    const serie = memoria.serie;
    setTimeout(() => {
      daiPunti(10, palco);
      stendardo(`${serie} risposte giuste di fila`, 'Serie · +10 punti');
    }, 800);
  }
}

// ---- 06-feed.js
// Il feed verticale: una clip per video, quella al centro dello schermo viene riprodotta.

const app = $('#app');
const feed = $('#feed');
const stato = { filtro: { tipo: 'tutti' }, lista: [], attivo: null };
let osservaVicini = null;
let osservaAttivo = null;

function alterna(lista) {
  const resto = lista.slice();
  const esito = [];
  while (resto.length) {
    const ultimo = esito[esito.length - 1];
    let k = ultimo ? resto.findIndex((v) => v.categoria !== ultimo.categoria && v.libro.titolo !== ultimo.libro.titolo) : 0;
    if (k < 0) k = resto.findIndex((v) => v.libro.titolo !== ultimo.libro.titolo);
    if (k < 0) k = 0;
    esito.push(resto.splice(k, 1)[0]);
  }
  return esito;
}

// «Per te»: prima le idee non ancora viste, con un po' più di spazio alle categorie che ti piacciono.
function ordinePerTe() {
  const rnd = casuale((seme(oggi()) ^ Math.floor(Math.random() * 2 ** 31)) >>> 0);
  const gusti = {};
  for (const id of Object.keys(memoria.piaciuti)) {
    const v = PER_ID.get(id);
    if (v) gusti[v.categoria] = (gusti[v.categoria] || 0) + 1;
  }
  const peso = (v) => rnd() - 0.12 * Math.min(gusti[v.categoria] || 0, 3);
  const ordina = (lista) => alterna(lista.map((v) => [peso(v), v]).sort((a, b) => a[0] - b[0]).map((x) => x[1]));
  return [...ordina(VIDEO.filter((v) => !memoria.visti[v.id])), ...ordina(VIDEO.filter((v) => memoria.visti[v.id]))];
}

function listaPerFiltro() {
  const f = stato.filtro;
  if (f.tipo === 'categoria') {
    // dentro una categoria i libri si alternano, e le idee già viste vanno in fondo
    const suoi = alterna(mescola(VIDEO.filter((v) => v.categoria === f.valore), casuale(seme(oggi() + f.valore))));
    return [...suoi.filter((v) => !memoria.visti[v.id]), ...suoi.filter((v) => memoria.visti[v.id])];
  }
  if (f.tipo === 'libro') return VIDEO.filter((v) => v.libro.titolo === f.valore);
  if (f.tipo === 'salvati') {
    return Object.entries(memoria.salvati).sort((a, b) => b[1] - a[1]).map(([id]) => PER_ID.get(id)).filter(Boolean);
  }
  return ordinePerTe();
}

function etichettaFiltro() {
  const f = stato.filtro;
  if (f.tipo === 'categoria') return CAT[f.valore].nome;
  if (f.tipo === 'libro') return f.valore;
  if (f.tipo === 'salvati') return 'Salvati';
  return 'Per te';
}

function coloriClip(nodo, cat) {
  nodo.style.setProperty('--bg', cat.bg);
  nodo.style.setProperty('--ink', cat.ink);
  nodo.style.setProperty('--acc', cat.accento);
  nodo.style.setProperty('--su', cat.suAccento);
}

function creaClip(video) {
  const clip = crea('section', 'clip');
  clip.dataset.id = video.id;
  coloriClip(clip, CAT[video.categoria]);
  clip.innerHTML = '<div class="palco"></div>';
  return clip;
}

function idrata(clip) {
  if (clip.dataset.pronta) return;
  const video = PER_ID.get(clip.dataset.id);
  if (!video) return;
  clip.dataset.pronta = '1';
  const palco = $('.palco', clip);
  const forme = formeVideo(video);
  const posa = disposizione(video, 0);
  const l = video.libro;
  const bottone = (classe, icona, nome, premuto) =>
    `<button type="button" class="az az--${classe}" ${premuto === undefined ? '' : `aria-pressed="${premuto}"`} aria-label="${nome}">${icona}<span>${nome}</span></button>`;
  palco.innerHTML = `
    <div class="forme" aria-hidden="true">${forme.map((f, k) => `<i class="f f--${f}" style="transform:${posa[k]}"></i>`).join('')}</div>
    <div class="scene"></div>
    <div class="pausa" aria-hidden="true">${ICONE.play}</div>
    <div class="piede">
      <button type="button" class="prossima" data-fa="prossima" hidden><span>Prossima idea</span><b></b>${ICONE.su}</button>
      <div class="didascalia">
        <p class="did-titolo">${esc(tipografia(video.titolo))}</p>
        <p class="did-libro"><i>${esc(tipografia(l.titolo))}</i> · ${esc(l.autore)}</p>
      </div>
      <div class="avanzamento" aria-hidden="true"></div>
    </div>
    <div class="azioni">
      ${bottone('piace', ICONE.cuore, 'Mi piace', !!memoria.piaciuti[video.id])}
      ${bottone('salva', ICONE.segnalibro, 'Salva', !!memoria.salvati[video.id])}
      ${bottone('condividi', ICONE.condividi, 'Invia')}
      ${bottone('suono', suono.vuole && suono.pronto ? ICONE.suono : ICONE.muto, 'Suono', suono.vuole && suono.pronto)}
      ${voce.ok ? bottone('voce', ICONE.voce, 'Voce', voce.attiva) : ''}
    </div>`;
  const primo = creaScena(video.scene[0], video, 0);
  primo.classList.add('fermo');
  $('.scene', palco).append(primo);
  adatta(primo);
}

function creaClipFinale() {
  const clip = crea('section', 'clip clip--fine');
  const f = stato.filtro;
  const vuoto = !stato.lista.length;
  let titolo = 'Per ora è tutto.';
  let testo = 'Hai scorso tutte le idee di questa raccolta. Le ritrovi quando vuoi, oppure cambia argomento.';
  if (vuoto && f.tipo === 'salvati') {
    titolo = 'Ancora nessuna idea salvata.';
    testo = 'Tocca il segnalibro accanto a un video per ritrovarlo qui.';
  }
  clip.innerHTML = `<div class="palco"><div class="fine">
      <p class="etichetta">${esc(etichettaFiltro())}</p>
      <h2 class="titolo">${titolo}</h2>
      <p class="paragrafo">${testo}</p>
      <div class="fine-azioni">
        ${vuoto ? '' : '<button type="button" class="tasto" data-fa="inizio">Torna all’inizio</button>'}
        ${f.tipo === 'tutti' ? '' : '<button type="button" class="tasto" data-fa="per-te">Vai a Per te</button>'}
        <button type="button" class="tasto tasto--pieno" data-fa="esplora">Esplora i libri</button>
      </div>
    </div></div>`;
  return clip;
}

function costruisciFeed(idIniziale) {
  disattiva();
  osservaVicini?.disconnect();
  osservaAttivo?.disconnect();
  let lista = listaPerFiltro();
  if (idIniziale && PER_ID.has(idIniziale)) {
    const scelto = PER_ID.get(idIniziale);
    lista = [scelto, ...lista.filter((v) => v !== scelto)];
  }
  stato.lista = lista;
  feed.innerHTML = '';
  const pezzi = document.createDocumentFragment();
  lista.forEach((v) => pezzi.append(creaClip(v)));
  pezzi.append(creaClipFinale());
  feed.append(pezzi);
  feed.scrollTop = 0;

  osservaVicini = new IntersectionObserver((voci) => {
    voci.forEach((v) => { if (v.isIntersecting) idrata(v.target); });
  }, { root: feed, rootMargin: '160% 0px' });
  osservaAttivo = new IntersectionObserver((voci) => {
    voci.forEach((v) => { if (v.isIntersecting && v.intersectionRatio >= 0.6) attiva(v.target); });
  }, { root: feed, threshold: [0.6] });
  $$('.clip', feed).forEach((c) => { osservaVicini.observe(c); osservaAttivo.observe(c); });

  $('#filtro-nome').textContent = etichettaFiltro();
  const prima = feed.firstElementChild;
  idrata(prima);
  attiva(prima);
}

function disattiva() {
  const a = stato.attivo;
  if (!a) return;
  a.riproduttore?.smonta();
  a.clip.classList.remove('clip--attiva');
  stato.attivo = null;
}

function attiva(clip) {
  if (stato.attivo?.clip === clip) return;
  disattiva();
  const video = PER_ID.get(clip.dataset.id);
  clip.classList.add('clip--attiva');
  const cat = video ? CAT[video.categoria] : null;
  if (cat) coloriClip(app, cat);
  else ['--bg', '--ink', '--acc', '--su'].forEach((p) => app.style.removeProperty(p));
  stato.attivo = { clip, video, riproduttore: null };
  if (!video) return;
  idrata(clip);
  // l'anteprima della prossima idea compare sull'ultima scena: è il motivo per scorrere ancora
  const dopo = PER_ID.get(clip.nextElementSibling?.dataset.id);
  const anteprima = $('.prossima', clip);
  anteprima.hidden = !dopo;
  if (dopo) $('b', anteprima).textContent = tipografia(dopo.titolo);
  const r = new Riproduttore(clip, video, (v, palco) => {
    if (segnaVisto(v.id)) premiaVideo(v, palco);
    aggiornaCromo();
  });
  stato.attivo.riproduttore = r;
  r.monta();
  if (pannelloAperto()) r.pausa(true);
  try { history.replaceState(null, '', '#' + video.id); } catch (e) { /* niente */ }
}

function vaiAClip(passi) {
  const clip = stato.attivo?.clip;
  const meta = passi > 0 ? clip?.nextElementSibling : clip?.previousElementSibling;
  if (meta) meta.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function aggiornaCromo(scatto) {
  const gettone = $('#apri-percorso');
  const fatti = Math.min(vistiOggi(), OBIETTIVO);
  $('#punti').textContent = formatta(memoria.punti || 0);
  $('#meta-giorno').style.width = `${(fatti / OBIETTIVO) * 100}%`;
  gettone.setAttribute('aria-label', `Il tuo percorso: ${memoria.punti || 0} punti, ${fatti} idee su ${OBIETTIVO} oggi`);
  if (scatto) { gettone.classList.remove('scatto'); void gettone.offsetWidth; gettone.classList.add('scatto'); }
}

// Il suono è «acceso» solo se lo si vuole e il browser l'ha sbloccato con un tocco.
function aggiornaAudio() {
  const acceso = suono.vuole && suono.pronto;
  $$('.az--voce', feed).forEach((b) => b.setAttribute('aria-pressed', voce.attiva));
  $$('.az--suono', feed).forEach((b) => {
    b.setAttribute('aria-pressed', acceso);
    b.firstElementChild.outerHTML = acceso ? ICONE.suono : ICONE.muto;
  });
  $('#invito-suono').hidden = !(suono.vuole && !suono.pronto);
}

function ripartiBase() {
  const r = stato.attivo?.riproduttore;
  if (r && !r.inPausa && !pannelloAperto()) base.parti(r.video.id);
}

let avvisoTimer = 0;
function avviso(testo, durata = 2600) {
  const a = $('#avviso');
  a.textContent = testo;
  a.classList.add('visibile');
  clearTimeout(avvisoTimer);
  avvisoTimer = setTimeout(() => a.classList.remove('visibile'), durata);
}

function alternaSegno(video, quale, forza) {
  const registro = memoria[quale];
  const nuovo = forza ?? !registro[video.id];
  if (nuovo) registro[video.id] = Date.now(); else delete registro[video.id];
  ricorda();
  const classe = quale === 'piaciuti' ? 'piace' : 'salva';
  $$(`.clip[data-id="${video.id}"] .az--${classe}`, feed).forEach((b) => {
    b.setAttribute('aria-pressed', nuovo);
    if (nuovo) { b.classList.remove('scatto'); void b.offsetWidth; b.classList.add('scatto'); }
  });
  return nuovo;
}

async function condividi(video) {
  const testo = `«${video.titolo}»: un’idea da ${video.libro.titolo} di ${video.libro.autore}.`;
  const inCornice = window.self !== window.top;
  const url = !inCornice && /^https?:$/.test(location.protocol) ? `${location.origin}${location.pathname}#${video.id}` : '';
  if (!inCornice && navigator.share) {
    try { await navigator.share({ title: 'Colto', text: testo, ...(url ? { url } : {}) }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(url ? `${testo}\n${url}` : testo);
    avviso('Copiato: incollalo dove vuoi');
  } catch (e) {
    avviso(testo, 7000);
  }
}

function cuoreVolante(palco, x, y) {
  const c = crea('div', 'cuore-volante', ICONE.cuore);
  const r = palco.getBoundingClientRect();
  c.style.left = `${x - r.left}px`;
  c.style.top = `${y - r.top}px`;
  palco.append(c);
  setTimeout(() => c.remove(), 900);
}

let tocco = { t: 0, timer: 0 };
feed.addEventListener('click', (ev) => {
  const clip = ev.target.closest('.clip');
  if (!clip) return;
  const fa = ev.target.closest('[data-fa]')?.dataset.fa;
  if (fa === 'inizio') return feed.scrollTo({ top: 0, behavior: 'smooth' });
  if (fa === 'per-te') return impostaFiltro({ tipo: 'tutti' });
  if (fa === 'esplora') return apriPannello('esplora');
  if (fa === 'prossima') return vaiAClip(1);

  const video = PER_ID.get(clip.dataset.id);
  if (!video) return;
  const az = ev.target.closest('.az');
  if (az) {
    if (az.classList.contains('az--piace')) { if (alternaSegno(video, 'piaciuti')) { suono.cuore(); vibra(12); } }
    else if (az.classList.contains('az--salva')) { suono.tocco(); avviso(alternaSegno(video, 'salvati') ? 'Salvato: lo trovi in Esplora › Salvati' : 'Tolto dai salvati'); }
    else if (az.classList.contains('az--condividi')) condividi(video);
    else if (az.classList.contains('az--suono')) {
      // se questo stesso tocco ha appena sbloccato il suono, resta acceso
      if (!suono.appena) {
        suono.vuole = !suono.vuole;
        memoria.suono = suono.vuole;
        ricorda();
        if (suono.vuole) { suono.sblocca(); ripartiBase(); suono.pop(); } else base.ferma();
        aggiornaAudio();
        avviso(suono.vuole ? 'Suono acceso' : 'Suono spento', 1400);
      }
    } else if (az.classList.contains('az--voce')) {
      if (!voce.attiva && voce.senzaItaliano()) return avviso('Su questo dispositivo non c’è una voce italiana.', 3600);
      voce.attiva = !voce.attiva;
      aggiornaAudio();
      const r = stato.attivo?.riproduttore;
      if (voce.attiva && r) voce.di(testoVoce(r.video.scene[r.i]));
      else voce.zitta();
      avviso(voce.attiva ? 'Voce accesa' : 'Voce spenta', 1400);
    }
    return;
  }
  const attivo = stato.attivo?.clip === clip ? stato.attivo.riproduttore : null;
  const opzione = ev.target.closest('.opzione');
  if (opzione) { attivo?.rivela(Number(opzione.dataset.i)); return; }
  if (ev.target.closest('button, a, input')) return;
  if (suono.appena) return; // il primo tocco accende solo il suono, non mette in pausa

  // Un tocco ferma o riprende, due tocchi vicini mettono «mi piace».
  const ora = performance.now();
  if (ora - tocco.t < 300) {
    clearTimeout(tocco.timer);
    tocco.t = 0;
    alternaSegno(video, 'piaciuti', true);
    cuoreVolante($('.palco', clip), ev.clientX, ev.clientY);
    suono.cuore();
    vibra(12);
  } else {
    tocco.t = ora;
    tocco.timer = setTimeout(() => attivo?.pausa(), 300);
  }
});

function impostaFiltro(filtro, idIniziale) {
  stato.filtro = filtro;
  chiudiPannello();
  costruisciFeed(idIniziale);
}

// ---- 07-pannelli.js
// Pannelli a comparsa: «Esplora» (categorie, libri, ricerca) e «Il tuo percorso».

let pannello = null;
let fermoPrima = false; // il video era già in pausa quando si è aperto il pannello
const pannelloAperto = () => !!pannello;
const corpoPannello = $('#pannello-corpo');

const piatto = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const idee = (n) => (n === 1 ? '1 idea' : `${n} idee`);

const LIBRI = (() => {
  const mappa = new Map();
  for (const v of VIDEO) {
    const k = v.libro.titolo;
    if (!mappa.has(k)) mappa.set(k, { titolo: k, autore: v.libro.autore, cerca: piatto(`${k} ${v.libro.autore} ${v.libro.titoloOriginale || ''}`), n: 0 });
    mappa.get(k).n++;
  }
  return [...mappa.values()].sort((a, b) => a.titolo.localeCompare(b.titolo, 'it'));
})();

function apriPannello(quale) {
  if (!pannello) fermoPrima = !!stato.attivo?.riproduttore?.inPausa;
  pannello = quale;
  app.classList.add('con-pannello');
  stato.attivo?.riproduttore?.pausa(true);
  if (quale === 'esplora') disegnaEsplora(); else disegnaPercorso();
  corpoPannello.scrollTop = 0;
  $('#pannello-chiudi').focus({ preventScroll: true });
}

function chiudiPannello() {
  if (!pannello) return;
  pannello = null;
  app.classList.remove('con-pannello');
  if (!fermoPrima) stato.attivo?.riproduttore?.pausa(false);
  fermoPrima = false;
}

const rigaLibro = (l) => `<li><button type="button" class="libro" data-libro="${esc(l.titolo)}"><b>${esc(tipografia(l.titolo))}</b><span>${esc(l.autore)}</span><em>${idee(l.n)}</em></button></li>`;

function disegnaEsiti(domanda) {
  const q = piatto(domanda.trim());
  const esiti = $('#esiti');
  if (!q) {
    const conta = {};
    VIDEO.forEach((v) => { conta[v.categoria] = (conta[v.categoria] || 0) + 1; });
    const salvati = Object.keys(memoria.salvati).filter((id) => PER_ID.has(id)).length;
    esiti.innerHTML = `
      <div class="raccolte">
        <button type="button" class="raccolta" data-raccolta="tutti"><b>Per te</b><span>${idee(VIDEO.length)}, prima le nuove</span></button>
        <button type="button" class="raccolta" data-raccolta="salvati"><b>Salvati</b><span>${salvati ? idee(salvati) : 'Ancora niente'}</span></button>
      </div>
      <h3 class="sezione">Categorie</h3>
      <div class="categorie">${CATEGORIE.filter((c) => conta[c.id]).map((c) =>
        `<button type="button" class="categoria" data-cat="${c.id}" style="--bg:${c.bg};--ink:${c.ink}"><b>${esc(c.nome)}</b><span>${idee(conta[c.id])}</span></button>`).join('')}</div>
      <h3 class="sezione"><span>Libri</span><span>${LIBRI.length}</span></h3>
      <ul class="libri">${LIBRI.map(rigaLibro).join('')}</ul>`;
    return;
  }
  const libri = LIBRI.filter((l) => l.cerca.includes(q));
  const video = VIDEO.filter((v) => piatto(v.titolo).includes(q)).slice(0, 30);
  if (!libri.length && !video.length) {
    esiti.innerHTML = `<p class="vuoto">Nessun risultato per «${esc(domanda.trim())}». Prova con un autore o con il titolo originale.</p>`;
    return;
  }
  esiti.innerHTML = `
    ${libri.length ? `<h3 class="sezione"><span>Libri</span><span>${libri.length}</span></h3><ul class="libri">${libri.map(rigaLibro).join('')}</ul>` : ''}
    ${video.length ? `<h3 class="sezione"><span>Idee</span><span>${video.length}</span></h3><ul class="libri">${video.map((v) =>
      `<li><button type="button" class="libro" data-video="${v.id}"><b>${esc(tipografia(v.titolo))}</b><span>${esc(v.libro.titolo)} · ${esc(v.libro.autore)}</span></button></li>`).join('')}</ul>` : ''}`;
}

function disegnaEsplora() {
  $('#pannello-titolo').textContent = 'Esplora';
  corpoPannello.innerHTML = `
    <label class="ricerca" for="cerca">${ICONE.cerca}<input id="cerca" type="search" autocomplete="off" enterkeyhint="search" placeholder="Cerca un libro, un autore, un’idea" aria-label="Cerca un libro, un autore, un’idea"></label>
    <div id="esiti"></div>`;
  $('#cerca').addEventListener('input', (ev) => disegnaEsiti(ev.target.value));
  disegnaEsiti('');
}

function disegnaPercorso() {
  $('#pannello-titolo').textContent = 'Il tuo percorso';
  const visti = Object.keys(memoria.visti).filter((id) => PER_ID.has(id));
  const libri = new Set(visti.map((id) => PER_ID.get(id).libro.titolo));
  const fila = giorniDiFila();
  const righe = CATEGORIE.map((c) => {
    const suoi = VIDEO.filter((v) => v.categoria === c.id);
    if (!suoi.length) return '';
    const fatti = suoi.filter((v) => memoria.visti[v.id]).length;
    return `<li><button type="button" class="progresso" data-cat="${c.id}">
        <span class="pr-nome">${esc(c.nome)}</span><span class="pr-num">${fatti} di ${suoi.length}</span>
        <span class="pr-barra"><i style="width:${(fatti / suoi.length) * 100}%"></i></span>
      </button></li>`;
  }).join('');
  const punti = memoria.punti || 0;
  const liv = livelloDi(punti);
  const oggiFatti = Math.min(vistiOggi(), OBIETTIVO);
  const mancano = liv.a - punti;
  corpoPannello.innerHTML = `
    <div class="livello">
      <p class="livello-nome"><span>Livello ${liv.n}</span><b>${esc(liv.nome)}</b></p>
      <div class="livello-barra" role="img" aria-label="${punti} punti, ne mancano ${mancano} al livello ${liv.n + 1}"><i style="width:${((punti - liv.da) / (liv.a - liv.da)) * 100}%"></i></div>
      <p class="piccolo">${formatta(punti)} punti · ancora ${mancano} per il livello ${liv.n + 1}</p>
    </div>
    <div class="cifre">
      <div><b>${oggiFatti}<small>/${OBIETTIVO}</small></b><span>${oggiFatti >= OBIETTIVO ? 'obiettivo di oggi fatto' : 'idee nuove oggi'}</span></div>
      <div><b>${fila}</b><span>${fila === 1 ? 'giorno' : 'giorni'} di fila</span></div>
      <div><b>${memoria.serie || 0}</b><span>quiz giusti di fila</span></div>
    </div>
    <p class="piccolo">${PUNTI_VIDEO} punti per ogni video nuovo visto fino in fondo, ${PUNTI_QUIZ} per ogni quiz azzeccato al primo colpo, 20 quando chiudi l’obiettivo del giorno.</p>
    <h3 class="sezione"><span>Idee viste</span><span>${visti.length} di ${VIDEO.length} · ${libri.size} libri su ${LIBRI.length}</span></h3>
    <ul class="progressi">${righe}</ul>
    <p class="piccolo">Punti e progressi restano su questo dispositivo.</p>
    <button type="button" class="tasto tasto--solo" id="azzera">Azzera i progressi</button>`;
}

corpoPannello.addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.dataset.raccolta) return impostaFiltro({ tipo: b.dataset.raccolta });
  if (b.dataset.cat) return impostaFiltro({ tipo: 'categoria', valore: b.dataset.cat });
  if (b.dataset.libro) return impostaFiltro({ tipo: 'libro', valore: b.dataset.libro });
  if (b.dataset.video) {
    const v = PER_ID.get(b.dataset.video);
    return impostaFiltro({ tipo: 'libro', valore: v.libro.titolo }, v.id);
  }
  if (b.id === 'azzera') {
    if (b.dataset.sicuro) {
      Object.assign(memoria, { visti: {}, giorni: [], punti: 0, quiz: {}, serie: 0, bonus: '' });
      ricorda();
      aggiornaCromo();
      disegnaPercorso();
      avviso('Progressi azzerati');
    } else {
      b.dataset.sicuro = '1';
      b.textContent = 'Tocca ancora per confermare';
    }
  }
});

// ---- 08-avvio.js
// Collegamenti dell'interfaccia e partenza.

$$('[data-icona]').forEach((e) => e.insertAdjacentHTML('beforeend', ICONE[e.dataset.icona]));
$$('[data-icona-prima]').forEach((e) => e.insertAdjacentHTML('afterbegin', ICONE[e.dataset.iconaPrima]));

$('#apri-esplora').addEventListener('click', () => apriPannello('esplora'));
$('#apri-percorso').addEventListener('click', () => apriPannello('percorso'));
$('#pannello-chiudi').addEventListener('click', chiudiPannello);
$('#velo').addEventListener('click', chiudiPannello);
$('#marchio').addEventListener('click', () => {
  if (stato.filtro.tipo === 'tutti') feed.scrollTo({ top: 0, behavior: 'smooth' });
  else impostaFiltro({ tipo: 'tutti' });
});
$('#freccia-su').addEventListener('click', () => vaiAClip(-1));
$('#freccia-giu').addEventListener('click', () => vaiAClip(1));

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') return chiudiPannello();
  if (ev.target.closest?.('input, textarea') || pannelloAperto() || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const a = stato.attivo;
  const tasti = {
    ArrowDown: () => vaiAClip(1), PageDown: () => vaiAClip(1), j: () => vaiAClip(1),
    ArrowUp: () => vaiAClip(-1), PageUp: () => vaiAClip(-1), k: () => vaiAClip(-1),
    ArrowRight: () => a?.riproduttore?.salta(1),
    ArrowLeft: () => a?.riproduttore?.salta(-1),
    ' ': () => { if (!ev.target.closest?.('button')) a?.riproduttore?.pausa(); else return false; },
    l: () => a?.video && alternaSegno(a.video, 'piaciuti'),
    s: () => a?.video && alternaSegno(a.video, 'salvati'),
  };
  const fa = tasti[ev.key];
  if (fa && fa() !== false) ev.preventDefault();
});

// Quando cambia la misura dello schermo (o arrivano i caratteri) il testo va rimisurato.
let misura = 0;
function rimisura() {
  $$('.clip[data-pronta] .scena.fermo', feed).forEach(adatta);
  stato.attivo?.riproduttore?.riadatta();
}
window.addEventListener('resize', () => { clearTimeout(misura); misura = setTimeout(rimisura, 150); });
document.fonts?.ready.then(rimisura);

// Il browser lascia partire l'audio solo dopo un tocco: il primo clic, ovunque, accende il suono.
suono.alVia = () => { ripartiBase(); aggiornaAudio(); };
document.addEventListener('click', () => {
  if (!suono.vuole || suono.pronto) return;
  if (!suono.sblocca()) return;
  suono.appena = true;
  setTimeout(() => { suono.appena = false; }, 0);
  suono.ctx.resume?.().then(() => suono.alVia()).catch(() => {});
  suono.alVia();
  suono.pop();
  avviso('Suono acceso. Lo spegni dal tasto a destra.', 2600);
}, true);
$('#invito-suono').addEventListener('click', () => { /* basta il clic: ci pensa l'ascoltatore qui sopra */ });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { voce.zitta(); base.ferma(); return; }
  if (suono.pronto) { try { suono.ctx.resume().then(ripartiBase).catch(() => {}); } catch (e) { /* niente */ } }
});
if (voce.ok) { try { speechSynthesis.addEventListener('voiceschanged', () => { voce._scelta = null; }); } catch (e) { /* niente */ } }

window.addEventListener('hashchange', () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (PER_ID.has(id) && stato.attivo?.video?.id !== id) impostaFiltro({ tipo: 'tutti' }, id);
});

feed.addEventListener('scroll', () => {
  if (!memoria.guida && feed.scrollTop > 40) { memoria.guida = 1; ricorda(); }
}, { passive: true });

costruisciFeed(decodeURIComponent(location.hash.slice(1)));
aggiornaCromo();
aggiornaAudio();
if (!memoria.guida) setTimeout(() => { if (!memoria.guida && !pannelloAperto()) avviso('Scorri in su per la prossima idea. Un tocco mette in pausa.', 5200); }, 6500);

})();
</script>
