<meta name="theme-color" content="#151210">
<link rel="preconnect" href="https://fonts.googleapis.com">

<div id="app" class="app">
  <main id="feed" class="feed" aria-label="Idee dai libri"></main>

  <div class="cromo">
    <header class="barra">
      <button id="marchio" class="marchio" type="button" aria-label="Colto: torna a Per te">Colto</button>
      <button id="apri-esplora" class="gettone" type="button" aria-haspopup="dialog" data-icona="giu"><span id="filtro-nome">Per te</span></button>
      <button id="apri-percorso" class="gettone" type="button" aria-haspopup="dialog" aria-label="Il tuo percorso"><b id="oggi-numero">0</b><span>oggi</span></button>
    </header>
    <div class="frecce">
      <button id="freccia-su" type="button" aria-label="Video precedente" data-icona="su"></button>
      <button id="freccia-giu" type="button" aria-label="Video successivo" data-icona="giu"></button>
    </div>
  </div>

  <div id="velo" class="velo"></div>

  <div class="cromo">
    <div id="avviso" class="avviso" role="status" aria-live="polite"></div>
    <section id="pannello" class="pannello" role="dialog" aria-modal="true" aria-labelledby="pannello-titolo">
      <header class="pannello-testa">
        <h2 id="pannello-titolo">Esplora</h2>
        <button id="pannello-chiudi" type="button" aria-label="Chiudi" data-icona="chiudi"></button>
      </header>
      <div id="pannello-corpo" class="pannello-corpo"></div>
    </section>
  </div>
</div>
