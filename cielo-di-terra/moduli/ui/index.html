<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cielo di Terra · demo dell'interfaccia</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2233; overflow: hidden; }
      #gioco { position: fixed; inset: 0; }
      #gioco canvas { display: block; width: 100%; height: 100%; }
      /* Pannellino della demo (non fa parte del modulo). */
      .demo-pannello { position: fixed; top: 8px; left: 8px; z-index: 100; font: 14px system-ui, sans-serif; color: #f3ead6;
        background: rgba(20, 16, 12, .78); border-radius: 6px; padding: 4px 10px; max-width: 220px; }
      .demo-pannello summary { cursor: pointer; padding: 4px 0; }
      .demo-pannello div { display: flex; flex-wrap: wrap; gap: 4px 8px; padding: 6px 0; }
      .demo-pannello a { color: #e2c58a; }
    </style>
  </head>
  <body>
    <div id="gioco"><canvas id="canvas-gioco"></canvas></div>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
