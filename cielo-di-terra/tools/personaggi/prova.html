<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prova personaggi</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #d9cdb6;
        overflow: hidden;
        font-family: 'EB Garamond', Georgia, serif;
      }
      canvas {
        display: block;
      }
      #etichette {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 10px;
        pointer-events: none;
        font-size: 15px;
      }
      #etichette span {
        position: absolute;
        transform: translateX(-50%);
        font-size: inherit;
        color: #3b2c1f;
        background: rgba(240, 230, 210, 0.8);
        padding: 2px 8px;
        border-radius: 3px;
        white-space: nowrap;
      }
      #info {
        position: fixed;
        left: 10px;
        top: 8px;
        font-size: 14px;
        color: #3b2c1f;
      }
    </style>
  </head>
  <body>
    <div id="info"></div>
    <div id="etichette"></div>
    <!--
      Pagina di prova dei personaggi generati, fuori dal gioco. Si serve con Vite dalla cartella
      cielo-di-terra (npx vite) e si apre su /tools/personaggi/prova.html?m=vecchio,togna,nando
      Parametri: m (modelli: id in public/personaggi, «pilota:<file>» per un GLB in
      tools/personaggi/pilota, «vecchio» per l'abitante procedurale di oggi),
      vista (fronte|fianco|retro|tre-quarti), modo (fermo|cammina), velocita, t (secondi di
      animazione: immagine ferma), gesto (saluta|indica|mano-al-petto), braccia (mani-giunte|
      braccia-conserte|mani-dietro), curvo (0..1), stile (toon|lambert|originale), lod (1 = forza il
      LOD basso), luce (giorno|sera), primo (1 = primo piano), sfondo (url di un'immagine),
      apertura (gradi delle braccia a riposo), gonna (0 = passo lungo), passo (metri fra le figure),
      indice (1 = gonna, apertura e postura da public/personaggi/indice.json), nomi (1 = etichette
      grandi con nome e altezza, per la scheda del cast).
    -->
    <script type="module" src="./prova.ts"></script>
  </body>
</html>
