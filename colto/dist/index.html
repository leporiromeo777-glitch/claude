chetta":"Accusa","voci":["«Volevi mettermi in imbarazzo»"]},"b":{"etichetta":"Effetto e domanda","voci":["«Mi hai corretto davanti a tutti»","«Ci sono rimasto male. Cosa intendevi?»"]}},{"tipo":"colpo","testo":"Vale anche al contrario."},{"tipo":"quiz","domanda":"Hai ferito qualcuno senza volerlo. Cosa dici per prima cosa?","opzioni":["«Non era mia intenzione»","«Capisco che ci sei rimasto male»"],"corretta":1,"spiegazione":"Per gli autori le buone intenzioni non cancellano l'effetto. Prima riconoscilo, poi spiega."},{"tipo":"chiusura","azione":"Ripensa a un torto recente. Scrivi: «Ha fatto… mi sono sentito… ==sto supponendo che…==»"}]},{"id":"padre-ricco-padre-povero-attivita-passivita","categoria":"finanza","titolo":"La tua casa ti porta soldi o te li toglie?","libro":{"titolo":"Padre ricco padre povero","autore":"Robert T. Kiyosaki","anno":1997,"titoloOriginale":"Rich Dad Poor Dad"},"scene":[{"tipo":"apertura","testo":"La casa in cui vivi è un investimento? ==Kiyosaki dice di no==."},{"tipo":"colpo","testo":"Conta dove vanno i soldi."},{"tipo":"confronto","a":{"etichetta":"Passività","voci":["Ti toglie soldi di tasca","Auto a rate, debiti di consumo"]},"b":{"etichetta":"Attività","voci":["Ti mette soldi in tasca","Immobili in affitto, azioni"]}},{"tipo":"quiz","domanda":"Per Kiyosaki, quale di queste è un'attività?","opzioni":["La casa in cui vivi","Un box dato in affitto","L'auto nuova"],"corretta":1,"spiegazione":"Il box porta soldi ogni mese. Casa e auto, per lui, li fanno uscire."},{"tipo":"testo","titolo":"Sì, anche la casa","testo":"Mutuo, tasse e manutenzione ==escono ogni mese==. Ma è la sua tesi più discussa: una casa tua ti evita l'affitto."},{"tipo":"principio","testo":"Prima compri attività. I lussi vengono dopo, ==pagati da quelle entrate==."},{"tipo":"chiusura","azione":"Scrivi tre cose che possiedi. Accanto: ==porta soldi o li porta via?=="}]},{"id":"padre-ricco-padre-povero-corsa-del-topo","categoria":"finanza","titolo":"Più guadagni, più spendi: la euro==."},{"tipo":"colpo","testo":"Troppo? Un attimo."},{"tipo":"testo","testo":"È il patrimonio netto atteso: ciò che possiedi meno i debiti, eredità escluse. Regola a spanne, nata negli USA: ==da giovane è normale stare sotto==."},{"tipo":"quiz","domanda":"Luca ha 40 anni e 50 mila euro lordi l'anno. Patrimonio atteso?","opzioni":["200 mila euro","125 mila euro","500 mila euro"],"corretta":0,"spiegazione":"40 × 50 000 ÷ 10 = 200 mila. Chi ha il doppio, per gli autori, è un grande accumulatore."},{"tipo":"chiusura","azione":"Fai il tuo conto: ==età × reddito lordo annuo ÷ 10==."}]},{"id":"i-will-teach-you-rich-spesa-consapevole","categoria":"finanza","titolo":"Spendi tanto per ciò che ami, taglia il resto","libro":{"titolo":"I Will Teach You to Be Rich","autore":"Ramit Sethi","anno":2009},"scene":[{"tipo":"apertura","testo":"Spendere tanto in concerti ==senza sensi di colpa==. A una condizione."},{"tipo":"colpo","testo":"La condizione è spietata."},{"tipo":"testo","titolo":"Spesa consapevole","testo":"Ramit Sethi non ti fa contare i caffè. Ti fa scegliere: spendi ==senza rimorsi== per ciò che ami, tagli senza pietà il resto."},{"tipo":"elenco","titolo":"Lo stipendio netto, secondo Sethi","voci":["Spese fisse: 50–60%","Investimenti: 10%","Risparmi: 5–10%","Spese libere, senza colpa: 20–35%"]},{"tipo":"esempio","testo":"Esempio illustrativo: Sara prende 1800 euro netti. Fisse 1000, investe 180, risparmia 140. I ==480 che restano== vanno in concerti. Zero rimorsi."},{"tipo":"principio","testo":"Non spendere meno su tutto: decidi ==dove vale la pena spendere tanto==."},{"tipo":"chiusura","azione":"Scrivi due spese che ami e due che non ti importano. ==Taglia una delle seconde==."}]},{"id":"i-will-teach-you-rich-soluzione-85","categoria":"finanza","titolo":"Meglio l'85% oggi che il 100% mai","libro":{"titolo":"I Will Teach You to Be Rich","autore":"Ramit Sethi","anno":2009},"scene":[{"tipo":"apertura","testo":"Da quanti mesi rimandi perché vuoi prima ==capire tutto== sui soldi?"},{"tipo":"mito","mito":"Prima di muovermi devo sapere tutto","realta":"Per Sethi cominciare conta più che ==diventare esperti==."},{"tipo":"testo","titolo":"La soluzione dell'85%","testo":"Conti, fondi, tassi, pareri opposti: più leggi, meno decidi. Sethi propone una scelta ==buona all'85%, fatta oggi==. Il resto lo sistemi dopo."},{"tipo":"quiz","domanda":"Devi aprire un conto di risparmio. Per Sethi, la mossa migliore?","opzioni":["Studiare finché trovi il migliore","Aspettare tassi più alti","Aprirne uno buono e iniziare"],"corretta":2,"spiegazione":"Fra buono e ottimo cambia poco. Fra iniziare e non iniziare, tutto."},{"tipo":"colpo","testo":"Fatto batte perfetto."},{"tipo":"chiusura","azione":"Scegli una decisione che rimandi e ==mettile una scadenza==: sette giorni."}]},{"id":"your-money-or-your-life-energia-vitale","categoria":"finanza","titolo":"Quante ore di vita costa quello che compri","libro":{"titolo":"Your Money or Your Life","autore":"Vicki Robin, Joe Dominguez","anno":1992},"scene":[{"tipo":"apertura","testo":"Quelle scarpe non costano 140 euro. Costano ==20 ore di vita==."},{"tipo":"testo","titolo":"Soldi = energia vitale","testo":"Vicki Robin e Joe Dominguez la vedono così: il denaro è tempo di vita ceduto. E la paga vera è più bassa: conta ==tragitti, recupero, spese di lavoro==."},{"tipo":"colpo","testo":"Il conto si fa così."},{"tipo":"confronto","titolo":"Esempio illustrativo: la paga di Gio","a":{"etichetta":"Sulla carta","voci":["1600 euro al mese","160 ore: 10 euro l'ora"]},"b":{"etichetta":"In realtà","voci":["1400 euro, tolte le spese","200 ore con tragitti: 7 euro l'ora"]}},{"tipo":"numero","valore":20,"suffisso":" ore","didascalia":"Tanto valgono le scarpe da 140 euro, a ==7 euro l'ora== veri.","nota":"Esempio illustrativo: 140 ÷ 7."},{"tipo":"principio","testo":"Ogni cosa la paghi in ==tempo di vita==. È quello il prezzo vero."},{"tipo":"chiusura","azione":"Calcola la tua paga oraria reale. Poi traduci ==in ore== l'ultimo acquisto."}]},{"id":"your-money-or-your-life-abbastanza","categoria":"finanza","titolo":"Il punto in cui avere di più smette di servire","libro":{"titolo":"Your Money or Your Life","autore":"Vicki Robin, Joe Dominguez","anno":1992},"scene":[{"tipo":"apertura","testo":"Il primo cappotto ti scalda. Il quinto ==ti occupa l'armadio==."},{"tipo":"testo","titolo":"La curva dell'appagamento","testo":"Vicki Robin e Joe Dominguez la disegnano così: all'inizio ogni euro speso dà moltissimo. Poi ==sempre meno==."},{"tipo":"elenco","titolo":"Le tappe della curva","numerato":true,"voci":["Sopravvivenza: cibo e un tetto","Comodità","Qualche lusso","Oltre il picco: solo ingombro"]},{"tipo":"colpo","testo":"Il picco ha un nome."},{"tipo":"principio","testo":"Si chiama ==«abbastanza»==: oltre, ogni cosa in più ti toglie più di quanto ti dà."},{"tipo":"quiz","domanda":"Per gli autori, dove sta il punto di «abbastanza»?","opzioni":["In cima alla curva, lussi inclusi","Nello stretto necessario","Non esiste: di più è meglio"],"corretta":0,"spiegazione":"Abbastanza non è rinuncia: include comodità e qualche lusso."},{"tipo":"chiusura","azione":"Apri un armadio. Conta ==le cose che non usi da un anno==."}]},{"id":"total-money-makeover-palla-di-neve","categoria":"finanza","titolo":"Debiti: perché partire dal più piccolo","libro":{"titolo":"The Total Money Makeover","autore":"Dave Ramsey","anno":2003},"scene":[{"tipo":"apertura","testo":"Tre debiti, pochi soldi. Da quale parti? Ramsey ==spiazza i matematici==."},{"tipo":"elenco","titolo":"La palla di neve","numerato":true,"voci":["Debiti in fila, dal più piccolo","Minimo su tutti, il resto sul primo","Chiuso uno, la sua rata passa al prossimo"]},{"tipo":"esempio","testo":"Esempio illustrativo: hai 400 euro al mese. Carta 500, prestito 2000, auto 6000. Rate minime: 50, 100 e 150. I ==100 che avanzano== vanno sulla carta."},{"tipo":"grafico","titolo":"Mesi per chiudere ogni debito","forma":"barre","unita":"mesi","dati":[{"e":"Carta","v":4},{"e":"Prestito","v":10},{"e":"Auto","v":22}],"nota":"Esempio illustrativo, calcolato senza interessi."},{"tipo":"colpo","testo":"Ma così paghi più interessi."},{"tipo":"testo","titolo":"Ramsey lo sa","testo":"Partire dal tasso più alto costa meno. Ma per lui i debiti sono comportamento, non matematica: una ==vittoria veloce== ti tiene in corsa."},{"tipo":"chiusura","azione":"Scrivi i tuoi debiti in fila, ==dal più piccolo al più grande==."}]},{"id":"total-money-makeover-fondo-emergenza","categoria":"finanza","titolo":"Il cuscinetto che trasforma un guaio in un fastidio","libro":{"titolo":"The Total Money Makeover","autore":"Dave Ramsey","anno":2003},"scene":[{"tipo":"apertura","testo":"La lavatrice si rompe sempre ==nel mese sbagliato==."},{"tipo":"mito","mito":"Per gli imprevisti c'è la carta di credito","realta":"Per Ramsey è così che un guasto ==diventa un debito==."},{"tipo":"numero","valore":1000,"suffisso":" $","didascalia":"Il primo passo del libro: un cuscinetto da fare ==in fretta==.","nota":"Cifra pensata per gli Stati Uniti."},{"tipo":"elenco","titolo":"Poi il fondo cresce","numerato":true,"voci":["Subito: un piccolo fondo","Poi: via i debiti, tranne il mutuo","Infine: da 3 a 6 mesi di spese"]},{"tipo":"esempio","testo":"Esempio illustrativo: spendi 1500 euro al mese. Fondo completo: ==da 4500 a 9000 euro==. Entrate incerte? Per Ramsey meglio sei mesi."},{"tipo":"colpo","testo":"E non è un investimento."},{"tipo":"principio","testo":"Il fondo non serve a guadagnare: serve a ==non fare nuovi debiti==."},{"tipo":"chiusura","azione":"Somma le spese di un mese e moltiplica per tre: ==è il fondo a cui puntare==."}]},{"id":"automatic-millionaire-fattore-latte","categoria":"finanza","titolo":"Dove finiscono i soldi che giuri di non avere","libro":{"titolo":"The Automatic Millionaire","autore":"David Bach","anno":2004},"scene":[{"tipo":"apertura","testo":"Kim non riesce a risparmiare 5 dollari al giorno. ==O così crede.=="},{"tipo":"esempio","testo":"Lo dice a David Bach, durante un suo corso. Lui le chiede solo di ripassare la giornata, spesa per spesa. Si parte da ==caffellatte e muffin==."},{"tipo":"colpo","testo":"I soldi ==c'erano==. A pezzetti."},{"tipo":"numero","valore":1095,"suffisso":" €","didascalia":"Tre euro al giorno, dopo un anno. Bach lo chiama ==fattore latte==.","nota":"Esempio illustrativo: 3 × 365."},{"tipo":"mito","mito":"Rinuncia al caffè e diventi ricco","realta":"Per Bach è solo un simbolo. E i critici ricordano: ==casa e auto pesano di più==."},{"tipo":"principio","testo":"Per Bach la volontà non basta: quei soldi vanno spostati ==in automatico==, prima di poterli spendere."},{"tipo":"chiusura","azione":"Oggi annota ogni spesa sotto i 5 euro. Stasera ==moltiplica per 365==."}]},{"id":"simple-path-to-wealth-fondo-indicizzato","categoria":"finanza","titolo":"Scegliere l'azione giusta? C'è chi le prende tutte","libro":{"titolo":"The Simple Path to Wealth","autore":"JL Collins","anno":2016},"scene":[{"tipo":"apertura","testo":"Trovare l'azione giusta è difficilissimo. E se ==le comprassi tutte==?"},{"tipo":"testo","testo":"JL Collins lo fa con un fondo indicizzato: replica tutto un mercato, ==migliaia di società==. Se una fallisce, pesa poco."},{"tipo":"mito","mito":"Per investire bene devi battere il mercato","realta":"Per Collins basta ==possederlo tutto==, pagare poco e reggere i cali."},{"tipo":"colpo","testo":"E l'indice ==si pulisce da solo==."},{"tipo":"quiz","domanda":"Il primo Dow Jones, 1896: 12 società. Quante sono ancora nell'indice?","opzioni":["Otto","Nessuna","Quattro"],"corretta":1,"spiegazione":"L'ultima, General Electric, è uscita nel 2018."},{"tipo":"principio","testo":"Chi declina esce, chi cresce pesa di più. ==Le vincitrici le hai già==, senza doverle scegliere."},{"tipo":"chiusura","azione":"Cerca la scheda di un fondo indicizzato. Conta ==quante società ha dentro==."}]},{"id":"simple-path-to-wealth-crollo-previsto","categoria":"finanza","titolo":"Ha venduto nel panico del 1987: cosa ha imparato","libro":{"titolo":"The Simple Path to Wealth","autore":"JL Collins","anno":2016},"scene":[{"tipo":"apertura","testo":"19 ottobre 1987: Wall Street perde ==oltre il 20% in un giorno==."},{"tipo":"esempio","testo":"JL Collins c'era. Racconta di aver resistito qualche mese. Poi ha ==venduto per paura==. Il mercato è risalito senza di lui."},{"tipo":"colpo","testo":"Rientrare gli è costato caro."},{"tipo":"testo","titolo":"La lezione","testo":"Per Collins i crolli sono ==parte del percorso==: il danno lo fa chi vende nel panico. La Borsa USA finora è risalita: è storia, non una garanzia."},{"tipo":"quiz","domanda":"Per Collins, cosa fa più danni a chi investe per decenni?","opzioni":["Un crollo del mercato","Iniziare nel giorno sbagliato","Vendere per paura"],"corretta":2,"spiegazione":"Il crollo passa, dice Collins. Vendere rende definitiva una perdita temporanea."},{"tipo":"chiusura","azione":"Scrivi ora, a mente fredda, ==cosa farai al prossimo crollo==."}]},{"id":"psicologia-soldi-ricchezza-invisibile","categoria":"finanza","titolo":"L'auto da 100 mila euro non dice quello che pensi","libro":{"titolo":"La psicologia dei soldi","autore":"Morgan Housel","anno":2020,"titoloOriginale":"The Psychology of Money"},"scene":[{"tipo":"apertura","testo":"Passa un'auto da 100 mila euro. ==Che cosa sai== di chi la guida?"},{"tipo":"quiz","domanda":"Di lui sai una cosa sola. Quale?","opzioni":["Che è ricco","Che ha 100 mila euro in meno","Che guadagna molto"],"corretta":1,"spiegazione":"O un debito in più. Per Morgan Housel vedi la spesa, non quello che resta."},{"tipo":"colpo","testo":"La ricchezza ==non si vede==."},{"tipo":"esempio","testo":"Da studente Housel faceva il parcheggiatore a Los Angeles. Molti clienti in Ferrari non erano ricchi. ==Spendevano in auto== gran parte dello stipendio."},{"tipo":"confronto","a":{"etichetta":"Si vede","voci":["Auto, vestiti, vacanze","Sono soldi già usciti"]},"b":{"etichetta":"Non si vede","voci":["I soldi che non hai speso","Ti danno scelta e tempo"]}},{"tipo":"principio","testo":"La ricchezza sono gli acquisti che ==non hai fatto==: soldi rimasti tuoi."},{"tipo":"chiusura","azione":"Apri l'app della banca. Quanto hai messo via questo mese? ==Quella è ricchezza.=="}]},{"id":"psicologia-soldi-buffett-tempo","categoria":"finanza","titolo":"Buffett ha fatto i miliardi dopo i 65 anni","libro":{"titolo":"La psicologia dei soldi","autore":"Morgan Housel","anno":2020,"titoloOriginale":"The Psychology of Money"},"scene":[{"tipo":"apertura","testo":"Buffett ha fatto quasi tutti i suoi soldi ==dopo i 65 anni==."},{"tipo":"numero","valore":81.5,"decimali":1,"suffisso":" mld","didascalia":"Miliardi di dollari arrivati ==dopo i 65 anni circa==. Su 84,5 totali.","nota":"Cifre riportate nel libro, uscito nel 2020."},{"tipo":"colpo","testo":"Il segreto? ==Ha iniziato a 10.=="},{"tipo":"testo","testo":"L'interesse composto sono gli interessi sugli interessi. Per Housel lavora per Buffett da ==tre quarti di secolo==."},{"tipo":"quiz","domanda":"E se avesse iniziato a 30 anni e smesso a 60? Oggi avrebbe…","opzioni":["Circa 12 milioni di dollari","Circa 12 miliardi di dollari"],"corretta":0,"spiegazione":"È il conto di Housel, a parità di rendimenti. Il 99,9% in meno."},{"tipo":"principio","testo":"Non serve il rendimento più alto. Serve un buon rendimento ==tenuto per decenni==."},{"tipo":"chiusura","azione":"Apri un simulatore di interesse composto. Prova 20 anni, poi 40. ==Guarda la differenza.=="}]},{"id":"psicologia-soldi-fortuna-rischio","categoria":"finanza","titolo":"Bill Gates e l'amico che nessuno ricorda","libro":{"titolo":"La psicologia dei soldi","autore":"Morgan Housel","anno":2020,"titoloOriginale":"The Psychology of Money"},"scene":[{"tipo":"apertura","testo":"Nel 1968 quasi nessun liceo ha un computer. Quello di ==Bill Gates== sì."},{"tipo":"esempio","testo":"Seattle, Lakeside School. Nel mondo ci sono 300 milioni di ragazzi in età da liceo. Lì dentro, 300. Per Housel: ==uno su un milione==."},{"tipo":"colpo","testo":"Poi c'è ==un altro ragazzo==."},{"tipo":"testo","titolo":"Kent Evans","testo":"È il migliore amico di Gates, bravo quanto lui con i computer. Muore in montagna prima del diploma. Per Housel, anche qui: ==una su un milione==."},{"tipo":"confronto","a":{"etichetta":"D'istinto","voci":["Ha vinto: è un genio","Ha perso: ha sbagliato tutto"]},"b":{"etichetta":"Secondo Housel","voci":["Nel successo c'è anche fortuna","Nel fallimento c'è anche rischio"]}},{"tipo":"principio","testo":"Fortuna e rischio sono fratelli. In ogni risultato pesano ==forze che non dipendono da te==."},{"tipo":"chiusura","azione":"Pensa a una scelta andata male. Scrivi due colonne: ==cosa dipendeva da te== e cosa no."}]},{"id":"same-as-ever-aspettative","categoria":"finanza","titolo":"Hai cose che Rockefeller non aveva. E non ti basta","libro":{"titolo":"Same as Ever","autore":"Morgan Housel","anno":2023},"scene":[{"tipo":"apertura","testo":"Hai cose che Rockefeller non poteva comprare. ==E non ti senti ricco.=="},{"tipo":"testo","testo":"Lui non ebbe mai la penicillina né l'ibuprofene. Tu sì. Ma per Morgan Housel non pesiamo ciò che abbiamo."},{"tipo":"colpo","testo":"Pesiamo ==le attese==."},{"tipo":"quiz","domanda":"Tu prendi il 10% in più, i tuoi amici il 30%. Come rischi di sentirti?","opzioni":["Più ricco di prima","Più povero di prima"],"corretta":1,"spiegazione":"Ci misuriamo con chi ci sta intorno. Le cifre assolute contano meno."},{"tipo":"testo","testo":"Una volta ti confrontavi con i vicini. Oggi i social mostrano ==i momenti migliori di tutti==. Le attese salgono da sole."},{"tipo":"principio","testo":"Il benessere è ==risultati meno aspettative==. Se salgono insieme, non senti alcun progresso."},{"tipo":"chiusura","azione":"==Silenzia un profilo== che ti fa sentire indietro. Scrivi tre cose che hai già."}]},{"id":"die-with-zero-ore-regalate","categoria":"finanza","titolo":"I risparmi che non userai sono ore lavorate gratis","libro":{"titolo":"Die With Zero","autore":"Bill Perkins","anno":2020},"scene":[{"tipo":"apertura","testo":"E se i risparmi che lasci fossero ==anni di lavoro regalati==?"},{"tipo":"testo","testo":"È la tesi di Bill Perkins. Ogni euro ti è costato tempo di vita. Mai speso né donato? Quelle ore ==le hai lavorate gratis==."},{"tipo":"colpo","testo":"Fai il conto."},{"tipo":"numero","valore":8000,"suffisso":" ore","didascalia":"Il lavoro dietro ==100 mila euro mai usati==. A 12,50 euro netti l'ora.","nota":"Esempio illustrativo: 100 000 : 12,50. Circa 4 anni a tempo pieno."},{"tipo":"mito","mito":"L'eredità si lascia alla fine","realta":"Per Perkins arriva tardi. Meglio dare ==mentre sei vivo==, quando serve davvero."},{"tipo":"principio","testo":"Metti al sicuro la vecchiaia. ==Oltre quel punto== scambi vita con soldi che non userai."},{"tipo":"chiusura","azione":"Calcola la tua paga netta all'ora. I risparmi senza uno scopo, ==quante ore sono?=="}]},{"id":"die-with-zero-secchi-di-tempo","categoria":"finanza","titolo":"Le esperienze hanno una data di scadenza","libro":{"titolo":"Die With Zero","autore":"Bill Perkins","anno":2020},"scene":[{"tipo":"apertura","testo":"C'è un'ultima volta in cui dormirai in ostello. ==Forse è già passata.=="},{"tipo":"esempio","testo":"Da ventenne Perkins dà del matto a un amico. Si è indebitato per girare l'Europa zaino in spalla. A trent'anni parte lui. ==Per gli ostelli è tardi.=="},{"tipo":"colpo","testo":"I soldi c'erano. ==L'età no.=="},{"tipo":"principio","testo":"Ogni esperienza ha una finestra. Chiediti ==a che età te la godresti di più==."},{"tipo":"elenco","titolo":"I «secchi di tempo»","numerato":true,"voci":["Dividi i prossimi anni in fasce da 5 o 10","Elenca le esperienze che vuoi fare","Metti ognuna nella ==fascia giusta=="]},{"tipo":"quiz","domanda":"Secondo Perkins, cosa manca di più negli anni centrali della vita?","opzioni":["I soldi","La salute","Il tempo"],"corretta":2,"spiegazione":"Da giovani mancano i soldi, da anziani la salute. Nel mezzo, il tempo."},{"tipo":"chiusura","azione":"Disegna tre fasce da dieci anni. ==Scrivi due esperienze in ognuna.=="}]},{"id":"almanack-naval-leva","categoria":"finanza","titolo":"Le tre leve che moltiplicano il tuo lavoro","libro":{"titolo":"The Almanack of Naval Ravikant","autore":"Eric Jorgenson","anno":2020},"scene":[{"tipo":"apertura","testo":"La tua giornata ha 24 ore. Se vendi tempo, ==il tetto è già fissato==."},{"tipo":"colpo","testo":"A meno di usare ==una leva==."},{"tipo":"testo","testo":"Naval Ravikant è un investitore della Silicon Valley. Per lui la ricchezza non viene dalle ore. Viene da ciò che ==moltiplica ogni tua decisione==."},{"tipo":"elenco","titolo":"Le tre leve secondo Naval","voci":["Lavoro: qualcuno deve scegliere di seguirti","Capitale: qualcuno deve affidarti dei soldi","Codice e contenuti: ==nessun permesso=="]},{"tipo":"esempio","testo":"Un'insegnante spiega le frazioni a 25 studenti. Registra la lezione e la pubblica. Può arrivare a 25 mila ==senza un'ora in più==."},{"tipo":"principio","testo":"Con una leva le ore contano meno. ==Conta di più il tuo giudizio.=="},{"tipo":"chiusura","azione":"Spieghi spesso la stessa cosa a voce? ==Scrivila o registrala una volta.== Poi condividila."}]},{"id":"millionaire-fastlane-tre-strade","categoria":"finanza","titolo":"Ricco a 65 anni? Per DeMarco è un pessimo affare","libro":{"titolo":"The Millionaire Fastlane","autore":"MJ DeMarco","anno":2011},"scene":[{"tipo":"apertura","testo":"Lavora, risparmia, ricco a 65 anni. ==E se fosse un pessimo affare?=="},{"tipo":"testo","testo":"Lo sostiene MJ DeMarco, che ha fondato e venduto un'azienda online. Per lui verso i soldi ci sono ==tre strade==."},{"tipo":"elenco","titolo":"Le tre strade di DeMarco","voci":["Marciapiede: spendi tutto quello che entra","Corsia lenta: stipendio, risparmio, attesa","Corsia veloce: un'impresa che ==rende senza di te=="]},{"tipo":"confronto","a":{"etichetta":"Corsia lenta","voci":["Scambi ore con uno stipendio","La ricchezza arriva da vecchio"]},"b":{"etichetta":"Corsia veloce","voci":["Un sistema che vende senza di te","Può servire migliaia di persone"]}},{"tipo":"colpo","testo":"Veloce ==non vuol dire facile==."},{"tipo":"testo","titolo":"Prima di crederci","testo":"È una tesi, non una garanzia. DeMarco stesso avverte: servono anni di lavoro. E ==molte imprese chiudono==."},{"tipo":"chiusura","azione":"Guarda le entrate del mese: ==quante dipendono dalle tue ore?== Scrivi un'idea alternativa."}]},{"id":"happy-money-spendere-per-altri","categoria":"finanza","titolo":"Venti dollari: per te o per un altro?","libro":{"titolo":"Happy Money","autore":"Elizabeth Dunn, Michael Norton","anno":2013},"scene":[{"tipo":"apertura","testo":"Ti regalano 20 dollari da spendere entro stasera. ==Per chi li usi?=="},{"tipo":"quiz","domanda":"Buste con 5 o 20 dollari da spendere in giornata. Chi è più felice la sera?","opzioni":["Chi li spende per un altro","Chi li spende per sé"],"corretta":0,"spiegazione":"Conta come li spendi, non quanto: 5 o 20 dollari, stesso effetto."},{"tipo":"testo","testo":"L'esperimento è di Dunn e Norton, in un campus canadese. Metà dei passanti spende per sé, metà per altri. Vince ==il secondo gruppo==."},{"tipo":"colpo","testo":"Noi ==prevediamo l'opposto==."},{"tipo":"principio","testo":"Anche pochi euro rendono più felici ==se li spendi per qualcun altro==."},{"tipo":"elenco","titolo":"Funziona meglio se","voci":["Lo scegli tu","Crea un legame con qualcuno","Vedi l'effetto di ciò che dai"]},{"tipo":"chiusura","azione":"Oggi spendi ==5 euro per un'altra persona==. Stasera nota come stai."}]},{"id":"happy-money-paga-prima","categoria":"finanza","titolo":"Il bello della vacanza arriva prima di partire","libro":{"titolo":"Happy Money","autore":"Elizabeth Dunn, Michael Norton","anno":2013},"scene":[{"tipo":"apertura","testo":"Il momento più bello di una vacanza arriva spesso ==prima di partire==."},{"tipo":"testo","testo":"Per Dunn e Norton l'attesa è un piacere gratis. Immagini il viaggio, ne parli, lo pregusti. Vale solo se ==compri in anticipo==."},{"tipo":"colpo","testo":"Le rate fanno ==il contrario==."},{"tipo":"confronto","a":{"etichetta":"Consuma ora, paga dopo","voci":["È il modello di carte e rate","Il conto arriva a piacere finito"]},"b":{"etichetta":"Paga ora, consuma dopo","voci":["Settimane di attesa piacevole","Quando arriva, sembra quasi gratis"]}},{"tipo":"esempio","testo":"Compri il biglietto di un concerto tre mesi prima. Per tre mesi riascolti le canzoni e conti i giorni. Quella sera ==ti resta solo la musica==."},{"tipo":"principio","testo":"Stacca il pagamento dal piacere: ==prima il conto, poi il godimento==."},{"tipo":"chiusura","azione":"Scegli una cosa bella da fare fra un mese e ==pagala oggi==. Poi segnala sul calendario."}]},{"id":"mente-milionaria-termostato","categoria":"finanza","titolo":"Le frasi sui soldi che ti porti da bambino","libro":{"titolo":"I segreti della mente milionaria","autore":"T. Harv Eker","anno":2005,"titoloOriginale":"Secrets of the Millionaire Mind"},"scene":[{"tipo":"apertura","testo":"«I soldi non crescono sugli alberi.» ==Quante volte== l'hai sentito?"},{"tipo":"testo","testo":"Per T. Harv Eker frasi così restano. Formano un modello mentale dei soldi. Da adulto guida le tue scelte ==senza che tu lo sappia==."},{"tipo":"elenco","titolo":"Da dove viene, secondo Eker","voci":["Quello che sentivi dire in casa","Quello che vedevi fare ai tuoi","Episodi che ti sono rimasti addosso"]},{"tipo":"colpo","testo":"Funziona come ==un termostato==."},{"tipo":"principio","testo":"Per Eker sei regolato su una cifra. ==Tendi a tornare lì==, qualunque cosa guadagni."},{"tipo":"confronto","a":{"etichetta":"Frase ereditata","voci":["«Con i soldi non ci so fare»"]},"b":{"etichetta":"Frase scelta","voci":["«Posso imparare a gestirli»"]}},{"tipo":"testo","titolo":"Con misura","testo":"Non è scienza: è l'opinione di un formatore. Quanto guadagni dipende anche da dove parti. L'esercizio però ==resta utile==."},{"tipo":"chiusura","azione":"Scrivi tre frasi sui soldi che sentivi da bambino. ==Vere, o solo ereditate?=="}]},{"id":"early-retirement-extreme-tasso-risparmio","categoria":"finanza","titolo":"La percentuale che decide quando smetti di lavorare","libro":{"titolo":"Early Retirement Extreme","autore":"Jacob Lund Fisker","anno":2010},"scene":[{"tipo":"apertura","testo":"Quanti anni devi lavorare ancora? Dipende da ==una percentuale==."},{"tipo":"testo","testo":"Jacob Lund Fisker è un fisico di origine danese. Per lui conta il tasso di risparmio. È quanto ==non spendi== di ciò che guadagni."},{"tipo":"quiz","domanda":"Risparmi il 75% dello stipendio. In un anno di lavoro, quanti anni di spese metti via?","opzioni":["Quattro mesi","Un anno","Tre anni"],"corretta":2,"spiegazione":"Spendi 25 e tieni 75. Tre volte quello che ti serve in un anno."},{"tipo":"grafico","titolo":"Anni di lavoro, per tasso di risparmio","forma":"barre","dati":[{"e":"10%","v":59},{"e":"25%","v":35},{"e":"50%","v":18},{"e":"75%","v":7}],"nota":"Esempio illustrativo: rendimento reale 4%, meta 25 volte le spese."},{"tipo":"colpo","testo":"Spendere meno ==vale doppio==."},{"tipo":"principio","testo":"Metti via di più e ti serve meno capitale. La via estrema di Fisker: ==saper fare quasi tutto da sé==."},{"tipo":"chiusura","azione":"Calcola il tuo tasso del mese scorso: ==risparmi diviso entrate nette==. Scrivilo."}]},{"id":"latte-factor-piccole-spese","categoria":"finanza","titolo":"Cinque euro al giorno: fai il conto","libro":{"titolo":"The Latte Factor","autore":"David Bach, John David Mann","anno":2019},"scene":[{"tipo":"apertura","testo":"Cinque euro al giorno tra caffè e snack. ==Quanto fa in un anno?=="},{"tipo":"quiz","domanda":"Fai il conto: in un anno sono…","opzioni":["Circa 900 euro","Circa 1800 euro","Circa 3600 euro"],"corretta":1,"spiegazione":"5 × 365 fa 1825 euro. Esempio illustrativo."},{"tipo":"colpo","testo":"Il caffè ==è solo un simbolo==."},{"tipo":"testo","testo":"David Bach lo chiama «Latte Factor». Per iniziare a risparmiare non serve guadagnare di più. ==Quei soldi li hai già.=="},{"tipo":"grafico","titolo":"5 euro al giorno (150 al mese) investiti al 4%","forma":"linea","unita":"€","dati":[{"e":"Oggi","v":0},{"e":"10 anni","v":22087},{"e":"20 anni","v":55016},{"e":"30 anni","v":104107},{"e":"40 anni","v":177294}],"nota":"Esempio illustrativo: versi 72 000. I rendimenti reali variano."},{"tipo":"testo","titolo":"La critica","testo":"Casa e auto pesano di più, è vero. Per Bach però conta ==scegliere tu== quali piccole spese valgono. Il resto è abitudine."},{"tipo":"chiusura","azione":"Trova nell'estratto conto ==una piccola spesa che si ripete==. Moltiplicala per 365."}]},{"id":"money-master-game-costi","categoria":"investimenti","titolo":"Quanto ti costa davvero un fondo al 2%","libro":{"titolo":"Money: Master the Game","autore":"Tony Robbins","anno":2014},"scene":[{"tipo":"apertura","testo":"Un fondo costa lo 0,2% l'anno, un altro il 2%. ==Poca differenza?=="},{"tipo":"quiz","domanda":"Entrambi rendono il 6% lordo. Dopo 30 anni, quanto vale in meno quello al 2%?","opzioni":["Circa il 40%","Circa il 20%","Circa il 2%"],"corretta":0,"spiegazione":"Esempio illustrativo: 10 mila euro diventano circa 54 mila o 32 mila."},{"tipo":"grafico","titolo":"10 mila euro dopo 30 anni, per costo annuo","forma":"barre","unita":"mila","dati":[{"e":"0,2%","v":54.3},{"e":"1%","v":43.2},{"e":"2%","v":32.4}],"nota":"Esempio illustrativo: 6% lordo ipotetico. I rendimenti reali variano."},{"tipo":"colpo","testo":"Il costo ==si paga ogni anno==."},{"tipo":"testo","testo":"Tony Robbins cita Jack Bogle, fondatore di Vanguard. I costi li paghi su tutto il capitale, ==interessi maturati compresi==."},{"tipo":"principio","testo":"Per Robbins il rendimento non lo controlli. ==I costi sì.== Ogni punto risparmiato resta a te."},{"tipo":"chiusura","azione":"Hai un fondo? Cerca nel documento informativo la voce ==«costi correnti»==."}]},{"id":"investitore-intelligente-mr-market","categoria":"investimenti","titolo":"Il socio lunatico che ti fa un prezzo al giorno","libro":{"titolo":"L'investitore intelligente","autore":"Benjamin Graham","anno":1949,"titoloOriginale":"The Intelligent Investor"},"scene":[{"tipo":"apertura","testo":"Hai un socio che ogni mattina ti offre ==un prezzo diverso==."},{"tipo":"esempio","testo":"Benjamin Graham lo chiama Mr. Market. Ogni giorno vuole comprare la tua quota o vendertene altra. Ora è euforico, ora ==nel panico==."},{"tipo":"colpo","testo":"Mr. Market è la Borsa."},{"tipo":"confronto","a":{"etichetta":"Ti fai guidare","voci":["Lui esulta: compri anche tu","Lui trema: vendi di corsa"]},"b":{"etichetta":"Ti fai servire","voci":["Prima stimi tu il valore","Accetti solo se ti conviene"]}},{"tipo":"quiz","domanda":"L'azienda è identica a ieri. Mr. Market oggi la paga meno. Cos'è cambiato?","opzioni":["Il valore dell'azienda","L'umore del mercato"],"corretta":1,"spiegazione":"Per Graham il prezzo si muove anche quando gli affari sono gli stessi."},{"tipo":"principio","testo":"Il prezzo di oggi è ==un'offerta, non un verdetto==. Puoi ignorarla."},{"tipo":"chiusura","azione":"Apri una notizia di Borsa di oggi. Scrivi accanto: ==affari o umore?=="}]},{"id":"investitore-intelligente-margine-sicurezza","categoria":"investimenti","titolo":"Le tre parole che Graham metteva prima di tutto","libro":{"titolo":"L'investitore intelligente","autore":"Benjamin Graham","anno":1949,"titoloOriginale":"The Intelligent Investor"},"scene":[{"tipo":"apertura","testo":"Per Graham il segreto di un buon investimento sta in ==tre parole==."},{"tipo":"testo","titolo":"Come un ponte","testo":"Un ponte regge più dei camion che ci passano. Graham fa lo stesso coi soldi: paga ==meno di quanto stima che valga==. L'immagine è dell'allievo Buffett."},{"tipo":"numero","valore":30,"suffisso":"%","didascalia":"Stimi 100, paghi 70: è lo sconto. Se in realtà vale 80, sei ancora sotto.","nota":"Esempio illustrativo: cifre inventate."},{"tipo":"colpo","testo":"==Margine di sicurezza.=="},{"tipo":"principio","testo":"Il margine serve a ==reggere i tuoi errori== e la sfortuna. Non a indovinare il futuro."},{"tipo":"mito","mito":"Se l'azienda è ottima, il prezzo non conta","realta":"Per Graham il margine dipende dal prezzo: ==pagata troppo, sparisce==."},{"tipo":"chiusura","azione":"Prossimo acquisto grosso: scrivi ==quanto vale per te== e quanto costa. Guarda la distanza."}]},{"id":"spasso-wall-street-scimmia-bendata","categoria":"investimenti","titolo":"Una scimmia bendata contro gli esperti di Borsa","libro":{"titolo":"A spasso per Wall Street","autore":"Burton G. Malkiel","anno":1973,"titoloOriginale":"A Random Walk Down Wall Street"},"scene":[{"tipo":"apertura","testo":"Una ==scimmia bendata== tira freccette sulla pagina della Borsa."},{"tipo":"colpo","testo":"Contro i professionisti."},{"tipo":"testo","titolo":"La provocazione di Malkiel","testo":"Lo sostiene Burton Malkiel, economista di Princeton. Un portafoglio scelto a caso andrebbe ==più o meno come== quello degli esperti."},{"tipo":"mito","mito":"Chi studia i grafici sa dove andrà il prezzo","realta":"Per Malkiel i prezzi a breve fanno una ==passeggiata casuale==: imprevedibili."},{"tipo":"esempio","testo":"Malkiel fa disegnare ai suoi studenti un grafico tirando una moneta. Lo mostra a un esperto di grafici. Risposta: ==da comprare subito==."},{"tipo":"colpo","testo":"Era solo una moneta."},{"tipo":"principio","testo":"Per Malkiel le notizie entrano subito nei prezzi. E ==quelle di domani== non le conosce nessuno."},{"tipo":"chiusura","azione":"Cerca una previsione di Borsa di un anno fa e ==controlla com'è andata==."}]},{"id":"spasso-wall-street-castelli-in-aria","categoria":"investimenti","titolo":"Il concorso di bellezza che spiega la Borsa","libro":{"titolo":"A spasso per Wall Street","autore":"Burton G. Malkiel","anno":1973,"titoloOriginale":"A Random Walk Down Wall Street"},"scene":[{"tipo":"apertura","testo":"Cento foto su un giornale. Vince chi sceglie le sei più belle? ==No.=="},{"tipo":"quiz","domanda":"Vince chi indovina le sei facce più scelte. Tu quali indichi?","opzioni":["Quelle che piaceranno agli altri","Le più belle per me"],"corretta":0,"spiegazione":"È un concorso descritto da Keynes. Per lui in Borsa si fa lo stesso."},{"tipo":"testo","testo":"Burton Malkiel la chiama teoria dei castelli in aria. Non compri per ciò che vale, ma sperando che ==un altro paghi di più==."},{"tipo":"colpo","testo":"Finché l'altro si trova."},{"tipo":"confronto","a":{"etichetta":"Castelli in aria","voci":["Conta l'umore della folla","Compri per rivendere"]},"b":{"etichetta":"Fondamenta solide","voci":["Conta il valore di fondo","Lo stimi da utili e dividendi"]}},{"tipo":"principio","testo":"Per Malkiel alla lunga pesa il valore. Nel breve ==la folla porta i prezzi ovunque==."},{"tipo":"chiusura","azione":"Pensa a una cosa che comprano tutti. Scrivi ==che cosa rende==, a parte rivenderla."}]},{"id":"little-book-common-sense-costi","categoria":"investimenti","titolo":"La famiglia ricchissima e il conto degli Aiutanti","libro":{"titolo":"The Little Book of Common Sense Investing","autore":"John C. Bogle","anno":2007},"scene":[{"tipo":"apertura","testo":"Immagina una famiglia che possiede ==tutte le azioni d'America==."},{"tipo":"colpo","testo":"Poi arrivano gli Aiutanti."},{"tipo":"esempio","testo":"È una parabola che John Bogle riprende da Buffett. Gli Aiutanti promettono ai cugini una fetta più grande: basta scambiarsi le azioni. ==A commissione.=="},{"tipo":"quiz","domanda":"I cugini si scambiano azioni e pagano gli Aiutanti. Alla famiglia resta…","opzioni":["Di più","Lo stesso","Di meno"],"corretta":2,"spiegazione":"Gli utili sono gli stessi. Ma una fetta ora va agli Aiutanti."},{"tipo":"numero","valore":60,"suffisso":"%","didascalia":"Fra Aiutanti e tasse in più, alla famiglia resta questa fetta. ==Era il 100%.==","nota":"Cifra della parabola di Bogle, non un dato di mercato."},{"tipo":"principio","testo":"Tutti gli investitori insieme ==sono il mercato==: ne prendono il rendimento, meno i costi."},{"tipo":"chiusura","azione":"Hai un fondo? Cerca nel documento i ==costi annui in percentuale==."}]},{"id":"one-up-wall-street-quello-che-conosci","categoria":"investimenti","titolo":"L'idea d'investimento nata al supermercato","libro":{"titolo":"One Up on Wall Street","autore":"Peter Lynch, John Rothchild","anno":1989},"scene":[{"tipo":"apertura","testo":"Investi in ciò che conosci. Un consiglio famoso, ==capito a metà==."},{"tipo":"esempio","testo":"Anni Settanta. Carolyn Lynch prova dei collant da supermercato, i L'eggs. Ottimi. Il marito Peter studia Hanes, che li produce. ==L'azione andrà molto bene.=="},{"tipo":"colpo","testo":"Fin qui, la parte famosa."},{"tipo":"mito","mito":"Ti piace il prodotto? Compra le azioni","realta":"Per Lynch il prodotto è ==solo lo spunto==. Poi studi conti, debiti e prezzo."},{"tipo":"elenco","titolo":"Cosa controlla dopo l'intuizione","voci":["L'azienda guadagna? Ha troppi debiti?","Quanto pesa quel prodotto sui suoi conti?","Il prezzo è già alle stelle?"]},{"tipo":"principio","testo":"Chi usa i prodotti nota le buone aziende ==prima degli analisti==. Ma notarle è solo l'inizio."},{"tipo":"chiusura","azione":"Scegli un'azienda che usi. Spiega ad alta voce, ==in due minuti==, come guadagna."}]},{"id":"one-up-wall-street-sei-categorie","categoria":"investimenti","titolo":"Non tutte le azioni raccontano la stessa storia","libro":{"titolo":"One Up on Wall Street","autore":"Peter Lynch, John Rothchild","anno":1989},"scene":[{"tipo":"apertura","testo":"Coca-Cola e una compagnia aerea. Le giudichi ==con lo stesso metro?=="},{"tipo":"testo","testo":"Peter Lynch no. Prima di giudicare un'azienda la mette in una di ==sei categorie==. Da ognuna si aspetta cose diverse."},{"tipo":"elenco","titolo":"Le prime tre","voci":["Crescita lenta: grandi, mature, dividendi","Solide: colossi come Coca-Cola, reggono le crisi","Crescita rapida: piccole, aggressive, rischiose"]},{"tipo":"colpo","testo":"E le altre tre?"},{"tipo":"elenco","titolo":"Le altre tre","voci":["Cicliche: auto e aerei, su e giù con l'economia","In ripresa: in crisi, provano a rialzarsi","Con beni nascosti che il mercato non vede"]},{"tipo":"principio","testo":"Prima di chiederti se un'azione è buona, chiediti ==che tipo di storia è==."},{"tipo":"chiusura","azione":"Prendi tre aziende che usi. Mettile ==ognuna in una categoria==."}]},{"id":"common-stocks-uncommon-profits-scuttlebutt","categoria":"investimenti","titolo":"Vuoi capire un'azienda? Chiedi ai suoi rivali","libro":{"titolo":"Common Stocks and Uncommon Profits","autore":"Philip A. Fisher","anno":1958},"scene":[{"tipo":"apertura","testo":"Per sapere com'è un capo ==non chiedi al capo==."},{"tipo":"colpo","testo":"Chiedi a chi ci lavora."},{"tipo":"testo","titolo":"Scuttlebutt","testo":"Philip Fisher fa così con le aziende. «Scuttlebutt» sono le chiacchiere di bordo dei marinai. Per lui, ==un metodo d'indagine==."},{"tipo":"elenco","titolo":"Chi ascolta Fisher","voci":["Concorrenti","Fornitori e clienti","Ex dipendenti, ma con cautela"]},{"tipo":"quiz","domanda":"Il metodo di Fisher: vai da cinque aziende rivali. Che cosa chiedi a ognuna?","opzioni":["Pregi e difetti delle altre quattro","I suoi punti di forza"],"corretta":0,"spiegazione":"Dei rivali si parla volentieri. Quasi sempre esce un ritratto preciso di tutte."},{"tipo":"principio","testo":"Le notizie migliori su un'azienda ==non stanno nei suoi comunicati==."},{"tipo":"chiusura","azione":"Prima di un colloquio, fai ==una domanda a tre persone== che conoscono l'azienda."}]},{"id":"essays-warren-buffett-cerchio-competenza","categoria":"investimenti","titolo":"Buffett e il coraggio di dire «questo non lo capisco»","libro":{"titolo":"The Essays of Warren Buffett","autore":"Warren Buffett, Lawrence A. Cunningham","anno":1997},"scene":[{"tipo":"apertura","testo":"Non devi capire tutto. Devi sapere ==che cosa non capisci==."},{"tipo":"testo","titolo":"Il cerchio di competenza","testo":"Per Warren Buffett ognuno ha il suo. Dentro ci sono le aziende che sai valutare davvero. ==Fuori tiri a indovinare.=="},{"tipo":"quiz","domanda":"Per Buffett, del tuo cerchio cosa conta di più?","opzioni":["Che sia grande","Sapere dove finisce","Allargarlo ogni anno"],"corretta":1,"spiegazione":"Lo scrive agli azionisti: la grandezza conta poco, i confini sono vitali."},{"tipo":"esempio","testo":"Fine anni Novanta. Le azioni di internet volano. Buffett non compra: non sa prevedere chi resterà forte. Sembra ==rimasto indietro==."},{"tipo":"colpo","testo":"Poi la bolla scoppia."},{"tipo":"principio","testo":"Basta saper valutare ciò che sta nel tuo cerchio. E ==accorgerti quando ne esci==."},{"tipo":"chiusura","azione":"Scrivi tre settori che conosci e tre che no. ==Quel confine è il tuo cerchio.=="}]},{"id":"essays-warren-buffett-mozzicone-sigaro","categoria":"investimenti","titolo":"L'affare a prezzo stracciato che affare non era","libro":{"titolo":"The Essays of Warren Buffett","autore":"Warren Buffett, Lawrence A. Cunningham","anno":1997},"scene":[{"tipo":"apertura","testo":"Trovi per terra un ==mozzicone di sigaro==. Un tiro gratis. Lo raccogli?"},{"tipo":"testo","titolo":"Investire a mozziconi","testo":"Buffett agli inizi faceva così: aziende mediocri a prezzi stracciati. Un ultimo tiro, tutto guadagno. Ma ==resta un mozzicone==."},{"tipo":"quiz","domanda":"Il «primo errore» che Buffett confessa?","opzioni":["Comprare Berkshire Hathaway","Aver snobbato internet"],"corretta":0,"spiegazione":"Era un'azienda tessile in declino. La prese perché costava poco."},{"tipo":"colpo","testo":"Il tempo gioca contro."},{"tipo":"grafico","titolo":"Lo stesso +25%, se per incassarlo aspetti…","forma":"linea","unita":"%","dati":[{"e":"1 anno","v":25},{"e":"2 anni","v":11.8},{"e":"5 anni","v":4.6},{"e":"10 anni","v":2.3}],"nota":"Esempio illustrativo: compri a 8, rivendi a 10. Resa annua composta."},{"tipo":"principio","testo":"Per Buffett il tempo ==aiuta le aziende eccellenti== e logora le mediocri. Lo sconto non basta."},{"tipo":"chiusura","azione":"Trova una cosa presa solo per lo sconto. ==La ricompreresti a prezzo pieno?=="}]},{"id":"most-important-thing-secondo-livello","categoria":"investimenti","titolo":"Perché «buona azienda» non vuol dire «buon affare»","libro":{"titolo":"The Most Important Thing","autore":"Howard Marks","anno":2011},"scene":[{"tipo":"apertura","testo":"«È una buona azienda, quindi compro.» ==Dov'è l'errore?=="},{"tipo":"confronto","a":{"etichetta":"Primo livello","voci":["È una buona azienda","Quindi compro"]},"b":{"etichetta":"Secondo livello","voci":["Tutti la credono ottima","Il prezzo è gonfiato: vendo"]}},{"tipo":"testo","titolo":"L'idea di Howard Marks","testo":"Il primo livello lo pensano tutti. E ciò che pensano tutti ==è già nel prezzo==. Serve un'idea diversa. E più giusta."},{"tipo":"colpo","testo":"Riesce a pochi, ammette."},{"tipo":"quiz","domanda":"Utili in crescita, ma il titolo scende. Lettura di secondo livello?","opzioni":["Il mercato ha sbagliato","Ci si aspettava di più"],"corretta":1,"spiegazione":"Il prezzo conteneva attese più alte. Conta lo scarto fra fatti e attese."},{"tipo":"principio","testo":"Non chiederti solo se è buona. Chiediti ==che cosa sai tu che il prezzo non sa==."},{"tipo":"chiusura","azione":"Prendi una notizia economica. Scrivi cosa pensano tutti e ==cosa può sfuggire==."}]},{"id":"most-important-thing-rischio-invisibile","categoria":"investimenti","titolo":"Il rischio cresce quando nessuno lo vede","libro":{"titolo":"The Most Important Thing","autore":"Howard Marks","anno":2011},"scene":[{"tipo":"apertura","testo":"Più tutti si sentono al sicuro, ==più il pericolo cresce==."},{"tipo":"colpo","testo":"Prima però: cos'è il rischio?"},{"tipo":"mito","mito":"Il rischio è il prezzo che balla su e giù","realta":"Per Howard Marks è la possibilità di ==perdere soldi per sempre==."},{"tipo":"esempio","testo":"Guidi veloce nella nebbia e arrivi a casa. Era sicuro? No, ti è andata bene. Un buon risultato ==non prova che il rischio non c'era==."},{"tipo":"confronto","titolo":"Il paradosso del rischio","a":{"etichetta":"Tutti tranquilli","voci":["Si compra senza domande","Prezzi su, rischio su"]},"b":{"etichetta":"Tutti spaventati","voci":["Nessuno vuole comprare","Prezzi giù, rischio giù"]}},{"tipo":"principio","testo":"Per Marks il rischio nasce dal ==prezzo troppo alto==. E il prezzo sale quando nessuno ha paura."},{"tipo":"chiusura","azione":"Ripensa a una scelta di soldi andata bene. Scrivi ==due cose che potevano andare storte==."}]},{"id":"poor-charlies-almanack-modelli-mentali","categoria":"investimenti","titolo":"Una testa piena di attrezzi: i modelli mentali","libro":{"titolo":"Poor Charlie's Almanack","autore":"Charles T. Munger","anno":2005},"scene":[{"tipo":"apertura","testo":"Se hai solo un martello, ==ogni problema sembra un chiodo==."},{"tipo":"testo","titolo":"La diagnosi di Munger","testo":"Charlie Munger, socio di Buffett, lo ripeteva. Chi sa una sola materia la usa per tutto. ==Anche dove non c'entra.=="},{"tipo":"colpo","testo":"La cura? Più attrezzi."},{"tipo":"elenco","titolo":"Modelli che Munger cita","voci":["Interesse composto, dalla matematica","Incentivi, dalla psicologia","Sistemi di riserva, dall'ingegneria"]},{"tipo":"principio","testo":"I fatti isolati non servono. Vanno appesi a ==un reticolo di modelli== di tante discipline."},{"tipo":"quiz","domanda":"Per Munger, quanti modelli fanno quasi tutto il lavoro?","opzioni":["Tre o quattro","Migliaia","80 o 90"],"corretta":2,"spiegazione":"E pochi pesano davvero tanto. Purché vengano da materie diverse."},{"tipo":"chiusura","azione":"Guarda un tuo problema con un'altra materia: ==che cosa direbbe un ingegnere?=="}]},{"id":"poor-charlies-almanack-inversione","categoria":"investimenti","titolo":"Pensa al contrario: come fallire di sicuro","libro":{"titolo":"Poor Charlie's Almanack","autore":"Charles T. Munger","anno":2005}, rtenza?","Che andrà bene domani"],"corretta":1,"spiegazione":"Su tanti che provano, qualcuno vince a lungo per caso. Conta quanti hanno cominciato."},{"tipo":"principio","testo":"Se guardi solo chi è rimasto in piedi, ==scambi la fortuna per bravura==."},{"tipo":"chiusura","azione":"Davanti a una storia di successo chiediti: ==quanti sono spariti?=="}]},{"id":"big-short-torre-tripla-a","categoria":"investimenti","titolo":"Come il debito peggiore diventò tripla A","libro":{"titolo":"The Big Short","autore":"Michael Lewis","anno":2010},"scene":[{"tipo":"apertura","testo":"Debiti che pochi volevano. Poco dopo, gli stessi: ==«sicurissimi»==."},{"tipo":"colpo","testo":"Bastò ==impilarli==."},{"tipo":"testo","titolo":"La torre dei mutui","testo":"Michael Lewis la racconta così. I mutui a rischio finivano in un titolo a piani. Se i debitori non pagano, ==si allaga prima il piano terra==."},{"tipo":"elenco","titolo":"La ricetta del CDO","numerato":true,"voci":["Prendi 100 piani terra che pochi vogliono","Impilali: ecco una torre nuova","Chiedi il voto alle agenzie. Le paghi tu."]},{"tipo":"numero","valore":80,"suffisso":"%","didascalia":"della nuova torre ottenne il voto massimo: ==la tripla A==.","nota":"È la quota riportata da Lewis."},{"tipo":"mito","mito":"Se mescoli tanti rischi, il rischio sparisce","realta":"Solo se sono diversi. Quelli dipendevano tutti ==dal prezzo delle case==."},{"tipo":"chiusura","azione":"Ti dicono «è sicuro»? Chiedi: ==chi ha dato quel voto, e chi lo paga?=="}]},{"id":"cigno-nero-tacchino","categoria":"investimenti","titolo":"Mille giorni di prove, e il tacchino sbaglia","libro":{"titolo":"Il cigno nero","autore":"Nassim Nicholas Taleb","anno":2007,"titoloOriginale":"The Black Swan"},"scene":[{"tipo":"apertura","testo":"Per mille giorni un tacchino ha le prove che ==l'uomo gli vuole bene==."},{"tipo":"esempio","testo":"Ogni mattina arriva il cibo. Ogni giorno la sua fiducia cresce. È al massimo il mercoledì prima del Ringraziamento."},{"tipo":"colpo","testo":"Quel pomeriggio, ==la sorpresa==."},{"tipo":"numero","valore":1000,"suffisso":" giorni","didascalia":"di conferme. Sul giorno 1001 non dicevano ==niente==.","nota":"Esempio di Taleb, ripreso da Bertrand Russell."},{"tipo":"testo","titolo":"Il Cigno nero","testo":"Taleb chiama così l'evento raro, dall'impatto enorme, che dopo sembra ovvio. Per il tacchino lo è. ==Per il macellaio no.=="},{"tipo":"mito","mito":"Non è mai successo, quindi non succederà","realta":"Mille conferme non provano una regola. ==Basta un caso contrario.=="},{"tipo":"chiusura","azione":"Scegli una cosa «sempre andata così». Scrivi ==cosa fai se domani finisce==."}]},{"id":"four-pillars-costi","categoria":"investimenti","titolo":"I tre costi di un fondo che non stanno in vetrina","libro":{"titolo":"The Four Pillars of Investing","autore":"William J. Bernstein","anno":2002},"scene":[{"tipo":"apertura","testo":"Il costo che leggi su un fondo ==non è tutto== quello che paghi."},{"tipo":"elenco","titolo":"I quattro strati, per Bernstein","numerato":true,"voci":["Costo di gestione: l'unico in vetrina","Commissioni su ogni compravendita","Scarto fra prezzo di acquisto e vendita","Prezzi mossi dagli ordini del fondo"]},{"tipo":"colpo","testo":"Adesso ==sommali==."},{"tipo":"grafico","titolo":"Fondo USA di grandi azioni: costo l'anno","forma":"barre","unita":"%","dati":[{"e":"Scritto","v":1.3},{"e":"Totale","v":2.2}],"nota":"Stime di Bernstein (2002). Mercati emergenti: da 2% a 9%."},{"tipo":"testo","titolo":"Il quarto pilastro","testo":"Bernstein lo chiama il pilastro del business: l'industria finanziaria vive di commissioni. ==I suoi ricavi sono i tuoi costi.=="},{"tipo":"mito","mito":"Se costa di più, sarà gestito meglio","realta":"Per Bernstein la bravura dei gestori non si ripete. I costi sì: ==ogni anno==."},{"tipo":"chiusura","azione":"Hai un fondo? Nel suo documento cerca la riga ==«costi di transazione»==."}]},{"id":"antifragile-triade","categoria":"investimenti","titolo":"Il contrario di fragile non è robusto","libro":{"titolo":"Antifragile","autore":"Nassim Nicholas Taleb","anno":2012},"scene":[{"tipo":"apertura","testo":"Sul pacco c'è scritto «fragile». Cosa scrivi sul ==pacco opposto==?"},{"tipo":"quiz","domanda":"Qual è il vero contrario di «fragile»?","opzioni":["Robusto","Indistruttibile","Che migliora con gli urti"],"corretta":2,"spiegazione":"Il robusto resta uguale. Il contrario di chi perde con gli urti è chi ci guadagna."},{"tipo":"colpo","testo":"La parola ==non esisteva==."},{"tipo":"testo","testo":"Taleb la inventa: ==antifragile==. Il fragile teme gli scossoni. Il robusto li regge. L'antifragile ne ha bisogno."},{"tipo":"esempio","testo":"I muscoli sono antifragili: li affatichi e crescono. Un mese a letto, al riparo da ogni sforzo, e ==si indeboliscono==."},{"tipo":"principio","testo":"Lo shock non lo prevedi. Puoi capire ==se ti romperà o ti rafforzerà==."},{"tipo":"chiusura","azione":"Scegli un ambito: lavoro, soldi, salute. ==Un imprevisto lì ti rompe o ti migliora?=="}]},{"id":"manias-panics-crashes-copione","categoria":"investimenti","titolo":"Le crisi finanziarie recitano sempre lo stesso copione","libro":{"titolo":"Manias, Panics, and Crashes","autore":"Charles P. Kindleberger","anno":1978},"scene":[{"tipo":"apertura","testo":"Tulipani nel 1637. Wall Street nel 1929. ==Stesso copione.=="},{"tipo":"colpo","testo":"Tre secoli, ==un solo schema==."},{"tipo":"elenco","titolo":"Il copione, dal modello di Minsky","numerato":true,"voci":["Una novità promette guadagni","Il credito si allarga, i prezzi salgono","Euforia: si compra solo per rivendere","Panico: tutti verso l'uscita"]},{"tipo":"quiz","domanda":"Per Kindleberger, cosa trasforma l'entusiasmo in una mania?","opzioni":["Il credito facile","Una grande truffa","Un errore dei governi"],"corretta":0,"spiegazione":"Senza soldi in prestito l'entusiasmo resta piccolo. È il debito facile a gonfiarlo."},{"tipo":"principio","testo":"Per Kindleberger le manie cambiano oggetto, non meccanismo: ==credito, euforia, panico==."},{"tipo":"chiusura","azione":"Prendi la moda finanziaria del momento. Prova a dire ==in quale atto si trova==."}]},{"id":"giocati-dal-caso-rumore","categoria":"investimenti","titolo":"Più guardi il conto, più vedi rumore","libro":{"titolo":"Giocati dal caso","autore":"Nassim Nicholas Taleb","anno":2001,"titoloOriginale":"Fooled by Randomness"},"scene":[{"tipo":"apertura","testo":"Quante volte al giorno controlli ==come vanno i tuoi soldi==?"},{"tipo":"esempio","testo":"Taleb immagina un dentista con un ottimo portafoglio: in media rende il 15% l'anno più dei titoli di Stato, con oscillazioni del 10%. Lo controlla ==di continuo==."},{"tipo":"grafico","titolo":"Lo vede in attivo, se guarda ogni…","forma":"barre","unita":"%","dati":[{"e":"Minuto","v":50.2},{"e":"Giorno","v":54},{"e":"Mese","v":67},{"e":"Anno","v":93}],"nota":"Esempio illustrativo di Taleb, non una previsione."},{"tipo":"colpo","testo":"Ogni minuto: ==testa o croce==."},{"tipo":"testo","testo":"Il portafoglio è lo stesso. Ma una perdita ==brucia più== di quanto un guadagno consoli. Il dentista arriva a sera sfinito."},{"tipo":"mito","mito":"Più controllo, più capisco come va","realta":"Sul breve vedi le oscillazioni, non il rendimento: ==raccogli rumore==."},{"tipo":"chiusura","azione":"Togli le notifiche sui prezzi. Decidi ==una data fissa== per guardare."}]},{"id":"stocks-long-run-orizzonte","categoria":"investimenti","titolo":"Quanto rischi dipende da quanto aspetti","libro":{"titolo":"Stocks for the Long Run","autore":"Jeremy J. Siegel","anno":1994},"scene":[{"tipo":"apertura","testo":"Su un anno le azioni fanno paura. E su ==vent'anni==?"},{"tipo":"testo","testo":"Jeremy Siegel ricostruisce due secoli di borsa americana, dal 1802. Poi toglie ==l'inflazione==."},{"tipo":"confronto","titolo":"Azioni USA, tolta l'inflazione","a":{"etichetta":"Tenute un anno","voci":["Anno peggiore: −38,6%"]},"b":{"etichetta":"Tenute vent'anni","voci":["Ventennio peggiore: circa +1% l'anno"]}},{"tipo":"mito","mito":"Le obbligazioni sono sempre le più sicure","realta":"Nei dati di Siegel in certi ventenni perdono ==contro l'inflazione==. Le azioni mai."},{"tipo":"principio","testo":"Per Siegel il rischio non è fisso: ==dipende da quanto a lungo tieni==."},{"tipo":"colpo","testo":"Però ==attenzione==."},{"tipo":"testo","testo":"È un solo Paese, fortunato. Sull'Ottocento c'è chi contesta i suoi dati. E Tokyo ha rivisto i massimi del 1989 solo ==dopo 34 anni==."},{"tipo":"chiusura","azione":"Accanto a ogni somma che hai da parte scrivi ==fra quanti anni ti serve==."}]},{"id":"cigno-nero-estremistan","categoria":"investimenti","titolo":"Entra il più ricco del mondo e la media impazzisce","libro":{"titolo":"Il cigno nero","autore":"Nassim Nicholas Taleb","anno":2007,"titoloOriginale":"The Black Swan"},"scene":[{"tipo":"apertura","testo":"Un super ricco entra in sala. In media, ora siete ==tutti milionari==."},{"tipo":"confronto","titolo":"Esempio illustrativo: uno in più","a":{"etichetta":"Entra il più pesante","voci":["Mille da 70 kg, lui 300","La media sale di 2 etti"]},"b":{"etichetta":"Entra il più ricco","voci":["Mille da 100 mila euro, lui 100 miliardi","La media sale a 100 milioni a testa"]}},{"tipo":"colpo","testo":"Due mondi ==diversi==."},{"tipo":"testo","testo":"Taleb li chiama ==Mediocristan== ed ==Estremistan==. Nel primo nessun caso sposta il totale. Nel secondo ne basta uno."},{"tipo":"quiz","domanda":"Quale vive nell'Estremistan?","opzioni":["Le copie vendute da un libro","L'altezza","Le ore di sonno"],"corretta":0,"spiegazione":"Un libro può vendere più di mille altri insieme. Nessuno è alto mille volte te."},{"tipo":"principio","testo":"Dove un caso solo può cambiare tutto, ==la media ti dice poco==."},{"tipo":"chiusura","azione":"Prendi una «media» che usi spesso. ==Un caso solo può stravolgerla?=="}]},{"id":"when-genius-failed-leva","categoria":"investimenti","titolo":"Due Nobel, un fondo e il debito che lo affondò","
