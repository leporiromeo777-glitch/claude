<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<title>Colto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Colto: le idee dei grandi libri di crescita personale, economia e finanza in brevi video verticali da scorrere.">
<meta name="theme-color" content="#151210">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<style>
/* Colto. Una colonna 9:16 a tutto schermo: ogni video è una «copertina» a tinta piatta,
   testo allineato a sinistra, azioni a destra, capitoli in basso. Angoli vivi, etichette piene. */
:root {
  color-scheme: dark;
  --fondo: #151210;   /* attorno al palco sugli schermi larghi */
  --carta: #F3ECDD;   /* chiaro di riserva */
  --bg: #2A2622;      /* le quattro tinte della clip attiva: le ridefinisce lo script */
  --ink: #F3ECDD;
  --acc: #FFD23F;
  --su: #1B1A12;
  --f-titoli: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-testo: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-dati: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --morbido: cubic-bezier(.2, .7, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--carta);
  font-family: var(--f-testo);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
svg { width: 1.25em; height: 1.25em; fill: currentColor; flex: none; }
.tratto { fill: none !important; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app { position: relative; height: 100%; overflow: hidden; }
.app, .clip {
  --linea: color-mix(in srgb, var(--ink) 28%, transparent);
  --velatura: color-mix(in srgb, var(--ink) 10%, transparent);
}

/* ---------- feed ---------- */
.feed {
  height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.feed::-webkit-scrollbar { display: none; }
.clip {
  position: relative;
  height: 100%;
  display: grid;
  place-items: center;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  background: color-mix(in srgb, var(--bg) 24%, var(--fondo));
}
.palco, .cromo {
  height: 100%;
  aspect-ratio: 9 / 16;
  max-width: 100%;
  container-type: size;
}
.palco {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: var(--bg);
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  --u: 1cqw;
}
@media (min-aspect-ratio: 3/4) and (min-height: 560px) {
  .palco, .cromo { height: calc(100% - 28px); }
  .palco { border-radius: 10px; }
}

/* ---------- forme sullo sfondo ---------- */
.forme { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.f {
  position: absolute; left: 0; top: 0;
  width: 60cqw; height: 60cqw; margin: -30cqw 0 0 -30cqw;
  transition: transform 1.25s cubic-bezier(.65, 0, .2, 1);
  --t: color-mix(in srgb, var(--ink) 9%, transparent);
}
.f--cerchio { border-radius: 50%; background: var(--t); }
.f--anello { border-radius: 50%; border: 7cqw solid var(--t); }
.f--mezzo { height: 30cqw; border-radius: 30cqw 30cqw 0 0; background: var(--t); }
.f--quadro { background: var(--t); }
.f--righe { background: repeating-linear-gradient(90deg, var(--t) 0 2.2cqw, transparent 2.2cqw 5.4cqw); }
.f--punti { background: radial-gradient(circle, var(--t) 0 1.1cqw, transparent 1.2cqw) 0 0 / 5cqw 5cqw; }

/* ---------- scene ---------- */
.scene { position: absolute; inset: 0; }
.scena {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  padding-block: 25cqw 41cqw;
  padding-left: max(16px, 7cqw, env(safe-area-inset-left, 0px));
  padding-right: max(16px, 17cqw, env(safe-area-inset-right, 0px));
  visibility: hidden; opacity: 0;
  --u: calc(1cqw * var(--s, 1));
}
.scena.on, .scena.fermo { visibility: visible; opacity: 1; }
.corpo { display: flex; flex-direction: column; gap: calc(4.4 * var(--u)); min-width: 0; }

/* Montaggio: tagli netti fra le scene, un lento avvicinamento dentro ogni scena,
   parole che arrivano una alla volta. Qualcosa si muove sempre. */
.scena.on { animation: carrello var(--dur, 6s) linear both; transform-origin: 30% 46%; }
.scena.on .corpo { animation: taglio .2s var(--morbido) both; }
.scena.fermo, .scena.fermo .corpo { animation: none; }
@keyframes carrello { from { transform: scale(1); } to { transform: scale(1.045); } }
@keyframes taglio { from { transform: translateY(calc(2.4 * var(--u))) scale(.97); } to { transform: none; } }

.entra, .p { opacity: 0; }
.p, .k { display: inline-block; }
.k { opacity: .32; }
.scena.on .entra { animation: sale .42s var(--morbido) both; animation-delay: var(--d, 0ms); }
.scena.on .p { animation: parola .34s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: var(--d, 0ms); }
.scena.on .k { animation: accende .26s ease-out both; animation-delay: var(--d, 0ms); }
.scena.fermo .entra, .scena.fermo .p, .scena.fermo .k { opacity: 1; animation: none; }
.palco.in-pausa * { animation-play-state: paused !important; }
@keyframes sale { from { opacity: 0; transform: translateY(calc(3.5 * var(--u))); } to { opacity: 1; transform: none; } }
@keyframes parola { from { opacity: 0; transform: translateY(.4em) scale(.74); } to { opacity: 1; transform: none; } }
@keyframes accende { from { opacity: .32; } 55% { opacity: 1; transform: translateY(-.05em); } to { opacity: 1; transform: none; } }

mark {
  --m-bg: var(--acc); --m-ink: var(--su);
  color: inherit;
  background: linear-gradient(var(--m-bg), var(--m-bg)) no-repeat 0 60% / 0% 88%;
  padding: 0 .06em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.scena.on mark { animation: evidenzia .4s ease-out both; animation-delay: var(--d, 700ms); }
.scena.on .entra > mark, .scena.on li.entra mark, .scena.on .lato.entra mark { animation-delay: calc(var(--d, 0ms) + 450ms); }
.scena.fermo:not(.on) mark { background-size: 100% 88%; color: var(--m-ink); }
@keyframes evidenzia { to { background-size: 100% 88%; color: var(--m-ink); } }

.etichetta { font: 500 max(10px, calc(3.05 * var(--u))) / 1.2 var(--f-dati); letter-spacing: .09em; text-transform: uppercase; }
.gancio { font-family: var(--f-titoli); font-stretch: 68%; font-weight: 800; font-size: calc(12.4 * var(--u) * var(--z, 1)); line-height: .98; letter-spacing: -.012em; text-wrap: balance; }
.titolo { font-family: var(--f-titoli); font-stretch: 72%; font-weight: 760; font-size: calc(8.6 * var(--u) * var(--z, 1)); line-height: 1.02; letter-spacing: -.008em; text-wrap: balance; }
.titolo--piccolo { font-size: calc(7 * var(--u) * var(--z, 1)); }
.paragrafo { font-size: calc(5.5 * var(--u)); line-height: 1.32; font-weight: 440; text-wrap: pretty; }
.massima { font-style: italic; font-weight: 500; font-size: calc(9 * var(--u) * var(--z, 1)); line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
.nota { font: 400 max(10px, calc(3.2 * var(--u))) / 1.4 var(--f-dati); opacity: .88; }

/* colpo: una frase-pugno su fondo pieno, con una piccola scossa */
.scena--colpo { background: var(--acc); color: var(--su); }
.scena--colpo mark { --m-bg: var(--su); --m-ink: var(--acc); }
.pugno { font-family: var(--f-titoli); font-stretch: 64%; font-weight: 900; font-size: calc(17.5 * var(--u) * var(--z, 1)); line-height: .93; letter-spacing: -.015em; text-wrap: balance; }
.scena--colpo.on .p { animation: schianto .3s cubic-bezier(.2, .9, .3, 1) both; animation-delay: var(--d, 0ms); }
@keyframes schianto { from { opacity: 0; transform: scale(1.9) rotate(-3deg); } 70% { opacity: 1; transform: scale(.96); } to { opacity: 1; transform: none; } }
.palco.scossa .scene { animation: scossa .28s linear; }
@keyframes scossa {
  0%, 100% { transform: none; }
  20% { transform: translate(-1.2cqw, .6cqw) rotate(-.5deg); }
  45% { transform: translate(1cqw, -.5cqw) rotate(.4deg); }
  70% { transform: translate(-.5cqw, .3cqw); }
}

/* mito: la frase che si sente dire, il timbro, poi la versione del libro */
.mito-detto { position: relative; display: flex; flex-direction: column; gap: calc(2.4 * var(--u)); padding: calc(4.4 * var(--u)) calc(4.4 * var(--u)) calc(5.4 * var(--u)); border: max(1.5px, .45cqw) solid var(--linea); }
.mito-frase { font-style: italic; font-weight: 500; font-size: calc(7.4 * var(--u)); line-height: 1.12; text-wrap: balance; transition: opacity .3s; text-decoration: line-through transparent; text-decoration-thickness: .07em; }
.timbro { position: absolute; right: calc(3 * var(--u)); bottom: calc(-3.6 * var(--u)); padding: calc(.9 * var(--u)) calc(2.6 * var(--u)) calc(.6 * var(--u)); border: calc(.7 * var(--u)) solid var(--acc); background: var(--bg); color: var(--acc); font-family: var(--f-titoli); font-stretch: 70%; font-weight: 900; font-size: calc(7.6 * var(--u)); line-height: 1; letter-spacing: .04em; text-transform: uppercase; rotate: -8deg; opacity: 0; transform: scale(2.4); }
.timbrata .timbro { opacity: 1; transform: none; transition: transform .2s cubic-bezier(.3, 1.4, .5, 1), opacity .08s; }
.timbrata .mito-frase { opacity: .55; text-decoration-color: currentColor; }
.mito-vero { display: flex; flex-direction: column; gap: calc(2.4 * var(--u)); margin-top: calc(1.6 * var(--u)); padding: calc(4.4 * var(--u)); background: var(--acc); color: var(--su); visibility: hidden; opacity: 0; transform: translateY(calc(3 * var(--u))); transition: opacity .28s, transform .34s var(--morbido), visibility 0s .3s; }
.svelata .mito-vero { visibility: visible; opacity: 1; transform: none; transition: opacity .28s, transform .34s var(--morbido); }
.mito-realta { font-family: var(--f-titoli); font-stretch: 88%; font-weight: 620; font-size: calc(6 * var(--u)); line-height: 1.14; text-wrap: balance; }
.mito-vero mark { --m-bg: var(--su); --m-ink: var(--acc); }
.scena--mito.on mark { animation: none; }
.scena--mito.svelata mark { animation: evidenzia .45s .4s ease-out both; }

/* elenco */
.voci { display: flex; flex-direction: column; gap: calc(3.6 * var(--u)); }
.voci li { display: grid; grid-template-columns: auto 1fr; gap: calc(3.2 * var(--u)); align-items: start; font-family: var(--f-titoli); font-stretch: 92%; font-weight: 560; font-size: calc(5.5 * var(--u)); line-height: 1.2; }
.segno { width: calc(2.6 * var(--u)); height: calc(2.6 * var(--u)); margin-top: calc(2 * var(--u)); background: var(--acc); }
.voci--numerate .segno { display: grid; place-items: center; width: calc(7 * var(--u)); height: calc(7 * var(--u)); margin-top: calc(-.2 * var(--u)); color: var(--su); font: 500 calc(3.8 * var(--u)) / 1 var(--f-dati); }

/* numero */
.cifra { display: flex; align-items: baseline; gap: calc(1.2 * var(--u)); font-family: var(--f-titoli); font-stretch: 62%; font-weight: 900; font-size: calc(34 * var(--u) * var(--z, 1)); line-height: .86; letter-spacing: -.02em; color: var(--acc); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cifra-lato { font-size: .5em; font-stretch: 75%; }

/* confronto */
.lati { display: flex; flex-direction: column; gap: calc(3 * var(--u)); }
.lato { display: flex; flex-direction: column; gap: calc(2.4 * var(--u)); padding: calc(4 * var(--u)) calc(4.4 * var(--u)) calc(4.4 * var(--u)); border: max(1.5px, .45cqw) solid var(--linea); }
.lato ul { display: flex; flex-direction: column; gap: calc(1.6 * var(--u)); }
.lato li { font-family: var(--f-titoli); font-stretch: 92%; font-weight: 540; font-size: calc(5 * var(--u)); line-height: 1.2; }
.lato--b { background: var(--acc); border-color: var(--acc); color: var(--su); }
.lato--b mark { --m-bg: var(--su); --m-ink: var(--acc); }

/* grafico */
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.g-base { stroke: var(--linea); stroke-width: .5; }
.g-linea { fill: none; stroke: var(--acc); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.g-area { fill: var(--acc); opacity: 0; }
.g-punto { fill: var(--ink); opacity: 0; }
.g-punto--fine { fill: var(--acc); stroke: var(--bg); stroke-width: .8; }
.g-barra { fill: color-mix(in srgb, var(--ink) 36%, transparent); transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); }
.g-barra--max { fill: var(--acc); }
.g-asse, .g-val { font-family: var(--f-dati); fill: var(--ink); }
.g-asse { font-size: 3.5px; opacity: .88; }
.g-val { font-size: 4.2px; font-weight: 500; opacity: 0; }
.scena.on .g-linea { animation: traccia 1.7s .45s cubic-bezier(.5, 0, .3, 1) forwards; }
.scena.on .g-area { --fino: .16; animation: appare .8s 1.6s forwards; }
.scena.on .g-punto, .scena.on .g-val { animation: appare .4s forwards; animation-delay: var(--d, 0ms); }
.scena.on .g-barra { animation: cresce .7s var(--morbido) forwards; animation-delay: var(--d, 0ms); }
@keyframes traccia { to { stroke-dashoffset: 0; } }
@keyframes appare { to { opacity: var(--fino, 1); } }
@keyframes cresce { to { transform: scaleY(1); } }

/* esempio */
.scheda { display: flex; flex-direction: column; gap: calc(3 * var(--u)); padding: calc(5 * var(--u)) calc(5 * var(--u)) calc(6 * var(--u)); background: var(--ink); color: var(--bg); rotate: -1.2deg; }
.scheda mark { --m-bg: var(--bg); --m-ink: var(--ink); }

/* quiz */
.domanda { font-family: var(--f-titoli); font-stretch: 80%; font-weight: 700; font-size: calc(6.6 * var(--u) * var(--z, 1)); line-height: 1.1; text-wrap: balance; }
.opzioni { display: flex; flex-direction: column; gap: calc(2.4 * var(--u)); }
.opzione { display: grid; grid-template-columns: auto 1fr; gap: calc(3 * var(--u)); align-items: center; min-height: 44px; padding: calc(3.2 * var(--u)) calc(3.6 * var(--u)); border: max(1.5px, .45cqw) solid var(--linea); text-align: left; font-family: var(--f-titoli); font-stretch: 92%; font-weight: 560; font-size: calc(5 * var(--u)); line-height: 1.15; transition: background .25s, color .25s, border-color .25s, opacity .25s; }
.opzione:disabled { cursor: default; }
.lettera { font: 500 calc(3.6 * var(--u)) / 1 var(--f-dati); opacity: .8; }
.opzione.giusta { background: var(--acc); border-color: var(--acc); color: var(--su); animation: centro .42s cubic-bezier(.3, 1.6, .5, 1); }
.opzione.sbagliata { text-decoration: line-through; animation: no .3s linear; }
@keyframes centro { 35% { transform: scale(1.045); } }
@keyframes no { 25% { transform: translateX(-1.4cqw); } 60% { transform: translateX(1.2cqw); } }
.rivelata .opzione:not(.giusta) { opacity: .55; }
@media (hover: hover) { .opzione:not(:disabled):hover { background: var(--velatura); } }
.spiegazione { font-size: calc(4.9 * var(--u)); line-height: 1.3; visibility: hidden; opacity: 0; transform: translateY(calc(2 * var(--u))); transition: opacity .4s, transform .4s var(--morbido); }
.rivelata .spiegazione { visibility: visible; opacity: 1; transform: none; }

/* chiusura */
.azione { font-family: var(--f-titoli); font-stretch: 72%; font-weight: 760; font-size: calc(8.8 * var(--u) * var(--z, 1)); line-height: 1.03; text-wrap: balance; }
.colofone { display: flex; flex-direction: column; gap: calc(1.2 * var(--u)); margin-top: calc(2 * var(--u)); padding-top: calc(4 * var(--u)); border-top: max(1.5px, .45cqw) solid var(--linea); }
.colofone-da { font: 500 max(10px, calc(2.9 * var(--u))) / 1.2 var(--f-dati); letter-spacing: .09em; text-transform: uppercase; opacity: .85; }
.colofone-libro { font-style: italic; font-weight: 500; font-size: calc(6.2 * var(--u)); line-height: 1.1; }
.colofone-autore { font: 400 max(10px, calc(3.4 * var(--u))) / 1.3 var(--f-dati); }

/* ---------- sopra il video ---------- */
.piede { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 3.4cqw; padding-bottom: max(12px, 4cqw); padding-left: max(16px, 7cqw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 7cqw, env(safe-area-inset-right, 0px)); pointer-events: none; }
.didascalia { display: flex; flex-direction: column; gap: 1cqw; padding-right: 12cqw; }
.did-titolo { font-family: var(--f-titoli); font-stretch: 88%; font-weight: 680; font-size: max(14px, 4.3cqw); line-height: 1.15; }
.did-libro { font-size: max(13px, 3.9cqw); line-height: 1.25; }
.avanzamento { display: flex; gap: 1.1cqw; height: max(3px, .8cqw); }
.avanzamento i { flex: 1 1 0; overflow: hidden; background: color-mix(in srgb, currentColor 28%, transparent); }
.avanzamento b { display: block; height: 100%; background: currentColor; transform: scaleX(0); transform-origin: 0 50%; }

/* durante un «colpo» il fondo è la tinta d'accento: testi e icone sopra il video cambiano colore con lui */
.palco.su-accento .piede, .palco.su-accento .azioni { color: var(--su); }
.palco.su-accento .az[aria-pressed="true"] svg { fill: currentColor; stroke: currentColor; }

/* l'invito a scorrere: compare sull'ultima scena con il titolo della prossima idea */
.prossima { position: absolute; left: max(16px, 7cqw, env(safe-area-inset-left, 0px)); bottom: calc(100% + 3.4cqw); max-width: 72cqw; pointer-events: auto; display: grid; grid-template-columns: 1fr auto; gap: .6cqw 3cqw; align-items: center; padding: 2.6cqw 3.4cqw; background: var(--ink); color: var(--bg); text-align: left; opacity: 0; visibility: hidden; transform: translateY(4cqw); transition: opacity .25s, transform .3s var(--morbido), visibility 0s .3s; }
.prossima span { font: 500 max(9.5px, 2.6cqw) / 1.2 var(--f-dati); letter-spacing: .09em; text-transform: uppercase; }
.prossima b { grid-column: 1; font-family: var(--f-titoli); font-stretch: 84%; font-weight: 700; font-size: max(13.5px, 4.1cqw); line-height: 1.12; }
.prossima svg { grid-column: 2; grid-row: 1 / 3; width: max(22px, 6cqw); height: max(22px, 6cqw); animation: su-e-giu 1s ease-in-out infinite; }
.alla-fine .prossima { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .3s var(--morbido); }
@keyframes su-e-giu { 50% { transform: translateY(-1.4cqw); } }

/* ricompense: punti che salgono, coriandoli */
.punti-volanti { position: absolute; left: 50%; top: 27%; display: flex; align-items: center; gap: 1.2cqw; padding: 1.6cqw 3.4cqw 1.6cqw 2.4cqw; background: var(--acc); color: var(--su); font-family: var(--f-titoli); font-stretch: 68%; font-weight: 900; font-size: 9cqw; line-height: 1; pointer-events: none; animation: sale-punti 1.25s var(--morbido) forwards; }
.punti-volanti svg { width: .8em; height: .8em; }
@keyframes sale-punti {
  0% { opacity: 0; transform: translate(-50%, 8cqw) scale(.5) rotate(-6deg); }
  18% { opacity: 1; transform: translate(-50%, 0) scale(1.12) rotate(-3deg); }
  30% { transform: translate(-50%, 0) scale(1) rotate(-3deg); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -26cqw) scale(.9) rotate(-3deg); }
}
.coriandoli { position: absolute; width: 0; height: 0; pointer-events: none; }
.coriandoli i { position: absolute; left: -1.2cqw; top: -1.2cqw; width: 2.4cqw; height: 2.4cqw; background: var(--tinta, var(--acc)); animation: scoppio 1.15s cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes scoppio {
  0% { opacity: 1; transform: none; }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 22cqw)) rotate(var(--giro)); }
}

.azioni { position: absolute; right: max(6px, 2cqw, env(safe-area-inset-right, 0px)); bottom: max(40px, 12.5cqw); display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; }

mani. ==Blocca in agenda== da 60 a 90 minuti."}]},{"id":"7-regole-cerchio-di-influenza","categoria":"crescita","titolo":"Due cerchi che spiegano dove finisce la tua energia","libro":{"titolo":"Le 7 regole per avere successo","autore":"Stephen R. Covey","anno":1989,"titoloOriginale":"The 7 Habits of Highly Effective People"},"scene":[{"tipo":"apertura","testo":"Quanta energia butti in cose che ==non dipendono da te==?"},{"tipo":"testo","testo":"Stephen Covey disegna due cerchi. Il grande: ciò che ti preoccupa. Il piccolo, dentro: ciò su cui ==puoi agire==."},{"tipo":"confronto","titolo":"Dove va la tua energia?","a":{"etichetta":"Preoccupazione","voci":["Il carattere del capo","Il meteo, il traffico"]},"b":{"etichetta":"Influenza","voci":["Come ti prepari e rispondi","Le tue abitudini"]}},{"tipo":"quiz","domanda":"Quale frase viene dal cerchio d'influenza?","opzioni":["«Se solo il capo cambiasse»","«Preparo meglio la riunione»","«Con questi colleghi è inutile»"],"corretta":1,"spiegazione":"Le frasi reattive parlano degli altri. Quelle proattive partono da te."},{"tipo":"colpo","testo":"E i cerchi ==non stanno fermi==."},{"tipo":"principio","testo":"Per Covey, se lavori sul cerchio piccolo, ==si allarga==. Se fissi solo il grande, il piccolo si restringe."},{"tipo":"chiusura","azione":"Scrivi la preoccupazione di oggi e ==un gesto== che dipende da te. Fallo."}]},{"id":"7-regole-importante-non-urgente","categoria":"crescita","titolo":"Le cose importanti non suonano mai","libro":{"titolo":"Le 7 regole per avere successo","autore":"Stephen R. Covey","anno":1989,"titoloOriginale":"The 7 Habits of Highly Effective People"},"scene":[{"tipo":"apertura","testo":"Hai corso tutto il giorno. La cosa che contava ==è rimasta lì==."},{"tipo":"colpo","testo":"Urgente non è importante."},{"tipo":"elenco","titolo":"I quattro quadranti di Covey","numerato":true,"voci":["Urgente e importante: le crisi","==Importante, non urgente==: salute, studio","Urgente, non importante: interruzioni","Nessuno dei due: tempo perso"]},{"tipo":"quiz","domanda":"Allenarti con regolarità: in quale quadrante sta?","opzioni":["Urgente e importante","Urgente, non importante","Importante, non urgente"],"corretta":2,"spiegazione":"Nessuno te lo chiede oggi. Ma se lo trascuri, prima o poi diventa una crisi."},{"tipo":"principio","testo":"Per Covey il secondo quadrante è il cuore di tutto. O lo metti in agenda tu, o ==non ci entra==."},{"tipo":"chiusura","azione":"Apri l'agenda e ==blocca un'ora== per una cosa importante che nessuno ti chiede."}]},{"id":"pensa-arricchisci-master-mind","categoria":"crescita","titolo":"Scegli chi ragiona con te","libro":{"titolo":"Pensa e arricchisci te stesso","autore":"Napoleon Hill","anno":1937,"titoloOriginale":"Think and Grow Rich"},"scene":[{"tipo":"apertura","testo":"Conta le persone con cui ragioni sui tuoi obiettivi. ==Zero?=="},{"tipo":"mito","mito":"Chi arriva in alto ce l'ha fatta da solo","realta":"Per Napoleon Hill dietro ogni grande piano c'è ==un gruppo che pensa insieme==."},{"tipo":"testo","titolo":"Il Master Mind","testo":"Hill lo chiama così. Più persone uniscono conoscenze e sforzi, ==in armonia==, per uno scopo preciso."},{"tipo":"elenco","titolo":"Le istruzioni di Hill","numerato":true,"voci":["Scegli chi serve al tuo piano","Decidi cosa offri tu in cambio","Vedetevi almeno due volte a settimana","Tenete l'armonia, o non funziona"]},{"tipo":"colpo","testo":"Ma occhio alla storia."},{"tipo":"testo","testo":"Hill dice di averlo imparato da Andrew Carnegie, re dell'acciaio. Il biografo di Carnegie non ha trovato ==prove di un loro incontro==. L'idea resta."},{"tipo":"chiusura","azione":"Scrivi a ==due persone== che stimi: un incontro fisso per parlare di obiettivi."}]},{"id":"as-a-man-thinketh-mente-giardino","categoria":"crescita","titolo":"Nella tua testa qualcosa cresce sempre","libro":{"titolo":"As a Man Thinketh","autore":"James Allen","anno":1903},"scene":[{"tipo":"apertura","testo":"Un giardino abbandonato non resta vuoto. ==Si riempie di erbacce.=="},{"tipo":"colpo","testo":"Per Allen, la mente fa uguale."},{"tipo":"testo","testo":"A inizio Novecento James Allen paragona la mente a un giardino. Se non ci semini pensieri utili, ==ci crescono da soli== quelli inutili."},{"tipo":"confronto","a":{"etichetta":"Giardino trascurato","voci":["Pensieri che arrivano a caso","Lamentele ripetute"]},"b":{"etichetta":"Giardino coltivato","voci":["Scegli cosa seminare","Strappi le erbacce"]}},{"tipo":"esempio","testo":"Due colleghi, la stessa critica. Uno ci rimugina per giorni. L'altro si chiede cosa imparare. ==Due semi diversi==."},{"tipo":"principio","testo":"Tesi di Allen: il carattere è la somma dei tuoi pensieri. E ogni gesto ==nasce da un seme==."},{"tipo":"testo","testo":"Allen esagera: quasi tutto ciò che ti capita nascerebbe dai pensieri. È una convinzione, non un fatto. Ma il giardino ==lo curi tu==."},{"tipo":"chiusura","azione":"Scrivi il pensiero che oggi hai ripetuto di più. ==Erbaccia o seme?=="}]},{"id":"magic-thinking-big-malattia-delle-scuse","categoria":"crescita","titolo":"La scusa che ripeti finisce per sembrarti vera","libro":{"titolo":"The Magic of Thinking Big","autore":"David J. Schwartz","anno":1959},"scene":[{"tipo":"apertura","testo":"«Troppo vecchio», «non portato», «sfortunato». ==Quale usi tu?=="},{"tipo":"testo","testo":"David Schwartz la chiama «excusitis»: malattia delle scuse. Chi combina poco, dice, ha sempre ==un perché pronto==."},{"tipo":"elenco","titolo":"Le quattro scuse classiche","voci":["Salute: «non sto bene»","Intelligenza: «non ci arrivo»","Età: «ormai è tardi»","Fortuna: «a me va male»"]},{"tipo":"colpo","testo":"Poi succede il peggio."},{"tipo":"principio","testo":"Per Schwartz all'inizio sai che è un alibi. Ripetilo abbastanza e ==finisci per crederci==."},{"tipo":"quiz","domanda":"A 40 anni vuoi cambiare mestiere. Che direbbe Schwartz?","opzioni":["Hai decenni di lavoro davanti","Ormai è tardi","Aspetta il momento giusto"],"corretta":0,"spiegazione":"Nel libro lo dice a un quarantenne: 20 anni di lavoro fatti, 30 davanti."},{"tipo":"chiusura","azione":"Scrivi la tua scusa preferita e ==una volta in cui non era vera==."}]},{"id":"vincere-lo-stress-formula-di-carrier","categoria":"crescita","titolo":"Qual è il peggio che può succedere?","libro":{"titolo":"Come vincere lo stress e cominciare a vivere","autore":"Dale Carnegie","anno":1948,"titoloOriginale":"How to Stop Worrying and Start Living"},"scene":[{"tipo":"apertura","testo":"Sono le tre di notte. ==Stesso problema==, ventesimo giro."},{"tipo":"esempio","testo":"Willis Carrier, pioniere dell'aria condizionata, da giovane installa un impianto. ==Non rende come garantito.== Non dorme più."},{"tipo":"colpo","testo":"Poi si dà tre passi."},{"tipo":"elenco","titolo":"La formula di Carrier","numerato":true,"voci":["Qual è il peggio che può succedere?","Preparati ad accettarlo, se serve","Poi lavora per ==migliorare quel peggio=="]},{"tipo":"testo","testo":"Il suo peggio: perdere il posto. Lo accetta, e torna lucido. Fa nuove prove e ==trova il rimedio==."},{"tipo":"numero","valore":15,"prefisso":"+","suffisso":" mila","didascalia":"I dollari che la ditta guadagna alla fine. Stava per ==perderne 20 mila==.","nota":"Cifre dal racconto di Carnegie."},{"tipo":"principio","testo":"Per Carnegie chi ha accettato il peggio ==non ha più niente da perdere==: può solo migliorarlo."},{"tipo":"chiusura","azione":"Scrivi il peggio che può succedere e ==una cosa== che lo rende meno grave."}]},{"id":"vincere-lo-stress-compartimenti-stagni","categoria":"crescita","titolo":"Chiudi le porte su ieri e su domani","libro":{"titolo":"Come vincere lo stress e cominciare a vivere","autore":"Dale Carnegie","anno":1948,"titoloOriginale":"How to Stop Worrying and Start Living"},"scene":[{"tipo":"apertura","testo":"Oggi stai portando il peso di ==tre giorni==: ieri, oggi e domani."},{"tipo":"esempio","testo":"Carnegie parte da un discorso del 1913. Il medico William Osler, a Yale: sulle navi si chiudono le paratie. Fatelo ==con le giornate==."},{"tipo":"confronto","a":{"etichetta":"Porte aperte","voci":["Rimpianti per ieri","Ansia per domani"]},"b":{"etichetta":"Compartimento stagno","voci":["Ieri è chiuso, domani non c'è","Tutta l'attenzione su oggi"]}},{"tipo":"colpo","testo":"Non vuol dire non programmare."},{"tipo":"quiz","domanda":"Domani hai un esame. Cosa è da «compartimento stagno»?","opzioni":["Non pensarci fino a domani","Ripassare oggi ciò che manca","Passare la sera in ansia"],"corretta":1,"spiegazione":"Prepararsi è lavoro di oggi. Fuori resta l'ansia, non il programma."},{"tipo":"principio","testo":"Per Carnegie domani si prepara così: ==facendo bene il lavoro di oggi==."},{"tipo":"chiusura","azione":"Scrivi ==tre cose== da fare oggi. Il resto su un foglio per domani. Chiudilo."}]},{"id":"psycho-cybernetics-immagine-di-se","categoria":"crescita","titolo":"Agisci come la persona che credi di essere","libro":{"titolo":"Psycho-Cybernetics","autore":"Maxwell Maltz","anno":1960},"scene":[{"tipo":"apertura","testo":"Un chirurgo plastico scopre che ==rifare un viso non basta==."},{"tipo":"esempio","testo":"Maxwell Maltz opera nasi e cicatrici. Molti pazienti poi cambiano carattere. Altri, con un viso nuovo, si sentono ==brutti come prima==."},{"tipo":"colpo","testo":"Il problema non era la faccia."},{"tipo":"testo","titolo":"L'immagine di sé","testo":"Era l'idea che avevano di sé. Per Maltz agiamo sempre ==in coerenza con quell'immagine==, anche quando è sbagliata."},{"tipo":"confronto","titolo":"Un brutto voto, due letture","a":{"etichetta":"«Sono negato»","voci":["Il voto conferma chi credi di essere","Smetti di provarci"]},"b":{"etichetta":"«Ho sbagliato»","voci":["Il voto è un fatto, non sei tu","Cerchi cosa correggere"]}},{"tipo":"principio","testo":"Per Maltz non ti comporti a lungo in modo diverso da come ti vedi. ==Cambia prima l'immagine==."},{"tipo":"chiusura","azione":"Scrivi tre frasi «Io sono una persona che…». ==Fatti o abitudini di pensiero?=="}]},{"id":"awaken-giant-dolore-e-piacere","categoria":"crescita","titolo":"Perché rimandi anche se sai cosa fare","libro":{"titolo":"Awaken the Giant Within","autore":"Tony Robbins","anno":1991},"scene":[{"tipo":"apertura","testo":"Rimandi e ti dai del pigro. Per Tony Robbins ==hai sbagliato diagnosi==."},{"tipo":"principio","testo":"Per lui due spinte muovono ogni scelta: ==evitare il dolore== e cercare il piacere."},{"tipo":"colpo","testo":"E il dolore pesa di più."},{"tipo":"mito","mito":"Rimando perché sono pigro","realta":"Per Robbins rimandi perché agire ora ti sembra ==più doloroso che aspettare==."},{"tipo":"confronto","titolo":"Cambia i collegamenti","a":{"etichetta":"Prima","voci":["Allenarmi = fatica","Divano = riposo"]},"b":{"etichetta":"Dopo","voci":["Saltare = come starò fra 5 anni","Allenarmi = energia"]}},{"tipo":"elenco","titolo":"Fare leva: tre domande","voci":["Cosa mi è già costato non cambiare?","Cosa mi costerà se continuo?","Cosa guadagno se cambio ora?"]},{"tipo":"testo","testo":"È il modello di un formatore, non una legge scientifica. Usalo come ==domanda pratica==."},{"tipo":"chiusura","azione":"Scrivi ==tre costi== di ciò che rimandi. Poi fai il primo passo: due minuti."}]},{"id":"road-less-traveled-torta-e-glassa","categoria":"crescita","titolo":"Prima la torta, poi la glassa","libro":{"titolo":"The Road Less Traveled","autore":"M. Scott Peck","anno":1978},"scene":[{"tipo":"apertura","testo":"Mangi prima la glassa o la torta? Per uno psichiatra ==dice come lavori==."},{"tipo":"esempio","testo":"Lo psichiatra Scott Peck segue una paziente che al lavoro rimanda tutto. Le chiede come mangia la torta. Lei: ==prima la glassa==."},{"tipo":"testo","testo":"In ufficio fa uguale. La prima ora ai compiti piacevoli. Le altre sei a ==trascinarsi sul resto==."},{"tipo":"colpo","testo":"Peck le propone il contrario."},{"tipo":"grafico","titolo":"Ore piacevoli se parti dalla…","forma":"barre","unita":"h","dati":[{"e":"Glassa","v":1},{"e":"Torta","v":6}],"nota":"Il conto di Peck: un'ora di fatica, poi sei di piacere."},{"tipo":"principio","testo":"Peck lo chiama rimandare la gratificazione: ==prima il dolore==, e il piacere dopo è pieno."},{"tipo":"chiusura","azione":"Metti ==primo in lista== per domattina il compito che ti pesa di più."}]},{"id":"road-less-traveled-amare-e-una-scelta","categoria":"crescita","titolo":"Innamorarsi non è ancora amare","libro":{"titolo":"The Road Less Traveled","autore":"M. Scott Peck","anno":1978},"scene":[{"tipo":"apertura","testo":"Le farfalle nello stomaco passano. ==E poi?=="},{"tipo":"mito","mito":"Il vero amore è un sentimento travolgente","realta":"Per Peck innamorarsi è un crollo temporaneo dei confini. ==Finisce per tutti.=="},{"tipo":"principio","testo":"Amare, per Peck, è volontà: ==impegnarsi per la crescita interiore== di un altro, o della propria."},{"tipo":"confronto","a":{"etichetta":"Innamorarsi","voci":["Succede, non lo decidi","Non costa fatica"]},"b":{"etichetta":"Amare","voci":["È una scelta che ripeti","Si vede da quello che fai"]}},{"tipo":"quiz","domanda":"Per Peck, quale di questi è un atto d'amore?","opzioni":["Non poter stare senza l'altro","Provare un'emozione fortissima","Ascoltare davvero, anche da stanchi"],"corretta":2,"spiegazione":"Dipendenza ed emozione non sono amore. Per Peck l'amore è lavoro: anzitutto attenzione."},{"tipo":"chiusura","azione":"Oggi dai a qualcuno ==dieci minuti di ascolto pieno==: telefono lontano."}]},{"id":"cant-hurt-me-regola-del-40","categoria":"crescita","titolo":"Quando dici basta, quanto ti resta?","libro":{"titolo":"Can't Hurt Me","autore":"David Goggins","anno":2018},"scene":[{"tipo":"apertura","testo":"«Non ce la faccio più.» Per un ex Navy SEAL è ==quasi sempre falso==."},{"tipo":"quiz","domanda":"Ti senti finito. Secondo Goggins, quanta forza hai usato?","opzioni":["Circa il 40%","Circa il 70%","Circa il 90%"],"corretta":0,"spiegazione":"È la sua «regola del 40%»: una stima personale, non una misura scientifica."},{"tipo":"testo","titolo":"Il limitatore","testo":"Goggins paragona la mente al limitatore di un'auto. Taglia la potenza ==molto prima== che il motore rischi."},{"tipo":"colpo","testo":"Per lui stanco non è finito."},{"tipo":"elenco","titolo":"Come si sposta il limite","voci":["Vuoi fermarti? Fai ancora un ==5-10%==","Massimo 100 flessioni? Punta a 105 o 110","Sali piano, per non farti male"]},{"tipo":"testo","testo":"Si allena la testa al disagio, a piccoli passi. ==Un dolore vero== resta un segnale da ascoltare."},{"tipo":"chiusura","azione":"Al prossimo allenamento, quando vuoi smettere fai ancora ==il 10% in più==."}]},{"id":"cant-hurt-me-barattolo-dei-biscotti","categoria":"crescita","titolo":"Il barattolo che apri quando stai per mollare","libro":{"titolo":"Can't Hurt Me","autore":"David Goggins","anno":2018},"scene":[{"tipo":"apertura","testo":"Nel momento peggiore di una gara, Goggins pensa ai ==biscotti==."},{"tipo":"colpo","testo":"Non per fame."},{"tipo":"esempio","testo":"Da bambino sua madre teneva un barattolo pieno di biscotti diversi. Prenderne uno era ==un premio da gustare==."},{"tipo":"quiz","domanda":"Che cosa tiene oggi Goggins nel suo «barattolo» mentale?","opzioni":["I premi che si concede dopo","Le prove dure che ha superato","Le frasi dei suoi allenatori"],"corretta":1,"spiegazione":"Lo studio matto per un esame, i chili persi per i SEAL. Quando sta per mollare ne pesca una."},{"tipo":"testo","testo":"Non è nostalgia. Goggins rivive la fatica che ha retto e ==la usa per il passo dopo==."},{"tipo":"principio","testo":"La prova che puoi farcela ==ce l'hai già==: le cose difficili che hai superato."},{"tipo":"chiusura","azione":"Scrivi ==cinque cose difficili== che hai superato. Rileggile quando stai per cedere."}]},{"id":"12-regole-confronto-con-ieri","categoria":"crescita","titolo":"Confrontati con chi eri ieri","libro":{"titolo":"12 regole per la vita","autore":"Jordan B. Peterson","anno":2018,"titoloOriginale":"12 Rules for Life"},"scene":[{"tipo":"apertura","testo":"Apri un social: in dieci secondi c'è qualcuno ==più bravo di te==."},{"tipo":"testo","testo":"Peterson parte da qui: c'è sempre chi fa meglio. E la tua voce critica trova sempre ==un confronto che perdi==."},{"tipo":"colpo","testo":"Allora cambia avversario."},{"tipo":"confronto","a":{"etichetta":"Tu e gli altri","voci":["Vedi un solo pezzo della loro vita","Il confronto lo sceglie il critico"]},"b":{"etichetta":"Tu e il te di ieri","voci":["Conosci tutta la storia","Ogni piccolo passo conta"]}},{"tipo":"principio","testo":"Per Peterson l'unico confronto utile è con chi eri ieri, ==non con un altro oggi==."},{"tipo":"elenco","titolo":"Il metodo dei piccoli passi","numerato":true,"voci":["Cosa potrei sistemare, di piccolo?","Scegli una cosa che faresti davvero","Falla, e concediti un premio"]},{"tipo":"chiusura","azione":"Stasera scegli una cosa piccola da sistemare domani. ==Solo quella.=="}]},{"id":"mindset-due-mentalita","categoria":"crescita","titolo":"Perché un errore abbatte alcuni e ne carica altri","libro":{"titolo":"Mindset","autore":"Carol S. Dweck","anno":2006},"scene":[{"tipo":"apertura","testo":"Brutto voto. Pensi «ho sbagliato» o ==«sono negato»==?"},{"tipo":"testo","titolo":"Due mentalità","testo":"Carol Dweck vede due mentalità. Fissa: il talento è ==dato una volta per tutte==. Di crescita: il talento si allena."},{"tipo":"confronto","a":{"etichetta":"Mentalità fissa","voci":["Se fatico, non sono portato","Evito le sfide"]},"b":{"etichetta":"Mentalità di crescita","voci":["Se fatico, sto imparando","Cerco le sfide"]}},{"tipo":"esempio","testo":"Dweck dà a dei bambini rompicapi sempre più duri. Alcuni si abbattono. Per altri il difficile è ==la parte divertente==."},{"tipo":"mito","mito":"Con la mentalità giusta i voti decollano","realta":"Gli studi più grandi trovano ==effetti piccoli==. Aiuta di più chi è in difficoltà."},{"tipo":"principio","testo":"Niente magie. Ma per Dweck ciò che credi di te cambia ==come reagisci all'errore==."},{"tipo":"chiusura","azione":"Scrivi una cosa in cui «non sei portato». Aggiungi: ==«non ancora»==."}]},{"id":"mindset-lode-al-talento","categoria":"crescita","titolo":"Il complimento che ti toglie il coraggio","libro":{"titolo":"Mindset","autore":"Carol S. Dweck","anno":2006},"scene":[{"tipo":"apertura","testo":"«Sei intelligente» può rendere un bambino ==meno coraggioso==."},{"tipo":"colpo","testo":"Sì, un complimento."},{"tipo":"esempio","testo":"Dweck fa risolvere dei problemi a centinaia di ragazzi. Poi loda alcuni per l'intelligenza, altri per l'impegno. ==Una sola frase.=="},{"tipo":"quiz","domanda":"Ora scelgono il prossimo compito. Chi vuole quello difficile?","opzioni":["I lodati per l'intelligenza","I lodati per l'impegno"],"corretta":1,"spiegazione":"Chi è lodato per il talento teme di smentirlo. Sceglie il facile."},{"tipo":"numero","valore":40,"suffisso":"%","didascalia":"Quasi 4 su 10 dei lodati per l'intelligenza ==mentono sul punteggio==.","nota":"Studio del 1998, riportato da Dweck nel libro."},{"tipo":"principio","testo":"Per Dweck, lodare il talento rende l'errore una minaccia. Lodare il percorso lo rende ==parte del lavoro==."},{"tipo":"chiusura","azione":"Oggi fai un complimento senza «sei bravo». Di' ==cosa ha fatto bene==."}]},{"id":"grinta-impegno-conta-due-volte","categoria":"crescita","titolo":"La formula che ridimensiona il talento","libro":{"titolo":"Grinta","autore":"Angela Duckworth","anno":2016,"titoloOriginale":"Grit"},"scene":[{"tipo":"apertura","testo":"Talento e impegno non pesano uguale. Uno dei due ==conta doppio==."},{"tipo":"quiz","domanda":"Anna ha doppio talento, Bea doppio impegno. Per Angela Duckworth, chi ottiene di più?","opzioni":["Anna","Pari","Bea"],"corretta":2,"spiegazione":"Nel suo conto l'impegno entra due volte. Guarda come."},{"tipo":"testo","titolo":"Due moltiplicazioni","testo":"Talento × impegno = abilità. Abilità × impegno = risultati. Il talento entra una volta, ==l'impegno due==."},{"tipo":"grafico","titolo":"Risultati con le formule di Duckworth","forma":"barre","dati":[{"e":"Anna","v":2},{"e":"Bea","v":4}],"nota":"Esempio illustrativo. Anna: 2×1×1. Bea: 1×2×2."},{"tipo":"colpo","testo":"Però non è una legge."},{"tipo":"testo","titolo":"I limiti","testo":"È un modello: lascia fuori fortuna e occasioni, lo dice anche Duckworth. E per altri studiosi la grinta ==spiega poco== dei risultati."},{"tipo":"chiusura","azione":"Scegli una cosa che sai fare «abbastanza». Oggi ==dieci minuti di esercizio vero==."}]},{"id":"grinta-passione-e-costanza","categoria":"crescita","titolo":"La passione non è entusiasmo: è costanza","libro":{"titolo":"Grinta","autore":"Angela Duckworth","anno":2016,"titoloOriginale":"Grit"},"scene":[{"tipo":"apertura","testo":"Gennaio: compri la chitarra. Marzo: ==prende polvere==."},{"tipo":"confronto","titolo":"Non era passione, per Duckworth","a":{"etichetta":"Entusiasmo","voci":["Parte forte, si spegne presto","Ogni mese una meta nuova"]},"b":{"etichetta":"Passione","voci":["Lo stesso interesse, per anni","Una meta che non cambia"]}},{"tipo":"testo","testo":"Per Angela Duckworth la grinta è passione più perseveranza. Per un obiettivo lontano. Una bussola, ==non un fuoco d'artificio==."},{"tipo":"colpo","testo":"La prova? L'esercito."},{"tipo":"esempio","testo":"West Point, prime settimane durissime. Chi regge? Nei dati di Duckworth voti e muscoli non lo dicono. Lo prevede meglio ==il punteggio di grinta==."},{"tipo":"elenco","titolo":"Da dove nasce, per Duckworth","voci":["Interesse: ti piace davvero","Pratica: ogni giorno un po' meglio","Scopo: serve anche ad altri","Speranza: ti rialzi"]},{"tipo":"chiusura","azione":"Scrivi i tuoi obiettivi. Unisci con una freccia quelli con ==la stessa meta==."}]},{"id":"numero-1-si-diventa-pratica-mirata","categoria":"crescita","titolo":"Gli anni di esperienza non ti rendono più bravo","libro":{"titolo":"Numero 1 si diventa","autore":"Anders Ericsson, Robert Pool","anno":2016,"titoloOriginale":"Peak"},"scene":[{"tipo":"apertura","testo":"Guidi da dieci anni. Sei ==più bravo== di quando hai preso la patente?"},{"tipo":"mito","mito":"Più anni di esperienza, più bravura","realta":"Per Ericsson, quando un gesto diventa automatico ==smetti di migliorare==."},{"tipo":"colpo","testo":"E allora come si migliora?"},{"tipo":"esempio","testo":"Steve Faloon ricorda 7 cifre di fila, come quasi tutti. Ericsson lo allena. Indovina? Una cifra in più. Sbaglia? La fila si accorcia. ==Sempre al limite.=="},{"tipo":"numero","valore":82,"didascalia":"Le cifre di fila che ricorda dopo due anni e ==più di 200 sedute==.","nota":"Esperimento raccontato da Ericsson nel libro."},{"tipo":"elenco","titolo":"La pratica mirata","voci":["Un obiettivo preciso a ogni seduta","Concentrazione piena","Un riscontro immediato","Un passo oltre il tuo limite"]},{"tipo":"chiusura","azione":"Isola ==il passaggio che sbagli sempre==. Ripeti solo quello, dieci minuti."}]},{"id":"fuoriclasse-diecimila-ore","categoria":"crescita","titolo":"Le 10 mila ore: cosa c'è di vero","libro":{"titolo":"Fuoriclasse","autore":"Malcolm Gladwell","anno":2008,"titoloOriginale":"Outliers"},"scene":[{"tipo":"apertura","testo":"==10 mila ore== e diventi un fuoriclasse. Davvero?"},{"tipo":"testo","testo":"Gladwell parte dai violinisti di un'accademia di Berlino. A vent'anni i migliori avevano ==molte più ore== di esercizio."},{"tipo":"grafico","titolo":"Violinisti a 20 anni: migliaia di ore","forma":"barre","dati":[{"e":"Migliori","v":10},{"e":"Bravi","v":8},{"e":"Docenti","v":4}],"nota":"Medie citate da Gladwell. Docenti: futuri insegnanti."},{"tipo":"colpo","testo":"Chi fece lo studio dissente."},{"tipo":"mito","mito":"Con 10 mila ore diventi un esperto","realta":"Per Anders Ericsson era ==una media, non una soglia==. E conta come ti eserciti."},{"tipo":"numero","valore":5,"suffisso":" su 10","didascalia":"Tra i violinisti migliori, quelli ==sotto le 10 mila ore== a vent'anni.","nota":"Lo riferisce lo stesso Ericsson."},{"tipo":"principio","testo":"Resta vero che servono anni di pratica. E, per Gladwell, ==l'occasione di farla==."},{"tipo":"chiusura","azione":"Conta le ore di ==pratica concentrata== di questa settimana. Scrivi il numero."}]},{"id":"fuoriclasse-mese-di-nascita","categoria":"crescita","titolo":"Il mese in cui sei nato conta più di quanto credi","libro":{"titolo":"Fuoriclasse","autore":"Malcolm Gladwell","anno":2008,"titoloOriginale":"Outliers"},"scene":[{"tipo":"apertura","testo":"Per sfondare nell'hockey canadese conviene ==nascere a gennaio==."},{"tipo":"grafico","titolo":"Hockey d'élite in Canada: mese di nascita","forma":"barre","unita":"%","dati":[{"e":"Gen-Mar","v":40},{"e":"Apr-Giu","v":30},{"e":"Lug-Set","v":20},{"e":"Ott-Dic","v":10}],"nota":"Proporzioni citate da Gladwell (ricerche di Barnsley)."},{"tipo":"quiz","domanda":"Non è l'oroscopo. Perché così tanti nati a inizio anno?","opzioni":["Sono i più grandi dell'annata","Genetica","Il freddo li tempra"],"corretta":0,"spiegazione":"Le annate partono il 1° gennaio. A dieci anni, quasi un anno in più si vede."},{"tipo":"colpo","testo":"E non finisce lì."},{"tipo":"elenco","titolo":"Poi il vantaggio cresce","numerato":true,"voci":["Finiscono nelle squadre migliori","Più allenamento, più partite","Anni dopo sono più forti davvero"]},{"tipo":"principio","testo":"Per Gladwell il successo nasce spesso da ==un piccolo vantaggio iniziale== che cresce."},{"tipo":"chiusura","azione":"Pensa a chi hai giudicato «poco portato». Scrivi ==un vantaggio che gli mancava==."}]},{"id":"generalisti-periodo-di-assaggio","categoria":"crescita","titolo":"Chi sceglie tardi non parte indietro","libro":{"titolo":"Generalisti","autore":"David Epstein","anno":2019,"titoloOriginale":"Range"},"scene":[{"tipo":"apertura","testo":"Uno giocava a golf ==a due anni==. L'altro provava tutti gli sport."},{"tipo":"colpo","testo":"Campioni tutti e due."},{"tipo":"confronto","a":{"etichetta":"Tiger Woods","voci":["Golf fin da piccolissimo","Un solo sport, ogni giorno"]},"b":{"etichetta":"Roger Federer","voci":["Calcio, basket, sci, nuoto…","Il tennis lo sceglie dopo"]}},{"tipo":"mito","mito":"Per arrivare in cima devi iniziare da piccolo","realta":"Per Epstein tra i campioni è più comune ==provare tanto, scegliere dopo==."},{"tipo":"esempio","testo":"Epstein cita studi su molti atleti. I futuri campioni, da ragazzi, facevano ==meno ore== del loro sport. Meno di chi poi è rimasto un gradino sotto."},{"tipo":"elenco","titolo":"Perché funziona, per Epstein","voci":["Costruisci abilità generali","Scopri ==cosa fa per te==","Scegli con più informazioni"]},{"tipo":"chiusura","azione":"Scegli una cosa mai provata e ==prenota oggi una prova==."}]},{"id":"generalisti-ambienti-gentili-e-ostili","categoria":"crescita","titolo":"Quando l'esperienza ti inganna","libro":{"titolo":"Generalisti","autore":"David Epstein","anno":2019,"titoloOriginale":"Range"},"scene":[{"tipo":"apertura","testo":"Un medico prevedeva il tifo ==toccando la lingua== dei pazienti."},{"tipo":"colpo","testo":"Ci azzeccava quasi sempre."},{"tipo":"esempio","testo":"Il paziente, ancora sano, poi si ammalava. Ma il tifo lo portava lui, da un letto all'altro. ==Con le mani.=="},{"tipo":"confronto","titolo":"La distinzione di Robin Hogarth","a":{"etichetta":"Ambiente gentile","voci":["Regole chiare","Sai subito se hai fatto bene"]},"b":{"etichetta":"Ambiente ostile","voci":["Regole poco chiare","Riscontro tardivo o ingannevole"]}},{"tipo":"quiz","domanda":"Quale di questi è un ambiente «gentile»?","opzioni":["Lanciare un'azienda","Gli scacchi","Prevedere le elezioni"],"corretta":1,"spiegazione":"Regole fisse, esito chiaro. Negli altri due ogni caso è nuovo."},{"tipo":"principio","testo":"Per Epstein, con regole chiare vince chi ripete. Dove non lo sono, chi ha ==esperienze diverse==."},{"tipo":"chiusura","azione":"Prendi un problema che ti blocca. Scrivi ==a cosa somiglia== fuori dal tuo campo."}]},{"id":"mastery-apprendistato","categoria":"crescita","titolo":"Il primo lavoro serve a imparare, non a guadagnare","libro":{"titolo":"Mastery","autore":"Robert Greene","anno":2012},"scene":[{"tipo":"apertura","testo":"Due offerte: una paga di più, nell'altra ==impari di più==. Quale scegli?"},{"tipo":"colpo","testo":"Chiedilo a Darwin."},{"tipo":"esempio","testo":"A 22 anni Darwin sale sul Beagle, senza stipendio. Per quasi cinque anni osserva, raccoglie, annota. Per Greene è ==il suo apprendistato==."},{"tipo":"principio","testo":"Per Robert Greene i primi anni servono a una cosa. ==Trasformare te==, non lo stipendio."},{"tipo":"elenco","titolo":"Le tre fasi, per Greene","numerato":true,"voci":["Osserva: impara le regole del posto","Esercitati: ripeti finché viene da sé","Sperimenta: prova da solo, cerca critiche"]},{"tipo":"testo","titolo":"Perché conviene","testo":"Per Greene una paga più alta oggi vale meno di ciò che impari. Le abilità ==rendono per decenni==."},{"tipo":"chiusura","azione":"Scrivi ==tre abilità== che stai imparando al lavoro o al corso. Poi una che ti manca."}]},{"id":"talent-code-scintilla","categoria":"crescita","titolo":"La motivazione si accende da fuori","libro":{"titolo":"The Talent Code","autore":"Daniel Coyle","anno":2009},"scene":[{"tipo":"apertura","testo":"1998: ventenne coreana vince un torneo di golf. ==Poi succede questo.=="},{"tipo":"grafico","titolo":"Golfiste sudcoreane nel circuito LPGA","forma":"barre","dati":[{"e":"1998","v":1},{"e":"2008","v":45}],"nota":"Cifre riportate da Coyle nel libro."},{"tipo":"colpo","testo":"Che cosa è successo?"},{"tipo":"testo","testo":"Lei è Se Ri Pak. Daniel Coyle lo chiama «accensione»: vedi una ==simile a te== farcela. E ti sembra possibile."},{"tipo":"quiz","domanda":"Bambini che iniziano a suonare. Nello studio citato da Coyle, cosa prevede i progressi?","opzioni":["L'intelligenza","Il senso del ritmo","Per quanto tempo pensano di suonare"],"corretta":2,"spiegazione":"A parità di esercizio, chi contava di suonare a lungo migliorava molto di più."},{"tipo":"principio","testo":"Per Coyle la pratica è il motore. Il carburante è un'idea: ==quello potrei essere io==."},{"tipo":"chiusura","azione":"Cerca chi è ==partito da dove sei tu== e fa ciò che sogni. Leggi la sua storia."}]},{"id":"drive-premi-e-creativita","categoria":"crescita","titolo":"Quando il premio ti fa lavorare peggio","libro":{"titolo":"Drive","autore":"Daniel H. Pink","anno":2009},"scene":[{"tipo":"apertura","testo":"Ti pagano per risolvere un rompicapo ==più in fretta==. Ci metti di più."},{"tipo":"esempio","testo":"Una candela, dei fiammiferi, una scatola di puntine: fissala al muro. Chi gareggia per soldi, racconta Pink, è ==più lento==."},{"tipo":"mito","mito":"Più premio, più risultati","realta":"Per Daniel Pink vale solo per i compiti meccanici. ==Il premio frena le idee==."},{"tipo":"quiz","domanda":"Dove funziona meglio un premio in denaro?","opzioni":["Imbustare 500 lettere","Inventare uno slogan","Progettare un'app"],"corretta":0,"spiegazione":"Passi chiari, conta la velocità. Negli altri due serve inventiva."},{"tipo":"elenco","titolo":"Cosa motiva davvero, per Pink","voci":["Autonomia: decidi tu come","Padronanza: diventi più bravo","Scopo: serve a qualcosa di più grande"]},{"tipo":"chiusura","azione":"Scegli un compito di oggi e fallo ==a modo tuo==: ordine, metodo o orario."}]},{"id":"so-good-capitale-di-carriera","categoria":"crescita","titolo":"«Segui la tua passione» è un cattivo consiglio","libro":{"titolo":"So Good They Can't Ignore You","autore":"Cal Newport","anno":2012},"scene":[{"tipo":"apertura","testo":"Ti dicono: ==segui la tua passione==. E se non ne hai una?"},{"tipo":"mito","mito":"Trova la tua passione, poi il lavoro giusto","realta":"Per Cal Newport la passione arriva dopo: ==quando diventi bravo==."},{"tipo":"esempio","testo":"Steve Jobs lo predicava. Ma da ragazzo, nota Newport, non sognava i computer. Apple nasce come ==un piccolo affare==. L'amore arriva dopo."},{"tipo":"confronto","titolo":"Due domande","a":{"etichetta":"Chi cerca la passione","voci":["Cosa mi offre questo lavoro?"]},"b":{"etichetta":"L'artigiano","voci":["Cosa so offrire io?"]}},{"tipo":"testo","titolo":"Capitale di carriera","testo":"Newport chiama così le abilità rare e utili. Sono la moneta con cui compri ==autonomia, creatività, impatto==."},{"tipo":"colpo","testo":"Prima bravo, poi appassionato."},{"tipo":"chiusura","azione":"Scrivi un'abilità ==rara e utile== nel tuo campo. Trova oggi un primo esercizio."}]},{"id":"flow-sfida-e-capacita","categoria":"crescita","titolo":"Perché a volte il tempo vola","libro":{"titolo":"Flow","autore":"Mihaly Csikszentmihalyi","anno":1990},"scene":[{"tipo":"apertura","testo":"Alzi gli occhi: sono passate ==tre ore==. Non te ne sei accorto."},{"tipo":"testo","testo":"Mihaly Csikszentmihalyi lo chiama «flow»: sei così preso che ==il resto sparisce==. Per lui sono i momenti migliori."},{"tipo":"colpo","testo":"E ha una ricetta."},{"tipo":"confronto","titolo":"Dove nasce il flow","a":{"etichetta":"Fuori dal flow","voci":["Troppo facile: noia","Troppo difficile: ansia"]},"b":{"etichetta":"Nel flow","voci":["Sfida alla pari con le tue capacità"]}},{"tipo":"quiz","domanda":"Studi e ti annoi. Che cosa ti riporta nel flow?","opzioni":["Una pausa più lunga","Cambiare stanza","Alzare la difficoltà"],"corretta":2,"spiegazione":"La noia dice che la sfida è sotto le tue capacità. Alzala."},{"tipo":"elenco","titolo":"Gli altri ingredienti","voci":["Un obiettivo chiaro","Un riscontro immediato","Tutta l'attenzione sul compito"]},{"tipo":"chiusura","azione":"Dai a un compito un obiettivo un po' difficile. ==Telefono muto== per dieci minuti."}]},{"id":"make-it-stick-richiamare-a-memoria","categoria":"crescita","titolo":"Rileggere ti inganna: fai questo invece","libro":{"titolo":"Make It Stick","autore":"Peter C. Brown, Henry L. Roediger III, Mark A. McDaniel","anno":2014},"scene":[{"tipo":"apertura","testo":"Hai riletto tre volte e ti sembra di saperlo. ==Ti sembra.=="},{"tipo":"testo","titolo":"Riconoscere non è ricordare","testo":"Rileggere rende la pagina familiare. E la familiarità ==sembra padronanza==. È il metodo più usato, e tra i meno efficaci."},{"tipo":"colpo","testo":"E allora ==cosa funziona?=="},{"tipo":"quiz","domanda":"Cosa ti fa ricordare di più dopo una settimana?","opzioni":["Rileggere ancora","Evidenziare","Chiudere e interrogarti"],"corretta":2,"spiegazione":"Ripescare un'informazione dalla memoria la fissa più che rivederla."},{"tipo":"grafico","titolo":"Esame di scienze: argomenti con e senza quiz","forma":"barre","unita":"%","dati":[{"e":"No quiz","v":79},{"e":"Con quiz","v":92}],"nota":"Scuola media di Columbia, Illinois. Negli USA: da C+ ad A−."},{"tipo":"principio","testo":"Ogni volta che ==ripeschi un'idea dalla memoria==, la rendi più facile da ritrovare."},{"tipo":"chiusura","azione":"Finita una pagina, chiudi e scrivi ==cosa ricordi==. Poi controlla."}]},{"id":"ruba-come-artista-furto-buono","categoria":"crescita","titolo":"Quando copiare diventa originalità","libro":{"titolo":"Ruba come un artista","autore":"Austin Kleon","anno":2012,"titoloOriginale":"Steal Like an Artist"},"scene":[{"tipo":"apertura","testo":"Copi da un autore: plagio. Copi ==da cento==: ti chiamano originale."},{"tipo":"mito","mito":"Le idee originali nascono dal nulla","realta":"Per Austin Kleon ogni lavoro nuovo è ==un miscuglio di idee venute prima==."},{"tipo":"esempio","testo":"I Beatles hanno cominciato suonando canzoni degli altri. McCartney lo ha raccontato: imitava Buddy Holly, Little Richard, Elvis. ==Come tutti.=="},{"tipo":"colpo","testo":"Ma c'è ==furto e furto==."},{"tipo":"confronto","titolo":"Furto cattivo, furto buono","a":{"etichetta":"Cattivo","voci":["Rubi da uno solo","Imiti e nascondi la fonte"]},"b":{"etichetta":"Buono","voci":["Rubi da tanti","Trasformi e dici da chi"]}},{"tipo":"principio","testo":"Ruba ==il modo di pensare==, non solo lo stile. Dove non riesci a imitare, comincia la tua voce."},{"t . Sunstein","anno":2008},"scene":[{"tipo":"apertura","testo":"Cosa scegli quando non scegli? ==Quello che ha deciso un altro.=="},{"tipo":"esempio","testo":"Un'azienda americana. Per entrare nel fondo pensione bisogna fare domanda. Poi la regola si inverte: iscritti in automatico, ==liberi di uscire==."},{"tipo":"colpo","testo":"Stessa libertà, ==altri numeri==."},{"tipo":"grafico","titolo":"Nuovi assunti iscritti al fondo pensione","forma":"barre","unita":"%","dati":[{"e":"Prima","v":20},{"e":"Dopo","v":90}],"nota":"Prima: a richiesta, dopo 3 mesi. Dopo: in automatico, da subito."},{"tipo":"mito","mito":"Se una cosa mi importa davvero, scelgo io","realta":"Anche sulla pensione vince spesso ==ciò che è già impostato==."},{"tipo":"principio","testo":"L'opzione predefinita è ciò che succede ==se non fai niente==. Chi la imposta ha un potere enorme."},{"tipo":"chiusura","azione":"Apri un abbonamento o un'app: cosa è attivo ==senza che tu l'abbia scelto==? Spegni una cosa."}]},{"id":"arte-di-pensare-chiaro-bias-sopravvissuto","categoria":"mente","titolo":"Il cimitero dei progetti che nessuno ti mostra","libro":{"titolo":"L'arte di pensare chiaro","autore":"Rolf Dobelli","anno":2011,"titoloOriginale":"Die Kunst des klaren Denkens"},"scene":[{"tipo":"apertura","testo":"Vuoi scrivere un romanzo? Prima visita ==un cimitero==."},{"tipo":"colpo","testo":"Quello ==dei libri mai nati==."},{"tipo":"elenco","titolo":"Dietro ogni scrittore famoso","voci":["Tanti autori pubblicati che non vendono","Tanti altri che non trovano un editore","Tanti manoscritti fermi nel cassetto"]},{"tipo":"quiz","domanda":"Intervisti 50 imprenditori di successo: tutti si alzano alle 5. Cosa hai dimostrato?","opzioni":["Alzarsi presto porta al successo","Il successo fa dormire poco","Niente: mancano i falliti"],"corretta":2,"spiegazione":"Forse anche chi ha fallito si alzava alle 5. Senza i perdenti non sai cosa fa la differenza."},{"tipo":"principio","testo":"È il bias del sopravvissuto: vedi solo chi ce l'ha fatta e ==sopravvaluti le tue probabilità==."},{"tipo":"chiusura","azione":"Prima di buttarti in un progetto cerca ==tre storie finite male== e leggi perché."}]},{"id":"misbehaving-contabilita-mentale","categoria":"mente","titolo":"I tuoi soldi non valgono tutti uguale","libro":{"titolo":"Misbehaving","autore":"Richard H. Thaler","anno":2015},"scene":[{"tipo":"apertura","testo":"50 euro trovati per strada li spendi subito. Quelli sudati no."},{"tipo":"colpo","testo":"Eppure sono ==gli stessi euro==."},{"tipo":"testo","titolo":"La contabilità mentale","testo":"Per Richard Thaler, Nobel per l'economia, dividi i soldi in ==barattoli con l'etichetta==: affitto, svago, risparmi. E non li mescoli."},{"tipo":"esempio","testo":"Dal libro: radiosveglia da 45 dollari, a dieci minuti da lì costa 35. Ci vai? E per una TV da 495 che là costa 485? ==Probabilmente no.=="},{"tipo":"colpo","testo":"Sempre ==10 dollari==."},{"tipo":"elenco","titolo":"Altri barattoli dal libro","voci":["Soldi vinti al gioco: li rischi di più","Biglietto già pagato: vai anche con la bufera"]},{"tipo":"principio","testo":"Tratti i soldi in modo diverso secondo il ==barattolo mentale== in cui li metti. Ma un euro è un euro."},{"tipo":"chiusura","azione":"Prima di inseguire uno sconto guarda ==gli euro, non la percentuale==. Ti muoveresti?"}]},{"id":"rumore-stesso-caso-giudizi-diversi","categoria":"mente","titolo":"Stesso caso, due esperti, due risposte","libro":{"titolo":"Rumore","autore":"Daniel Kahneman, Olivier Sibony, Cass R. Sunstein","anno":2021,"titoloOriginale":"Noise"},"scene":[{"tipo":"apertura","testo":"Il prezzo di una polizza dipende da ==chi te lo calcola==."},{"tipo":"esempio","testo":"Una compagnia di assicurazioni fa una prova: stessi casi a più impiegati. Ognuno fissa il prezzo ==da solo==."},{"tipo":"quiz","domanda":"I dirigenti si aspettano il 10% di differenza fra colleghi. Quanta ne trovano?","opzioni":["Il 10%","Il 55%","Il 90%"],"corretta":1,"spiegazione":"La differenza mediana era il 55%: oltre cinque volte quella attesa."},{"tipo":"grafico","titolo":"Stesso cliente, due colleghi","forma":"barre","unita":"$","dati":[{"e":"Uno","v":9500},{"e":"L'altro","v":16700}],"nota":"Esempio del libro: la differenza è il 55% della media dei due."},{"tipo":"colpo","testo":"Non è bias. È ==rumore==."},{"tipo":"confronto","titolo":"Due modi di sbagliare","a":{"etichetta":"Bias","voci":["Tutti sbagliano dalla stessa parte"]},"b":{"etichetta":"Rumore","voci":["Ognuno dà una risposta diversa"]}},{"tipo":"chiusura","azione":"Rifai da zero una stima di giorni fa, senza guardarla. Poi ==fai la media delle due==."}]},{"id":"paradox-of-choice-troppa-scelta","categoria":"mente","titolo":"Smetti di cercare il meglio: basta «abbastanza buono»","libro":{"titolo":"The Paradox of Choice","autore":"Barry Schwartz","anno":2004},"scene":[{"tipo":"apertura","testo":"«Slim, easy, relaxed o baggy?» Volevi solo ==dei jeans==."},{"tipo":"esempio","testo":"È successo allo psicologo Barry Schwartz. Un acquisto da cinque minuti era diventato una fatica ==piena di dubbi==."},{"tipo":"mito","mito":"Più scelta, più libertà, più felicità","realta":"Per Schwartz oltre un certo punto arrivano ==ansia e rimpianti==."},{"tipo":"grafico","titolo":"Marmellate: chi compra dopo l'assaggio","forma":"barre","unita":"%","dati":[{"e":"6 gusti","v":30},{"e":"24 gusti","v":3}],"nota":"Studio famoso. Rifatto da altri, ha dato esiti contrastanti."},{"tipo":"colpo","testo":"Ma non sempre ==si ripete==."},{"tipo":"confronto","titolo":"Due modi di scegliere","a":{"etichetta":"Massimizzatore","voci":["Vuole il meglio, poi si pente"]},"b":{"etichetta":"Chi si accontenta","voci":["Prende la prima cosa che va bene"]}},{"tipo":"principio","testo":"Secondo Schwartz chi cerca sempre il meglio ==se lo gode di meno== di chi sa dire «questo va bene»."},{"tipo":"chiusura","azione":"Prossimo acquisto: scrivi ==tre requisiti== e prendi la prima cosa che li rispetta."}]},{"id":"stumbling-on-happiness-prevedere-felicita","categoria":"mente","titolo":"Sbagli a prevedere cosa ti renderà felice","libro":{"titolo":"Stumbling on Happiness","autore":"Daniel Gilbert","anno":2006},"scene":[{"tipo":"apertura","testo":"Stai scegliendo il tuo futuro con ==l'umore di oggi==."},{"tipo":"esempio","testo":"Fai la spesa a stomaco pieno e compri troppo poco: non riesci a immaginarti affamato. Per Daniel Gilbert ==col futuro fai lo stesso==."},{"tipo":"elenco","titolo":"Tre difetti dell'immaginazione","voci":["Riempie i dettagli, e non te ne accorgi","Colora il domani con l'umore di oggi","Non prevede quanto in fretta ti adatti"]},{"tipo":"colpo","testo":"Il terzo è ==una buona notizia==."},{"tipo":"testo","titolo":"Il sistema immunitario psicologico","testo":"Chi viene lasciato si aspetta mesi di buio. Negli studi che Gilbert racconta ==si riprende prima del previsto==."},{"tipo":"mito","mito":"So già come mi sentirò","realta":"L'immaginazione sbaglia. Meglio chiedere a ==chi lo sta vivendo ora==."},{"tipo":"chiusura","azione":"Hai una scelta in ballo? Scrivi oggi a chi ==la sta già vivendo== e chiedigli com'è."}]},{"id":"in-un-batter-di-ciglia-colpo-d-occhio","categoria":"mente","titolo":"Quando due secondi battono quattordici mesi","libro":{"titolo":"In un batter di ciglia","autore":"Malcolm Gladwell","anno":2005,"titoloOriginale":"Blink"},"scene":[{"tipo":"apertura","testo":"Un esperto guarda la statua due secondi. ==Qualcosa non torna.=="},{"tipo":"esempio","testo":"1983: offrono al Getty Museum una statua greca per quasi 10 milioni di dollari. Dopo 14 mesi di analisi il museo dice ==autentica==."},{"tipo":"colpo","testo":"Agli esperti ==sembra sbagliata==."},{"tipo":"quiz","domanda":"Secondo Gladwell, chi ha visto giusto?","opzioni":["Gli esperti, in due secondi","Il laboratorio, in 14 mesi"],"corretta":0,"spiegazione":"I documenti di provenienza erano falsi. Oggi anche il museo ammette: forse è un falso."},{"tipo":"colpo","testo":"Non è ==magia==."},{"tipo":"testo","titolo":"La fetta sottile","testo":"Gladwell lo chiama «thin-slicing»: un occhio allenato coglie lo schema da pochi indizi. Senza ==anni di pratica==, avverte, l'istinto può ingannare."},{"tipo":"chiusura","azione":"Annota oggi una prima impressione. Fra una settimana rileggila: ==avevi visto giusto?=="}]},{"id":"thinking-in-bets-decisione-e-risultato","categoria":"mente","titolo":"Una buona decisione può finire male","libro":{"titolo":"Thinking in Bets","autore":"Annie Duke","anno":2018},"scene":[{"tipo":"apertura","testo":"Super Bowl 2015. Mancano 26 secondi. ==Manca un metro.=="},{"tipo":"esempio","testo":"Seattle può correre o lanciare. Pete Carroll sceglie il lancio: intercettato, partita persa. Per i giornali è ==la peggior chiamata di sempre==."},{"tipo":"quiz","domanda":"In quella situazione, quanti lanci venivano intercettati?","opzioni":["Circa 50 su 100","Circa 20 su 100","Circa 2 su 100"],"corretta":2,"spiegazione":"Circa il 2% nelle 15 stagioni precedenti, secondo i dati citati da Annie Duke."},{"tipo":"mito","mito":"È finita male, quindi era sbagliata","realta":"Annie Duke lo chiama «resulting»: ==giudichi la scelta dal risultato==."},{"tipo":"principio","testo":"La vita somiglia al poker, non agli scacchi: ==non controlli il risultato==, solo la scommessa."},{"tipo":"chiusura","azione":"Pensa alla tua decisione peggiore dell'anno: ==sbagliata davvero==, o solo finita male?"}]},{"id":"armi-persuasione-reciprocita","categoria":"comunicazione","titolo":"Il regalo gratis che poi paghi","libro":{"titolo":"Le armi della persuasione","autore":"Robert B. Cialdini","anno":1984,"titoloOriginale":"Influence: The Psychology of Persuasion"},"scene":[{"tipo":"apertura","testo":"Ti regalano un fiore per strada. Ora ti senti ==in debito==."},{"tipo":"esempio","testo":"Un esperimento. Uno sconosciuto ti offre una Coca-Cola, poi vende biglietti della lotteria. Chi ha avuto la bibita ==ne compra il doppio==."},{"tipo":"colpo","testo":"Anche chi lo trova ==antipatico==."},{"tipo":"testo","titolo":"La regola del contraccambio","testo":"Cialdini la chiama reciprocità: chi riceve si sente in obbligo. Vale ==anche per un regalo non richiesto==."},{"tipo":"elenco","titolo":"Dove la incontri","voci":["L'assaggio gratis al supermercato","L'omaggio nella busta che chiede soldi","Il venditore che cede per primo"]},{"tipo":"mito","mito":"Se accetti un omaggio, poi devi qualcosa","realta":"Per Cialdini a un favore si risponde. ==A un trucco per venderti no.=="},{"tipo":"chiusura","azione":"Davanti a un omaggio chiediti: ==direi sì anche senza regalo?=="}]},{"id":"armi-persuasione-impegno-coerenza","categoria":"comunicazione","titolo":"Dici un piccolo sì. Poi non sai più dire no","libro":{"titolo":"Le armi della persuasione","autore":"Robert B. Cialdini","anno":1984,"titoloOriginale":"Influence: The Psychology of Persuasion"},"scene":[{"tipo":"apertura","testo":"Un cartellone orrendo in giardino. ==Tre su quattro== dicono sì."},{"tipo":"testo","titolo":"California, anni Sessanta","testo":"Bussano alle case: metteresti in giardino un cartello enorme sulla guida sicura? ==Più di quattro su cinque== dicono no."},{"tipo":"colpo","testo":"Tranne ==un gruppo==."},{"tipo":"esempio","testo":"Due settimane prima avevano detto sì a un cartellino minuscolo sulla guida sicura. Ora accettano ==anche il cartellone==."},{"tipo":"grafico","titolo":"Chi accetta il cartellone in giardino","forma":"barre","unita":"%","dati":[{"e":"A freddo","v":17},{"e":"Dopo","v":76}],"nota":"Dopo: con il cartellino già accettato."},{"tipo":"principio","testo":"Un piccolo sì cambia l'idea che hai di te. Poi vuoi ==restare coerente==."},{"tipo":"elenco","titolo":"Succede anche a te","voci":["Prima una firma, poi la richiesta grossa","Il prezzo che sale a decisione presa"]},{"tipo":"chiusura","azione":"Prima di un altro sì chiediti: ==rifarei la prima scelta?=="}]},{"id":"pre-suasion-domanda-prima","categoria":"comunicazione","titolo":"La domanda innocua che ti prepara al sì","libro":{"titolo":"Pre-Suasion","autore":"Robert B. Cialdini","anno":2016},"scene":[{"tipo":"apertura","testo":"«Ti consideri una persona disponibile?» ==Attento a cosa rispondi.=="},{"tipo":"quiz","domanda":"Ti fermano per un sondaggio. Quanti dicono sì, a freddo?","opzioni":["Circa 3 su 10","Circa 6 su 10"],"corretta":0,"spiegazione":"Nello studio citato da Cialdini accetta il 29%."},{"tipo":"colpo","testo":"Poi cambiano ==una cosa sola==."},{"tipo":"testo","titolo":"La domanda prima","testo":"A un altro gruppo chiedono prima: ti consideri disponibile? Quasi tutti dicono sì. Solo dopo arriva il sondaggio."},{"tipo":"numero","valore":77.3,"decimali":1,"suffisso":"%","didascalia":"Tanti accettano ora il sondaggio. ==Più del doppio== di prima.","nota":"Studio di Bolkan e Andersen citato nel libro."},{"tipo":"principio","testo":"Per Cialdini si convince prima di chiedere: ==spostando la tua attenzione==."},{"tipo":"chiusura","azione":"Domanda su di te, poi una richiesta? ==Valuta solo la richiesta.=="}]},{"id":"made-to-stick-maledizione-conoscenza","categoria":"comunicazione","titolo":"Il gioco che spiega perché non ti capiscono","libro":{"titolo":"Made to Stick","autore":"Chip Heath, Dan Heath","anno":2007},"scene":[{"tipo":"apertura","testo":"Tamburella «Tanti auguri» sul tavolo. ==Scommetti che la indovinano?=="},{"tipo":"esempio","testo":"Stanford, 1990. Metà dei volontari tamburella canzoni famose, l'altra metà indovina. Chi tamburella prevede: ==una su due==."},{"tipo":"quiz","domanda":"Quante canzoni hanno indovinato davvero?","opzioni":["Una su 4","Una su 10","Una su 40"],"corretta":2,"spiegazione":"Tre su 120. Chi tamburella sente la melodia in testa. Chi ascolta no."},{"tipo":"colpo","testo":"E tu lo fai ==quando spieghi==."},{"tipo":"testo","titolo":"La maledizione della conoscenza","testo":"I fratelli Heath la chiamano così. Quando sai una cosa, non riesci più a immaginare ==com'era non saperla==."},{"tipo":"confronto","a":{"etichetta":"Da esperto","voci":["«Creiamo valore rco stupisce, ma ci vai di rado. I cereali li vedi ogni mattina."},{"tipo":"principio","testo":"Per Berger parliamo e compriamo ==ciò che ci torna in mente==."},{"tipo":"elenco","titolo":"Altri inneschi nel libro","voci":["Il venerdì fa cercare la canzone «Friday»","Kit Kat si è legato alla pausa caffè"]},{"tipo":"chiusura","azione":"Voglia improvvisa di comprare? Chiediti: ==cosa ho appena visto?=="}]},{"id":"never-split-difference-etichette","categoria":"comunicazione","titolo":"Come parla un negoziatore dell'FBI","libro":{"titolo":"Never Split the Difference","autore":"Chris Voss","anno":2016},"scene":[{"tipo":"apertura","testo":"Tre fuggitivi armati dietro una porta. ==Come li fai uscire?=="},{"tipo":"esempio","testo":"Harlem, 1998. Chris Voss, negoziatore FBI, parla per ore a quella porta. Dice ad alta voce ==le paure di chi è dentro==."},{"tipo":"colpo","testo":"Alla fine ==escono==."},{"tipo":"mito","mito":"In una trattativa le emozioni vanno tenute fuori","realta":"Per Voss sono ==la prima cosa di cui parlare==."},{"tipo":"testo","titolo":"Si chiama etichettare","testo":"Dai un nome a ciò che prova l'altro. Esempio: «Sembra che tu abbia paura». Chi si sente capito ==si calma==."},{"tipo":"confronto","a":{"etichetta":"«Io sento che…»","voci":["Mette te al centro"]},"b":{"etichetta":"«Sembra che…»","voci":["Mette al centro l'altro"]}},{"tipo":"chiusura","azione":"Con chi è nervoso, oggi, prova: ==«Sembra che ti pesi»==. Poi taci e ascolta."}]},{"id":"never-split-difference-domande-calibrate","categoria":"comunicazione","titolo":"Come dire no senza dire no","libro":{"titolo":"Never Split the Difference","autore":"Chris Voss","anno":2016},"scene":[{"tipo":"apertura","testo":"Il capo ti chiede l'impossibile. ==Non dire no.=="},{"tipo":"colpo","testo":"Fai ==una domanda==."},{"tipo":"confronto","a":{"etichetta":"No secco","voci":["«Non se ne parla»"]},"b":{"etichetta":"Domanda calibrata","voci":["«Come faccio a farlo?»"]}},{"tipo":"testo","titolo":"Domande calibra titolo":"I quattro passi","numerato":true,"voci":["Innesco: una notifica","Azione: apri e scorri","Ricompensa: non sai cosa troverai","Investimento: lasci foto e contatti"]},{"tipo":"colpo","testo":"Poi la notifica ==non serve più==."},{"tipo":"quiz","domanda":"Quale di questi è un innesco interno?","opzioni":["La noia in fila alla cassa","Una notifica sullo schermo"],"corretta":0,"spiegazione":"La notifica arriva da fuori. La noia nasce in te: apri l'app da solo."},{"tipo":"principio","testo":"Per Eyal l'abitudine è fatta quando ==l'innesco passa dentro di te==."},{"tipo":"chiusura","azione":"Apri l'app che usi di più e ==spegni le notifiche==. Ora."}]},{"id":"switch-elefante-cavaliere","categoria":"comunicazione","titolo":"Sai cosa fare e non lo fai: c'entra un elefante","libro":{"titolo":"Switch","autore":"Chip Heath, Dan Heath","anno":2010},"scene":[{"tipo":"apertura","testo":"Perché sai benissimo cosa fare e poi ==non lo fai==?"},{"tipo":"colpo","testo":"C'entra ==un elefante==."},{"tipo":"testo","titolo":"Il Cavaliere e l'Elefante","testo":"L'immagine è di Jonathan Haidt. La ragione è un Cavaliere, l'emozione il suo Elefante. Se litigano, ==vince l'Elefante==."},{"tipo":"elenco","titolo":"Tre mosse per cambiare","voci":["Guida il Cavaliere: istruzioni precise","Motiva l'Elefante: fagli sentire perché","Spiana il Percorso: rendilo facile"]},{"tipo":"esempio","testo":"West Virginia. Niente «mangia sano». Una campagna dice solo: ==compra il latte all'1% di grassi==."},{"tipo":"grafico","titolo":"Quota del latte magro venduto","forma":"barre","unita":"%","dati":[{"e":"Prima","v":18},{"e":"Dopo","v":41}],"nota":"Dati riportati nel libro."},{"tipo":"principio","testo":"Per gli Heath quella che sembra resistenza è spesso ==mancanza di chiarezza==."},{"tipo":"chiusura","azione":"Scegli un cambiamento e scrivi ==il primo gesto preciso==."}]},{"id":"come-trattare-gli-altri-interesse-sincero","categoria":"comunicazione","titolo":"Il segreto del cane per piacere a tutti","libro":{"titolo":"Come trattare gli altri e farseli amici","autore":"Dale Carnegie","anno":1936,"titoloOriginale":"How to Win Friends and Influence People"},"scene":[{"tipo":"apertura","testo":"Gallina: uova. Mucca: latte. Il cane? ==Niente.== Eppure lo adori."},{"tipo":"colpo","testo":"Come si guadagna da vivere?"},{"tipo":"esempio","testo":"Torni a casa e ti corre incontro, felice. Non deve venderti niente. Per Dale Carnegie il suo segreto è tutto qui: ==si interessa a te==."},{"tipo":"colpo","testo":"Noi facciamo il contrario."},{"tipo":"mito","mito":"Per piacere devi essere interessante","realta":"Per Carnegie piace di più chi è ==interessato agli altri==."},{"tipo":"numero","valore":2,"suffisso":" mesi","didascalia":"Se ti interessi agli altri, ti fai più amici che in ==due anni== a parlare di te.","nota":"Non è una statistica: è il paragone di Carnegie."},{"tipo":"elenco","titolo":"Come si fa, in pratica","voci":["Ricorda il nome e usalo","Chiedi di ciò che sta a cuore a loro","Ascolta fino in fondo, ==sul serio=="]},{"tipo":"chiusura","azione":"Oggi fai ==due domande sull'altro== prima di raccontare qualcosa di te."}]},{"id":"crucial-conversations-silenzio-o-violenza","categoria":"comunicazione","titolo":"Chi urla e chi tace stanno facendo la stessa cosa","libro":{"titolo":"Crucial Conversations","autore":"Kerry Patterson, Joseph Grenny, Ron McMillan, Al Switzler","anno":2002},"scene":[{"tipo":"apertura","testo":"Lui alza la voce, tu ti zittisci. ==È la stessa mossa.=="},{"tipo":"testo","titolo":"Conversazioni cruciali","testo":"Posta alta, opinioni opposte, emozioni forti. Per gli autori è lì che ==diamo il peggio==. E scappiamo in due modi."},{"tipo":"elenco","titolo":"Le due vie di fuga","voci":["Silenzio: taci, svii, minimizzi","Violenza: alzi la voce, etichetti, attacchi"]},{"tipo":"quiz","domanda":"In piena discussione butti lì una battuta sarcastica. Per gli autori è…","opzioni":["Silenzio","Violenza"],"corretta":0,"spiegazione":"Col sarcasmo mascheri  ma col panico da palco. ==Estroversa e timida.=="},{"tipo":"colpo","testo":"Com'è possibile?"},{"tipo":"mito","mito":"Introverso vuol dire timido","realta":"Timidezza è ==paura del giudizio==. Introversione è preferire pochi stimoli."},{"tipo":"testo","titolo":"Questione di stimoli","testo":"A un estroverso la folla dà energia. Un introverso poi deve ricaricarsi da solo. Per Cain ==non è un difetto== da correggere."},{"tipo":"numero","valore":1,"suffisso":" su 3","didascalia":"Almeno ==una persona su tre== è introversa, per gli studi citati da Cain.","nota":"Le stime vanno da un terzo a metà degli americani."},{"tipo":"chiusura","azione":"Domani metti ==dieci minuti da solo== dopo l'impegno più affollato."}]},{"id":"difficult-conversations-tre-conversazioni","categoria":"comunicazione","titolo":"Perché litigate sempre per gli stessi piatti","libro":{"titolo":"Difficult Conversations","autore":"Douglas Stone, Bruce Patton, Sheila Heen","anno":1999},"scene":[{"tipo":"apertura","testo":"In ogni litigio ce ne sono ==tre==. Tu ne senti uno solo."},{"tipo":"esempio","testo":"«Hai lasciato di nuovo i piatti.» Si discute di turni. Sotto, uno si sente dato per scontato. Più sotto, l'altro si chiede: ==sono un egoista?=="},{"tipo":"elenco","titolo":"Le tre conversazioni","voci":["Cosa è successo: chi ha ragione?","Sentimenti: cosa provo e non dico","Identità: cosa dice di me questa storia"]},{"tipo":"colpo","testo":"Di solito fai ==solo la prima==."},{"tipo":"testo","testo":"Lo spiegano Stone, Patton e Heen, studiosi di negoziazione a Harvard. Finché le altre due restano sotto, ==la lite ritorna==."},{"tipo":"mito","mito":"Discutere serve a stabilire chi ha ragione","realta":"Per gli autori serve a ==capire cosa è successo== a tutti e due."},{"tipo":"chiusura","azione":"Pensa a una lite in sospeso. Scrivi una riga per livello: ==fatti, sentimenti, identità==."}]},{"id":"radical-candor-empatia-rovinosa","categoria":"comunicazione","titolo":"Dieci mesi di silenzio gentile, poi
